services:
  - type: web
    name: ga-golden-abodes-platform
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build:all
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: golden_abodes
      - key: API_TOOL_PATH
        value: /opt/render/project/src/client/public/legacy

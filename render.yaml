services:
  - type: web
    name: ga-golden-abodes-platform
    runtime: node
    rootDir: .
    # build:all needs sibling GA_Cashflow_V1_React + local XLSX — use build:render on Render only.
    # build:render bundles PreConstruction at /preconstruction/ (sibling GA_PreConstruction_React in monorepo).
    buildCommand: npm ci && npm run build:render
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: golden_abodes
      # One-shot: restore Cashflow V1 sold units from best Mongo snapshot before layout deploy (Jun 11 ~17:27 IST).
      - key: V1_AUTO_RESTORE_BEFORE
        value: "2026-06-11T17:27:00+05:30"
      - key: V1_AUTO_RESTORE_IF_CURRENT_UNITS_BELOW
        value: "5"
      - key: API_TOOL_PATH
        value: /opt/render/project/src/client/public/legacy
      # Vault → Construction Execution + PreConstruction (full URLs). No client rebuild needed.
      - key: EXECUTION_DASHBOARD_URL
        sync: false
      - key: PRECONSTRUCTION_APP_URL
        sync: false
      # Optional: simplest shared lock for only V2/V3 pages (/app/org-planner and /app/resource-planner).
      - key: V2V3_ACCESS_CODE
        sync: false
      # Optional: same as above but only applied at Vite build time.
      - key: VITE_EXECUTION_DASHBOARD_URL
        sync: false
      - key: VITE_PRECONSTRUCTION_URL
        sync: false
      # Hiring module — Metaview MCP (set in Render dashboard; do not commit tokens)
      - key: METAVIEW_OAUTH_TOKEN
        sync: false
      - key: METAVIEW_MCP_URL
        value: https://mcp.metaview.ai/mcp

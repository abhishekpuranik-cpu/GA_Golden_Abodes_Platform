    var bookIsoExp=normalizeToISODate(mo+'-15')||mo+'-15';
    var pseudoExp={payType:'const',bookingDate:bookIsoExp,totalValue:val,milestonesDates:(u.milestonesDates&&typeof u.milestonesDates==='object')?u.milestonesDates:{}};
    var schedE=getConstSchedule(pseudoExp,cfg);
    schedE=clampConstScheduleAmountsToTotal(schedE,val);
    schedE=ensureUnsoldScheduleCapturesTotal(schedE,bookIsoExp,val);
    if(schedE&&schedE.length){
      schedE.forEach(function(it){
        var isoE=normalizeToISODate(it.date);
        if(!isoE) return;
        var moE=isoE.slice(0,7);
        if(!map[moE]) map[moE]={sales:0,items:[]};
        var amtE=coerceMoney(it.amount);
        map[moE].sales+=amtE;
        map[moE].items.push({unit:u.unitNo||'Unsold',amount:amtE,milestone:it.label||'Milestone'});
      });
      return;
    }
    if(!map[mo]) map[mo]={sales:0,items:[]};
    map[mo].sales+=val;
    map[mo].items.push({unit:u.unitNo||'Unsold',amount:val,milestone:'Projected Sale'});
  });
  return scaleUnsoldMapToBookCap(map,cfg);
}

function getUnitSchedule(unit, cfg){

function unitCollectedAmount(cfg, unit){

  var crmR=coerceMoney(unit.receivedToDate);

function getConstSchedule(unit, cfg){
  var sched=[];
  var defs=constMilestonesFromPlinthToPossession(getMilestoneDefs(cfg));
  var b0=normalizeToISODate(unit.bookingDate)||'';
  var tv=coerceMoney(unit.totalValue);
  defs.forEach(function(ms){
    var amt=(parseFloat(ms.pct)||0)/100*tv;
    var date;
    if(ms.key==='booking') date=b0;
    else if(ms.key==='agreement'){
      if(!b0){ date=''; }
      else {
        var d=new Date(b0);
        if(isNaN(d.getTime())) date='';
        else { d.setMonth(d.getMonth()+1); date=d.toISOString().slice(0,10); }
      }
    } else {
      // Project-level uploaded milestone dates (Sales tab / template) take precedence; unit override is fallback

      // Custom milestone keys (e.g. Paradise workbook): Token → booking; Agreement/Registration → +1 month
      if(!date&&b0){
        var lk=String(ms.key||'').toLowerCase();
        var ll=String(ms.label||'').toLowerCase();
        if(lk.indexOf('token')>=0||ll.indexOf('token')>=0) date=b0;
        else if(lk.indexOf('agreement')>=0||ll.indexOf('agreement')>=0||ll.indexOf('registration')>=0){
          var da=new Date(b0);
          if(!isNaN(da.getTime())){ da.setMonth(da.getMonth()+1); date=da.toISOString().slice(0,10); }
        }
      }
      // CLP (Book28): if construction-linked and plan target is on/before booking, treat as due at booking
      // (site already passed that stage — cumulative % through booking month). Future stages keep target dates.
      if(date&&b0&&milestoneIsConstLink(ms)){
        var dStr=date.slice(0,10), bStr=b0.slice(0,10);
        if(dStr<=bStr) date=b0;
      }
    }
    if(date) sched.push({date:clampDateIsoToBooking(date,b0),amount:amt,label:milestoneDisplayLabel(ms)});
  });
  return sched;
}

function getInstallSchedule(unit){

/** Scheduled revenue: prefer (due) per tranche when present; drop recv/pend for same milestone to avoid double-count. Legacy rows with only recv+pend unchanged. */
function getInstallScheduleForSales(unit, cfg){

  });
  var hasAnyDue=prepared.some(function(x){return String(x.label||'').indexOf('(due)')>=0;});
  if(!hasAnyDue) return prepared;
  var baseLab=function(L){ return installmentBaseLabel(L); };
  var hasDueByBase={};
  prepared.forEach(function(x){
    if(String(x.label||'').indexOf('(due)')>=0) hasDueByBase[baseLab(x.label)]=true;

    var L=String(x.label||'');
    if(L.indexOf('(due)')>=0) return true;
    if(L.indexOf('(received)')>=0||L.indexOf('(pending)')>=0){

      return true;
    }
    return true;
  });

  if(!hasPreBookSyn) return sched;
  var bmo=(normalizeToISODate(unit&&unit.bookingDate)||'').slice(0,7);
  var tv=coerceMoney(unit&&unit.totalValue);
  if(!bmo||tv<=0) return sched;
  var bookingDueTot=0;
  sched.forEach(function(x){
    var L=String(x.label||'');
    if(L.indexOf('(due)')<0) return;
    var iso=normalizeToISODate(x.date)||'';
    if(!iso||iso.slice(0,7)!==bmo) return;
    bookingDueTot+=coerceMoney(x.amount);
  });
  if(bookingDueTot<=tv*1.01) return sched;
  var strippedDue=0;
  var slim=sched.filter(function(x){
    var L=String(x.label||'');
    if(L.indexOf('(due)')<0) return true;
    if(L.indexOf('Construction stage at booking')>=0&&L.indexOf('(due)')>=0) return true;
    if(L.indexOf('Balance to Agreement')>=0) return true;
    var iso=normalizeToISODate(x.date)||'';
    if(!iso||iso.slice(0,7)!==bmo) return true;
    strippedDue+=coerceMoney(x.amount);
    return false;
  });

// Consolidated GA cashflow (sum of all projects by month)
/** @param cfByPid optional map pid→buildCashflow rows (reuse when GA UI already built per-project CF). */
function buildGACashflow(cfByPid){
  var list=getVisibleProjects();
  if(!list.length) return [];
  var cache=cfByPid;
  if(!cache){
    cache={};
    list.forEach(function(p){ cache[p.id]=buildCashflow(p.id); });
  }
  // Find overall date range
  var allStartDates=list.map(function(p){return getCF(p.id).startDate||'';}).filter(Boolean).sort();
  var earliest=allStartDates[0]||new Date().toISOString().slice(0,7)+'-01';
  // Find max end
  var maxMonths=list.reduce(function(mx,p){return Math.max(mx,getCF(p.id).totalMonths||60);},0);
  var totalMonths=maxMonths+6; // buffer
  // Aggregate
  var agg=[];
  for(var i=0;i<totalMonths;i++){
    var mo=offsetMonth(earliest,i);
    var row={period:i+1,mo,label:monthLabel(earliest,i),isCurrent:mo===currentMonthStr(),
      salesRev:0,salesRealized:0,salesProjectedShow:0,salesDeficit:0,equityInf:0,invFunding:0,ulInflow:0,custColl:0,custUL:0,otherIn:0,totInflows:0,
      land:0,noc:0,consultant:0,regulatoryConsulting:0,construction:0,marketing:0,ga:0,contingency:0,intPaid:0,principalPaid:0,totOutflows:0,
      netCF:0,closingCash:0, l1In: {}, l1Out: {}};
    list.forEach(function(p){
      var pRows=cache[p.id];
      if(!pRows) return;
      var pRow=pRows.find(function(r){return r.mo===mo;});
      if(!pRow) return;
      ['salesRev','salesRealized','salesProjectedShow','salesDeficit','equityInf','invFunding','ulInflow','custColl','custUL','otherIn','totInflows',
       'land','noc','consultant','regulatoryConsulting','construction','marketing','ga','contingency','intPaid','principalPaid','totOutflows',
       'netCF'].forEach(function(k){row[k]+=pRow[k]||0;});
      mergeL1Object(row.l1In, pRow.l1In);
      mergeL1Object(row.l1Out, pRow.l1Out);
    });
    if(i>0) row.closingCash=agg[i-1].closingCash+row.netCF;
    else row.closingCash=row.netCF;
    agg.push(row);
  }
  return agg;
}
function buildHierarchyRollup(vis, cfByPid){
  var byRoot={};
  (vis||[]).forEach(function(p){
    if(!p) return;
    var h=getProjectHierarchy(p.id);
    var root=h.projectGroup||'Unassigned';
    var phase=h.phase||'Unassigned';
    var building=(h.building&&h.building!=='Unassigned')?h.building:(p.name||p.id||'Building');
    var rows=(cfByPid&&cfByPid[p.id])||[];
    var tin=rows.reduce(function(s,r){ return s+(r.totInflows||0); },0);
    var tout=rows.reduce(function(s,r){ return s+(r.totOutflows||0); },0);
    var close=rows.length?(rows[rows.length-1].closingCash||0):0;
    if(!byRoot[root]) byRoot[root]={name:root,totIn:0,totOut:0,close:0,phases:{}};
    var rr=byRoot[root];
    rr.totIn+=tin; rr.totOut+=tout; rr.close+=close;
    if(!rr.phases[phase]) rr.phases[phase]={name:phase,totIn:0,totOut:0,close:0,buildings:[]};
    var ph=rr.phases[phase];
    ph.totIn+=tin; ph.totOut+=tout; ph.close+=close;
    ph.buildings.push({name:building,pid:p.id,totIn:tin,totOut:tout,close:close});
  });
  return Object.keys(byRoot).sort().map(function(k){
    var r=byRoot[k];
    var phases=Object.keys(r.phases).sort().map(function(pk){
      var ph=r.phases[pk];
      ph.buildings.sort(function(a,b){ return String(a.name).localeCompare(String(b.name)); });
      return ph;
    });
    return {name:r.name,totIn:r.totIn,totOut:r.totOut,close:r.close,phases:phases};
  });
}

function offsetMonth(startDate, offset){

}

/** Excel serial or odd strings → YYYY-MM-DD */
function normalizeToISODate(d){

  if(/^\d{4}-\d{2}$/.test(s)) return s+'-01';
  var m=s.match(/^([A-Za-z]{3,9})[.\-\s']*(\d{2,4})$/);

    var monMap={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
    var mk=m[1].toLowerCase().slice(0,4)==='sept'?'sept':m[1].toLowerCase().slice(0,3);
    var mm=monMap[mk];
    var yy=parseInt(m[2],10);
    if(isFinite(mm)&&isFinite(yy)){
      if(yy<100) yy=(yy>=70?1900:2000)+yy;
      if(yy>=1900&&yy<=2200) return yy+'-'+String(mm).padStart(2,'0')+'-01';
    }
  }

    }

  if(isFinite(n)&&n>20000&&n<80000){

}

function moToQuarterKey(mo){
  if(!mo||String(mo).length<7) return '';
  var y=parseInt(mo.slice(0,4),10), m=parseInt(mo.slice(5,7),10);
  if(!isFinite(y)||!isFinite(m)) return '';
  var q=Math.floor((m-1)/3)+1;
  return y+'-Q'+q;
}
function quarterLabelFromKey(qk){
  var p=String(qk).split('-Q');
  if(p.length!==2) return qk;
  return 'Q'+p[1]+' '+p[0];
}
function addMonthsToMonthKey(mo,n){
  if(!mo||!n) return mo;
  var p=String(mo).split('-');
  var y=parseInt(p[0],10), m=parseInt(p[1],10);
  if(!isFinite(y)||!isFinite(m)) return mo;
  var d=new Date(y, m-1, 1);
  if(isNaN(d.getTime())) return mo;
  d.setMonth(d.getMonth()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

/** Build column model for sales grid: array of {kind:'month',mo} | {kind:'quarterSum',qk,months} */
function buildSalesRevenueColumns(monthColsSorted, mode, qCollapsed){
  var cols=[];
  if(mode==='quarter'){
    var qMap={};
    monthColsSorted.forEach(function(mo){
      var qk=moToQuarterKey(mo);
      if(!qMap[qk]) qMap[qk]={qk:qk,months:[]};
      qMap[qk].months.push(mo);
    });
    Object.keys(qMap).sort().forEach(function(qk){ cols.push({kind:'quarterSum',qk:qk,months:qMap[qk].months}); });
    return cols;
  }
  var qOrder=[];
  var qB={};
  monthColsSorted.forEach(function(mo){
    var qk=moToQuarterKey(mo);
    if(qB[qk]) qB[qk].push(mo);
    else{ qB[qk]=[mo]; qOrder.push(qk); }
  });
  qOrder.forEach(function(qk){
    var months=qB[qk];
    if(qCollapsed[qk]) cols.push({kind:'quarterSum',qk:qk,months:months});
    else months.forEach(function(mo){ cols.push({kind:'month',mo:mo,qk:moToQuarterKey(mo)}); });
  });
  return cols;
}
function postSalesIncludeUnitInScheduleRollup(u){
  var c=String((u&&(u.collectionIssue||u.paymentIssueStatus))||'none').toLowerCase();
  if(!c||c==='none'||c==='ok'||c==='clear'||c==='good') return true;
  return false;
}
function postSalesIncludeUnitInExpectedAmountRollup(u){
  var c=String((u&&(u.collectionIssue||u.paymentIssueStatus))||'none').toLowerCase().replace(/\s+/g,'_');
  if(c==='agreement_pending'||c==='agreement-pending'){
    return Boolean(normalizeToISODate(u.expectedAgreementDate||u.agreementDate||u.agreementRegistrationDate||''));
  }
  return postSalesIncludeUnitInScheduleRollup(u);
}
function unitHasCrmReceivedLinesPs(u){
  if(!u) return false;
  return (u.installments||[]).some(function(ins){ return ins.label&&String(ins.label).indexOf('(received)')>=0; });
}
function hasLedgerCustomerCollectionsForUnitPs(cfg, unitId){
  if(!unitId) return false;
  return (cfg.actuals||[]).some(function(a){
    return a&&a.unitRef===unitId&&a.cat1==='Customer Collections'&&includeActualInCashflowSums(a);
  });

/** Unsold rows still in stock at calendar end of moKey (YYYY-MM), by projected / expected sale month. */
function unsoldInventoryUnitsAtMonthEnd(cfg, moKey){
  var soldSet={};
  (cfg.units||[]).forEach(function(u){ soldSet[normalizeUnitNoKey(u&&u.unitNo)]=1; });
  var startD=cfg.startDate||(moKey+'-01');
  var uns=(cfg.unsoldUnits||[]).filter(function(u){ return !soldSet[normalizeUnitNoKey(u&&u.unitNo)]; });
  return uns.filter(function(u){
    var saleIso=normalizeToISODate(u.projectedSaleDate)||'';
    if(saleIso) return saleIso.slice(0,7)>moKey;
    var em=parseInt(u.expectedMonth,10);
    if(em>=1){
      var moSale=offsetMonth(startD, em-1);
      return !moSale||moSale>moKey;
    }
    return true;
  }).length;
}
/** Count of unsold units whose first projected booking / sale month is moKey. */
function pipelineExpectedBookingsCount(cfg, moKey){
  var soldSet={};
  (cfg.units||[]).forEach(function(u){ soldSet[normalizeUnitNoKey(u&&u.unitNo)]=1; });
  var startD=cfg.startDate||(moKey+'-01');
  var uns=(cfg.unsoldUnits||[]).filter(function(u){ return !soldSet[normalizeUnitNoKey(u&&u.unitNo)]; });
  var n=0;
  uns.forEach(function(u){
    var saleIso=normalizeToISODate(u.projectedSaleDate)||'';
    if(saleIso&&saleIso.slice(0,7)===moKey) n+=1;
    else if(!saleIso){
      var em=parseInt(u.expectedMonth,10);
      if(em>=1){
        var moSale=offsetMonth(startD, em-1);
        if(moSale===moKey) n+=1;
      }
    }
  });
  return n;
}
function buildPostSalesSeries(cfg){
  var sched={}, exp={}, real={}, unsold={}, newBk={};
  (cfg.units||[]).forEach(function(u){
    var biso=normalizeToISODate(u.bookingDate||'');
    if(biso){
      var bm=biso.slice(0,7);
      if(/^\d{4}-\d{2}$/.test(bm)) newBk[bm]=(newBk[bm]||0)+1;
    }
  });
  (cfg.units||[]).forEach(function(u){
    getUnitSchedule(u,cfg).forEach(function(it){
      var iso=normalizeToISODate(it.date);
      if(!iso) return;
      var mo=iso.slice(0,7);
      sched[mo]=(sched[mo]||0)+coerceMoney(it.amount);
    });
  });
  (cfg.units||[]).forEach(function(u){
    if(!postSalesIncludeUnitInExpectedAmountRollup(u)) return;
    getUnitSchedule(u,cfg).forEach(function(it){
      var iso=normalizeToISODate(it.date);
      if(!iso) return;
      var mo=iso.slice(0,7);
      exp[mo]=(exp[mo]||0)+coerceMoney(it.amount);
    });
  });
  var byId={};
  (cfg.units||[]).forEach(function(u){ if(u&&u.id) byId[u.id]=u; });
  (cfg.actuals||[]).forEach(function(a){
    if(!includeActualInCashflowSums(a)) return;
    var mo=a.date?String(a.date).slice(0,7):'';
    if(!/^\d{4}-\d{2}$/.test(mo)) return;
    if(a.cat1!=='Customer Collections') return;
    if(a.unitRef){
      var u0=byId[a.unitRef];
      if(u0 && unitHasCrmReceivedLinesPs(u0)) return;
    }
    real[mo]=(real[mo]||0)+Math.abs(coerceMoney(a.amount));
  });
  (cfg.units||[]).forEach(function(u){
    var inst=u.installments||[], hasRecvLine=inst.some(function(ins){ return ins.label&&String(ins.label).indexOf('(received)')>=0; });
    if(hasRecvLine){
      inst.forEach(function(ins){
        if(!ins.label||String(ins.label).indexOf('(received)')<0) return;
        var iso=normalizeToISODate(effectiveInstallmentIso(u,cfg,ins));
        if(!iso) return;
        var mo=iso.slice(0,7);
        var amt=Math.abs(coerceMoney(ins.amount));
        if(amt<=0) return;
        real[mo]=(real[mo]||0)+amt;
      });
      return;
    }
    if(u.id && hasLedgerCustomerCollectionsForUnitPs(cfg, u.id)) return;
    var collAmt=coerceMoney(u.collectedAmount);
    var collDt=normalizeToISODate(u.collectedDate||'');
    if(collAmt>0 && collDt){
      var mo2=collDt.slice(0,7);
      real[mo2]=(real[mo2]||0)+collAmt;
      return;
    }
    var rtd2=coerceMoney(u.receivedToDate);
    if(rtd2>0){
      var ref2=normalizeToISODate(u.collectedDate||u.bookingDate||'');
      if(ref2){
        var mo3=ref2.slice(0,7);
        real[mo3]=(real[mo3]||0)+rtd2;
      }
    }
  });
  var startD=cfg.startDate||new Date().toISOString().slice(0,7)+'-01';
  var uns=buildUnsoldRealization(cfg, startD);
  Object.keys(uns).forEach(function(mo){ unsold[mo]=uns[mo].sales||0; });
  var all={};
  [sched,exp,real,unsold].forEach(function(o){
    Object.keys(o).forEach(function(k){ all[k]=1; });
  });
  var nPlan=Math.max(1, cfg.totalMonths||60);
  var planEndMo=offsetMonth(startD, nPlan-1);
  for(var i=0;i<nPlan;i++){
    var mk=offsetMonth(startD, i);
    if(mk) all[mk]=1;
  }
  var f;
  for(f=0;f<=60;f+=1){
    var mk2=addMonthsToYM(planEndMo, f);
    if(mk2) all[mk2]=1;
  }
  var projStartMo=String(startD).slice(0,7);
  for(var b=1;b<=120;b+=1){
    var mkb=addMonthsToYM(projStartMo, -b);
    if(!mkb) break;
    all[mkb]=1;
  }
  var months=Object.keys(all).sort();
  return months.map(function(mo){
    return {
      mo: mo,
      scheduled: sched[mo]||0,
      expected: exp[mo]||0,
      realized: real[mo]||0,
      unsoldProj: unsold[mo]||0,
      gap: (sched[mo]||0)-(real[mo]||0),
      newBookings: newBk[mo]||0,
      unsoldInvUnits: unsoldInventoryUnitsAtMonthEnd(cfg, mo),
      pipelineExpBookings: pipelineExpectedBookingsCount(cfg, mo),
      pipelineClpAtBooking: pipelineClpAtBookingMonth(cfg, mo)
    };
  });
}
function aggregatePostSalesSeriesForVisible(vis){
  var byMo={};
  (vis||[]).forEach(function(p){
    if(!p||!p.id) return;
    var cfg=getCF(p.id);
    buildPostSalesSeries(cfg).forEach(function(r){
      var mo=r.mo||'';

      byMo[mo].scheduled+=(r.scheduled||0);

}

function scheduledInNextMonths(cfg, startMo, nMonths, delayMo){
  var ufn=delayMo?function(u,c){ return getUnitScheduleWithConstructionDelay(u,c,delayMo);}:getUnitSchedule;
  var tot=0;
  var start=new Date((startMo||'2020-01')+'-01');
  if(isNaN(start.getTime())) return 0;
  for(var i=0;i<nMonths;i++){
    var d=new Date(start); d.setMonth(d.getMonth()+i);
    var mk=d.toISOString().slice(0,7);
    (cfg.units||[]).forEach(function(u){
      ufn(u,cfg).forEach(function(it){
        var iso=normalizeToISODate(it.date);
        if(iso&&iso.slice(0,7)===mk) tot+=coerceMoney(it.amount);
      });
    });
  }
  return tot;
}

function getUnitScheduleWithConstructionDelay(u,cfg,delayMo){
  if(!delayMo||u.payType!=='const') return getUnitSchedule(u,cfg);
  return getConstScheduleShifted(u,cfg,delayMo);
}

function getConstScheduleShifted(unit,cfg,shiftMonths){
  var sched=[];
  var defs=constMilestonesFromPlinthToPossession(getMilestoneDefs(cfg));
  var b0=normalizeToISODate(unit.bookingDate)||'';
  var tv=coerceMoney(unit.totalValue);
  defs.forEach(function(ms){
    var amt=(parseFloat(ms.pct)||0)/100*tv;
    var date;
    if(ms.key==='booking') date=b0;
    else if(ms.key==='agreement'){
      if(!b0) date='';
      else {
        var d=new Date(b0);
        if(isNaN(d.getTime())) date='';
        else { d.setMonth(d.getMonth()+1); date=d.toISOString().slice(0,10); }
      }
    } else {
      var raw=milestoneTargetIsoForDef(cfg, unit, ms)||'';
      if(raw){
        var dx=new Date(raw);
        if(!isNaN(dx.getTime())){ dx.setMonth(dx.getMonth()+shiftMonths); date=dx.toISOString().slice(0,10); date=clampDateIsoToBooking(date,b0); }
        else date=raw;
      } else date='';
      if(date&&b0&&milestoneIsConstLink(ms)){
        var dStr2=date.slice(0,10), bStr2=b0.slice(0,10);
        if(dStr2<=bStr2) date=b0;
      }
    }
    if(date) sched.push({date:clampDateIsoToBooking(date,b0),amount:amt,label:milestoneDisplayLabel(ms)});
  });
  return sched;
}

function plL1LabelForActualLine(a){
  if(a.plL1) return a.plL1;
  if(a.masterKey && typeof GA_ACCT_L3_BY_CODE!=='undefined' && GA_ACCT_L3_BY_CODE[a.masterKey]){
    var g=GA_ACCT_L3_BY_CODE[a.masterKey];
    if(g.plApplicable) return g.plL1Label||g.l1Name||'';
  }
  var g2=gaAcctEntryByShortCode(a.gaL3||'', a.gaScope||'building', getAcctPrefixForPid(_curPid));
  if(g2&&g2.plApplicable) return g2.plL1Label||g2.l1Name||'';
  var cl=classifyTallyLineFromText((a.party||'')+' '+(a.note||''), a.party||'', a.amount||0, a.gaScope||'building');
  return cl.plL1||cl.gaL1||'Unmapped';
}
function buildPLRollupFromActuals(actuals, opts){
  opts=opts||{};
  var fromMo=opts.fromMonth||'';
  var toMo=opts.toMonth||'';
  var byL1={}, byL3={}, unmapped=0, revenue=0, expense=0;
  (actuals||[]).forEach(function(a){
    if(!a||!a.date) return;
    var mo=String(a.date).slice(0,7);
    if(fromMo && mo<fromMo) return;
    if(toMo && mo>toMo) return;
    var lbl=plL1LabelForActualLine(a);
    if(!lbl||lbl==='Unmapped'){ unmapped+=Math.abs(a.amount||0); return; }
    var amt=a.amount||0;
    if(!byL1[lbl]) byL1[lbl]=0;
    byL1[lbl]+=amt;
    var l3k=(a.gaL3||'')+'|'+(a.gaL3Name||a.party||'');
    if(!byL3[l3k]) byL3[l3k]={label:a.gaL3Name||a.party||a.gaL3||'—', l1:lbl, amt:0};
    byL3[l3k].amt+=amt;
    if(amt>=0) revenue+=amt; else expense+=Math.abs(amt);
  });
  return {byL1:byL1, byL3:byL3, revenue:revenue, expense:expense, net:revenue-expense, unmapped:unmapped};
}

function salesCellAmt(u,cfg,col){
  var t=0;
  getUnitSchedule(u,cfg).forEach(function(it){
    var iso=normalizeToISODate(it.date);
    if(!iso) return;
    var mo=iso.slice(0,7);
    if(col.kind==='month'&&mo===col.mo) t+=coerceMoney(it.amount);
    if(col.kind==='quarterSum'&&col.months.indexOf(mo)>=0) t+=coerceMoney(it.amount);
  });
  return t;
}
function salesCellAmtByLabel(u,cfg,col,labelNeedle){
  var t=0;
  (u.installments||[]).forEach(function(ins){
    if(String(ins.label||'').indexOf(labelNeedle)<0) return;
    var iso=normalizeToISODate(effectiveInstallmentIso(u,cfg,ins));
    if(!iso) return;
    var mo=iso.slice(0,7);
    if(col.kind==='month'&&mo===col.mo) t+=coerceMoney(ins.amount);
    if(col.kind==='quarterSum'&&col.months.indexOf(mo)>=0) t+=coerceMoney(ins.amount);
  });
  return t;
}
function formatShortDateDMY(iso){
  if(!iso||iso.length<10) return '';
  return iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4);
}
function salesCellAmtRecvByMilestoneMonth(u,cfg,col){
  var t=0;
  groupCRMInstallmentsByBase(u,cfg).forEach(function(g){
    var dueMo=crmMilestoneMonthKey(g.dueIso||'', u);
    if(!dueMo) return;
    var ok=(col.kind==='month'&&dueMo===col.mo)||(col.kind==='quarterSum'&&col.months&&col.months.indexOf(dueMo)>=0);
    if(ok) t+=coerceMoney(g.recv);
  });
  return t;
}
function salesCellAmtPendByMilestoneMonth(u,cfg,col){
  var t=0;
  groupCRMInstallmentsByBase(u,cfg).forEach(function(g){
    var dueMo=crmMilestoneMonthKey(g.dueIso||'', u);
    if(!dueMo) return;
    var ok=(col.kind==='month'&&dueMo===col.mo)||(col.kind==='quarterSum'&&col.months&&col.months.indexOf(dueMo)>=0);
    if(ok) t+=coerceMoney(g.pend);
  });
  return t;
}
function salesCellDateLabels(u,cfg,col){
  var seen={}, out=[];
  (u.installments||[]).forEach(function(ins){
    var iso=normalizeToISODate(effectiveInstallmentIso(u,cfg,ins));
    if(!iso) return;
    var mo=iso.slice(0,7);
    var match=(col.kind==='month'&&mo===col.mo)||(col.kind==='quarterSum'&&col.months&&col.months.indexOf(mo)>=0);
    if(!match) return;
    var d=formatShortDateDMY(iso);
    if(d&&!seen[d]){ seen[d]=1; out.push(d); }
  });
  return out.length?out.join(', '):'—';
}

/** Sum amounts keyed by YYYY-MM for one grid column (month or quarter). */
function colSumFromMoMap(map,col){
  if(!map) return 0;
  if(col.kind==='month') return map[col.mo]||0;
  var t=0;
  if(col.kind==='quarterSum'&&col.months){
    col.months.forEach(function(mo){ t+=map[mo]||0; });
  }
  return t;
}
/**
 * One getUnitSchedule + one CRM group per unit (not per cell). Used by Sales grid only.
 * Maps: dueByMo from scheduled tranches; recvByMo / pendByMo from CRM buckets or raw installment labels.
 */
function buildSalesGridCaches(cfg, units){
  return units.map(function(u){
    var sched=getUnitSchedule(u,cfg);
    var dueByMo={};
    var dueTillToday=0;
    var bookingIso=normalizeToISODate(u&&u.bookingDate)||'';
    var tdy=today();
    sched.forEach(function(it){
      var iso=normalizeToISODate(it.date);
      if(!iso) return;
      var mo=(u.payType==='install')?iso.slice(0,7):clampMonthToBooking(iso.slice(0,7), bookingIso);
      var amt=coerceMoney(it.amount);
      dueByMo[mo]=(dueByMo[mo]||0)+amt;
      if(iso<=tdy) dueTillToday+=amt;
    });
    var recvByMo={}, pendByMo={}, recvTillToday=0, pendTillToday=0;
    if(u.payType==='install'){
      if(installUsesCRMDueLines(u)){
        groupCRMInstallmentsByBase(u,cfg).forEach(function(g){
          var dueMo=crmMilestoneMonthKey(g.dueIso||'', u);
          if(!dueMo) return;
          var rcv=coerceMoney(g.recv);
          recvByMo[dueMo]=(recvByMo[dueMo]||0)+rcv;
          var gIso=normalizeToISODate(g.dueIso)||'';
          if(gIso&&gIso<=tdy) recvTillToday+=rcv;
        });
      } else {
        (u.installments||[]).forEach(function(ins){
          var L=String(ins.label||'');
          var iso=normalizeToISODate(effectiveInstallmentIso(u,cfg,ins));
          if(!iso) return;
          var mo=iso.slice(0,7);
          var amtIns=coerceMoney(ins.amount);
          if(L.indexOf('(received)')>=0){
            recvByMo[mo]=(recvByMo[mo]||0)+amtIns;
            if(iso<=tdy) recvTillToday+=amtIns;
          }
        });
      }
      var rtdFloor=coerceMoney(u.receivedToDate);
      if(rtdFloor>recvTillToday) recvTillToday=rtdFloor;
      var moKeys={};
      function markMo(m){Object.keys(m||{}).forEach(function(k){moKeys[k]=1;});}
      markMo(dueByMo); markMo(recvByMo);
      Object.keys(moKeys).forEach(function(mo){
        pendByMo[mo]=Math.max(0,(dueByMo[mo]||0)-(recvByMo[mo]||0));
      });
      pendTillToday=Math.max(0,dueTillToday-recvTillToday);
    }
    return {dueByMo:dueByMo,recvByMo:recvByMo,pendByMo:pendByMo,dueTillToday:dueTillToday,recvTillToday:recvTillToday,pendTillToday:pendTillToday};
  });
}

function cumulativeConstructionDuePct(defs, ms){
  var i, m, s=0;
  for(i=0;i<defs.length;i++){
    m=defs[i];
    s+=Math.max(0,parseFloat(m.pct)||0);
    if(m.key===ms.key) break;
  }
  return Math.round(s*10000)/10000;
}

function achievedIsoForMilestoneDef(cfg, ms){
  var mad=cfg.milestonesAchievedDates||{};
  var iso=normalizeToISODate(mad[ms.key])||'';
  if(iso) return iso;
  var lab=slugCRM(milestoneDisplayLabel(ms));
  var mk=slugCRM(String(ms.key||''));
  var k, ks, n, best='';
  for(k in mad){
    if(!Object.prototype.hasOwnProperty.call(mad,k)) continue;
    ks=slugCRM(k);
    n=normalizeToISODate(mad[k])||'';
    if(!n) continue;
    if(ks.indexOf(mk)>=0||mk.indexOf(ks)>=0||ks===mk||(lab.length>=3&&ks.indexOf(lab)>=0)){
      if(!best||n>best) best=n;
    }
  }
  return best;
}

function roadSvgXYForIndex(si, nSteps, anchors){
  anchors=anchors||POST_SALES_ROAD_SVG_XY;
  var L=anchors.length;
  if(nSteps<=0) return {x:anchors[0].x,y:anchors[0].y,up:!!anchors[0].up};
  if(nSteps===1) return {x:anchors[0].x,y:anchors[0].y,up:!!anchors[0].up};
  var t=si/(nSteps-1);
  var seg=t*(L-1);
  var i=Math.min(Math.floor(seg),L-2);
  var f=seg-i;
  var a=anchors[i], b=anchors[i+1];
  return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,up:f<0.5?!!a.up:!!b.up};
}

  return '—';
}

function resolvePostSalesRoadHereIndex(steps, tIso){
  var bestIdx=-1, bestIso='', i, st, a;

    a=st.achievedIso&&st.achievedIso<=tIso?st.achievedIso:'';
    if(!a) continue;
    if(!bestIso||a>bestIso||(a===bestIso&&i>bestIdx)){ bestIso=a; bestIdx=i; }
  }
  return bestIso?bestIdx:-1;
}

function computePostSalesRoadmap(cfg){
  var tIso=today();
  var defs=getMilestoneDefs(cfg);
  var roadMs=[], i, ms;
  for(i=0;i<defs.length;i++){
    ms=defs[i];
    if(milestoneIsConstLink(ms)) roadMs.push(ms);
  }
  var steps=[], achievedIso, targetIso, cum;
  for(i=0;i<roadMs.length;i++){
    ms=roadMs[i];
    achievedIso=achievedIsoForRoadmapDef(cfg,ms);
    targetIso=normalizeToISODate(milestoneTargetIsoForDef(cfg,null,ms))||'';
    cum=cumulativeConstructionDuePct(defs,ms);
    steps.push({
      label:milestoneDisplayLabel(ms),
      achievedIso:achievedIso||'',
      targetIso:targetIso||'',
      done:!!(achievedIso&&achievedIso<=tIso),
      cumDuePct:cum
    });
  }
  var cur=resolvePostSalesRoadHereIndex(steps, tIso);
  return {steps:steps, currentIndex:cur};
}

function postSalesRowKind(mo, curMo){

function postSalesSumForwardMonths(series, startMo, nMonths, pick){
  if(!series||!series.length||!startMo||nMonths<=0) return 0;
  var idx=-1,i;
  for(i=0;i<series.length;i++){ if(series[i].mo===startMo){ idx=i; break; } }
  if(idx<0){
    for(i=0;i<series.length;i++){ if(series[i].mo>=startMo){ idx=i; break; } }
  }
  if(idx<0) return 0;
  var t=0;
  for(i=idx;i<series.length&&i<idx+nMonths;i++){
    var r=series[i];
    t+=(typeof pick==='function'?pick(r):0);
  }
  return t;
}
/** As-of-today Due / Rcvd / Pend — same basis as Sales grid “As of today” (installment date ≤ today). */
function sumSalesGridTillToday(cfg){
  var units=(cfg&&cfg.units)||[];
  if(!units.length) return {demand:0,recv:0,pend:0};
  var caches=buildSalesGridCaches(cfg,units);
  var demand=0,recv=0,pend=0;
  caches.forEach(function(c){
    demand+=coerceMoney(c.dueTillToday);
    recv+=coerceMoney(c.recvTillToday);
    pend+=coerceMoney(c.pendTillToday);
  });
  return {demand:demand,recv:recv,pend:pend};
}
function sumTillDateExpectedDemand(cfg){
  var tdy=today();
  var tot=0;
  (cfg.units||[]).forEach(function(u){
    if(!postSalesIncludeUnitInExpectedAmountRollup(u)) return;
    getUnitSchedule(u,cfg).forEach(function(it){
      var iso=normalizeToISODate(it.date);
      if(iso&&iso<=tdy) tot+=coerceMoney(it.amount);
    });
  });
  return tot;
}
function sumSalesGridTillTodayRollup(vis){
  var demand=0,recv=0,pend=0,expected=0;
  (vis||[]).forEach(function(p){
    if(!p||!p.id) return;
    var cfg=getCF(p.id);
    if(!cfg) return;
    var t=sumSalesGridTillToday(cfg);
    demand+=t.demand; recv+=t.recv; pend+=t.pend;
    expected+=sumTillDateExpectedDemand(cfg);
  });
  return {demand:demand,recv:recv,pend:pend,expected:expected};
}
function computePostSalesPerformanceKpis(seriesFull, curMo, tillOverride){
  var tillDateDemand,tillDateReal,tillDateExpected;
  if(tillOverride){
    tillDateDemand=coerceMoney(tillOverride.demand);
    tillDateReal=coerceMoney(tillOverride.recv);
    tillDateExpected=coerceMoney(tillOverride.expected);
  } else {
    var ytdRows=(seriesFull||[]).filter(function(r){ return r.mo&&r.mo<=curMo; });
    tillDateDemand=ytdRows.reduce(function(s,r){ return s+(r.scheduled||0); },0);
    tillDateExpected=ytdRows.reduce(function(s,r){ return s+(r.expected||0); },0);
    tillDateReal=ytdRows.reduce(function(s,r){ return s+(r.realized||0); },0);
  }
  var fwdSold=postSalesSumForwardMonths(seriesFull,curMo,12,function(r){ return r.scheduled||0; });
  var fwdUnsold=postSalesSumForwardMonths(seriesFull,curMo,12,function(r){ return r.unsoldProj||0; });
  var fwdTotal=fwdSold+fwdUnsold;
  return {
    tillDateDemand:tillDateDemand,
    tillDateExpected:tillDateExpected,
    tillDateReal:tillDateReal,
    tillDateGap:Math.max(0,tillDateDemand-tillDateReal),
    tillDateEff:tillDateDemand>0?(100*tillDateReal/tillDateDemand):0,
    ytdDemand:tillDateDemand,
    ytdExpected:tillDateExpected,
    ytdReal:tillDateReal,
    ytdGap:Math.max(0,tillDateDemand-tillDateReal),
    ytdEff:tillDateDemand>0?(100*tillDateReal/tillDateDemand):0,
    fwdSold:fwdSold,
    fwdUnsold:fwdUnsold,
    fwdTotal:fwdTotal
  };
}

function postSalesMtdSubtitle(){

  }catch(e){ return 'MTD'; }
}
function htmlPostSalesEffMiniBar(sched, real, rowKind){
  var pct=sched>0?(100*real/sched):0;
  if(!isFinite(pct)) pct=0;
  pct=Math.max(0,Math.min(100,pct));
  var col=rowKind==='future'?'#ea580c':(rowKind==='current'&&pct<85?'#dc2626':'#059669');
  var w=Math.round(pct*100)/100;
  return '<div style="display:flex;align-items:center;gap:5px;justify-content:flex-end;min-width:96px"><div style="flex:1;max-width:64px;height:7px;background:#e5e7eb;border-radius:4px;overflow:hidden"><div style="width:'+w+'%;height:100%;background:'+col+'"></div></div><span style="min-width:28px;font-weight:700;font-size:9px">'+Math.round(pct)+'%</span></div>';
}
function fmtPostSalesMaybeProj(rk, val, isInt){
  if(val===undefined||val===null) return '—';
  if(rk!=='future') return isInt?String(Math.round(val)):cr(val,'—');
  if(!val) return '—';
  return '~'+(isInt?String(Math.round(val)):cr(val));
}
function buildPostSalesMonthlyTableHtml(series, seriesFull, curMo){
  var atMoMap={};
  var cS=0,cE=0,cR=0,cNb=0;
  seriesFull.forEach(function(r){
    cS+=r.scheduled; cE+=r.expected||0; cR+=r.realized; cNb+=(r.newBookings||0);
    atMoMap[r.mo]={cumS:cS,cumE:cE,cumR:cR,cumNb:cNb};
  });
  var h='';
  h+='<div style="overflow-x:auto;border:1px solid var(--border);border-radius:8px">';
  h+='<table style="width:100%;border-collapse:collapse;font-size:10px">';
  h+='<thead>';
  h+='<tr style="background:#E8EEF7;font-size:9px;font-weight:800;color:var(--blue-b)">';
  h+='<th rowspan="2" style="padding:6px 8px;text-align:left;vertical-align:bottom;border-bottom:1px solid var(--border);min-width:92px">Month</th>';
  h+='<th colspan="3" style="padding:5px 6px;text-align:center;border-bottom:1px solid var(--border)">Bookings &amp; inventory</th>';
  h+='<th colspan="4" style="padding:5px 6px;text-align:center;border-bottom:1px solid var(--border)">Demand &amp; collections</th>';
  h+='<th colspan="3" style="padding:5px 6px;text-align:center;border-bottom:1px solid var(--border)">Unsold inventory pipeline</th>';
  h+='</tr>';
  h+='<tr style="background:var(--blue-l);font-size:9px">';
  ['New bkgs','Cum. bkgs','Unsold inv.'].forEach(function(lab){
    h+='<th style="padding:5px 6px;text-align:right;border-bottom:2px solid var(--border)" title="'+escAttr(lab)+'">'+lab+'</th>';
  });
  ['Demand','Collected','Eff. %','Outst.'].forEach(function(lab){
    h+='<th style="padding:5px 6px;text-align:right;border-bottom:2px solid var(--border)" title="'+(lab==='Outst.'?'Cumulative demand − cumulative collected (plan vs receipts)':escAttr(lab))+'">'+lab+'</th>';
  });
  [
    {lab:'Inv. units',title:'Unsold units still in stock at month-end'},
    {lab:'Exp. bkgs',title:'Unsold units projected to book this month'},
    {lab:'CLP @ bkgs',title:'CLP demand due in booking month (construction stage at projected sale)'},
    {lab:'CLP later',title:'Further CLP tranches in this month from earlier/future projected bookings'}
  ].forEach(function(col){
    h+='<th style="padding:5px 6px;text-align:right;border-bottom:2px solid var(--border)" title="'+escAttr(col.title)+'">'+col.lab+'</th>';
  });
  h+='</tr></thead><tbody>';
  if(!series.length){
    h+='<tr><td colspan="11" style="padding:20px;text-align:center;color:var(--muted)">Add sold units and payment schedules on the Sales &amp; Inventory sub-tab to populate this view.</td></tr>';
  } else {
    series.forEach(function(r){
      var c=atMoMap[r.mo]||{cumS:0,cumE:0,cumR:0,cumNb:0};
      var rk=postSalesRowKind(r.mo,curMo);
      var bg=rk==='past'?'#faf5eb':(rk==='current'?'#fde68a':'#e0f2fe');
      var fw=rk==='current'?800:600;
      var unsCol=rk==='future'?'#166534':'#b91c1c';
      var nb=r.newBookings||0;
      var invU=r.unsoldInvUnits||0;
      var expBk=r.pipelineExpBookings||0;
      var clpBk=r.pipelineClpAtBooking||0;
      var clpLater=Math.max(0,(r.unsoldProj||0)-clpBk);

      h+='<tr style="border-bottom:1px solid var(--border);background:'+bg+';font-weight:'+fw+'">';
      h+='<td style="padding:6px 8px;vertical-align:top">'+(rk==='current'?'● ':'')+moLab+mtd+'</td>';
      h+='<td style="text-align:right;padding:6px 6px">'+fmtPostSalesMaybeProj(rk, nb, true)+'</td>';
      h+='<td style="text-align:right;padding:6px 6px">'+c.cumNb+'</td>';
      h+='<td style="text-align:right;padding:6px 6px;color:'+unsCol+';font-weight:700">'+fmtPostSalesMaybeProj(rk, invU, true)+'</td>';
      h+='<td style="text-align:right;padding:6px 6px;color:var(--blue-b)">'+fmtPostSalesMaybeProj(rk, r.scheduled, false)+'</td>';
      h+='<td style="text-align:right;padding:6px 6px;color:var(--green-b)">'+fmtPostSalesMaybeProj(rk, r.realized, false)+'</td>';

      h+='</tr>';
    });
    var totNb=series.reduce(function(s,r){ return s+(r.newBookings||0); },0);
    var last=series[series.length-1];
    var cEnd=last?atMoMap[last.mo]:{cumNb:0,cumS:0,cumR:0};
    var totDem=series.reduce(function(s,r){ return s+r.scheduled; },0);
    var totColl=series.reduce(function(s,r){ return s+r.realized; },0);
    h+='<tr style="background:var(--blue-l);font-weight:800;font-size:10px"><td style="padding:8px 8px">Total (visible window)</td>';
    h+='<td style="text-align:right">'+totNb+'</td><td style="text-align:right">'+(cEnd.cumNb||0)+'</td><td style="text-align:right">—</td>';
    h+='<td style="text-align:right">'+cr(totDem)+'</td><td style="text-align:right">'+cr(totColl)+'</td>';
    h+='<td style="text-align:right">'+htmlPostSalesEffMiniBar(totDem,totColl,'past')+'</td>';
    h+='<td style="text-align:right">'+cr(Math.max(0,(cEnd.cumS||0)-(cEnd.cumR||0)))+'</td>';
    h+='<td colspan="3" style="text-align:right;color:var(--muted);font-size:9px;font-weight:600">Pipeline: tick <strong>Project CLP</strong> on unsold rows; CLP @ bkgs uses Sales milestone targets vs projected booking date.</td>';
    h+='</tr>';
  }
  h+='</tbody></table></div>';
  return h;
}

function applySalesGridFreeze(freezeCols){
  var tbl=document.getElementById('sales-grid-table');
  if(!tbl||!freezeCols) return;
  var rows=tbl.rows, r, c, occ=[], lefts=[], colW=[], maxCol=0;
  // Reset prior styles
  Array.prototype.forEach.call(rows, function(row){
    Array.prototype.forEach.call(row.cells, function(cell){
      cell.style.position='';
      cell.style.left='';
      cell.style.zIndex='';
      cell.style.boxShadow='';
    });
  });
  // Build logical grid accounting for rowSpan/colSpan.
  for(r=0;r<rows.length;r++){
    if(!occ[r]) occ[r]=[];
    var logicalCol=0;
    for(c=0;c<rows[r].cells.length;c++){
      var cell=rows[r].cells[c];
      while(occ[r][logicalCol]) logicalCol++;
      cell.dataset.gridCol=String(logicalCol);
      var rs=cell.rowSpan||1, cs=cell.colSpan||1, rr, cc;
      var w=cell.getBoundingClientRect().width||cell.offsetWidth||0;
      // Ignore merged colspan cells for width model; they distort sticky offsets.
      if(cs===1 && (colW[logicalCol]||0)<w) colW[logicalCol]=w;
      for(rr=r;rr<r+rs;rr++){
        if(!occ[rr]) occ[rr]=[];
        for(cc=logicalCol;cc<logicalCol+cs;cc++) occ[rr][cc]=1;
      }
      logicalCol+=cs;
      if(logicalCol>maxCol) maxCol=logicalCol;
    }
  }
  var acc=0, i;
  for(i=0;i<freezeCols&&i<maxCol;i++){ lefts[i]=acc; acc+=(colW[i]||0); }
  function pinCell(cell, idx, baseZ){
    if(lefts[idx]===undefined) return;
    if((cell.colSpan||1)>1) return;
    cell.style.position='sticky';
    cell.style.left=lefts[idx]+'px';
    cell.style.zIndex=String(baseZ+idx);
    if(!cell.style.background) cell.style.background='var(--card)';
    cell.style.boxShadow='1px 0 0 var(--border)';
  }
  var theadRows=tbl.tHead?tbl.tHead.rows:[];
  Array.prototype.forEach.call(theadRows, function(row){
    Array.prototype.forEach.call(row.cells, function(cell){
      var idx=parseInt(cell.dataset.gridCol||'-1',10);
      if(idx>=0&&idx<freezeCols) pinCell(cell, idx, 220);
    });
  });
  Array.prototype.forEach.call(tbl.tBodies, function(tb){
    Array.prototype.forEach.call(tb.rows, function(row){
      Array.prototype.forEach.call(row.cells, function(cell){
        var idx=parseInt(cell.dataset.gridCol||'-1',10);
        if(idx>=0&&idx<freezeCols) pinCell(cell, idx, 120);
      });
    });
  });
}
function renderSalesKeepViewport(){
  var sx=window.scrollX||0;
  var scroller=document.scrollingElement||document.documentElement||document.body;
  var sy=scroller&&typeof scroller.scrollTop==='number'?scroller.scrollTop:(window.scrollY||0);
  var active=document.activeElement;
  var ref=null, selS=null, selE=null;
  if(active&&active.dataset&&active.dataset.action){
    ref={action:String(active.dataset.action||'')};
    ['idx','qk','mode','mskey'].forEach(function(k){
      if(active.dataset[k]!==undefined) ref[k]=String(active.dataset[k]||'');
    });
    try{
      if(typeof active.selectionStart==='number'&&typeof active.selectionEnd==='number'){
        selS=active.selectionStart; selE=active.selectionEnd;
      }
    }catch(e){}
  }
  renderSales();
  requestAnimationFrame(function(){
    window.scrollTo(sx, sy);
    if(!ref||!ref.action) return;
    var candidates=Array.prototype.slice.call(document.querySelectorAll('[data-action="'+ref.action+'"]'));
    var target=candidates.find(function(node){
      return ['idx','qk','mode','mskey'].every(function(k){
        return ref[k]===undefined||String(node.dataset[k]||'')===ref[k];
      });
    })||candidates[0];
    if(target&&target.focus){
      target.focus({preventScroll:true});
      try{
        if(typeof selS==='number'&&typeof selE==='number'&&target.setSelectionRange) target.setSelectionRange(selS, selE);
        else if(target.setSelectionRange){
          var L=String(target.value||'').length;
          target.setSelectionRange(L,L);
        }
      }catch(e2){}
    }
  });
}

function isGstLedgerName(name){
  var s=String(name||'').toLowerCase();
  return s.indexOf('cgst')>=0 || s.indexOf('sgst')>=0 || s.indexOf('igst')>=0 || s.indexOf('utgst')>=0
    || (s.indexOf('gst')>=0 && s.indexOf('gstr')<0);
}
function isRoundOffTdsName(name){
  var s=String(name||'').toLowerCase();
  return s.indexOf('round')>=0 || s.indexOf('tds')>=0 || s.indexOf('tcs')>=0;
}
/** Tally: <ISDEEMEDPOSITIVE>Yes</…> = Debit, No = Credit. */
function tallyIsDebitFromEntryInner(inner){
  if(!inner) return true;
  if(/<ISDEEMEDPOSITIVE>\s*Yes\s*</i.test(inner)) return true;
  if(/<ISDEEMEDPOSITIVE>\s*No\s*</i.test(inner)) return false;
  return true;
}
function parseVendorGstFactsFromXml(xmlText){
  if(!xmlText||typeof xmlText!=='string') return [];
  var safe=sanitizeTallyXmlForDomParser(xmlText);
  var vouchers=tallyXmlListInners(safe,'VOUCHER');
  var out=[];
  vouchers.forEach(function(vb, idx){
    var dateRaw=tallyVoucherDateRawFromInner(vb);
    var date=normalizeDate(dateRaw)||today();
    var vno=tallyXmlSimpleTag(vb,'VOUCHERNUMBER')||String(idx+1);
    var vtype=tallyXmlSimpleTag(vb,'VOUCHERTYPENAME')||'';
    var partyHint=String(tallyXmlSimpleTag(vb,'PARTYLEDGERNAME')||'').trim();
    var ents=tallyXmlListInners(vb,'ALLLEDGERENTRIES.LIST');
    if(!ents.length) return;
    var drBase=0, drGst=0, partyCrAmt=0, bestCrName='', vendor=partyHint;
    ents.forEach(function(ent){
      var ledger=String(tallyXmlSimpleTag(ent,'LEDGERNAME')||'').trim();
      var amtStr=tallyLedgerPrimaryAmountStr(ent);
      var mag=Math.abs(parseFloat(String(amtStr).replace(/,/g,''))||0);
      if(!ledger || !mag) return;
      if(!vendor && /<ISPARTYLEDGER>\s*Yes\s*<\/ISPARTYLEDGER>/i.test(ent)) vendor=ledger;
      var isDr=tallyIsDebitFromEntryInner(ent);
      if(isDr){
        if(isGstLedgerName(ledger)) drGst+=mag;
        else if(!isRoundOffTdsName(ledger)) drBase+=mag;
      } else {
        if(!isGstLedgerName(ledger) && !isRoundOffTdsName(ledger) && mag>=partyCrAmt - 0.1){
          partyCrAmt=mag; bestCrName=ledger;
        }
      }
    });
    if(!vendor && bestCrName) vendor=bestCrName;
    if(!vendor) vendor=tallyXmlSimpleTag(ents[0],'LEDGERNAME')||'Unknown Vendor';
    var total= partyCrAmt>0 ? partyCrAmt : (drBase+drGst);
    var gst= drGst, taxable= drBase;
    if(partyCrAmt>0) taxable=Math.max(0, partyCrAmt - drGst);
    if(total<=0) return;
    if(gst<=0.01 && drBase>0 && drGst<0.01) taxable=total;
    var narr=String(tallyXmlSimpleTag(vb,'NARRATION')||'').trim();
    out.push({
      vendor: vendor, date: date, voucherNo: vno, voucherType: vtype,
      taxable: taxable, gst: gst, total: total,
      gstPct: total?((gst/total)*100):0,
      narration: narr
    });
  });
  return out;
}
var __gaVendorGstCacheKey = '';
var __gaVendorGstCachedFacts = null;
function getVendorGstFactsCached(rawXml){
  if(!rawXml) { __gaVendorGstCachedFacts = []; return __gaVendorGstCachedFacts; }
  if(rawXml===__gaVendorGstCacheKey && __gaVendorGstCachedFacts) return __gaVendorGstCachedFacts;
  __gaVendorGstCacheKey=rawXml;
  __gaVendorGstCachedFacts=parseVendorGstFactsFromXml(rawXml);
  return __gaVendorGstCachedFacts;
}
/** Tally bill allocation → payable (new bill) vs paid (against bill). */
function classifyTallyBillAllocSide(billType, voucherType){
  var bt=String(billType||'').toLowerCase().trim();
  var vt=String(voucherType||'').toLowerCase();
  if(bt.indexOf('new ref')>=0 || bt==='new') return 'payable';
  if(bt.indexOf('agst')>=0 || bt.indexOf('against')>=0) return 'paid';
  if(bt.indexOf('advance')>=0) return 'paid';
  if(bt.indexOf('on account')>=0) return 'paid';
  if(/payment/.test(vt)) return 'paid';
  if(/purchase|debit\s*note/.test(vt)) return 'payable';
  if(/receipt/.test(vt)) return 'paid';
  return 'paid';
}
function tallyEntryIsPartyLedgerInner(entInner){
  return /<ISPARTYLEDGER>\s*Yes\s*<\/ISPARTYLEDGER>/i.test(String(entInner||''));
}
function isTallyPayableCreationVoucherType(vtype){
  return /purchase|debit\s*note|journal/i.test(String(vtype||''));
}
/**
 * Parse Tally voucher XML for bill-level payable vs paid (BILLALLOCATIONS.LIST).
 * Returns [{ vendor, billName, payable, paid, balance, events[] }].
 */
function parseTallyPayablePaidFromXml(xmlText){
  if(!xmlText||typeof xmlText!=='string') return [];
  var safe=sanitizeTallyXmlForDomParser(xmlText);
  var vouchers=tallyXmlListInners(safe,'VOUCHER');
  var billMap={};
  function billKey(vendor, name){ return String(vendor||'').trim()+'\x00'+String(name||'').trim(); }
  function addEvent(vendor, billName, side, amt, meta){
    vendor=String(vendor||'').trim();
    billName=String(billName||'').trim();
    if(!vendor||!billName||!amt) return;
    var k=billKey(vendor, billName);
    if(!billMap[k]) billMap[k]={vendor:vendor, billName:billName, payable:0, paid:0, events:[]};
    var rec=billMap[k];
    if(side==='payable') rec.payable+=amt;
    else rec.paid+=amt;
    rec.events.push({
      side:side, amount:amt,
      date:meta.date||'', voucherNo:meta.voucherNo||'', voucherType:meta.voucherType||'',
      billType:meta.billType||'', narration:meta.narration||''
    });
  }
  vouchers.forEach(function(vb, idx){
    var date=normalizeDate(tallyVoucherDateRawFromInner(vb))||today();
    var vno=tallyXmlSimpleTag(vb,'VOUCHERNUMBER')||String(idx+1);
    var vtype=tallyXmlSimpleTag(vb,'VOUCHERTYPENAME')||'';
    var partyHint=String(tallyXmlSimpleTag(vb,'PARTYLEDGERNAME')||'').trim();
    var narr=String(tallyXmlSimpleTag(vb,'NARRATION')||'').trim();
    var ents=tallyXmlListInners(vb,'ALLLEDGERENTRIES.LIST');
    if(!ents.length) return;
    ents.forEach(function(ent){
      var ledger=String(tallyXmlSimpleTag(ent,'LEDGERNAME')||'').trim();
      if(!ledger||isTallyBankOrCashLedger(ledger)) return;
      var vendor=partyHint;
      if(tallyEntryIsPartyLedgerInner(ent)) vendor=ledger;
      if(!vendor) vendor=ledger;
      var bills=tallyXmlListInners(ent,'BILLALLOCATIONS.LIST');
      if(bills.length){
        bills.forEach(function(b){
          var bname=tallyXmlSimpleTag(b,'NAME')||vno;
          var btype=tallyXmlSimpleTag(b,'BILLTYPE')||'';
          var bamt=Math.abs(parseFloat(String(tallyXmlSimpleTag(b,'AMOUNT')).replace(/,/g,''))||0);
          if(!bamt) return;
          addEvent(vendor, bname, classifyTallyBillAllocSide(btype, vtype), bamt, {
            date:date, voucherNo:vno, voucherType:vtype, billType:btype, narration:narr
          });
        });
      } else if(tallyEntryIsPartyLedgerInner(ent) && isTallyPayableCreationVoucherType(vtype)){
        var pamt=Math.abs(parseFloat(String(tallyLedgerPrimaryAmountStr(ent)).replace(/,/g,''))||0);
        if(pamt) addEvent(vendor, vno, 'payable', pamt, {date:date, voucherNo:vno, voucherType:vtype, billType:'(voucher)', narration:narr});
      }
    });
  });
  return Object.keys(billMap).map(function(k){
    var r=billMap[k];
    r.balance=Math.max(0, (r.payable||0)-(r.paid||0));
    r.pctPaid=r.payable>0?Math.min(100,((r.paid||0)/r.payable)*100):(r.paid>0?100:0);
    r.events.sort(function(a,b){ return String(a.date||'').localeCompare(String(b.date||'')); });
    return r;
  });
}
var __gaPayablePaidCacheKey = '';
var __gaPayablePaidCachedBills = null;
function getPayablePaidBillsCached(rawXml){
  if(!rawXml){ __gaPayablePaidCachedBills=[]; return __gaPayablePaidCachedBills; }
  if(rawXml===__gaPayablePaidCacheKey && __gaPayablePaidCachedBills) return __gaPayablePaidCachedBills;
  __gaPayablePaidCacheKey=rawXml;
  __gaPayablePaidCachedBills=parseTallyPayablePaidFromXml(rawXml);
  return __gaPayablePaidCachedBills;
}
function aggregatePayablePaidByVendor(bills){
  var by={};
  (bills||[]).forEach(function(b){
    var v=String(b.vendor||'Unknown Vendor');
    if(!by[v]) by[v]={vendor:v, payable:0, paid:0, balance:0, bills:0};
    by[v].payable+=(b.payable||0);
    by[v].paid+=(b.paid||0);
    by[v].balance+=(b.balance||0);
    by[v].bills+=1;
  });
  return Object.keys(by).map(function(k){ return by[k]; }).sort(function(a,b){ return (b.payable+b.paid)-(a.payable+a.paid); });
}

function payablePaidSourceMeta(bills){
  var payableEv=0, paidEv=0, agstRef=0, newRef=0;
  (bills||[]).forEach(function(b){
    (b.events||[]).forEach(function(ev){
      if(ev.side==='payable') payableEv++;
      else paidEv++;
      var bt=String(ev.billType||'').toLowerCase();
      if(bt.indexOf('agst')>=0||bt.indexOf('against')>=0) agstRef++;
      if(bt.indexOf('new ref')>=0||bt==='new') newRef++;
    });
  });
  return {
    payableEvents:payableEv, paidEvents:paidEv, agstRef:agstRef, newRef:newRef,

  };

 * Export Vendor GST reports from session XML (respects current vendor search).

function exportVendorGstExcel(report){
  if(!window.XLSX){ alert('Spreadsheet library not loaded.'); return; }
  var raw=window.__gaLastTallyExportRaw||'';
  if(!raw){ alert('No Tally XML in session. Use Tally live sync or Import Tally (XML) first.'); return; }
  var facts=getVendorGstFactsCached(raw);
  var q=String(_expenseVendorSearch||'').trim().toLowerCase();
  var rows=facts.filter(function(f){
    var v=String(f.vendor||'Unknown Vendor');
    return !q || v.toLowerCase().indexOf(q)>=0;
  }).slice().sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
  var proj=String(_curPid||'proj');
  var stamp=new Date().toISOString().slice(0,10);
  function sheetFromAoA(name, aoa){
    var ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=(aoa[0]||[]).map(function(){ return { wch: 14 }; });
    return { name: name.slice(0, 31), ws: ws };
  }
  function buildBillsInr(){
    var aoa=[['Date','Vendor','Voucher No','Voucher Type','Taxable ₹','GST ₹','Total ₹','GST %','Narration']];
    rows.forEach(function(f){
      var gp=f.total>0?((f.gst/f.total)*100):0;
      aoa.push([f.date||'',f.vendor||'',f.voucherNo||'',f.voucherType||'',f.taxable,f.gst,f.total,gp,f.narration||'']);
    });
    return aoa;
  }
  function buildBillsLac(){
    var aoa=[['Date','Vendor','Voucher No','Voucher Type','Taxable (lac)','GST (lac)','Total (lac)','GST %','Narration']];
    rows.forEach(function(f){
      var gp=f.total>0?((f.gst/f.total)*100):0;
      aoa.push([f.date||'',f.vendor||'',f.voucherNo||'',f.voucherType||'',rupeesToLacNum(f.taxable),rupeesToLacNum(f.gst),rupeesToLacNum(f.total),gp,f.narration||'']);
    });
    return aoa;
  }
  function buildVendorSummary(){
    var by={};
    rows.forEach(function(f){
      var v=String(f.vendor||'Unknown Vendor');
      if(!by[v]) by[v]={ vendor:v, taxable:0, gst:0, total:0, n:0 };
      by[v].taxable+=f.taxable; by[v].gst+=f.gst; by[v].total+=f.total; by[v].n+=1;
    });
    var aoa=[['Vendor','Taxable ₹','GST ₹','Total ₹','Vouchers','GST % of bill']];
    Object.keys(by).sort(function(a,b){ return by[b].total-by[a].total; }).forEach(function(k){
      var o=by[k], pct=o.total>0?(o.gst/o.total*100):0;
      aoa.push([k,o.taxable,o.gst,o.total,o.n,pct]);
    });
    return aoa;
  }
  function buildByMonth(){
    var m={};
    rows.forEach(function(f){
      var ym=String(f.date||'').slice(0,7);
      if(!ym||ym.length<7) ym='(undated)';
      if(!m[ym]) m[ym]={ ym:ym, taxable:0, gst:0, total:0, n:0 };
      m[ym].taxable+=f.taxable; m[ym].gst+=f.gst; m[ym].total+=f.total; m[ym].n+=1;
    });
    var aoa=[['Month','Voucher count','Taxable ₹','GST ₹','Total ₹']];
    Object.keys(m).sort().forEach(function(k){ var o=m[k]; aoa.push([k,o.n,o.taxable,o.gst,o.total]); });
    return aoa;
  }
  if(report==='workbook-all'){
    var wb=XLSX.utils.book_new();
    [sheetFromAoA('Bills_INR',buildBillsInr()),sheetFromAoA('Bills_LAC',buildBillsLac()),sheetFromAoA('Vendor_summary',buildVendorSummary()),sheetFromAoA('By_month',buildByMonth())].forEach(function(s){
      XLSX.utils.book_append_sheet(wb,s.ws,s.name);
    });
    XLSX.writeFile(wb,'GA_VendorGST_Reports_'+proj+'_'+stamp+'.xlsx');
    return;
  }
  var aoa;
  if(report==='bills-lac') aoa=buildBillsLac();
  else if(report==='bills-detail'||report==='bills-inr') aoa=buildBillsInr();
  else if(report==='vendor-summary') aoa=buildVendorSummary();
  else if(report==='by-month') aoa=buildByMonth();
  else aoa=buildBillsInr();
  var wb=XLSX.utils.book_new();
  var sn='Bills_detail';
  if(report==='bills-inr') sn='Bills_INR';
  else if(report==='bills-detail') sn='Bills_detail';
  else if(report==='bills-lac') sn='Bills_LAC';
  else if(report==='vendor-summary') sn='Vendor_summary';
  else if(report==='by-month') sn='By_month';
  sn=String(sn).slice(0,31);
  var sh=sheetFromAoA(sn,aoa);
  XLSX.utils.book_append_sheet(wb,sh.ws,sh.name);
  XLSX.writeFile(wb,'GA_VendorGST_'+sn+'_'+proj+'_'+stamp+'.xlsx');
}

  if(!visRows.length){
    h+='<div style="font-size:10px;color:var(--muted)">No lender schedule rows for current filter.</div>';
  }else{
    h+='<div style="font-size:10px;color:var(--muted);margin-bottom:8px">Due: Interest '+cr(totI,'₹0')+' · Principal '+cr(totP,'₹0')+' · Total '+cr(totP+totI,'₹0')+' &nbsp;|&nbsp; Marked Paid: Interest '+cr(paidI,'₹0')+' · Principal '+cr(paidP,'₹0')+' · Total '+cr(paidP+paidI,'₹0')+'</div>';

    h+='</tbody></table></div>';

function openModal(html){ document.getElementById('modal-root').innerHTML=html; }
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function formatUnitCommentStamp(iso){
  var d=iso?new Date(iso):null;
  if(!d||!isFinite(d.getTime())) return 'Unknown time';
  return d.toLocaleString();
}
function sortedUnitComments(u){
  ensureUnitSalesMeta(u);
  return (u.commentLog||[]).slice().sort(function(a,b){
    return String(a&&a.at||'').localeCompare(String(b&&b.at||''));
  });
}
function unitCommentChronologyText(u){
  return sortedUnitComments(u).map(function(it){
    return '['+formatUnitCommentStamp(it.at)+'] '+String(it.by||'User')+': '+String(it.text||'').replace(/\s+/g,' ').trim();
  }).join('\n');
}
function showUnitCommentsModal(idx){
  var cfg=getCF(_curPid), u=(cfg.units||[])[idx];
  if(!u){ alert('Unit not found.'); return; }
  ensureUnitSalesMeta(u);
  var items=sortedUnitComments(u);
  var hist=items.length?items.map(function(it){
    return '<div style="padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff">'
      +'<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;font-size:10px;color:var(--muted)"><span><strong>'+escHtml(String(it.by||'User'))+'</strong></span><span>'+escHtml(formatUnitCommentStamp(it.at))+'</span></div>'

function parseUnitClpDelimitedLine(line, sep){
  var out=[], cur='', inQuotes=false, i, ch, next;
  for(i=0;i<line.length;i++){
    ch=line.charAt(i);
    if(ch==='"'){
      next=line.charAt(i+1);
      if(inQuotes&&next==='"'){ cur+='"'; i++; }
      else inQuotes=!inQuotes;
      continue;
    }
    if(ch===sep&&!inQuotes){ out.push(cur); cur=''; continue; }
    cur+=ch;
  }
  out.push(cur);
  return out;
}
function parseUnitClpUploadText(text, defs){
  var raw=String(text||'').replace(/^\uFEFF/,'');
  var lines=raw.split(/\r?\n/).map(function(line){ return line.trim(); }).filter(Boolean);
  if(!lines.length) return {error:'The uploaded file is empty.'};
  var sep=lines[0].indexOf('\t')>=0?'\t':',';
  var head=parseUnitClpDelimitedLine(lines[0], sep).map(function(x){ return slugCRM(x); });
  function pick(row, keys){
    var i, idx;
    for(i=0;i<keys.length;i++){
      idx=head.indexOf(keys[i]);
      if(idx>=0) return row[idx]||'';
    }
    return '';
  }
  var bySlug={};
  (defs||[]).forEach(function(ms){
    bySlug[slugCRM(ms.key)]=ms;
    bySlug[slugCRM(ms.label)]=ms;
    bySlug[slugCRM(milestoneDisplayLabel(ms))]=ms;
  });
  var next={}, matched=0;
  lines.slice(1).forEach(function(line){
    var row=parseUnitClpDelimitedLine(line, sep);
    var keyish=pick(row,['milestone_key','key','milestone','milestone_label','label','stage']);
    var dateish=pick(row,['target_date','date','target','plan_date','milestone_date']);
    var iso=normalizeToISODate(dateish)||'';
    if(!keyish||!iso) return;
    var ms=bySlug[slugCRM(keyish)];
    if(!ms) return;
    next[ms.key]=iso;
    matched++;
  });
  if(!matched) return {error:'No milestone rows matched. Use Milestone Key/Milestone Label and Target Date columns.'};
  return {map:next,count:matched};
}
function unitClpTemplateCsv(cfg, unit){
  return ['Milestone Key,Milestone Label,Target Date'].concat(getMilestoneDefs(cfg).map(function(ms){
    var iso=normalizeToISODate(unit&&unit.milestonesDates&&unit.milestonesDates[ms.key])||'';
    return [ms.key,'"'+String(milestoneDisplayLabel(ms)||'').replace(/"/g,'""')+'"',iso].join(',');
  })).join('\n');
}

function buildSoldUnitsReportBook(cfg){
  var units=cfg.units||[];
  var caches=buildSalesGridCaches(cfg, units);
  var monthSet={};
  Object.keys(cfg.milestonesDates||{}).forEach(function(k){
    var iso=normalizeToISODate(cfg.milestonesDates[k])||'';
    if(iso) monthSet[iso.slice(0,7)]=1;
  });
  units.forEach(function(u, idx){
    ensureUnitPaymentFields(u);
    ensureUnitSalesMeta(u);
    var cache=caches[idx]||{};
    ['dueByMo','recvByMo','pendByMo'].forEach(function(key){
      Object.keys(cache[key]||{}).forEach(function(mo){ monthSet[mo]=1; });
    });
    Object.keys(u.milestonesDates||{}).forEach(function(k){
      var iso=normalizeToISODate(u.milestonesDates[k])||'';
      if(iso) monthSet[iso.slice(0,7)]=1;
    });
  });
  var months=Object.keys(monthSet).filter(function(mo){ return /^\d{4}-\d{2}$/.test(mo); }).sort();
  var soldRows=[[
    'Unit No','Unit Type','Client Name','Booking Date','Pay Type','Sale Value','Collected','Balance',
    'Funding Source','Loan Amount','Loan Sanctioned','OC Auto','OC Received','OC Pending (display)','OC Pending (computed plan)','Final loan (display)','Bank Loan Details','Payment Status','Expected Agreement Date',
    'Own Contribution Due Till Today','Comment Count','Comment Chronology','Unit CLP Override Count'
  ]];
  var monthlyRows=[['Unit No','Month','Due','Received','Pending']];
  var clpRows=[['Unit No','Milestone Key','Milestone Label','Pct','Common CLP','Unit Override','Effective CLP']];
  var commentRows=[['Unit No','Timestamp','By','Comment']];
  units.forEach(function(u, idx){
    var cache=caches[idx]||{dueByMo:{},recvByMo:{},pendByMo:{}};
    var collected=unitCollectedAmount(cfg,u);
    var oc=Math.max(0,coerceMoney(u.ownContributionAmount));
    var ocr=Math.max(0,coerceMoney(u.ownContributionReceived));
    var ocDueToday=ownContributionDueTillTodayForDisplay(u,cfg,cache);
    var ocPending=ownContributionPendingForDisplay(u,cfg,cache);
    var ocPendComp=ownContributionPendingComputed(u,cfg,cache);
    var fl=finalLoanAmountForUnit(u);
    soldRows.push([
      u.unitNo||'',
      u.unitType||'',
      u.clientName||'',
      normalizeToISODate(u.bookingDate)||'',
      u.payType||'const',
      coerceMoney(u.totalValue),
      collected,
      Math.max(0,coerceMoney(u.totalValue)-collected),
      normalizeFundingSource(u.fundingSource),
      Math.max(0,coerceMoney(u.loanAmount)),
      normalizeLoanSanction(u.loanSanctioned),
      oc,
      ocr,
      ocPending,
      ocPendComp,
      fl,
      String(u.bankLoanDetails||''),
      normalizeUnitPaymentStatus(u),
      normalizeToISODate(u.expectedAgreementDate)||'',
      ocDueToday,
      unitCommentCount(u),
      unitCommentChronologyText(u),
      unitClpOverrideCount(u)
    ]);
    months.forEach(function(mo){
      monthlyRows.push([
        u.unitNo||'',
        mo,
        coerceMoney((cache.dueByMo||{})[mo]),
        coerceMoney((cache.recvByMo||{})[mo]),
        coerceMoney((cache.pendByMo||{})[mo])
      ]);
    });
    getMilestoneDefs(cfg).forEach(function(ms){
      clpRows.push([
        u.unitNo||'',
        ms.key||'',
        milestoneDisplayLabel(ms)||'',
        parseFloat(ms.pct)||0,
        normalizeToISODate(cfg&&cfg.milestonesDates&&cfg.milestonesDates[ms.key])||'',
        normalizeToISODate(u&&u.milestonesDates&&u.milestonesDates[ms.key])||'',
        normalizeToISODate(milestoneTargetIsoForDef(cfg,u,ms))||''
      ]);
    });
    sortedUnitComments(u).forEach(function(it){
      commentRows.push([u.unitNo||'', it.at||'', it.by||'', it.text||'']);
    });
  });
  return {
    soldRows:soldRows,
    monthlyRows:monthlyRows,
    clpRows:clpRows,
    commentRows:commentRows
  };
}

/** Merge voucher XML (file from Tally export) into actuals — same parser as live bridge. */
function importTallyXmlFromFileText(xmlText, fileName){
  return importTallyXmlBatch([{name:fileName||'uploaded.xml', text:xmlText}]);
}
function importTallyXmlBatch(filePayloads){
  if(!_curPid){alert('Select a project first.');return;}
  if(!filePayloads||!filePayloads.length){alert('No files to import.');return;}
  var allRows=[], fileStats=[], errors=[], combinedRaw=[], cfStatement=false;
  filePayloads.forEach(function(fp){
    var text=normalizeTallyUploadText(String(fp.text||'').replace(/^\uFEFF/,''));
    if(!text.trim()){ errors.push((fp.name||'file')+': empty'); return; }
    if(!/<ENVELOPE[\s>]/i.test(text) && !/<VOUCHER[\s/>]/i.test(text) && !/<DSPDISPNAME>/i.test(text)){
      errors.push((fp.name||'file')+': not Tally XML (expected voucher or Cash Flow statement export)');
      return;
    }
    var parsed=parseTallyXmlToLedgerLines(text, {onlyPaymentReceipt:true});
    if(parsed.error){ errors.push((fp.name||'file')+': '+parsed.error); return; }
    var rows=parsed.rows||[];
    if(!rows.length){ errors.push((fp.name||'file')+': no Payment/Receipt ledger lines'); return; }
    if(parsed.format==='cashflow-statement') cfStatement=true;
    fileStats.push({name:fp.name||'file', count:rows.length, format:parsed.format||'voucher'});
    allRows=allRows.concat(rows);
    combinedRaw.push('<!-- '+String(fp.name||'file')+' -->\n'+text);
  });
  if(!allRows.length){
    alert('No Payment/Receipt lines imported.'+(errors.length?'\n\n'+errors.join('\n'):''));
    return;
  }
  var s=getTallySyncForPull();
  var res=mergeTallyLinesIntoActuals(allRows,{
    replaceTally:!!s.replaceTally,
    costCentreSubstr:s.costCentreSubstr||'',
    onlyPaymentReceipt:true
  });
  window.__gaLastTallyExportRaw=combinedRaw.join('\n\n');
  window.__gaLastTallyExportMeta={
    reportId:'uploaded-xml-batch',
    fromDate:'',
    toDate:'',
    sendCompanyToTally:false,
    currentCompany:'',
    pulledAt:new Date().toISOString(),
    files:fileStats,
    onlyPaymentReceipt:true
  };
  window.__gaLastTallyParsedRows=allRows.slice();
  renderTab(_curTab);
  refreshProjectCashflowViews();
  var summary='✓ Imported Payment/Receipt from '+fileStats.length+' file(s): +'+res.added+' line(s). Skipped '+res.skipped+' (duplicate, cost-centre, bank, or non-P/R).';
  fileStats.forEach(function(st){
    summary+='\n • '+st.name+': '+st.count+' Payment/Receipt lines';
  });
  if(cfStatement) summary+='\n\nNote: Cash Flow statement is not used in Payment/Receipt mode.';
  if(errors.length) summary+='\n\nWarnings:\n'+errors.map(function(e){return ' • '+e;}).join('\n');
  alert(summary);
}
function importTallyFile(input){
  if(!input.files||!input.files.length) return;
  var files=Array.prototype.slice.call(input.files);
  if(files.length===1){
    var only=files[0];
    var nm=String(only.name||'').toLowerCase();
    var isXml=/\.xml$/i.test(nm);
    if(!isXml){
      importTallyDelimitedFile(only, input);
      return;
    }
  }
  var pending=files.length, payloads=[], readErr=false;
  files.forEach(function(file){
    var reader=new FileReader();
    reader.onload=function(e){
      var buf=e.target.result;
      var text=decodeTallyUploadArrayBuffer(buf);
      payloads.push({name:file.name, text:text});
      if(--pending===0 && !readErr){
        importTallyXmlBatch(payloads);
        input.value='';
      }
    };
    reader.onerror=function(){
      readErr=true;
      alert('Could not read '+(file.name||'file')+'.');
      input.value='';
    };
    reader.readAsArrayBuffer(file);
  });
}
function importTallyDelimitedFile(file, input){
  var r=new FileReader();
  r.onload=function(e){
    var text=String(e.target.result||'').replace(/^\uFEFF/,'');
    if(!lines.length){alert('File appears empty.');return;}
    var header=lines[0].split('\t').map(function(h){return h.toLowerCase().trim();});
    var iDate=header.indexOf('date'), iParty=-1, iAmt=-1, iCredit=-1, iNarr=-1, iCC=-1;
    ['particulars','ledger name','party name','ledger'].forEach(function(k){if(iParty<0)iParty=header.indexOf(k);});
    ['amount','debit amount','debit'].forEach(function(k){if(iAmt<0)iAmt=header.indexOf(k);});
    ['credit amount','credit'].forEach(function(k){if(iCredit<0)iCredit=header.indexOf(k);});
    ['narration','description','remarks'].forEach(function(k){if(iNarr<0)iNarr=header.indexOf(k);});
    ['cost centre','cost center','department'].forEach(function(k){if(iCC<0)iCC=header.indexOf(k);});
    if(iParty<0){alert('Cannot find Particulars / Ledger Name column in file.\nExpected: Date, Particulars, Amount.\nPlease ensure tab-separated Tally export format.');return;}
    var parsed=[];
    lines.slice(1).forEach(function(line){
      var cols=line.split('\t');
      var party=cols[iParty]&&cols[iParty].trim();
      if(!party) return;
      var amtRaw=iAmt>=0?cols[iAmt]||'':'';
      var creditRaw=iCredit>=0?cols[iCredit]||'':'';
      var amt=parseFloat(amtRaw.replace(/,/g,''))||0;
      var credit=parseFloat(creditRaw.replace(/,/g,''))||0;
      if(credit>0) amt=credit;
      if(!amt) return;
      var narr=iNarr>=0?cols[iNarr]||'':'';
      var cc=iCC>=0?cols[iCC]||'':'';
      var date=iDate>=0?normalizeDate(cols[iDate]||''):today();
      var cl=classifyTallyLineFromText(party+' '+narr, party, amt);
      var cat=cl.cat1;
      var isInflow=INFLOW_CATS.indexOf(cat)>=0;
      if(cl.flow==='in' && !isInflow) isInflow=true;
      if(cl.flow==='out' && isInflow) isInflow=false;
      if(!isInflow) amt=-Math.abs(amt);
      parsed.push({
        date:date,party:party,cat1:cat,note:narr,amount:amt,costCentre:cc,
        gaL1:cl.gaL1,gaL2:cl.gaL2,gaL3:cl.gaL3,gaL3Name:cl.gaL3Name,tallyMapSrc:cl.tallyMapSrc,
      });
    });
    if(!parsed.length){alert('No transactions parsed. Check file format.');return;}
    var cfg=getCF(_curPid);
    var added=0;
    parsed.forEach(function(p){
      if(p.date&&p.amount){
        cfg.actuals.push(Object.assign({id:uid()},p));
        added++;
      }
    });
    saveAll(); renderTab(_curTab); refreshProjectCashflowViews();
    alert('✓ Imported '+added+' transaction(s). Review categories in the transaction log — auto-mapping uses ledger name keywords. Correct any that need updating.');
  };
  r.readAsText(file);
  input.value='';
}

}
function normalizeDate(d){
  if(!d) return today();
  var s=String(d).trim();
  if(/^\d{8}$/.test(s)) return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
  var mons={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  var ma=/^(\d{1,2})-([A-Za-z]{3,9})-(\d{2,4})$/i.exec(s);
  if(ma){
    var mo=mons[String(ma[2]).toLowerCase().slice(0,3)];
    if(mo){
      var yr=String(ma[3]).length===2?('20'+ma[3]):ma[3];
      return yr+'-'+mo+'-'+String(ma[1]).padStart(2,'0');
    }
  }
  var m=/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/.exec(s);
  if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  m=/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/.exec(s);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  return s;
}

function importExpenseSchedule(input){
  if(!input.files||!input.files[0]) return;
  if(!window.XLSX){alert('XLSX library not loaded.');input.value='';return;}
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var buf=new Uint8Array(e.target.result);
      var wb=XLSX.read(buf,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
      if(rows.length<2){alert('No data rows in expense file.');return;}
      var hdr=rows[0].map(function(c){ return String(c||'').toLowerCase().trim(); });
      function colIdx(names){
        for(var i=0;i<hdr.length;i++){
          for(var j=0;j<names.length;j++){
            if(hdr[i]===names[j]||hdr[i].indexOf(names[j])>=0) return i;
          }
        }
        return -1;
      }
      var iDa=colIdx(['date']), iAm=colIdx(['amount']), iDe=colIdx(['description','desc']), iCa=colIdx(['category','l3','l3 code','cost head','code']), iCC=colIdx(['cost centre','cost center','unit','cc']);
      if(iDa<0) iDa=0;
      if(iAm<0) iAm=1;
      if(iDe<0) iDe=2;
      if(iCa<0) iCa=3;
      if(iCC<0) iCC=4;
      var cfg=getCF(_curPid);
      var added={landSchedule:0,nocSchedule:0,consultantSchedule:0,regulatoryConsultingSchedule:0,constructionSchedule:0,marketingSchedule:0};
      var skippedGA=0;
      function pushSk(sk,o){
        if(!cfg[sk]) cfg[sk]=[];
        cfg[sk].push(o);
        added[sk]++;
      }
      rows.slice(1).forEach(function(r){
        var dateRaw=r[iDa], amount=parseFloat(r[iAm])||0, desc=(r[iDe]||'').toString().trim(), catRaw=(r[iCa]||'').toString().trim(), cc=(r[iCC]||'').toString().trim();
        if(!amount) return;
        var iso=normalizeToISODate(dateRaw);
        var cat=catRaw.toLowerCase();
        var g=null;
        if(typeof GA_ACCT_L3_BY_CODE!=='undefined' && GA_ACCT_L3_BY_CODE){
          var t3=catRaw.trim();
          var bPref=_curPid?getAcctPrefixForPid(_curPid):'A';
          var mk=resolveMasterKeyFromShortCode(t3, 'building', bPref)||resolveMasterKeyFromShortCode(t3.split(/[\s|]+/)[0], 'building', bPref);
          g=(mk&&GA_ACCT_L3_BY_CODE[mk])||lookupGAAccountingByLedgerName(t3, 'building', bPref)||lookupGAAccountingByLedgerName(t3.split(/[\s|]+/)[0], 'building', bPref);
        }
        if(g){
          var sk=legacyCat1ToExpenseScheduleKey(g.legacyCat1);
          if(!sk){
            skippedGA++;
            return;
          }
          if(sk==='constructionSchedule'||sk==='marketingSchedule'){
            var o={amount:amount,costCentre:cc,desc:desc||g.l3Name||g.desc};
            if(iso){ o.date=iso; o.month=dateToProjectMonth(cfg.startDate||'',iso); }
            else o.month=1;
            pushSk(sk,o);
          } else {
            pushSk(sk,{date:iso||'',amount:amount,desc:desc||g.l3Name||g.desc,costCentre:cc});
          }
          return;
        }
        if(cat.indexOf('land')>=0||(cat.indexOf('partner')>=0&&cat.indexOf('buyout')>=0)){
          pushSk('landSchedule',{date:iso||'',amount:amount,desc:desc,costCentre:cc});
        } else if(cat.indexOf('noc')>=0||cat.indexOf('approval')>=0||cat.indexOf('statutory')>=0){
          pushSk('nocSchedule',{date:iso||'',amount:amount,desc:desc,costCentre:cc});
        } else if(cat.indexOf('regulatory')>=0){
          pushSk('regulatoryConsultingSchedule',{date:iso||'',amount:amount,desc:desc,costCentre:cc});
        } else if(cat.indexOf('consult')>=0){
          pushSk('consultantSchedule',{date:iso||'',amount:amount,desc:desc,costCentre:cc});
        } else if(cat.indexOf('construct')>=0||cat.indexOf('civil')>=0){
          var co={amount:amount,costCentre:cc,desc:desc};
          if(iso){ co.date=iso; co.month=dateToProjectMonth(cfg.startDate||'',iso); }
          else co.month=1;
          pushSk('constructionSchedule',co);
        } else if(cat.indexOf('market')>=0||cat.indexOf('brand')>=0||cat.indexOf('advert')>=0){
          var mo={amount:amount,costCentre:cc,desc:desc};
          if(iso){ mo.date=iso; mo.month=dateToProjectMonth(cfg.startDate||'',iso); }
          else mo.month=1;
          pushSk('marketingSchedule',mo);
        } else if(cat.indexOf('ga dm')>=0||cat.indexOf('ga-dm')>=0||cat.indexOf('dm fee')>=0||cat.indexOf('g&a')>=0||cat.indexOf('g a')>=0||cat.indexOf('admin')>=0||cat.indexOf('overhead')>=0){
          skippedGA++;
        }
      });
      var n=added.landSchedule+added.nocSchedule+added.consultantSchedule+added.regulatoryConsultingSchedule+added.constructionSchedule+added.marketingSchedule;
      if(!n&&!skippedGA){alert('No rows matched. Use an L3 code from GA Accounting Categories (e.g. I3-2) or legacy text (Land, NOC, …).');return;}
      saveAll();
      renderTab(_curTab);
      refreshProjectCashflowViews();
      var msg='✓ Imported '+n+' expense schedule row(s). Monthly Cashflow and GA Consolidated updated.';
      if(skippedGA) msg+=' ('+skippedGA+' GA DM Fee row(s) skipped — set GA DM Fee monthly / V2 annual fields on this tab.)';
      alert(msg);
    }catch(err){
      alert('Could not read expense file: '+err.message);
    }finally{
      input.value='';
    }
  };
  reader.readAsArrayBuffer(input.files[0]);
}

function importMilestoneTemplate(input){
  if(!input.files||!input.files[0]) return;
  if(!window.XLSX){alert('XLSX library not loaded.');input.value='';return;}
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array',cellDates:true,cellNF:false,cellText:false});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(!rows.length){alert('Template appears empty.');return;}
      var hdr=rows[0].map(function(c){return (c||'').toString().trim().toLowerCase();});
      function colIdx(names){
        for(var i=0;i<hdr.length;i++){
          var h=hdr[i];
          for(var j=0;j<names.length;j++){
            if(h===names[j]||h.indexOf(names[j])>=0) return i;
          }
        }
        return -1;
      }
      var ik=colIdx(['key']), ilab=colIdx(['label']), ipct=colIdx(['percent','%']), icl=colIdx(['construction','linked','y/n']);
      var iAch=colIdx(['achieved date','milestone achieved','actual date','actual']);
      var iTgt=colIdx(['target date','milestone target','payment date','plan date']);
      if(iTgt<0){
        var idLegacy=colIdx(['date']);
        if(idLegacy>=0 && idLegacy!==iAch) iTgt=idLegacy;
      }
      if(ik<0) ik=0;
      if(ilab<0) ilab=1;
      if(ipct<0) ipct=2;
      if(icl<0) icl=3;
      if(iTgt<0) iTgt=4;
      if(iAch<0) iAch=5;
      var dataRows=rows.slice(1);
      var rawPctSum=0;
      dataRows.forEach(function(r){
        var k0=(r[ik]!==undefined&&r[ik]!==null?r[ik]:r[0]);
        k0=(k0||'').toString().trim();
        var l0=(r[ilab]!==undefined&&r[ilab]!==null?r[ilab]:r[1]);
        l0=(l0||'').toString().trim();
        if(!k0||!l0) return;
        rawPctSum+=Math.abs(parseFloat(r[ipct]!==undefined&&r[ipct]!==null?r[ipct]:r[2])||0);
      });
      // Paradise-style: cells sum to ~1.0 as fractions of GDV (0.1+0.2+…); GA template uses 5,10,… summing to ~100.
      var pctScaleExcelFractions=rawPctSum>0.85&&rawPctSum<=1.05;
      var out=[];
      var dateByKey={}, achievedByKey={};
      dataRows.forEach(function(r){
        var key=(r[ik]!==undefined&&r[ik]!==null?r[ik]:r[0]);
        key=(key||'').toString().trim();
        var label=(r[ilab]!==undefined&&r[ilab]!==null?r[ilab]:r[1]);
        label=(label||'').toString().trim();
        var pctRaw=r[ipct]!==undefined&&r[ipct]!==null?r[ipct]:r[2];
        var pct=parseFloat(pctRaw)||0;
        if(pctScaleExcelFractions&&pct>0&&pct<=1) pct=pct*100;
        else if(!pctScaleExcelFractions&&pct>0&&pct<1) pct=pct*100;
        var clRaw=r[icl]!==undefined&&r[icl]!==null?r[icl]:r[3];
        var cl=(clRaw||'').toString().trim().toUpperCase().charAt(0)==='Y';
        var dateRawTgt=r[iTgt]!==undefined&&r[iTgt]!==null?r[iTgt]:r[4];
        var dateRawAch=iAch>=0&&r[iAch]!==undefined&&r[iAch]!==null?r[iAch]:'';
        var isoT=normalizeToISODate(dateRawTgt);
        var isoA=normalizeToISODate(dateRawAch);
        if(!key||!label||pct<=0) return;
        out.push({key:key,label:label,pct:Math.round(pct*10000)/10000,constLink:cl});
        if(isoT) dateByKey[key]=isoT;
        if(isoA) achievedByKey[key]=isoA;
      });
      if(!out.length){alert('No valid milestone rows found. Ensure Key, Label and Percent are filled.');return;}
      var cfg=getCF(_curPid);
      cfg.milestoneDefs=out;
      if(!cfg.milestonesDates) cfg.milestonesDates={};
      if(!cfg.milestonesAchievedDates) cfg.milestonesAchievedDates={};
      Object.keys(dateByKey).forEach(function(k){ cfg.milestonesDates[k]=dateByKey[k]; });
      Object.keys(achievedByKey).forEach(function(k){ cfg.milestonesAchievedDates[k]=achievedByKey[k]; });
      saveAll();
      renderSales();
      refreshPostSalesRoadmap();
      refreshProjectCashflowViews();
      var dn=Object.keys(dateByKey).length, an=Object.keys(achievedByKey).length;
      alert('✓ Milestone template applied'+(dn||an?(' ('+[dn?dn+' target':'',an?an+' achieved':''].filter(Boolean).join(', ')+')'):'')+'.');
    }catch(err){
      alert('Could not read milestone template: '+err.message);
    }finally{
      input.value='';
    }
  };
  reader.readAsArrayBuffer(input.files[0]);
}

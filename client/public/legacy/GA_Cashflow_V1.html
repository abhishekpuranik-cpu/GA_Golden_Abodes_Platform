<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GA Cashflow Tracker V2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundled.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script src="ga_accounting_categories.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4FA;--card:#fff;--border:#DDE2EA;--muted:#6B7280;
  --blue:#1558A0;--blue-b:#0A3266;--blue-l:#EBF4FF;
  --green:#1A7244;--green-l:#E8F6EE;--green-b:#0D4D30;
  --red:#A8301E;--red-l:#FEECEC;--red-b:#7B1D1D;
  --gold:#A07800;--gold-l:#FDF8EC;--teal:#0B7070;--teal-l:#E6F7F7;
  --purple:#542B8A;--purple-l:#F3EEFF;--purple-b:#3B1D6E;
  --orange:#B54D0A;--orange-l:#FEF0E5;--slate:#4A5568;--text:#1A202C;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:12px}
.hidden{display:none!important}
/* Top bar */
#topbar{background:linear-gradient(90deg,#0A3266,#1558A0);color:#fff;padding:0 14px;display:flex;align-items:center;gap:4px;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.3);flex-wrap:wrap;min-height:46px}
#topbar .logo{font-size:14px;font-weight:800;padding:0 14px 0 0;border-right:1px solid rgba(255,255,255,.2);margin-right:4px;white-space:nowrap}
.tab-btn{background:none;border:none;color:rgba(255,255,255,.7);padding:12px 11px;cursor:pointer;font-size:11px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab-btn.on{color:#fff;border-bottom-color:#62C5FF}
.tab-btn:hover{color:#fff}
/* Sync bar */
#sync-bar{background:var(--blue-l);border-bottom:1.5px solid var(--border);padding:5px 14px;display:flex;align-items:center;gap:10px;font-size:10px}
/* Pages */
.page{padding:12px 14px;max-width:1800px;margin:0 auto}
/* Cards */
.card{background:var(--card);border-radius:8px;border:1.5px solid var(--border);padding:12px 14px;margin-bottom:10px}
/* KPI row */
.kpi-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kpi{flex:1;min-width:100px;background:var(--card);border-radius:8px;padding:10px 12px;border:1.5px solid var(--border)}
/* Buttons */
.btn{padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:700;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-b)}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:var(--card);color:var(--blue-b);border:1.5px solid var(--border)}
.btn-outline:hover{border-color:var(--blue)}
.btn-red{background:var(--red);color:#fff}
/* Cashflow table */
.cf-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);box-shadow:0 4px 24px rgba(10,50,102,.06);background:var(--card)}
.cf-tbl{border-collapse:separate;border-spacing:0;width:100%;min-width:2000px;font-size:12px;line-height:1.35}
.cf-tbl thead th{background:#1A2744;color:#fff;padding:8px 9px;text-align:right;white-space:nowrap;font-size:11px;font-weight:700;position:sticky;top:0;z-index:10;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.cf-tbl thead tr:nth-child(2) th{font-size:10px;font-weight:600;padding:6px 8px}
.cf-tbl thead th:first-child,.cf-tbl thead th:nth-child(2){text-align:left}
.cf-sticky0{position:sticky;left:0;z-index:16;background:var(--card);min-width:38px;text-align:left!important;box-shadow:1px 0 0 var(--border)}
.cf-sticky1{position:sticky;left:38px;z-index:16;background:var(--card);min-width:56px;max-width:72px;box-shadow:1px 0 0 var(--border)}
.cf-month-narrow{font-size:10px;line-height:1.25;white-space:normal;word-break:break-word;padding:5px 6px!important;font-weight:600;color:var(--blue-b)}
.sales-cur-mo{background:#FFFDE7!important;box-shadow:inset 0 0 0 1px #F59E0B}
.sales-subtab{display:inline-flex;gap:4px;margin-bottom:12px;padding:4px;background:var(--border);border-radius:8px}
.sales-subtab button{border:none;padding:8px 14px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted)}
.sales-subtab button.on{background:#fff;color:var(--blue-b);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ms-milestone-title{word-break:normal;overflow-wrap:break-word;white-space:normal;line-height:1.35;hyphens:auto}
.ps-dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.ps-dash-card{border-radius:10px;padding:12px 14px;border:1.5px solid var(--border);background:linear-gradient(145deg,#fff,#F8FAFC)}
.ps-dash-card h4{margin:0 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ps-dash-card .v{font-size:18px;font-weight:800;color:var(--blue-b)}
.sales-grid-wrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:8px}
.sales-grid-wrap thead th{position:sticky;z-index:20;background:#fff}
.sales-grid-wrap thead tr:first-child th{top:0;z-index:40}
.sales-grid-wrap thead tr:nth-child(2) th{top:28px;z-index:39}
.cf-tbl tbody tr:hover td{background-color:rgba(21,88,160,.04)!important}
.cf-tbl tbody td{border-bottom:1px solid #E8EDF4}
.cf-num{text-align:right;padding:6px 9px;white-space:nowrap;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.cf-muted{color:var(--muted)}
.cf-in{color:#166534}
.cf-out{color:#991B1B}
.cf-in-tot{font-weight:700;color:#14532D}
.cf-out-tot{font-weight:700;color:#7F1D1D}
.cf-debt{color:#4A2080;font-size:11px}
.cf-actual{opacity:1}
.cf-proj td{font-style:italic;opacity:.92}
/* Modal */
.modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:10px;padding:20px 24px;width:500px;max-width:95vw;max-height:88vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.modal h3{font-size:14px;font-weight:800;color:var(--blue-b);margin-bottom:14px}
/* Form fields */
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.field label,.fld-lbl{font-size:10px;font-weight:700;color:var(--muted)}
.fld-note{font-size:9px;color:var(--muted);font-weight:400;margin-top:1px}
.field input,.field select,.cap-inp{padding:6px 8px;border:1.5px solid var(--border);border-radius:5px;font-size:11px;background:var(--card);width:100%}
.field input:focus,.cap-inp:focus{border-color:var(--blue);outline:none}
</style>
</head>
<body>

<!-- Top nav -->
<div id="topbar">
  <div class="logo">&#127968; GA Cashflow</div>
  <button class="tab-btn on"  id="tab-cashflow"  onclick="showTab('cashflow')">&#128200; Cashflow</button>
  <button class="tab-btn"     id="tab-sales"     onclick="showTab('sales')">&#127968; Sales &amp; Revenue</button>
  <button class="tab-btn"     id="tab-capital"   onclick="showTab('capital')">&#128176; Capital Structure</button>
  <button class="tab-btn"     id="tab-expenses"  onclick="showTab('expenses')">&#128196; Expense Schedule</button>
  <button class="tab-btn"     id="tab-debt"      onclick="showTab('debt')">&#127970; Debt Service</button>
  <button class="tab-btn"     id="tab-ga"        onclick="showTab('ga')">&#127760; GA Consolidated</button>
  <div style="margin-left:auto;display:flex;align-items:center;gap:6px;padding:6px 0">
    <select id="phase-select" onchange="selectPhase(this.value)"
      style="padding:5px 8px;border-radius:5px;border:1px solid #fff;background:#fff;color:var(--blue-b);font-size:11px;font-weight:600;min-width:130px">
      <option value="__all__">All Phases</option>
    </select>
    <select id="building-select" onchange="selectBuilding(this.value)"
      style="padding:5px 8px;border-radius:5px;border:1px solid #fff;background:#fff;color:var(--blue-b);font-size:11px;font-weight:600;min-width:130px">
      <option value="__all__">All Buildings</option>
    </select>
    <select id="proj-select" onchange="selectProj(this.value)"
      style="padding:5px 8px;border-radius:5px;border:1px solid #fff;background:#fff;color:var(--blue-b);font-size:11px;font-weight:600;min-width:160px">
      <option value="">No projects</option>
    </select>
    <button class="btn btn-outline" onclick="syncFromV3()"
      style="font-size:10px;padding:4px 8px;color:#fff;border-color:rgba(255,255,255,.3)">&#8635; Sync V3</button>
    <button class="btn btn-outline" data-action="add-proj"
      style="font-size:10px;padding:4px 8px;color:#fff;border-color:rgba(255,255,255,.3)" title="Add project manually">+ Manual</button>
    <button class="btn btn-outline" data-action="hierarchy-modal"
      style="font-size:10px;padding:4px 8px;color:#fff;border-color:rgba(255,255,255,.3)" title="Edit project hierarchy">⚙ Hierarchy</button>
  </div>
</div>

<!-- Sync bar -->
<div id="sync-bar">
  <span id="sync-msg" style="color:var(--muted)">Loading&#8230;</span>
  <span style="margin-left:12px;padding-left:12px;border-left:1.5px solid var(--border);display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span style="font-weight:700;color:var(--blue-b)">Tally</span>
    <button type="button" class="btn btn-primary" data-action="tally-sync-modal" style="font-size:10px;padding:4px 10px">Live sync (local)</button>
  </span>
  <span style="margin-left:12px;padding-left:12px;border-left:1.5px solid var(--border);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap">
    <span style="font-weight:700;color:var(--blue-b)">Drive</span>
    <button type="button" class="btn btn-outline" data-action="cf-cloud-setup" style="font-size:10px;padding:4px 8px" title="Same Web App URL as GA Planner V3 (localStorage ga_cloud_url)">Apps Script URL</button>
    <button type="button" class="btn btn-primary" data-action="cf-cloud-save" style="font-size:10px;padding:4px 8px">Save to cloud</button>
    <span id="cf-cloud-status" style="font-size:10px;color:var(--muted);max-width:220px"></span>
  </span>
  <span style="margin-left:12px;padding-left:12px;border-left:1.5px solid var(--border);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap" title="Requires a small backend that stores one JSON state document in MongoDB. Not the same as Drive / Apps Script.">
    <span style="font-weight:700;color:var(--blue-b)">Server / Mongo</span>
    <button type="button" class="btn btn-outline" data-action="mongo-server-setup" style="font-size:10px;padding:4px 8px">Set API + enable</button>
    <button type="button" class="btn btn-primary" data-action="mongo-save-now" style="font-size:10px;padding:4px 8px" title="PUT state now">Save to server</button>
    <button type="button" class="btn btn-outline" data-action="mongo-load-now" style="font-size:10px;padding:4px 8px" title="GET state from server">Load from server</button>
    <span id="mongo-cf-status" style="font-size:10px;color:var(--muted);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>
  </span>
  <span style="margin-left:auto;color:var(--muted);font-size:10px">Today: <strong id="today-date"></strong></span>
</div>

<!-- Pages -->
<div id="page-cashflow"  class="page"></div>
<div id="page-sales"     class="page hidden"></div>
<div id="page-capital"   class="page hidden"></div>
<div id="page-expenses"  class="page hidden"></div>
<div id="page-debt"      class="page hidden"></div>
<div id="page-ga"        class="page hidden"></div>
<div id="modal-root"></div>

<!-- Static file inputs -->
<input type="file" id="tally-file-input" accept=".csv,.tsv,.txt,.xml,.xlsx,.xls,text/xml" style="display:none" onchange="importTallyFile(this)"/>
<input type="file" id="cap-template-input" accept=".xlsx,.xls" style="display:none" onchange="importCapitalTemplate(this)"/>
<input type="file" id="cf-import-input"   accept=".json" style="display:none"/>
<input type="file" id="sales-milestones-input" accept=".xlsx,.xls,.xlsm" style="display:none" onchange="importMilestoneTemplate(this)"/>
<input type="file" id="expense-schedule-input" accept=".xlsx,.xls" style="display:none" onchange="importExpenseSchedule(this)"/>
<input type="file" id="sales-inventory-input" accept=".xlsx,.xls,.xlsm" style="display:none" onchange="importInventoryTemplate(this)"/>
<input type="file" id="unsold-inventory-input" accept=".xlsx,.xls,.xlsm" style="display:none" onchange="importUnsoldInventoryTemplate(this)"/>
<input type="file" id="crm-postsales-input" accept=".xlsx,.xls,.xlsm" style="display:none" onchange="importCRMPostSalesWorkbook(this)"/>

<script>
// CF V1 — Part 1: Constants, data model, engine
'use strict';

// ══════════════════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════════════════
var CF_VERSION = 4;
var INFLOW_CATS  = ['Sales Revenue','Equity Infusion','Investor Funding','Unsecured Loan','Customer Collections','Customer UL','Other Inflow'];
var OUTFLOW_CATS = ['Land','NOC','Consultant','Regulatory & Consulting','Construction','Marketing','GA DM Fee','Contingency','Interest Paid','Principal Repaid'];
var ALL_CATS = INFLOW_CATS.concat(OUTFLOW_CATS);
/**
 * Display column names from GA Accounting Categories (L1 inflow A–G, outflow H–O).
 * Engine still uses INFLOW/OUTFLOW legacy cat1 keys internally.
 */
var CF_INFLOW_L1_COLS = null;
var CF_OUTFLOW_L1_COLS = null;
function ensureGaL1CashflowCols(){
  if(CF_INFLOW_L1_COLS && CF_OUTFLOW_L1_COLS) return;
  if(typeof GA_ACCT_L3_BY_CODE==='undefined'){
    CF_INFLOW_L1_COLS = INFLOW_CATS.slice();
    CF_OUTFLOW_L1_COLS = OUTFLOW_CATS.slice();
    return;
  }
  var inf={}, ouf={};
  Object.keys(GA_ACCT_L3_BY_CODE).forEach(function(k){
    var g=GA_ACCT_L3_BY_CODE[k];
    if(g.flow==='in' && g.l1) inf[g.l1] = g.l1Name;
    if(g.flow==='out' && g.l1) ouf[g.l1] = g.l1Name;
  });
  CF_INFLOW_L1_COLS = Object.keys(inf).sort().map(function(c){ return inf[c]; });
  CF_OUTFLOW_L1_COLS = Object.keys(ouf).sort().map(function(c){ return ouf[c]; });
  if(!CF_INFLOW_L1_COLS.length) CF_INFLOW_L1_COLS = INFLOW_CATS.slice();
  if(!CF_OUTFLOW_L1_COLS.length) CF_OUTFLOW_L1_COLS = OUTFLOW_CATS.slice();
}
function l1MapEmpty(cols){
  var o={}; (cols||[]).forEach(function(n){ o[n] = 0; }); return o;
}
function mergeL1Object(dst, add){
  if(!add) return;
  Object.keys(add).forEach(function(k){
    dst[k] = (dst[k] || 0) + (add[k] || 0);
  });
}
function sumL1MapOverRows(rows, key){
  var out={};
  (rows || []).forEach(function(r){
    if(!r || !r[key]) return;
    mergeL1Object(out, r[key]);
  });
  return out;
}
/**
 * Map the same numbers as the legacy 7+9 into GA L1 headers (I/M/N/O are zero unless
 * reclassified on actual lines; schedule rolls into Construction Cost, etc.).
 */
function l1InflowFromRowVals(r){
  ensureGaL1CashflowCols();
  var cols = CF_INFLOW_L1_COLS, m = l1MapEmpty(cols);
  cols.forEach(function(n){
    var v=0;
    if(n==='Sales Revenue') v=r.salesRev||0;
    else if(n==='Equity Infusion' || n==='Promoter Funding') v=r.equityInf||0;
    else if(n==='Investor Funding') v=r.invFunding||0;
    else if(n==='Unsecured Loan') v=r.ulInflow||0;
    else if(n==='Customer UL') v=r.custUL||0;
    else if(n==='Customer Collections') v=(r.custColl||0) + (cols.indexOf('Customer UL') >= 0 ? 0 : (r.custUL||0));
    else if(n==='Other Inflow' || n==='Other Income') v=r.otherIn||0;
    else if(n==='Financial Institution Funding') v=0;
    m[n] = v;
  });
  return m;
}
function l1OutflowFromRowVals(r){
  ensureGaL1CashflowCols();
  var cols = CF_OUTFLOW_L1_COLS, m = l1MapEmpty(cols);
  var pa = (r.land||0) + (r.noc||0) + (r.consultant||0) + (r.regulatoryConsulting||0);
  var hasL=cols.indexOf('Land')>=0, hasN=cols.indexOf('NOC')>=0, hasC=cols.indexOf('Consultant')>=0;
  var usePaRollupOnly = !(hasL && hasN && hasC);
  var debtSvc = (r.intPaid||0) + (r.principalPaid||0);
  cols.forEach(function(n){
    var v=0;
    if(n==='Project Acquisition') v= usePaRollupOnly ? pa : 0;
    else if(n==='Land' || n==='NOC' || n==='Consultant') v= n==='Land' ? (r.land||0) : (n==='NOC' ? (r.noc||0) : (r.consultant||0));
    else if(n==='Regulatory & Consulting') v= r.regulatoryConsulting||0;
    else if(n==='Construction Cost' || n==='Construction') v= n==='Construction' ? (r.construction||0) : (r.construction||0) + (r.contingency||0);
    else if(n==='Contingency') v= r.contingency||0;
    else if(n==='Common Aminities' || n==='Show Flat' || n==='Sales Office') v=0;
    else if(n==='Marketing' || n==='Marketing Cost') v=r.marketing||0;
    else if(n==='GA DM Fee' || n==='G&A Cost' || n==='G&A') v= r.ga||0;
    else if(n==='Interest Paid' || n==='Principal Repaid' || n==='Interest & Panelty Cost') v= n==='Principal Repaid' ? (r.principalPaid||0) : n==='Interest Paid' ? (r.intPaid||0) : debtSvc;
    m[n] = v;
  });
  return m;
}
function cfDisplayInflowCols(){
  ensureGaL1CashflowCols();
  return (CF_INFLOW_L1_COLS && CF_INFLOW_L1_COLS.length) ? CF_INFLOW_L1_COLS : INFLOW_CATS;
}
function cfDisplayOutflowCols(){
  ensureGaL1CashflowCols();
  return (CF_OUTFLOW_L1_COLS && CF_OUTFLOW_L1_COLS.length) ? CF_OUTFLOW_L1_COLS : OUTFLOW_CATS;
}
/** Narrow table headers: break on every space (e.g. GA / DM / Fee). */
function cfCatThLabel(c){ return String(c).replace(/ /g,'<br/>'); }
/** Outflow column header: L1 category name only (no L2/L3 subtitle row). */
function cfOutflowColHeaderHtml(cn){
  return cfCatThLabel(cn);
}
function scheduleMonthConsultantRow(e,startDate){
  if(e.date){
    var iso=normalizeToISODate(e.date);
    if(iso) return iso.slice(0,7);
  }
  if(e.planDate){
    var iso2=normalizeToISODate(e.planDate);
    if(iso2) return iso2.slice(0,7);
  }
  if(e.month>0&&startDate) return offsetMonth(startDate,e.month-1);
  return '';
}
function scheduleMonthConsOrMkt(e,startDate){
  if(e.date){
    var isod=normalizeToISODate(e.date);
    if(isod) return isod.slice(0,7);
  }
  if(e.planDate){
    var isoP=normalizeToISODate(e.planDate);
    if(isoP) return isoP.slice(0,7);
  }
  if(e.month>0&&startDate) return offsetMonth(startDate,e.month-1);
  return '';
}
function principalRepaymentInMonthHtml(rs, mo, period){
  if(!rs) return 0;
  var amt=rs.amount||0;
  if(!amt) return 0;
  if(rs.dueDate){
    var iso=normalizeToISODate(rs.dueDate);
    if(iso&&iso.slice(0,7)===mo) return amt;
    return 0;
  }
  if(rs.month===period) return amt;
  return 0;
}
/** Totals for planned-vs-actual L1 chart (same mapping as monthly row rollup). */
function plannedTotalsFakeRowForL1(cfg){
  function sumSched(skey){ return (cfg[skey]||[]).reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0); }
  return {
    land:sumSched('landSchedule'),noc:sumSched('nocSchedule'),consultant:sumSched('consultantSchedule'),
    regulatoryConsulting:sumSched('regulatoryConsultingSchedule'),
    construction:sumSched('constructionSchedule'),marketing:sumSched('marketingSchedule'),
    ga:(cfg.gaGAAnnual>0?cfg.gaGAAnnual:(cfg.gaMonthly||0)*12),contingency:0,intPaid:0,principalPaid:0
  };
}
function actualOutflowSumByGaL1(cfg){
  ensureGaL1CashflowCols();
  var cols=CF_OUTFLOW_L1_COLS, sums=l1MapEmpty(cols);
  (cfg.actuals||[]).forEach(function(a){
    if(!a||coerceMoney(a.amount)>=0) return;
    if(!includeActualInCashflowSums(a)) return;
    var mag=Math.abs(coerceMoney(a.amount));
    if(mag<=0) return;
    var l1=String(a.gaL1||'').trim();
    if(l1&&sums.hasOwnProperty(l1)) sums[l1]+=mag;
  });
  return sums;
}
function htmlExpenseHealthL1CompareChart(cfg){
  var acts=cfg.actuals||[];
  var faux=plannedTotalsFakeRowForL1(cfg);
  var planL1=l1OutflowFromRowVals(faux);
  var actL1=actualOutflowSumByGaL1(cfg);
  var cols=cfDisplayOutflowCols();
  var rows=[], maxV=1;
  cols.forEach(function(cn){
    var p=planL1[cn]||0, a=actL1[cn]||0;
    rows.push({cn:cn,p:p,a:a});
    if(p>maxV) maxV=p;
    if(a>maxV) maxV=a;
  });
  var h='<div class="card" style="margin-bottom:12px;border-top:3px solid #1558A0">';
  h+='<div style="font-size:12px;font-weight:800;color:var(--blue-b);margin-bottom:6px">Expense health — planned vs actual (GA L1 / cashflow columns)</div>';

// Greedy tokenization for CRM/Excel run-on labels (e.g. oncommencementofplinth)
var MILESTONE_LABEL_LEX = [
  'oncommencementof','oncompletionof','onintimationof','atthetimeof','onecoatof','completionof','commencementof',
  'waterproofing','electrification','registration','excavation','brickwork','plastering','plaster','plumbing',

  'staircase','elevator','lift','shaft','lobby','lobbies','mechanical','electrical','entrance','water','pump','pumps',
  'walls','wall','floors','floor','fitting','fittings','selective','fabrication','grill','windows','window','doors','door',
  'tiles','masonry','brick','sump','chute','commencement','completion','intimation','agreement','stampduty','stamp','duty','total','amount',
  '1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th',
  'gst','interest','the','and','for','of','on','at','time','coat'
];
MILESTONE_LABEL_LEX.sort(function(a,b){return b.length-a.length;});

function humanizeMilestoneLabel(raw){
  if(raw===undefined||raw===null) return '';
  var s=String(raw).replace(/_/g,' ').replace(/-/g,' ').trim();
  if(!s) return '';
  if(/\s/.test(s)) return s.replace(/\b([a-z])/gi,function(_,c){return c.toUpperCase();});
  var lower=s.toLowerCase();
  var out=[], i=0;
  while(i<lower.length){
    var matched=false;
    for(var wi=0;wi<MILESTONE_LABEL_LEX.length;wi++){
      var w=MILESTONE_LABEL_LEX[wi];
      if(lower.slice(i,i+w.length)===w){ out.push(w); i+=w.length; matched=true; break; }
    }
    if(!matched){ out.push(lower[i]); i++; }
  }
  var merged=[], buf='';
  function flushBuf(){ if(buf){ merged.push(buf); buf=''; } }
  out.forEach(function(t){
    if(t.length===1) buf+=t;
    else { flushBuf(); merged.push(t); }
  });
  flushBuf();
  var phrase=merged.join(' ').replace(/\s+/g,' ').trim();
  return phrase.replace(/\b([a-z])/gi,function(_,c){return c.toUpperCase();});
}

function formatMilestonePct(p){
  var n=parseFloat(p);
  if(!isFinite(n)) return '—';
  var r=Math.round(n*10000)/10000;
  if(Math.abs(r-Math.round(r))<1e-6) return String(Math.round(r));
  return r.toFixed(2).replace(/\.?0+$/,'');
}

function milestoneDisplayLabel(ms){
  if(!ms) return '';
  return humanizeMilestoneLabel(ms.label||ms.key||'');
}

/** Strip CRM suffix so "Token (due)" → "Token". */
function installmentBaseLabel(L){
  return String(L||'').replace(/\s*\(due\)\s*$/i,'').replace(/\s*\(received\)\s*$/i,'').replace(/\s*\(pending\)\s*$/i,'').trim();
}
/** Match CRM column header to a milestone def (project or CRM-import defs). */
function findMilestoneDefForHeader(cfg, hdrLabel){
  var raw=String(hdrLabel||'').trim();
  if(!raw) return null;
  var hs=slugCRM(humanizeMilestoneLabel(raw));
  var hsRaw=slugCRM(raw);
  var defs=getMilestoneDefs(cfg);
  var i, ms, best=null;
  for(i=0;i<defs.length;i++){
    ms=defs[i];
    var sl=slugCRM(String(ms.label||''));
    if(slugCRM(milestoneDisplayLabel(ms))===hs||sl===hs||sl===hsRaw||slugCRM(String(ms.key||''))===hs||slugCRM(String(ms.key||''))===hsRaw){ return ms; }
  }
  var hCompact=(raw||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
  if(hCompact.length<5) return null;
  for(i=0;i<defs.length;i++){
    ms=defs[i];
    var mCompact=(milestoneDisplayLabel(ms)||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
    if(!mCompact||mCompact.length<5) continue;
    if(hCompact.indexOf(mCompact)>=0||mCompact.indexOf(hCompact)>=0) best=ms;
  }
  return best;
}
/** When milestone dates were saved under legacy keys (e.g. Plinth) but defs use CRM keys (crm_plinth_18), match by slug. */
function milestoneDateIsoBySlugScan(cfg, unit, labelish){
  var raw=String(labelish||'').trim();
  if(!raw) return '';
  var targets={};
  targets[slugCRM(humanizeMilestoneLabel(raw))]=1;
  targets[slugCRM(raw)]=1;
  function scanMap(m){
    if(!m||typeof m!=='object') return '';
    var k, iso, sk, sh;
    for(k in m){
      if(!Object.prototype.hasOwnProperty.call(m,k)) continue;
      iso=normalizeToISODate(m[k])||'';
      if(!iso) continue;
      sk=slugCRM(k);
      sh=slugCRM(humanizeMilestoneLabel(k));
      if(targets[sk]||targets[sh]) return iso;
    }
    return '';
  }
  var a=scanMap(cfg&&cfg.milestonesDates);
  if(a) return a;
  return scanMap(unit&&unit.milestonesDates);
}
function milestoneTargetIsoForDef(cfg, unit, ms){
  if(!ms) return '';
  var pd=normalizeToISODate(cfg&&cfg.milestonesDates&&cfg.milestonesDates[ms.key])||'';
  var ud=normalizeToISODate(unit&&unit.milestonesDates&&unit.milestonesDates[ms.key])||'';
  if(pd||ud) return pd||ud;
  var s1=milestoneDateIsoBySlugScan(cfg, unit, milestoneDisplayLabel(ms));
  if(s1) return s1;
  return milestoneDateIsoBySlugScan(cfg, unit, ms.key)||milestoneDateIsoBySlugScan(cfg, unit, ms.label);
}
function clampDateIsoToBooking(iso, bookingIso){
  var d=normalizeToISODate(iso)||'';
  var b=normalizeToISODate(bookingIso)||'';
  if(!d||!b) return d||b||'';
  return d<b?b:d;
}
function clampMonthToBooking(mo, bookingIso){
  var m=(mo&&String(mo).slice(0,7))||'';
  var b=normalizeToISODate(bookingIso)||'';
  if(!m||!b) return m;
  var bm=b.slice(0,7);
  return m<bm?bm:m;
}
function bookingMilestonePct(cfg){
  var defs=getMilestoneDefs(cfg), i, ms;
  for(i=0;i<defs.length;i++){
    ms=defs[i];
    var lk=String(ms.key||'').toLowerCase();
    var ll=String(ms.label||'').toLowerCase();
    if(lk==='booking'||lk.indexOf('booking')>=0||lk.indexOf('token')>=0||ll.indexOf('booking')>=0||ll.indexOf('token')>=0){
      return Math.max(0,parseFloat(ms.pct)||0);
    }
  }
  return 0;
}
function cumulativeMilestonePctAtBooking(unit,cfg){
  var b=normalizeToISODate(unit&&unit.bookingDate)||'';
  if(!b) return 0;
  var defs=getMilestoneDefs(cfg), i, ms, dt, cum=0;
  for(i=0;i<defs.length;i++){
    ms=defs[i];
    if(String(ms.key||'').toLowerCase()==='booking'){
      cum+=Math.max(0,parseFloat(ms.pct)||0);
      continue;
    }
    dt=milestoneTargetIsoForDef(cfg, unit, ms)||'';
    if(!dt){
      var ll=String(ms.label||'').toLowerCase(), lk=String(ms.key||'').toLowerCase();
      if((ll.indexOf('agreement')>=0||ll.indexOf('registration')>=0||lk.indexOf('agreement')>=0)&&b){
        var da=new Date(b); if(!isNaN(da.getTime())){ da.setMonth(da.getMonth()+1); dt=da.toISOString().slice(0,10); }
      }
    }
    if(dt&&dt<=b) cum+=Math.max(0,parseFloat(ms.pct)||0);
  }
  return Math.max(0,cum);
}
function bookingDueDiagnostics(unit,cfg){
  if(!unit||unit.payType!=='install') return null;
  var b=normalizeToISODate(unit.bookingDate)||'';
  var tv=coerceMoney(unit.totalValue);
  if(!b||tv<=0||!installUsesCRMDueLines(unit)) return null;
  var upDue=0;
  groupCRMInstallmentsByBase(unit,cfg).forEach(function(g){
    var dIso=normalizeToISODate(g.dueIso)||'';
    if(!dIso) return;
    if(dIso<=b) upDue+=coerceMoney(g.due);
  });
  var ownPct=bookingMilestonePct(cfg);
  var cumPct=Math.max(ownPct,cumulativeMilestonePctAtBooking(unit,cfg));
  var expDue=tv*(cumPct/100);
  var diff=upDue-expDue;
  return {uploaded:upDue,expected:expDue,diff:diff,pct:cumPct};
}
/** Paradise / CRM: timeline gives one month per milestone; due/received/pending share that month (pending: sheet row if any, else due−recv). */
function effectiveInstallmentIso(unit,cfg,ins){
  var raw=normalizeToISODate(ins&&ins.date)||'';
  if(!cfg||!unit||unit.payType!=='install'||!ins) return raw;
  var b=normalizeToISODate(unit.bookingDate)||'';
  if(raw) return clampDateIsoToBooking(raw, b);
  var base=installmentBaseLabel(ins.label);
  if(!base) return raw;
  var ms=findMilestoneDefForHeader(cfg, base);
  var tgt=ms?milestoneTargetIsoForDef(cfg, unit, ms):'';
  if(!tgt) tgt=milestoneDateIsoBySlugScan(cfg, unit, base);
  // Important: if both sheet date and mapped target date are missing, keep blank.
  // Falling back to booking date here pulls unknown future stages into booking month.
  if(!tgt) return '';
  return clampDateIsoToBooking(tgt, b);
}
/** YYYY-MM for installment rows: use unit-level milestone month exactly as uploaded/mapped. */
function crmMilestoneMonthKey(dueIso, unit){
  var mo=(dueIso||'').slice(0,7);
  if(!mo||!/^\d{4}-\d{2}$/.test(mo)) return mo;
  return mo;
}
function installUsesCRMDueLines(unit){
  return (unit.installments||[]).some(function(ins){ return String(ins.label||'').indexOf('(due)')>=0; });
}
/** One object per CRM milestone column: due, recv, pend (explicit or derived), shared milestone month. */
function groupCRMInstallmentsByBase(unit,cfg){
  var acc={};
  (unit.installments||[]).forEach(function(ins){
    var L=String(ins.label||'');
    var base=installmentBaseLabel(L);
    if(!base) return;
    var iso=effectiveInstallmentIso(unit,cfg,ins);
    var typ=L.indexOf('(received)')>=0?'r':L.indexOf('(pending)')>=0?'p':L.indexOf('(due)')>=0?'d':'u';
    if(!acc[base]) acc[base]={base:base,due:0,recv:0,pendSum:0,pendExplicit:false,dueIso:''};
    var g=acc[base];
    if(typ==='d'){
      g.due+=coerceMoney(ins.amount);
      if(iso) g.dueIso=iso;
    }else if(typ==='r'){
      g.recv+=coerceMoney(ins.amount);
      if(iso&&!g.dueIso) g.dueIso=iso;
    }else if(typ==='p'){
      g.pendExplicit=true;
      g.pendSum+=coerceMoney(ins.amount);
      if(iso&&!g.dueIso) g.dueIso=iso;
    }else if(typ==='u'){
      g.due+=coerceMoney(ins.amount);
      if(iso) g.dueIso=iso;
    }
  });
  var arr=Object.keys(acc).map(function(k){
    var g=acc[k];
    g.pend=g.pendExplicit?g.pendSum:Math.max(0,coerceMoney(g.due)-coerceMoney(g.recv));
    delete g.pendSum;
    delete g.pendExplicit;
    return g;
  });
  var syn=null;
  arr.forEach(function(g){
    if(String(g.base||'').indexOf('Construction stage at booking')>=0) syn=g;
  });
  if(!syn) return arr;
  var bmo=(normalizeToISODate(unit&&unit.bookingDate)||'').slice(0,7);
  var tv=coerceMoney(unit&&unit.totalValue);
  if(!bmo||tv<=0) return arr;
  var sumBookDue=0;
  arr.forEach(function(g){
    var iso=normalizeToISODate(g.dueIso)||'';
    if(!iso||iso.slice(0,7)!==bmo) return;
    sumBookDue+=coerceMoney(g.due);
  });
  if(sumBookDue<=tv*1.01) return arr;
  var extraDue=0,extraRecv=0;
  var out=[];
  arr.forEach(function(g){
    var isSyn=String(g.base||'').indexOf('Construction stage at booking')>=0;
    if(isSyn){ out.push(g); return; }
    var iso=normalizeToISODate(g.dueIso)||'';
    var inBook=!!(iso&&iso.slice(0,7)===bmo);
    var isBal=String(g.base||'').indexOf('Balance to Agreement')>=0;
    if(inBook&&!isBal){
      extraDue+=coerceMoney(g.due);
      extraRecv+=coerceMoney(g.recv);
      return;
    }
    out.push(g);
  });
  syn.due=coerceMoney(syn.due)+extraDue;
  syn.recv=coerceMoney(syn.recv)+extraRecv;
  syn.pend=Math.max(0,coerceMoney(syn.due)-coerceMoney(syn.recv));
  return out;
}

/**
 * Tally ledgers that follow the GA chart often prefix the voucher line with the L3 code (e.g. "I3-2 Cement").
 * "C1-1-3 C302" → resolve by trimming trailing "-segments" until a workbook L3 key matches.
 */
function lookupGAAccountingByLedgerName(ledgerName){
  if(typeof GA_ACCT_L3_BY_CODE==='undefined'||!GA_ACCT_L3_BY_CODE) return null;
  var t=String(ledgerName||'').trim();
  if(!t) return null;
  var sp=t.indexOf(' ');
  var first=sp<0?t:t.slice(0,sp);
  var c=first;
  while(c){
    if(GA_ACCT_L3_BY_CODE[c]) return GA_ACCT_L3_BY_CODE[c];
    var p=c.lastIndexOf('-');
    if(p<0) break;
    c=c.slice(0,p);
  }
  return null;
}
/**
 * @returns {{cat1:string,gaL1:string,gaL2:string,gaL3:string,gaL3Name:string,flow?:string,tallyMapSrc:string}}
 */
function classifyTallyLineFromText(fullText, party, rawAmount){
  var text=String(fullText||'').toLowerCase();
  var g=lookupGAAccountingByLedgerName(party);
  if(g){
    return {
      cat1:g.legacyCat1,
      gaL1:g.l1Name||'',
      gaL2:(g.l2Name||'')+' ('+(g.l2||'')+')',
      gaL3:g.l3||'',
      gaL3Name:g.l3Name||'',
      flow:g.flow,
      tallyMapSrc:'l3-book',
    };
  }
  g=lookupGAAccountingByLedgerName(String(party||'').trim().split(/[\s|:/]+/)[0]);
  if(g){
    return {cat1:g.legacyCat1,gaL1:g.l1Name||'',gaL2:(g.l2Name||'')+' ('+(g.l2||'')+')',gaL3:g.l3||'',gaL3Name:g.l3Name||'',flow:g.flow,tallyMapSrc:'l3-book'};
  }
  var kw=guessTallyCategoryKey(fullText);
  if(!kw) kw=guessTallyCategoryKey(String(party||''));
  if(kw){
    return {cat1:kw,gaL1:'',gaL2:'',gaL3:'',gaL3Name:'',tallyMapSrc:'keyword'};
  }
  if(/customer|collection|booking|milestone|possession|receipt|sale|unit|flat|parking|amenity|demand|installment|allotment/i.test(text)){
    return {cat1:'Other Inflow',gaL1:'',gaL2:'',gaL3:'',gaL3Name:'(heuristic inflow)',tallyMapSrc:'heuristic-in'};
  }
  return {cat1:'Construction',gaL1:'',gaL2:'',gaL3:'',gaL3Name:'(unmapped — reclassify if needed)',tallyMapSrc:'unmapped-out'};
}
function legacyCat1ToExpenseScheduleKey(leg){
  var m={'Land':'landSchedule','NOC':'nocSchedule','Consultant':'consultantSchedule','Regulatory & Consulting':'regulatoryConsultingSchedule','Construction':'constructionSchedule','Marketing':'marketingSchedule'};

function guessTallyCategoryKey(ledger){
  if(!ledger) return '';
  var l=String(ledger).toLowerCase();
  var best='', bestLen=0;
  Object.keys(TALLY_MAP).forEach(function(k){
    if(l.indexOf(k)>=0 && k.length>bestLen){ best=TALLY_MAP[k]; bestLen=k.length; }
  });
  return best;
}

function tallyDd(iso){ return String(iso||'').replace(/\D/g,'').slice(0,8); }
/** XML 1.0 disallows most C0 controls; Tally data sometimes contains them and DOMParser fails. */
function stripIllegalXmlCharacters(s){
  if(!s||typeof s!=='string') return '';
  return s.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFDD0-\uFDEF\uFFFE\uFFFF]/g,'');
}
/** Tally often emits raw & in text; strict DOMParser rejects it. Escape only bare ampersands. */
function sanitizeTallyXmlForDomParser(xmlText){
  if(!xmlText||typeof xmlText!=='string') return '';
  var s=stripIllegalXmlCharacters(xmlText.replace(/^\uFEFF/,''));
  return s.replace(/&(?!(?:amp|apos|quot|lt|gt);|#(?:[0-9]+|x[0-9A-Fa-f]+);|[a-zA-Z][a-zA-Z0-9]*;)/gi,'&amp;');
}
function tallyDecodeXmlText(s){
  return String(s||'')
    .replace(/&amp;/gi,'&')
    .replace(/&lt;/gi,'<')
    .replace(/&gt;/gi,'>')
    .replace(/&quot;/gi,'"')
    .replace(/&apos;/gi,"'");
}
/** Escape regex special chars in a Tally tag name (e.g. ALLLEDGERENTRIES.LIST). */
function tallyReEsc(tag){ return String(tag||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
/** Remove nested LIST blocks so AMOUNT regex hits the ledger line amount, not bill splits. */
function tallyStripListBlocks(innerXml, listTagNames){
  var s=String(innerXml||'');
  (listTagNames||[]).forEach(function(nm){
    var esc=tallyReEsc(nm);
    s=s.replace(new RegExp('<'+esc+'\\b[^>]*>[\\s\\S]*?</'+esc+'>','gi'),'');
  });
  return s;
}
function tallyAmtInsideBillAllocDom(el){
  var p=el&&el.parentElement;
  while(p){
    var t=p.tagName||'';
    if(t==='BILLALLOCATIONS.LIST'||t.indexOf('BILLALLOCATIONS')===0) return true;
    p=p.parentElement;
  }
  return false;
}
/** Prefer direct-child AMOUNT on ALLLEDGERENTRIES; ignore nested bill-line zeros. */
function tallyLedgerPrimaryAmountDom(ent){
  if(!ent) return '';
  var i, c, t, n, best='', bestAbs=0, tn;
  for(i=0;i<ent.children.length;i++){
    c=ent.children[i];
    if(!c||!c.tagName) continue;
    tn=String(c.tagName).toUpperCase();
    if(tn==='AMOUNT'||tn==='DEBITAMOUNT'||tn==='CREDITAMOUNT'){
      t=String(c.textContent||'').trim();
      n=Math.abs(parseFloat(t.replace(/,/g,'')))||0;
      if(n>=bestAbs){bestAbs=n; best=t;}
    }
  }
  if(bestAbs>0) return best;
  var all=ent.getElementsByTagName('AMOUNT');
  for(i=0;i<all.length;i++){
    c=all[i];
    if(tallyAmtInsideBillAllocDom(c)) continue;
    t=String(c.textContent||'').trim();
    n=Math.abs(parseFloat(t.replace(/,/g,'')))||0;
    if(n>=bestAbs){bestAbs=n; best=t;}
  }
  return best;
}
function tallyLedgerPrimaryAmountStr(entInner){
  var strip=['BILLALLOCATIONS.LIST','INTERESTCOLLECTION.LIST','OLDAUDITENTRYIDS.LIST','ACCOUNTINGALLOCATIONS.LIST','GST.LIST','BANKALLOCATIONS.LIST','BRANCHALLOCATIONS.LIST','PAYROLLMODEPAYMENT.LIST','ORIGINALPURCHASE.LIST','SERIALNUMBER.LIST','CATEGORYALLOCATIONS.LIST','INVENTORYALLOCATIONS.LIST'];
  var stripped=tallyStripListBlocks(entInner,strip);
  var best='', bestAbs=0, tags=['AMOUNT','DEBITAMOUNT','CREDITAMOUNT'], ti, m, esc, re2;
  for(ti=0;ti<tags.length;ti++){
    esc=tallyReEsc(tags[ti]);
    re2=new RegExp('<'+esc+'(?:\\s[^>]*)?>([\\s\\S]*?)<\\/'+esc+'>','gi');
    while((m=re2.exec(stripped))!==null){
      var inner=m[1].replace(/<!\[CDATA\[([\s\S]*?)\]\]>/gi,'$1').replace(/<[^>]+>/g,'').trim();
      var tx=tallyDecodeXmlText(inner);
      var nx=Math.abs(parseFloat(tx.replace(/,/g,'')))||0;
      if(nx>=bestAbs){bestAbs=nx; best=tx;}
    }
  }
  return best;
}
function tallyVoucherDateRawFromInner(vb){
  var tags=['DATE','VCHENTRYDATE','EFFECTIVE_DATE','REFERENCEDATE','VCHSTATUSDATE','ACTUALVCHDATE','BONDDATE'];
  for(var i=0;i<tags.length;i++){
    var t=tallyXmlSimpleTag(vb,tags[i]);
    if(t) return t;
  }
  return '';
}
/** First <TAG>…</TAG> in block (optional attrs on open). Nested markup → flatten to text. */
function tallyXmlSimpleTag(block, tag){
  if(!block||!tag) return '';
  var esc=tallyReEsc(tag);
  var re=new RegExp('<'+esc+'(?:\\s[^>]*)?>([\\s\\S]*?)<\\/'+esc+'>','i');
  var m=re.exec(block);
  if(!m) return '';
  var inner=m[1].trim().replace(/<!\[CDATA\[([\s\S]*?)\]\]>/gi,'$1');
  if(inner.indexOf('<')<0) return tallyDecodeXmlText(inner);
  return tallyDecodeXmlText(inner.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim());
}
/** All direct child blocks named tag (siblings), inner XML only. */
function tallyXmlListInners(parentXml, tag){
  var esc=tallyReEsc(tag);
  var re=new RegExp('<'+esc+'(?:\\s[^>]*)?>([\\s\\S]*?)<\\/'+esc+'>','gi');
  var out=[], x;
  while((x=re.exec(parentXml))!==null) out.push(x[1]);

}
/**
 * When DOMParser fails (unescaped < in narration, bad chars, etc.), extract the same fields Tally sends.

function parseTallyXmlToLedgerLinesRegex(safeXml){
  var rows=[], vi=0;
  function normDate(s){
    s=String(s||'').trim();
    if(/^\d{8}$/.test(s)) return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
    return normalizeDate(s);
  }
  var reV=/<VOUCHER\b[^>]*>([\s\S]*?)<\/VOUCHER>/gi;
  var vm;
  while((vm=reV.exec(safeXml))!==null){
    vi++;
    var vb=vm[1];
    var dRaw=tallyVoucherDateRawFromInner(vb);
    var date=normDate(dRaw)||today();
    var vno=tallyXmlSimpleTag(vb,'VOUCHERNUMBER')||tallyXmlSimpleTag(vb,'VOUCHERNUMBERLIST')||String(vi);
    var vtype=tallyXmlSimpleTag(vb,'VOUCHERTYPENAME')||'';
    var ents=tallyXmlListInners(vb,'ALLLEDGERENTRIES.LIST');
    for(var ei=0;ei<ents.length;ei++){
      var ent=ents[ei];
      var party=tallyXmlSimpleTag(ent,'LEDGERNAME');
      if(!party) continue;
      var amtStr=tallyLedgerPrimaryAmountStr(ent);
      var amt=parseFloat(String(amtStr).replace(/,/g,''))||0;
      var cc=tallyXmlSimpleTag(ent,'COSTCENTRENAME')||tallyXmlSimpleTag(vb,'COSTCENTRENAME');
      if(!cc){
        var bills=tallyXmlListInners(ent,'BILLALLOCATIONS.LIST');
        if(bills.length){

        }
      }
      var narr=tallyXmlSimpleTag(ent,'NARRATION')||tallyXmlSimpleTag(vb,'NARRATION');
      var tk='tally|'+date+'|'+vno+'|'+party+'|'+amtStr+'|'+(cc||'');
      rows.push({date:date,party:party,rawAmount:amt,note:(vtype?('['+vtype+'] '):'')+(narr||''),costCentre:cc,tallyKey:tk});
    }

/** Parse Tally export XML → ledger lines {date, party, rawAmount, note, costCentre, tallyKey} */
function parseTallyXmlToLedgerLines(xmlText){
  var rows=[];
  if(!xmlText||typeof xmlText!=='string') return rows;
  var trimmed=xmlText.trim();
  if(trimmed.charAt(0)==='{'){
    try{
      var er=JSON.parse(trimmed);
      if(er.error) return {error:String(er.error)};
      if(er.ok===false) return {error:String(er.error||er.message||'Bridge returned JSON instead of XML.')};
    }catch(e){}
  }
  var safe=sanitizeTallyXmlForDomParser(xmlText);
  var lem=/<LINEERROR>([\s\S]*?)<\/LINEERROR>/i.exec(safe);
  if(lem){
    var rawL=lem[1].replace(/<!\[CDATA\[([\s\S]*?)\]\]>/gi,'$1').replace(/<[^>]+>/g,'').trim();
    var lmsg=tallyDecodeXmlText(rawL);
    var lhint=/SVCURRENTCOMPANY|SVCurrentCompany|Could not set/i.test(lmsg)?' Turn off “Send company name to Tally” in Live sync, or type the exact company name from Gateway → Select Company.':'';
    return {error:'Tally LINEERROR: '+lmsg+'.'+lhint};
  }
  var p=new DOMParser().parseFromString(safe,'text/xml');
  if(p.getElementsByTagName('parsererror').length){
    rows=parseTallyXmlToLedgerLinesRegex(safe);
    if(rows.length) return {rows:rows};
    var one=String(safe).replace(/\s+/g,' ').slice(0,280);
    return {error:'Invalid XML (parser error). Try re-export from Tally or use Import Tally (CSV / XML). Preview: '+one+(safe.length>280?'…':'')};
  }
  function txt(el, tag){
    if(!el) return '';
    var n=el.getElementsByTagName(tag)[0];
    return n?String(n.textContent||'').trim():'';
  }
  function normDate(s){
    s=String(s||'').trim();
    if(/^\d{8}$/.test(s)) return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
    return normalizeDate(s);
  }
  var vouchers=p.getElementsByTagName('VOUCHER');
  for (var vi=0; vi<vouchers.length; vi++){
    var vch=vouchers[vi];
    var dRaw='';
    ['DATE','VCHENTRYDATE','EFFECTIVE_DATE','REFERENCEDATE','VCHSTATUSDATE','ACTUALVCHDATE','BONDDATE'].forEach(function(tg){if(!dRaw)dRaw=txt(vch,tg)||'';});
    var date=normDate(dRaw)||today();
    var vno=txt(vch,'VOUCHERNUMBER')||txt(vch,'VOUCHERNUMBERLIST')||String(vi);
    var vtype=txt(vch,'VOUCHERTYPENAME')||'';
    var ents=vch.getElementsByTagName('ALLLEDGERENTRIES.LIST');
    for (var ei=0; ei<ents.length; ei++){
      var ent=ents[ei];
      var party=txt(ent,'LEDGERNAME');
      if(!party) continue;
      var amtStr=tallyLedgerPrimaryAmountDom(ent)||txt(ent,'AMOUNT');
      var amt=parseFloat(String(amtStr).replace(/,/g,''))||0;
      var cc=txt(ent,'COSTCENTRENAME')||txt(vch,'COSTCENTRENAME');
      if(!cc){
        var bill=ent.getElementsByTagName('BILLALLOCATIONS.LIST')[0];
        if(bill) cc=txt(bill,'NAME')||txt(bill,'COSTCENTRENAME');
      }
      var narr=txt(ent,'NARRATION')||txt(vch,'NARRATION');
      var tk='tally|'+date+'|'+vno+'|'+party+'|'+amtStr+'|'+(cc||'');
      rows.push({date:date,party:party,rawAmount:amt,note:(vtype?('['+vtype+'] '):'')+(narr||''),costCentre:cc,tallyKey:tk});
    }
  }
  if(rows.length) return {rows:rows};
  rows=parseTallyXmlToLedgerLinesRegex(safe);
  if(rows.length) return {rows:rows};
  var msgs=p.getElementsByTagName('LINEERROR');
  if(msgs.length) return {error:txt(msgs[0],'DESCRIPTION')||'Tally LINEERROR'};
  return {error:'No voucher ledger lines in this XML (no VOUCHER / ALLLEDGERENTRIES). Export again from Tally with the full period (e.g. Day Book + Alt+F2 range), or use Import Tally (CSV / XML) with a voucher-style export. Live bridge pulls can be limited to one day by Tally.'};
}
function ledgerLineToActual(row){
  var party=row.party, note=row.note||'', cc=row.costCentre||'';
  var raw=parseFloat(row.rawAmount)||0;
  var cl=classifyTallyLineFromText(party+' '+note, party, raw);
  var cat1=cl.cat1;
  var isInflow=INFLOW_CATS.indexOf(cat1)>=0;
  if(cl.flow==='in' && !isInflow) isInflow=true;
  if(cl.flow==='out' && isInflow) isInflow=false;
  var mag=Math.abs(raw);

  return {

function mergeTallyLinesIntoActuals(rows, opts){
  opts=opts||{};
  var cfg=getCF(_curPid);
  if(!cfg.actuals) cfg.actuals=[];
  if(opts.replaceTally) cfg.actuals=cfg.actuals.filter(function(a){return a.source!=='tally';});
  var ccSub=(opts.costCentreSubstr||'').trim().toLowerCase();
  var added=0, skipped=0;
  rows.forEach(function(row){
    if(ccSub){
      var c=(row.costCentre||'').toLowerCase();
      if(!c||c.indexOf(ccSub)<0){skipped++;return;}
    }
    var act=ledgerLineToActual(row);
    if(cfg.actuals.some(function(a){return a.tallyKey===act.tallyKey;})){skipped++;return;}
    cfg.actuals.push(act);
    added++;
  });
  saveAll();
  return {added:added,skipped:skipped};
}

function downloadTextFile(filename, text, mime){
  var blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
}

  });

    if(st==='agreement_pending'){ nA++; pA+=pend; }

  });
  return {nAgreement:nA,nPayIssue:nPI,pendAgreement:pA,pendPayIssue:pPI};
}

function mongoStatePutNow(){

  _mongoSaveBusy=true;
  var expected=_mongoStateVersion;

  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,body:j}; }); })
  .then(function(res){
    if(!res.ok){
      if(res.body && res.body.currentVersion!==undefined){
        _mongoStateVersion=Number(res.body.currentVersion)||_mongoStateVersion;
      }
      throw new Error((res.body&&res.body.error)||'Mongo save failed');

    _mongoStateVersion=Number(res.body.version)||_mongoStateVersion;
    mongoStateStatus('MongoDB save OK · v'+_mongoStateVersion,'green');

function cfCloudRelayBase(){
  try{
    if(window.location.protocol==='file:') return 'http://localhost:8765';
    if((window.location.protocol==='http:'||window.location.protocol==='https:')&&window.location.host)
      return window.location.origin;
  }catch(e){}
  return 'http://localhost:8765';
}
function cfCloudRelayCandidates(){
  var out=[], seen={};
  function add(u){
    if(!u||seen[u]) return;
    seen[u]=1; out.push(u);
  }
  add(cfCloudRelayBase());
  try{
    if(window.location.origin&&window.location.origin!=='null') add(window.location.origin);
  }catch(e){}
  [8765,8766,8767,8768,8769,8770,8771,8772,8773,8774,8775].forEach(function(p){
    add('http://localhost:'+p);
    add('http://127.0.0.1:'+p);
  });
  return out;
}
function cfFetchWithTimeout(url, opts, ms){
  ms=ms||12000;
  return new Promise(function(resolve,reject){
    var done=false;
    var t=setTimeout(function(){
      if(done) return;
      done=true;
      reject(new Error('Timed out after '+Math.round(ms/1000)+'s'));
    }, ms);
    fetch(url, opts).then(function(r){
      if(done) return;
      done=true; clearTimeout(t); resolve(r);
    }).catch(function(e){
      if(done) return;
      done=true; clearTimeout(t); reject(e);
    });
  });
}
function cfSerializeCloudSlice(){

function cfCloudPushImmediate(){
  var url='';
  try{ url=(localStorage.getItem(CF_CLOUD_CONF_KEY)||'').trim(); }catch(e){}
  if(!url||url.indexOf('script.google.com')<0){
    setCfCloudStatus('Set Apps Script URL (V3) to enable cloud merge');
    return;
  }
  var savedBy='User';
  try{ savedBy=(localStorage.getItem('ga_user_name')||'User').trim()||'User'; }catch(e){}
  var payload={v:2, ts:Date.now(), savedBy:savedBy, ga_cf_v1:cfSerializeCloudSlice()};
  setCfCloudStatus('Saving to Drive…');
  var relays=cfCloudRelayCandidates(), idx=0, lastErr='';
  function attempt(){
    if(idx>=relays.length){
      var hint='Run Start_GA_Planner.bat (proxy) and open via http://localhost:8765';
      setCfCloudStatus('Cloud failed. '+hint+'. Last error: '+String(lastErr||'Failed to fetch').slice(0,80));
      return;
    }
    var relay=relays[idx++];
    cfFetchWithTimeout(relay+'/cloud-save?url='+encodeURIComponent(url),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    },12000).then(function(r){
      return r.text().then(function(t){ return {r:r,t:t,relay:relay}; });
    }).then(function(o){
      if(!o.r.ok) throw new Error(o.t.slice(0,240)||('HTTP '+o.r.status));
      var meta=JSON.parse(o.t);
      if(meta.ok===false) throw new Error(meta.error||'Save rejected');
      setCfCloudStatus('Drive OK via '+o.relay.replace(/^https?:\/\//,'')+' · '+new Date().toLocaleTimeString('en-IN'));
    }).catch(function(e){
      lastErr=String(e&&e.message||e||'');
      attempt();
    });
  }
  attempt();
}

function syncFromV3(){

function hydratePlannerBridgeKeys(){

    }catch(e){ return true; }

function inferProjectGroupFromProject(p){
  if(!p) return 'Unassigned';
  var explicit=(p.projectGroup||p.project||p.parentProject||p.program||'').toString().trim();
  if(explicit) return explicit;
  var n=String(p.name||'').trim();
  if(!n) return 'Unassigned';
  var parts=n.split(/\s[-:|]\s/);
  return (parts[0]||n).trim()||'Unassigned';
}
function inferPhaseFromProject(p){
  if(!p) return 'Unassigned';
  var explicit=(p.phase||p.projectPhase||p._phase||'').toString().trim();
  if(explicit) return explicit;
  var n=String(p.name||'');
  var m=n.match(/\b(phase\s*[a-z0-9]+)/i);
  if(m&&m[1]) return m[1].replace(/\s+/g,' ').replace(/^./,function(c){return c.toUpperCase();});
  return 'Unassigned';
}
function inferBuildingFromProject(p){
  if(!p) return 'Unassigned';
  var explicit=(p.building||p._building||p.buildingName||p._buildingName||p.tower||'').toString().trim();
  if(explicit) return explicit;
  var n=String(p.name||'').trim();
  if(!n) return 'Unassigned';
  var parts=n.split(/\s[-:|]\s/);
  if(parts.length>=3) return (parts[2]||'').trim()||'Unassigned';
  return 'Unassigned';
}

// CASHFLOW ENGINE
// ══════════════════════════════════════════════════════════════
function minMonthKey(a,b){
  if(!a) return b||'';
  if(!b) return a;
  return a<=b?a:b;
}
function maxMonthKey(a,b){
  if(!a) return b||'';
  if(!b) return a;
  return a>=b?a:b;
}
/** Earliest YYYY-MM among recorded actuals (ledger lines). */
function earliestActualsMonthKey(cfg){
  var minMo='';
  (cfg.actuals||[]).forEach(function(a){
    if(!includeActualInCashflowSums(a)) return;
    var mk=a.date?String(a.date).slice(0,7):'';
    if(!/^\d{4}-\d{2}$/.test(mk)) return;
    if(!minMo||mk<minMo) minMo=mk;
  });
  return minMo;
}
/** Count of months m where fromMo <= m < toMoExclusive (YYYY-MM keys). */
function monthKeysBetweenHalfOpen(fromMo,toMoExclusive){
  var n=0, cur=fromMo;
  while(cur&&cur<toMoExclusive){
    n++;
    cur=addMonthsToMonthKey(cur,1);
  }
  return n;
}
function buildCashflow(pid){
  var cfg=getCF(pid);
  var fz=forecastCfg(cfg);
  var months=Math.max(1,cfg.totalMonths||60);
  var startDate=cfg.startDate||new Date().toISOString().slice(0,7)+'-01';
  var startKey=startDate.length>=7?startDate.slice(0,7):'';
  if(!/^\d{4}-\d{2}$/.test(startKey)) startKey=new Date().toISOString().slice(0,7);

  // Build actuals index by month+cat
  var actMap={};
  (cfg.actuals||[]).forEach(function(a){
    if(!includeActualInCashflowSums(a)) return;
    var mo=a.date?a.date.slice(0,7):'';
    if(!mo) return;
    if(!actMap[mo]) actMap[mo]={};
    actMap[mo][a.cat1]=(actMap[mo][a.cat1]||0)+coerceMoney(a.amount);
  });

  // Build capital inflow schedules
  var invFlowMap={};
  (cfg.investors||[]).forEach(function(inv){
    if(inv.drawMonth&&inv.amount>0){
      var mo=offsetMonth(startDate,inv.drawMonth-1);
      invFlowMap[mo]=(invFlowMap[mo]||0)+inv.amount;
    }
  });
  var ulFlowMap={};
  (cfg.unsecuredLoans||[]).forEach(function(ul){
    if(ul.drawDate&&ul.amount>0){
      var mo=ul.drawDate.slice(0,7);
      ulFlowMap[mo]=(ulFlowMap[mo]||0)+ul.amount;
    }
  });
  var culFlowMap={};
  (cfg.customerUL||[]).forEach(function(cu){
    if(cu.date&&cu.amount>0){
      var mo=cu.date.slice(0,7);
      culFlowMap[mo]=(culFlowMap[mo]||0)+cu.amount;
    }
  });
  var otherFlowMap={};
  (cfg.otherInflows||[]).forEach(function(oi){
    if(oi.date&&oi.amount>0){
      var mo=oi.date.slice(0,7);
      otherFlowMap[mo]=(otherFlowMap[mo]||0)+oi.amount;
    }
  });

  // Build customer collection schedule (CRM: due / realized / deficit meta by milestone month)
  var salesTimingMeta={salesDeficitTotal:0};
  var custCollMap=buildCustomerCollections(cfg, startDate, salesTimingMeta);
  var unsoldSalesMap=buildUnsoldRealization(cfg, startDate);

  // Build outflow schedules
  var landMap={};
  (cfg.landSchedule||[]).forEach(function(e){
    var amtL=parseFloat(e.amount)||0;
    if(!amtL) return;
    var moL=scheduleMonthConsultantRow(e,startDate);
    if(moL) landMap[moL]=(landMap[moL]||0)+amtL;
  });
  var nocMap={};
  (cfg.nocSchedule||[]).forEach(function(e){
    var amtN=parseFloat(e.amount)||0;
    if(!amtN) return;
    var moN=scheduleMonthConsultantRow(e,startDate);
    if(moN) nocMap[moN]=(nocMap[moN]||0)+amtN;
  });
  var consultMap={};
  (cfg.consultantSchedule||[]).forEach(function(e){
    var amt=parseFloat(e.amount)||0;
    if(!amt) return;
    var moC=scheduleMonthConsultantRow(e,startDate);
    if(moC) consultMap[moC]=(consultMap[moC]||0)+amt;
  });
  var regConsultMap={};
  (cfg.regulatoryConsultingSchedule||[]).forEach(function(e){
    var amtR=parseFloat(e.amount)||0;
    if(!amtR) return;
    var moR=scheduleMonthConsultantRow(e,startDate);
    if(moR) regConsultMap[moR]=(regConsultMap[moR]||0)+amtR;
  });
  // Partner buyout → Land in month 0 if not in schedule
  if(cfg.partnerBuyout>0&&cfg.startDate&&!Object.keys(landMap).length){
    landMap[offsetMonth(startDate,0)]=(landMap[offsetMonth(startDate,0)]||0)+cfg.partnerBuyout;
  }

  // Construction schedule: month# from project start and/or explicit calendar date (expense template)
  var consMap={};
  (cfg.constructionSchedule||[]).forEach(function(e){
    var amt=parseFloat(e.amount)||0;
    if(!amt) return;
    var moC=scheduleMonthConsOrMkt(e,startDate);
    if(moC) consMap[moC]=(consMap[moC]||0)+amt;
  });
  // Marketing schedule: same
  var mktgSchedMap={};
  (cfg.marketingSchedule||[]).forEach(function(e){
    var amt=parseFloat(e.amount)||0;
    if(!amt) return;
    var moM=scheduleMonthConsOrMkt(e,startDate);
    if(moM) mktgSchedMap[moM]=(mktgSchedMap[moM]||0)+amt;
  });

  // Debt service schedule
  var debtInterestMap={};
  var debtPrincipalMap={};
  var debtBalance={};
  (cfg.debtTranches||[]).forEach(function(dt){debtBalance[dt.id]={bal:0,rate:dt.ratePct||12};});

  var earliestAct=earliestActualsMonthKey(cfg);
  var floorMo=addMonthsToMonthKey(startKey,-120);
  var sequenceStart=startKey;
  if(earliestAct){
    var em=maxMonthKey(earliestAct,floorMo);
    if(em<sequenceStart) sequenceStart=em;
  }
  if(showPriorCalendarYears()){
    var janYr=startKey.slice(0,4)+'-01';
    if(janYr<startKey) sequenceStart=minMonthKey(sequenceStart,janYr);
  }
  var preCount=monthKeysBetweenHalfOpen(sequenceStart,startKey);

  var openingCash=0;
  var rows=[];
  var curMo=currentMonthStr();
  var totalSteps=preCount+months;

  for(var idx=0;idx<totalSteps;idx++){
    var mo, period, label, i;
    if(idx<preCount){
      mo=addMonthsToMonthKey(sequenceStart,idx);
      period=0;
      label=formatMonthKey(mo);
      i=-1;
    } else {
      i=idx-preCount;
      mo=offsetMonth(startDate,i);
      period=i+1;
      label=monthLabel(startDate,i);
    }
    var isActual=mo<=curMo&&mo!=='';
    var act=actMap[mo]||{};
    var ov=(period>0&&cfg.overrides&&cfg.overrides[period])||{};

    // ── INFLOWS ──
    // Scheduled sold-unit inflows → Sales Revenue only (avoid double-count with Customer Collections)
    var bucketMo=custCollMap[mo]||{};
    var schedSales  = (bucketMo.sales||0) + ((unsoldSalesMap[mo]&&unsoldSalesMap[mo].sales)||0);
    var actSalesRev = act['Sales Revenue'];
    var salesRev    = ov.salesRev !== undefined ? ov.salesRev : (actSalesRev!==undefined&&actSalesRev!==null ? actSalesRev : schedSales);
    var salesRealizedMo=bucketMo.salesRealized||0;
    var salesProjectedLine=(mo>curMo)?(bucketMo.sales||0):0;
    var salesDeficitMo=(mo===curMo)?(salesTimingMeta.salesDeficitTotal||0):0;
    var equityInf   = ov.equityInf   !== undefined ? ov.equityInf   : (act['Equity Infusion']  || 0);
    var invFunding  = ov.invFunding  !== undefined ? ov.invFunding  : (act['Investor Funding'] || invFlowMap[mo] || 0);
    var ulInflow    = ov.ulInflow    !== undefined ? ov.ulInflow    : (act['Unsecured Loan']    || ulFlowMap[mo]  || 0);
    var custColl    = ov.custColl    !== undefined ? ov.custColl    : (act['Customer Collections'] || 0);
    var custUL      = ov.custUL      !== undefined ? ov.custUL      : (act['Customer UL']       || culFlowMap[mo] || 0);
    var otherIn     = ov.otherIn     !== undefined ? ov.otherIn     : (act['Other Inflow']      || otherFlowMap[mo] || 0);

    // ── OUTFLOWS ──
    var land        = ov.land        !== undefined ? ov.land        : (act['Land']         || landMap[mo]    || 0);
    var noc         = ov.noc         !== undefined ? ov.noc         : (act['NOC']           || nocMap[mo]     || 0);
    var consultant  = ov.consultant  !== undefined ? ov.consultant  : (act['Consultant']   || consultMap[mo] || 0);
    var regulatoryConsulting= ov.regulatoryConsulting!==undefined ? ov.regulatoryConsulting : (act['Regulatory & Consulting']||regConsultMap[mo]||0);
    var construction= ov.construction!== undefined ? ov.construction: (isActual ? (act['Construction']||0) : (consMap[mo]||0));
    // G&A from V2 push or manual monthly
    var gaMonthly   = cfg.gaGAAnnual>0 ? cfg.gaGAAnnual/12 : (cfg.gaMonthly||500000);
    var gaDmAct     = act['GA DM Fee'];
    if(gaDmAct===undefined||gaDmAct===null) gaDmAct=act['GA-DM'];
    if(gaDmAct===undefined||gaDmAct===null) gaDmAct=act['G&A'];
    var ga          = ov.ga          !== undefined ? ov.ga          : (gaDmAct          || gaMonthly);
    // Marketing from V2 push or schedule
    var mktgMonthly = cfg.gaMktgAnnual>0 ? cfg.gaMktgAnnual/12 : 0;
    var marketing   = ov.marketing   !== undefined ? ov.marketing   : (act['Marketing']     || mktgSchedMap[mo] || (isActual?0:mktgMonthly));
    // Contingency = % of construction (projected only)
    var contingency = ov.contingency !== undefined ? ov.contingency : (act['Contingency']   || (isActual?0:construction*(cfg.contingencyPct||2)/100));

    if(!isActual && period>0){
      salesRev*=fz.salesFactor;
      custColl*=fz.collectionsFactor;
      otherIn*=fz.otherInflowFactor;
      consultant*=fz.costFactor;
      regulatoryConsulting*=fz.costFactor;
      construction*=fz.costFactor;
      marketing*=fz.marketingFactor;
      ga*=fz.gaFactor;
      contingency=contingency*fz.costFactor+fz.monthlyBuffer;
    }
    var totInflows  = salesRev+equityInf+invFunding+ulInflow+custColl+custUL+otherIn;

    // Debt: calculate interest on balances
    var schedInt=0, debtDraw=0;
    (cfg.debtTranches||[]).forEach(function(dt){
      if(!debtBalance[dt.id]) debtBalance[dt.id]={bal:0,rate:dt.ratePct||12};
      var db=debtBalance[dt.id];
      if(dt.drawDate&&dt.drawDate.slice(0,7)===mo){
        db.bal+=(dt.drawAmount||0); debtDraw+=(dt.drawAmount||0);
      }
      if(db.bal>0) schedInt+=db.bal*(db.rate/100/12);
    });
    // Interest and principal from actuals if available, else scheduled
    var intPaid     = act['Interest Paid']    || (isActual?0:schedInt);
    var principalPaid=act['Principal Repaid'] || 0;

    // Principal repayment from tranche schedules
    if(!isActual)(cfg.debtTranches||[]).forEach(function(dt){
      (dt.repaySchedule||[]).forEach(function(rs){ principalPaid+=principalRepaymentInMonthHtml(rs, mo, period); });
    });

    // Update debt balance for repayments
    if(principalPaid>0){
      var remaining=principalPaid;
      (cfg.debtTranches||[]).forEach(function(dt){
        if(!debtBalance[dt.id]) return;
        var pay=Math.min(debtBalance[dt.id].bal,remaining);
        debtBalance[dt.id].bal-=pay; remaining-=pay;
      });
    }

    var totOutflows = land+noc+consultant+regulatoryConsulting+construction+marketing+ga+contingency+intPaid+principalPaid;
    var netCF=totInflows-totOutflows;
    var closingCash=openingCash+netCF;
    var closingDebt=Object.values(debtBalance).reduce(function(s,v){return s+v.bal;},0);
    var openingDebt=closingDebt-debtDraw+principalPaid;
    var cads=Math.max(0,closingCash);
    var debtService=schedInt+(principalPaid||0);
    var dscr=debtService>0?cads/debtService:null;

    var l1In = l1InflowFromRowVals({ salesRev, equityInf, invFunding, ulInflow, custColl, custUL, otherIn });
    var l1Out = l1OutflowFromRowVals({ land, noc, consultant, regulatoryConsulting, construction, marketing, ga, contingency, intPaid, principalPaid });
    rows.push({
      period,mo,label:label,
      isActual,isCurrent:mo===curMo,isPreProject:period===0,isForecast:(!isActual&&period>0),
      openingCash,
      salesRev,salesRealized:salesRealizedMo,salesProjectedShow:salesProjectedLine,salesDeficit:salesDeficitMo,
      equityInf,invFunding,ulInflow,custColl,custUL,otherIn,totInflows,
      land,noc,consultant,regulatoryConsulting,construction,marketing,ga,contingency,intPaid,principalPaid,totOutflows,
      netCF,closingCash,
      debtDraw,openingDebt,closingDebt,schedInt,debtService,cads,dscr,
      l1In, l1Out
    });
    openingCash=closingCash;
  }
  return rows;
}

function defaultForecastObj(){

}
/** Build rows with a temporary forecast override (for impact comparisons). */
function buildCashflowWithForecast(pid, override){

  cfg.forecast=Object.assign({},defaultForecastObj(),bak||{},override||{});
  var rows=buildCashflow(pid);
  cfg.forecast=bak;

}

function buildCustomerCollections(cfg, startDate, salesMeta){
  salesMeta=salesMeta||{};
  var map={};
  var curMo=currentMonthStr();
  var deficitTotal=0;
  function ensure(mo){
    if(!mo||mo.length<7) return null;
    if(!map[mo]) map[mo]={collections:0,sales:0,salesRealized:0,salesProjected:0,items:[]};
    return map[mo];
  }
  (cfg.units||[]).forEach(function(unit){
    var tv=coerceMoney(unit.totalValue);
    if(tv<=0||!unit.bookingDate) return;
    if(unit.payType==='const'){
      getConstSchedule(unit,cfg).forEach(function(item){
        if(!item.date) return;
        var iso=normalizeToISODate(item.date);
        if(!iso) return;
        var mo=iso.slice(0,7);
        var e=ensure(mo);
        if(!e) return;
        var amt=coerceMoney(item.amount);
        e.collections+=amt;
        e.sales+=amt;
        if(mo>curMo) e.salesProjected+=amt;
        if(amt!==0) e.items.push({unit:unit.unitNo,milestone:item.label,amount:amt,kind:'due'});
      });
      return;
    }
    if(installUsesCRMDueLines(unit)){
      groupCRMInstallmentsByBase(unit,cfg).forEach(function(g){
        var dueMo=crmMilestoneMonthKey(g.dueIso||'', unit);
        if(!dueMo) return;
        var e=ensure(dueMo);
        if(!e) return;
        var d=coerceMoney(g.due), r=coerceMoney(g.recv), pnd=coerceMoney(g.pend);
        if(d>0){
          e.collections+=d;
          e.sales+=d;
          if(dueMo>curMo) e.salesProjected+=d;
          e.items.push({unit:unit.unitNo,milestone:g.base+' (due)',amount:d,kind:'due'});
        }
        if(r>0){
          e.salesRealized+=r;
          e.items.push({unit:unit.unitNo,milestone:g.base+' (received)',amount:r,kind:'realized'});
        }
        if(dueMo<=curMo) deficitTotal+=Math.max(0,pnd);
      });
      return;
    }
    getUnitSchedule(unit,cfg).forEach(function(item){
      if(!item.date) return;
      var iso=normalizeToISODate(item.date);
      if(!iso) return;
      var mo=iso.slice(0,7);
      var e=ensure(mo);
      if(!e) return;
      var amt=coerceMoney(item.amount);
      e.collections+=amt;
      e.sales+=amt;
      if(mo>curMo) e.salesProjected+=amt;
      if(amt!==0) e.items.push({unit:unit.unitNo,milestone:item.label,amount:amt,kind:'sched'});
    });
  });
  salesMeta.salesDeficitTotal=deficitTotal;
  return map;
}

function ensureUnsoldPaceCfg(cfg){
  if(!cfg.unsoldPace) cfg.unsoldPace={mode:'sqft',inputPeriod:'month',value:0,baseline:null};
  if(cfg.unsoldPace.baseline===undefined) cfg.unsoldPace.baseline=null;
  if(!cfg.unsoldPace.mode) cfg.unsoldPace.mode='sqft';
  if(cfg.unsoldPace.inputPeriod!=='month'&&cfg.unsoldPace.inputPeriod!=='quarter') cfg.unsoldPace.inputPeriod='month';
}
function unsoldPacePerMonth(cfg){
  ensureUnsoldPaceCfg(cfg);
  var v=parseFloat(cfg.unsoldPace.value)||0;
  if(v<=0) return 0;
  return cfg.unsoldPace.inputPeriod==='quarter'?v/3:v;
}
function unsoldGlobalPaceActive(cfg){
  return unsoldPacePerMonth(cfg)>0;
}
function countCalendarMonthsInclusive(ymStart, ymEnd){
  if(!ymStart||!ymEnd||ymStart>ymEnd) return 0;
  var a=ymStart.split('-'), b=ymEnd.split('-');
  var y0=+a[0], m0=+a[1], y1=+b[0], m1=+b[1];
  if(!isFinite(y0)||!isFinite(m0)||!isFinite(y1)||!isFinite(m1)) return 0;
  return (y1-y0)*12+(m1-m0)+1;
}
function visibleUnsoldRows(cfg){
  var soldSet={};
  (cfg.units||[]).forEach(function(u){ soldSet[normalizeUnitNoKey(u&&u.unitNo)]=1; });
  var out=[];
  (cfg.unsoldUnits||[]).forEach(function(u){
    if(soldSet[normalizeUnitNoKey(u&&u.unitNo)]) return;
    var area=coerceMoney(u.saleableArea);

    if(val>0) out.push({area:area,val:val});
  });

}
function buildUnsoldPaceQueue(cfg){
  var soldSet={};
  (cfg.units||[]).forEach(function(u){ soldSet[normalizeUnitNoKey(u&&u.unitNo)]=1; });
  var out=[];
  (cfg.unsoldUnits||[]).forEach(function(u){
    if(soldSet[normalizeUnitNoKey(u&&u.unitNo)]) return;
    var area=coerceMoney(u.saleableArea);
    var rate=coerceMoney(u.plannedRatePerSqft);
    var val=coerceMoney(u.plannedSaleValue||u.totalValue||(area>0&&rate>0?area*rate:0));
    if(val>0) out.push({row:u,area:area,val:val});
  });
  return out;
}
function addConstUnsoldToMap(map, cfg, bookingIso, totalValue, uRef){
  var tv=coerceMoney(totalValue);
  if(tv<=0) return;
  var bi=normalizeToISODate(bookingIso)||String(bookingIso);
  var pseudo={payType:'const',bookingDate:bi,totalValue:tv,milestonesDates:(uRef&&uRef.milestonesDates)||{}};
  var labelUnit=(uRef&&(uRef.unitNo||uRef.id))||'Pace (unsold)';
  var sched=getConstSchedule(pseudo,cfg);
  if(sched.length){
    sched.forEach(function(it){
      var iso=normalizeToISODate(it.date);
      if(!iso) return;
      var mKey=iso.slice(0,7);
      if(!map[mKey]) map[mKey]={sales:0,items:[]};
      var amt=coerceMoney(it.amount);
      map[mKey].sales+=amt;
      map[mKey].items.push({unit:labelUnit,amount:amt,milestone:it.label||'Milestone'});
    });
    return;
  }
  var m0=bi.slice(0,7);
  if(!map[m0]) map[m0]={sales:0,items:[]};
  map[m0].sales+=tv;
  map[m0].items.push({unit:labelUnit,amount:tv,milestone:'Unsold (set milestone % in project CLP)'});
}
/** Revenue map for unsold: FIFO lots + same CLP as sold const-linked units. Optional `opts` for max(projectedSalePerMonth) path. */
function buildUnsoldGlobalPaceRevenueMap(cfg, opts){
  var map={};
  var queue=buildUnsoldPaceQueue(cfg);
  if(!queue.length) return map;
  ensureUnsoldPaceCfg(cfg);
  var o=opts&&typeof opts==='object'?opts:null;
  var mode=cfg.unsoldPace.mode==='units'?'units':'sqft';
  if(o&&o.unitsPerMonth!=null) mode='units';
  if(o&&o.sqftPerMonth!=null) mode='sqft';
  if(o&&o.mode) mode=o.mode;
  var pace=0;
  if(o&&mode==='units'&&o.unitsPerMonth!=null) pace=Math.max(0,+o.unitsPerMonth)||0;
  else if(o&&mode==='sqft'&&o.sqftPerMonth!=null){
    var v=+o.sqftPerMonth; pace=(o.inputPeriod==='quarter'&&v>0)?(v/3):v;
  } else pace=unsoldPacePerMonth(cfg);
  if(pace<=0) return map;
  var startMo=(o&&o.startMonthKey&&/^\d{4}-\d{2}$/.test(String(o.startMonthKey).slice(0,7)))?String(o.startMonthKey).slice(0,7):currentMonthStr();
  if(mode==='units'){
    var nPerMo=Math.max(0,Math.floor(pace+1e-6));
    if(pace>0&&nPerMo<1) nPerMo=1;
    if(nPerMo<0.1) return map;
    var mi=0;
    while(queue.length>0.5&&mi<600){
      var bookYm=addMonthsToYM(startMo,mi);
      if(!bookYm) break;
      var bookIso2=normalizeToISODate(bookYm+'-15')||bookYm+'-15';
      var nThis=Math.min(nPerMo,queue.length);
      for(var ii=0;ii<nThis;ii+=1){
        var lot2=queue.shift();
        if(!lot2) break;
        addConstUnsoldToMap(map,cfg,bookIso2,lot2.val,lot2.row);
      }
      mi++;
    }
    return map;
  }
  var remQ=queue.map(function(x){ return {row:x.row,area:coerceMoney(x.area),val:coerceMoney(x.val)}; });
  var mJ=0;
  while(remQ.length>0.5&&mJ<600){
    var bookYm2=addMonthsToYM(startMo,mJ);
    if(!bookYm2) break;
    var bookIso3=normalizeToISODate(bookYm2+'-15')||bookYm2+'-15';
    var remP=pace;
    while(remP>0.1&&remQ.length){
      var h0=remQ[0];
      if(h0.area<0.1){ remQ.shift(); continue; }
      if(h0.area<=remP+0.1){
        var takeA0=h0.area, lot0=remQ.shift();
        if(lot0) addConstUnsoldToMap(map,cfg,bookIso3,lot0.val,lot0.row);
        remP-=takeA0; continue;
      }
      var fr0=remP/h0.area, partV0=h0.val*fr0;
      h0.val-=partV0; h0.area-=remP;
      addConstUnsoldToMap(map,cfg,bookIso3,partV0,h0.row);
      remP=0;
      if(h0.area<0.1) remQ.shift();
    }
    mJ++;
  }
  return map;
}
function soldStatsForPaceCompare(cfg, sinceYM){
  var sq=0, val=0, n=0, miss=0;
  (cfg.units||[]).forEach(function(u){
    var b=(normalizeToISODate(u.bookingDate)||'').slice(0,7);
    if(!b||b<sinceYM) return;
    n++;
    var a=coerceMoney(u.saleableArea);
    if(a>0) sq+=a; else miss++;
    val+=coerceMoney(u.totalValue);
  });
  return {sqft:sq,value:val,units:n,missingAreaCount:miss};
}
function computeUnsoldPaceVsBaseline(cfg){
  ensureUnsoldPaceCfg(cfg);
  var b=cfg.unsoldPace.baseline;
  if(!b||!b.at) return null;
  var cur=currentMonthStr();
  var nM=b.at>cur?0:countCalendarMonthsInclusive(b.at,cur);
  var pace=+b.pacePerMonth||0;
  var mode=b.mode==='units'?'units':'sqft';
  var plannedSq=0, plannedVal=0;
  if(mode==='sqft'){
    var W=+b.blendedPSqft||0;
    var capS=+b.bsSqft||0;
    plannedSq=Math.min(nM*pace,capS);
    plannedVal=Math.min(plannedSq*W,+b.bsVal||0);
  } else {
    var av=+b.avgValPerUnit||0;
    var capU=+b.bsUnits||0;
    var uPl=Math.min(nM*pace,capU);
    plannedVal=Math.min(uPl*av,+b.bsVal||0);
    plannedSq=uPl*(capU>0.01?((+b.bsSqft||0)/capU):0);
  }
  var act=soldStatsForPaceCompare(cfg,b.at);
  return{
    nMonths:nM, baselineMonth:b.at,
    plannedSqft:plannedSq, plannedValue:plannedVal, mode:mode,
    actualSqft:act.sqft, actualValue:act.value, actualUnits:act.units,
    missArea:act.missingAreaCount,
    deltaValue:act.value-plannedVal, deltaSqft:act.sqft-plannedSq
  };
}

function buildUnsoldRealization(cfg, startDate){
  ensureUnsoldPaceCfg(cfg);
  if(unsoldGlobalPaceActive(cfg)) return buildUnsoldGlobalPaceRevenueMap(cfg);
  var soldSet={};
  (cfg.units||[]).forEach(function(u){ soldSet[normalizeUnitNoKey(u&&u.unitNo)]=1; });
  var unsold=(cfg.unsoldUnits||[]).filter(function(u){ return !soldSet[normalizeUnitNoKey(u&&u.unitNo)]; });
  var maxPpm=0;
  unsold.forEach(function(u){ maxPpm=Math.max(maxPpm, coerceMoney(u.projectedSalePerMonth)); });
  if(maxPpm>0){
    return buildUnsoldGlobalPaceRevenueMap(cfg, { mode:'units', unitsPerMonth: maxPpm, startMonthKey: currentMonthStr() });
  }
  var map={};
  unsold.forEach(function(u){
    var area=coerceMoney(u.saleableArea);
    var rate=coerceMoney(u.plannedRatePerSqft);
    var val=coerceMoney(u.plannedSaleValue||u.totalValue||(area>0&&rate>0?area*rate:0));
    if(val<=0) return;
    var saleIso=normalizeToISODate(u.projectedSaleDate)||'';
    if(saleIso){
      var pseudo={payType:'const',bookingDate:saleIso,totalValue:val,milestonesDates:(u.milestonesDates&&typeof u.milestonesDates==='object')?u.milestonesDates:{}};
      var sched=getConstSchedule(pseudo,cfg);
      if(sched.length){
        sched.forEach(function(it){
          var iso=normalizeToISODate(it.date);
          if(!iso) return;
          var mo=iso.slice(0,7);
          if(!map[mo]) map[mo]={sales:0,items:[]};
          var amt=coerceMoney(it.amount);
          map[mo].sales+=amt;
          map[mo].items.push({unit:u.unitNo||'Unsold',amount:amt,milestone:it.label||'Milestone'});
        });
        return;
      }
      var moSale=saleIso.slice(0,7);
      if(!map[moSale]) map[moSale]={sales:0,items:[]};
      map[moSale].sales+=val;
      map[moSale].items.push({unit:u.unitNo||'Unsold',amount:val,milestone:'Projected Sale'});
      return;
    }
    var m=parseInt(u.expectedMonth,10);
    if(!m||m<1) return;
    var mo=offsetMonth(startDate,m-1);
    if(!map[mo]) map[mo]={sales:0,items:[]};
    map[mo].sales+=val;
    map[mo].items.push({unit:u.unitNo||'Unsold',amount:val,milestone:'Projected Sale'});
  });
  return map;
}

function getUnitSchedule(unit, cfg){
  return unit.payType==='install' ? getInstallScheduleForSales(unit, cfg||{}) : getConstSchedule(unit, cfg);
}

function unitCollectedAmount(cfg, unit){
  var fromActs=(cfg.actuals||[]).filter(function(a){
    if(!a||a.unitRef!==unit.id||a.cat1!=='Customer Collections') return false;
    return includeActualInCashflowSums(a);
  }).reduce(function(s,a){return s+coerceMoney(a.amount);},0);
  var crmR=coerceMoney(unit.receivedToDate);
  return fromActs+crmR;
}

function getConstSchedule(unit, cfg){
  var sched=[];
  var defs=getMilestoneDefs(cfg);
  var b0=normalizeToISODate(unit.bookingDate)||'';
  var tv=coerceMoney(unit.totalValue);
  defs.forEach(function(ms){
    var amt=(parseFloat(ms.pct)||0)/100*tv;
    var date;
    if(ms.key==='booking') date=b0;
    else if(ms.key==='agreement'){
      if(!b0){ date=''; }
      else {
        var d=new Date(b0);
        if(isNaN(d.getTime())) date='';
        else { d.setMonth(d.getMonth()+1); date=d.toISOString().slice(0,10); }
      }
    } else {
      // Project-level uploaded milestone dates (Sales tab / template) take precedence; unit override is fallback
      date=clampDateIsoToBooking(milestoneTargetIsoForDef(cfg, unit, ms)||'', b0);
      // Custom milestone keys (e.g. Paradise workbook): Token → booking; Agreement/Registration → +1 month
      if(!date&&b0){
        var lk=String(ms.key||'').toLowerCase();
        var ll=String(ms.label||'').toLowerCase();
        if(lk.indexOf('token')>=0||ll.indexOf('token')>=0) date=b0;
        else if(lk.indexOf('agreement')>=0||ll.indexOf('agreement')>=0||ll.indexOf('registration')>=0){
          var da=new Date(b0);
          if(!isNaN(da.getTime())){ da.setMonth(da.getMonth()+1); date=da.toISOString().slice(0,10); }
        }
      }
      // CLP (Book28): if construction-linked and plan target is on/before booking, treat as due at booking
      // (site already passed that stage — cumulative % through booking month). Future stages keep target dates.
      if(date&&b0&&milestoneIsConstLink(ms)){
        var dStr=date.slice(0,10), bStr=b0.slice(0,10);
        if(dStr<=bStr) date=b0;
      }
    }
    if(date) sched.push({date:clampDateIsoToBooking(date,b0),amount:amt,label:milestoneDisplayLabel(ms)});
  });
  return sched;
}

function getInstallSchedule(unit){
  return (unit.installments||[]).map(function(ins){
    return {date:normalizeToISODate(ins.date)||ins.date,amount:coerceMoney(ins.amount),label:ins.label||'Installment'};
  });
}
/** Scheduled revenue: prefer (due) per tranche when present; drop recv/pend for same milestone to avoid double-count. Legacy rows with only recv+pend unchanged. */
function getInstallScheduleForSales(unit, cfg){
  var raw=getInstallSchedule(unit);
  var prepared=raw.map(function(x){
    return {date:effectiveInstallmentIso(unit,cfg||{},x),amount:x.amount,label:x.label};
  });
  var hasAnyDue=prepared.some(function(x){return String(x.label||'').indexOf('(due)')>=0;});
  if(!hasAnyDue) return prepared;
  var baseLab=function(L){ return installmentBaseLabel(L); };
  var hasDueByBase={};
  prepared.forEach(function(x){
    if(String(x.label||'').indexOf('(due)')>=0) hasDueByBase[baseLab(x.label)]=true;
  });
  var sched=prepared.filter(function(x){
    var L=String(x.label||'');
    if(L.indexOf('(due)')>=0) return true;
    if(L.indexOf('(received)')>=0||L.indexOf('(pending)')>=0){
      if(hasDueByBase[baseLab(L)]) return false;
      return true;
    }
    return true;
  });
  /** Legacy CRM import: pre-book bucket + same milestones inferred to booking month → Due > agreement. */
  var hasPreBookSyn=sched.some(function(x){
    var L=String(x.label||'');
    return L.indexOf('Construction stage at booking')>=0&&L.indexOf('(due)')>=0;
  });
  if(!hasPreBookSyn) return sched;
  var bmo=(normalizeToISODate(unit&&unit.bookingDate)||'').slice(0,7);
  var tv=coerceMoney(unit&&unit.totalValue);
  if(!bmo||tv<=0) return sched;
  var bookingDueTot=0;
  sched.forEach(function(x){
    var L=String(x.label||'');
    if(L.indexOf('(due)')<0) return;
    var iso=normalizeToISODate(x.date)||'';
    if(!iso||iso.slice(0,7)!==bmo) return;
    bookingDueTot+=coerceMoney(x.amount);
  });
  if(bookingDueTot<=tv*1.01) return sched;
  var strippedDue=0;
  var slim=sched.filter(function(x){
    var L=String(x.label||'');
    if(L.indexOf('(due)')<0) return true;
    if(L.indexOf('Construction stage at booking')>=0&&L.indexOf('(due)')>=0) return true;
    if(L.indexOf('Balance to Agreement')>=0) return true;
    var iso=normalizeToISODate(x.date)||'';
    if(!iso||iso.slice(0,7)!==bmo) return true;
    strippedDue+=coerceMoney(x.amount);
    return false;
  });
  slim.forEach(function(x){
    var L=String(x.label||'');
    if(L.indexOf('Construction stage at booking')>=0&&L.indexOf('(due)')>=0){
      x.amount=coerceMoney(x.amount)+strippedDue;
    }
  });
  return slim;
}

// Consolidated GA cashflow (sum of all projects by month)
/** @param cfByPid optional map pid→buildCashflow rows (reuse when GA UI already built per-project CF). */
function buildGACashflow(cfByPid){
  var list=getVisibleProjects();
  if(!list.length) return [];
  var cache=cfByPid;
  if(!cache){
    cache={};
    list.forEach(function(p){ cache[p.id]=buildCashflow(p.id); });
  }
  // Find overall date range
  var allStartDates=list.map(function(p){return getCF(p.id).startDate||'';}).filter(Boolean).sort();
  var earliest=allStartDates[0]||new Date().toISOString().slice(0,7)+'-01';
  // Find max end
  var maxMonths=list.reduce(function(mx,p){return Math.max(mx,getCF(p.id).totalMonths||60);},0);
  var totalMonths=maxMonths+6; // buffer
  // Aggregate
  var agg=[];
  for(var i=0;i<totalMonths;i++){
    var mo=offsetMonth(earliest,i);
    var row={period:i+1,mo,label:monthLabel(earliest,i),isCurrent:mo===currentMonthStr(),
      salesRev:0,salesRealized:0,salesProjectedShow:0,salesDeficit:0,equityInf:0,invFunding:0,ulInflow:0,custColl:0,custUL:0,otherIn:0,totInflows:0,
      land:0,noc:0,consultant:0,regulatoryConsulting:0,construction:0,marketing:0,ga:0,contingency:0,intPaid:0,principalPaid:0,totOutflows:0,
      netCF:0,closingCash:0, l1In: {}, l1Out: {}};
    list.forEach(function(p){
      var pRows=cache[p.id];
      if(!pRows) return;
      var pRow=pRows.find(function(r){return r.mo===mo;});
      if(!pRow) return;
      ['salesRev','salesRealized','salesProjectedShow','salesDeficit','equityInf','invFunding','ulInflow','custColl','custUL','otherIn','totInflows',
       'land','noc','consultant','regulatoryConsulting','construction','marketing','ga','contingency','intPaid','principalPaid','totOutflows',
       'netCF'].forEach(function(k){row[k]+=pRow[k]||0;});
      mergeL1Object(row.l1In, pRow.l1In);
      mergeL1Object(row.l1Out, pRow.l1Out);
    });
    if(i>0) row.closingCash=agg[i-1].closingCash+row.netCF;
    else row.closingCash=row.netCF;
    agg.push(row);
  }
  return agg;
}

function offsetMonth(startDate, offset){
  if(!startDate) return '';
  try{
    var s=startDate.length>=10?startDate.slice(0,10):(startDate.slice(0,7)+'-01');
    var p=s.split('-');
    var y=parseInt(p[0],10), mo=parseInt(p[1],10), da=parseInt(p[2]||'1',10);
    if(!isFinite(y)||!isFinite(mo)) return '';
    var d=new Date(y, mo-1, da);
    d.setMonth(d.getMonth()+offset);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  }catch(e){ return ''; }
}
/** 1-based project month index for a calendar date vs project start (YYYY-MM or YYYY-MM-DD). */
function dateToProjectMonth(startDate, isoDate){
  if(!startDate||!isoDate) return 1;
  try{
    var s0=(startDate.length>=7?startDate.slice(0,7):startDate)+'-01';
    var s1=(isoDate.length>=7?isoDate.slice(0,7):isoDate)+'-01';
    var d0=new Date(s0), d1=new Date(s1);
    if(isNaN(d0.getTime())||isNaN(d1.getTime())) return 1;
    var m=(d1.getFullYear()-d0.getFullYear())*12+(d1.getMonth()-d0.getMonth())+1;
    return Math.max(1,m);
  }catch(e){ return 1; }
}
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normalizeUnitNoKey(s){

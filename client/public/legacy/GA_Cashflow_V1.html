}
function monthLabel(startDate, offset){
  if(!startDate) return 'M'+(offset+1);
  try{
    var s=startDate.length>=10?startDate.slice(0,10):(startDate.slice(0,7)+'-01');
    var p=s.split('-');
    var y=parseInt(p[0],10), mo=parseInt(p[1],10), da=parseInt(p[2]||'1',10);
    var d=new Date(y, mo-1, da);
    d.setMonth(d.getMonth()+offset);
    return d.toLocaleDateString('en-IN',{month:'short',year:'2-digit'});
  }catch(e){ return 'M'+(offset+1); }
}

/** Excel serial or odd strings → YYYY-MM-DD */
function normalizeToISODate(d){
  if(d===undefined||d===null) return '';
  if(d instanceof Date && !isNaN(d.getTime())) return d.toISOString().slice(0,10);
  var s=String(d).trim();
  if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(/^\d{4}-\d{2}$/.test(s)) return s+'-01';
  var m=s.match(/^([A-Za-z]{3,9})[.\-\s']*(\d{2,4})$/);
  if(m){
    var monMap={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
    var mk=m[1].toLowerCase().slice(0,4)==='sept'?'sept':m[1].toLowerCase().slice(0,3);
    var mm=monMap[mk];
    var yy=parseInt(m[2],10);
    if(isFinite(mm)&&isFinite(yy)){
      if(yy<100) yy=(yy>=70?1900:2000)+yy;
      if(yy>=1900&&yy<=2200) return yy+'-'+String(mm).padStart(2,'0')+'-01';
    }
  }
  var dm=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(dm){
    var dd=parseInt(dm[1],10), m2=parseInt(dm[2],10), y2=parseInt(dm[3],10);
    if(y2<100) y2=(y2>=70?1900:2000)+y2;
    if(dd>=1&&dd<=31&&m2>=1&&m2<=12&&y2>=1900&&y2<=2200){
      return y2+'-'+String(m2).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    }
  }
  var n=parseFloat(s.replace(/^\+/,''),10);
  if(isFinite(n)&&n>20000&&n<80000){
    var epoch=new Date(1899,11,30);
    var dt=new Date(epoch.getTime()+Math.round(n)*86400000);
    if(!isNaN(dt.getTime())) return dt.toISOString().slice(0,10);
  }
  var tryD=new Date(s);
  if(!isNaN(tryD.getTime())) return tryD.toISOString().slice(0,10);
  return '';
}
function formatMonthKey(mo){
  if(!mo) return '—';
  var s=String(mo).trim();
  if(/^\d{4}-\d{2}$/.test(s)){
    var p=s.split('-');
    var d=new Date(+p[0],+p[1]-1,1);
    return d.toLocaleDateString('en-IN',{month:'short',year:'numeric'});
  }
  var n=parseFloat(s.replace(/^\+/,''),10);
  if(isFinite(n)&&n>20000&&n<80000){
    var epoch=new Date(1899,11,30);
    var dt=new Date(epoch.getTime()+Math.round(n)*86400000);
    return dt.toLocaleDateString('en-IN',{month:'short',year:'numeric'});
  }
  return s;
}
function cr(v,zero){

function formatRupeesDisplay(v){

function parseIndianFyRangeFromText(text){

function moToQuarterKey(mo){
  if(!mo||String(mo).length<7) return '';
  var y=parseInt(mo.slice(0,4),10), m=parseInt(mo.slice(5,7),10);
  if(!isFinite(y)||!isFinite(m)) return '';
  var q=Math.floor((m-1)/3)+1;
  return y+'-Q'+q;
}
function quarterLabelFromKey(qk){
  var p=String(qk).split('-Q');
  if(p.length!==2) return qk;
  return 'Q'+p[1]+' '+p[0];
}
function addMonthsToMonthKey(mo,n){
  if(!mo||!n) return mo;
  var p=String(mo).split('-');
  var y=parseInt(p[0],10), m=parseInt(p[1],10);
  if(!isFinite(y)||!isFinite(m)) return mo;
  var d=new Date(y, m-1, 1);
  if(isNaN(d.getTime())) return mo;
  d.setMonth(d.getMonth()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

}

/** Build column model for sales grid: array of {kind:'month',mo} | {kind:'quarterSum',qk,months} */
function buildSalesRevenueColumns(monthColsSorted, mode, qCollapsed){
  var cols=[];
  if(mode==='quarter'){
    var qMap={};
    monthColsSorted.forEach(function(mo){
      var qk=moToQuarterKey(mo);
      if(!qMap[qk]) qMap[qk]={qk:qk,months:[]};
      qMap[qk].months.push(mo);
    });
    Object.keys(qMap).sort().forEach(function(qk){ cols.push({kind:'quarterSum',qk:qk,months:qMap[qk].months}); });
    return cols;
  }
  var qOrder=[];
  var qB={};
  monthColsSorted.forEach(function(mo){
    var qk=moToQuarterKey(mo);
    if(qB[qk]) qB[qk].push(mo);
    else{ qB[qk]=[mo]; qOrder.push(qk); }
  });
  qOrder.forEach(function(qk){
    var months=qB[qk];
    if(qCollapsed[qk]) cols.push({kind:'quarterSum',qk:qk,months:months});
    else months.forEach(function(mo){ cols.push({kind:'month',mo:mo,qk:moToQuarterKey(mo)}); });
  });
  return cols;
}
function postSalesIncludeUnitInScheduleRollup(u){
  var c=String((u&&(u.collectionIssue||u.paymentIssueStatus))||'none').toLowerCase();
  if(!c||c==='none'||c==='ok'||c==='clear'||c==='good') return true;
  return false;
}
function postSalesIncludeUnitInExpectedAmountRollup(u){
  var c=String((u&&(u.collectionIssue||u.paymentIssueStatus))||'none').toLowerCase().replace(/\s+/g,'_');
  if(c==='agreement_pending'||c==='agreement-pending'){
    return Boolean(normalizeToISODate(u.expectedAgreementDate||u.agreementDate||u.agreementRegistrationDate||''));
  }
  return postSalesIncludeUnitInScheduleRollup(u);
}
function unitHasCrmReceivedLinesPs(u){
  if(!u) return false;
  return (u.installments||[]).some(function(ins){ return ins.label&&String(ins.label).indexOf('(received)')>=0; });
}
function hasLedgerCustomerCollectionsForUnitPs(cfg, unitId){
  if(!unitId) return false;
  return (cfg.actuals||[]).some(function(a){
    return a&&a.unitRef===unitId&&a.cat1==='Customer Collections'&&includeActualInCashflowSums(a);
  });
}
function buildPostSalesSeries(cfg){
  var sched={}, exp={}, real={}, unsold={};
  (cfg.units||[]).forEach(function(u){
    getUnitSchedule(u,cfg).forEach(function(it){
      var iso=normalizeToISODate(it.date);
      if(!iso) return;
      var mo=iso.slice(0,7);
      sched[mo]=(sched[mo]||0)+coerceMoney(it.amount);
    });
  });
  (cfg.units||[]).forEach(function(u){
    if(!postSalesIncludeUnitInExpectedAmountRollup(u)) return;
    getUnitSchedule(u,cfg).forEach(function(it){
      var iso=normalizeToISODate(it.date);
      if(!iso) return;
      var mo=iso.slice(0,7);
      exp[mo]=(exp[mo]||0)+coerceMoney(it.amount);
    });
  });
  var byId={};
  (cfg.units||[]).forEach(function(u){ if(u&&u.id) byId[u.id]=u; });
  (cfg.actuals||[]).forEach(function(a){
    if(!includeActualInCashflowSums(a)) return;
    var mo=a.date?String(a.date).slice(0,7):'';
    if(!/^\d{4}-\d{2}$/.test(mo)) return;
    if(a.cat1!=='Customer Collections') return;
    if(a.unitRef){
      var u0=byId[a.unitRef];
      if(u0 && unitHasCrmReceivedLinesPs(u0)) return;
    }
    real[mo]=(real[mo]||0)+Math.abs(coerceMoney(a.amount));
  });
  (cfg.units||[]).forEach(function(u){
    var inst=u.installments||[], hasRecvLine=inst.some(function(ins){ return ins.label&&String(ins.label).indexOf('(received)')>=0; });
    if(hasRecvLine){
      inst.forEach(function(ins){
        if(!ins.label||String(ins.label).indexOf('(received)')<0) return;
        var iso=normalizeToISODate(effectiveInstallmentIso(u,cfg,ins));
        if(!iso) return;
        var mo=iso.slice(0,7);
        var amt=Math.abs(coerceMoney(ins.amount));
        if(amt<=0) return;
        real[mo]=(real[mo]||0)+amt;
      });
      return;
    }
    if(u.id && hasLedgerCustomerCollectionsForUnitPs(cfg, u.id)) return;
    var collAmt=coerceMoney(u.collectedAmount);
    var collDt=normalizeToISODate(u.collectedDate||'');
    if(collAmt>0 && collDt){
      var mo2=collDt.slice(0,7);
      real[mo2]=(real[mo2]||0)+collAmt;
      return;
    }
    var rtd2=coerceMoney(u.receivedToDate);
    if(rtd2>0){
      var ref2=normalizeToISODate(u.collectedDate||u.bookingDate||'');
      if(ref2){
        var mo3=ref2.slice(0,7);
        real[mo3]=(real[mo3]||0)+rtd2;
      }
    }
  });
  var startD=cfg.startDate||new Date().toISOString().slice(0,7)+'-01';
  var uns=buildUnsoldRealization(cfg, startD);
  Object.keys(uns).forEach(function(mo){ unsold[mo]=uns[mo].sales||0; });
  var all={};
  [sched,exp,real,unsold].forEach(function(o){
    Object.keys(o).forEach(function(k){ all[k]=1; });
  });
  var nPlan=Math.max(1, cfg.totalMonths||60);
  var planEndMo=offsetMonth(startD, nPlan-1);
  for(var i=0;i<nPlan;i++){
    var mk=offsetMonth(startD, i);
    if(mk) all[mk]=1;
  }
  var f;
  for(f=0;f<=60;f+=1){
    var mk2=addMonthsToYM(planEndMo, f);
    if(mk2) all[mk2]=1;
  }
  var projStartMo=String(startD).slice(0,7);
  for(var b=1;b<=120;b+=1){
    var mkb=addMonthsToYM(projStartMo, -b);
    if(!mkb) break;
    all[mkb]=1;
  }
  var months=Object.keys(all).sort();
  return months.map(function(mo){
    return {
      mo: mo,
      scheduled: sched[mo]||0,
      expected: exp[mo]||0,
      realized: real[mo]||0,
      unsoldProj: unsold[mo]||0,
      gap: (sched[mo]||0)-(real[mo]||0)
    };
  });
}

function scheduledInNextMonths(cfg, startMo, nMonths, delayMo){
  var ufn=delayMo?function(u,c){ return getUnitScheduleWithConstructionDelay(u,c,delayMo);}:getUnitSchedule;
  var tot=0;
  var start=new Date((startMo||'2020-01')+'-01');
  if(isNaN(start.getTime())) return 0;
  for(var i=0;i<nMonths;i++){
    var d=new Date(start); d.setMonth(d.getMonth()+i);
    var mk=d.toISOString().slice(0,7);
    (cfg.units||[]).forEach(function(u){
      ufn(u,cfg).forEach(function(it){
        var iso=normalizeToISODate(it.date);
        if(iso&&iso.slice(0,7)===mk) tot+=coerceMoney(it.amount);
      });
    });
  }
  return tot;
}

function getUnitScheduleWithConstructionDelay(u,cfg,delayMo){
  if(!delayMo||u.payType!=='const') return getUnitSchedule(u,cfg);
  return getConstScheduleShifted(u,cfg,delayMo);
}

function getConstScheduleShifted(unit,cfg,shiftMonths){
  var sched=[];
  var defs=getMilestoneDefs(cfg);
  var b0=normalizeToISODate(unit.bookingDate)||'';
  var tv=coerceMoney(unit.totalValue);
  defs.forEach(function(ms){
    var amt=(parseFloat(ms.pct)||0)/100*tv;
    var date;
    if(ms.key==='booking') date=b0;
    else if(ms.key==='agreement'){
      if(!b0) date='';
      else {
        var d=new Date(b0);
        if(isNaN(d.getTime())) date='';
        else { d.setMonth(d.getMonth()+1); date=d.toISOString().slice(0,10); }
      }
    } else {
      var raw=milestoneTargetIsoForDef(cfg, unit, ms)||'';
      if(raw){
        var dx=new Date(raw);
        if(!isNaN(dx.getTime())){ dx.setMonth(dx.getMonth()+shiftMonths); date=dx.toISOString().slice(0,10); date=clampDateIsoToBooking(date,b0); }
        else date=raw;
      } else date='';
      if(date&&b0&&milestoneIsConstLink(ms)){
        var dStr2=date.slice(0,10), bStr2=b0.slice(0,10);
        if(dStr2<=bStr2) date=b0;
      }
    }
    if(date) sched.push({date:clampDateIsoToBooking(date,b0),amount:amt,label:milestoneDisplayLabel(ms)});
  });
  return sched;
}

    h+='<div style="text-align:center;color:var(--muted);padding:16px;font-size:11px">No transactions yet. Add manually or import from Tally (CSV or XML).</div>';
  } else {
    h+='<div class="sales-grid-wrap"><table id="sales-grid-table" style="width:100%;border-collapse:collapse;font-size:10px">';
    h+='<thead><tr style="background:var(--blue-l)"><th style="padding:5px 8px;text-align:left">Date</th>';
    h+='<th style="text-align:left">Party</th><th style="text-align:left">Category</th><th style="text-align:left;max-width:180px">GA L1 / L2 / L3</th>';
    h+='<th style="text-align:left">Cost Centre</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody>';

        +(a.gaL2?('<div style="font-size:8px;color:var(--slate)">'+escHtml(a.gaL2)+'</div>'):'')
        +((a.gaL3||a.gaL3Name)?('<div style="font-size:8px;color:var(--muted)">'+(a.gaL3?escHtml(a.gaL3)+' ':'')+escHtml(a.gaL3Name||'')+'</div>'):'');
      if(!gaH) gaH='<span style="font-size:8px;color:var(--muted)">—</span>';
      h+='<tr style="border-bottom:1px solid var(--border)">';
      h+='<td style="padding:4px 8px">'+a.date+'</td>';
      h+='<td style="padding:4px 8px">'+a.party+'<br/><span style="font-size:9px;color:var(--muted)">'+a.note+'</span></td>';
      h+='<td style="padding:4px 8px"><span style="background:'+(pos?'var(--green-l)':'var(--red-l)')+';color:'+(pos?'var(--green-b)':'var(--red-b)')+';padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700">'+a.cat1+'</span>'
        +((a.tallyMapSrc&&a.source==='tally')?('<div style="font-size:7px;margin-top:2px;color:var(--muted)">'+escHtml(a.tallyMapSrc)+'</div>'):'')+'</td>';
      h+='<td style="padding:4px 6px;vertical-align:top">'+gaH+'</td>';

      h+='</tr>';

function salesCellAmt(u,cfg,col){
  var t=0;
  getUnitSchedule(u,cfg).forEach(function(it){
    var iso=normalizeToISODate(it.date);
    if(!iso) return;
    var mo=iso.slice(0,7);
    if(col.kind==='month'&&mo===col.mo) t+=coerceMoney(it.amount);
    if(col.kind==='quarterSum'&&col.months.indexOf(mo)>=0) t+=coerceMoney(it.amount);
  });
  return t;
}
function salesCellAmtByLabel(u,cfg,col,labelNeedle){
  var t=0;
  (u.installments||[]).forEach(function(ins){
    if(String(ins.label||'').indexOf(labelNeedle)<0) return;
    var iso=normalizeToISODate(effectiveInstallmentIso(u,cfg,ins));
    if(!iso) return;
    var mo=iso.slice(0,7);
    if(col.kind==='month'&&mo===col.mo) t+=coerceMoney(ins.amount);
    if(col.kind==='quarterSum'&&col.months.indexOf(mo)>=0) t+=coerceMoney(ins.amount);
  });
  return t;
}
function formatShortDateDMY(iso){
  if(!iso||iso.length<10) return '';
  return iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4);
}
function salesCellAmtRecvByMilestoneMonth(u,cfg,col){
  var t=0;
  groupCRMInstallmentsByBase(u,cfg).forEach(function(g){
    var dueMo=crmMilestoneMonthKey(g.dueIso||'', u);

}
function salesCellAmtPendByMilestoneMonth(u,cfg,col){

function salesCellDateLabels(u,cfg,col){
  var seen={}, out=[];
  (u.installments||[]).forEach(function(ins){

/** Sum amounts keyed by YYYY-MM for one grid column (month or quarter). */
function colSumFromMoMap(map,col){
  if(!map) return 0;
  if(col.kind==='month') return map[col.mo]||0;
  var t=0;
  if(col.kind==='quarterSum'&&col.months){
    col.months.forEach(function(mo){ t+=map[mo]||0; });
  }
  return t;
}
/**
 * One getUnitSchedule + one CRM group per unit (not per cell). Used by Sales grid only.
 * Maps: dueByMo from scheduled tranches; recvByMo / pendByMo from CRM buckets or raw installment labels.
 */
function buildSalesGridCaches(cfg, units){
  return units.map(function(u){
    var sched=getUnitSchedule(u,cfg);
    var dueByMo={};
    var dueTillToday=0;
    var bookingIso=normalizeToISODate(u&&u.bookingDate)||'';
    var tdy=today();
    sched.forEach(function(it){
      var iso=normalizeToISODate(it.date);
      if(!iso) return;
      var mo=(u.payType==='install')?iso.slice(0,7):clampMonthToBooking(iso.slice(0,7), bookingIso);
      var amt=coerceMoney(it.amount);
      dueByMo[mo]=(dueByMo[mo]||0)+amt;
      if(iso<=tdy) dueTillToday+=amt;
    });
    var recvByMo={}, pendByMo={}, recvTillToday=0, pendTillToday=0;
    if(u.payType==='install'){
      if(installUsesCRMDueLines(u)){
        groupCRMInstallmentsByBase(u,cfg).forEach(function(g){
          var dueMo=crmMilestoneMonthKey(g.dueIso||'', u);
          if(!dueMo) return;
          var rcv=coerceMoney(g.recv), pnd=coerceMoney(g.pend);
          recvByMo[dueMo]=(recvByMo[dueMo]||0)+rcv;
          pendByMo[dueMo]=(pendByMo[dueMo]||0)+pnd;
          var gIso=normalizeToISODate(g.dueIso)||'';
          if(gIso&&gIso<=tdy){
            recvTillToday+=rcv;
            pendTillToday+=pnd;
          }
        });
      } else {
        (u.installments||[]).forEach(function(ins){
          var L=String(ins.label||'');
          var iso=normalizeToISODate(effectiveInstallmentIso(u,cfg,ins));
          if(!iso) return;
          var mo=iso.slice(0,7);
          var amtIns=coerceMoney(ins.amount);
          if(L.indexOf('(received)')>=0){
            recvByMo[mo]=(recvByMo[mo]||0)+amtIns;
            if(iso<=tdy) recvTillToday+=amtIns;
          }
          if(L.indexOf('(pending)')>=0){
            pendByMo[mo]=(pendByMo[mo]||0)+amtIns;
            if(iso<=tdy) pendTillToday+=amtIns;
          }
        });
      }
    }
    return {dueByMo:dueByMo,recvByMo:recvByMo,pendByMo:pendByMo,dueTillToday:dueTillToday,recvTillToday:recvTillToday,pendTillToday:pendTillToday};
  });
}

function applySalesGridFreeze(freezeCols){
  var tbl=document.getElementById('sales-grid-table');
  if(!tbl||!freezeCols) return;
  var rows=tbl.rows, r, c, occ=[], lefts=[], colW=[], maxCol=0;
  // Reset prior styles
  Array.prototype.forEach.call(rows, function(row){
    Array.prototype.forEach.call(row.cells, function(cell){
      cell.style.position='';
      cell.style.left='';
      cell.style.zIndex='';
      cell.style.boxShadow='';
    });
  });
  // Build logical grid accounting for rowSpan/colSpan.
  for(r=0;r<rows.length;r++){
    if(!occ[r]) occ[r]=[];
    var logicalCol=0;
    for(c=0;c<rows[r].cells.length;c++){
      var cell=rows[r].cells[c];
      while(occ[r][logicalCol]) logicalCol++;
      cell.dataset.gridCol=String(logicalCol);
      var rs=cell.rowSpan||1, cs=cell.colSpan||1, rr, cc;
      var w=cell.getBoundingClientRect().width||cell.offsetWidth||0;
      // Ignore merged colspan cells for width model; they distort sticky offsets.
      if(cs===1 && (colW[logicalCol]||0)<w) colW[logicalCol]=w;
      for(rr=r;rr<r+rs;rr++){
        if(!occ[rr]) occ[rr]=[];
        for(cc=logicalCol;cc<logicalCol+cs;cc++) occ[rr][cc]=1;
      }
      logicalCol+=cs;
      if(logicalCol>maxCol) maxCol=logicalCol;
    }
  }
  var acc=0, i;
  for(i=0;i<freezeCols&&i<maxCol;i++){ lefts[i]=acc; acc+=(colW[i]||0); }
  function pinCell(cell, idx, baseZ){
    if(lefts[idx]===undefined) return;
    if((cell.colSpan||1)>1) return;
    cell.style.position='sticky';
    cell.style.left=lefts[idx]+'px';
    cell.style.zIndex=String(baseZ+idx);
    if(!cell.style.background) cell.style.background='var(--card)';
    cell.style.boxShadow='1px 0 0 var(--border)';
  }
  var theadRows=tbl.tHead?tbl.tHead.rows:[];
  Array.prototype.forEach.call(theadRows, function(row){
    Array.prototype.forEach.call(row.cells, function(cell){
      var idx=parseInt(cell.dataset.gridCol||'-1',10);
      if(idx>=0&&idx<freezeCols) pinCell(cell, idx, 220);
    });
  });
  Array.prototype.forEach.call(tbl.tBodies, function(tb){
    Array.prototype.forEach.call(tb.rows, function(row){
      Array.prototype.forEach.call(row.cells, function(cell){
        var idx=parseInt(cell.dataset.gridCol||'-1',10);
        if(idx>=0&&idx<freezeCols) pinCell(cell, idx, 120);
      });
    });
  });
}

function isGstLedgerName(name){
  var s=String(name||'').toLowerCase();
  return s.indexOf('cgst')>=0 || s.indexOf('sgst')>=0 || s.indexOf('igst')>=0 || s.indexOf('utgst')>=0
    || (s.indexOf('gst')>=0 && s.indexOf('gstr')<0);
}
function isRoundOffTdsName(name){
  var s=String(name||'').toLowerCase();
  return s.indexOf('round')>=0 || s.indexOf('tds')>=0 || s.indexOf('tcs')>=0;
}
/** Tally: <ISDEEMEDPOSITIVE>Yes</…> = Debit, No = Credit. */
function tallyIsDebitFromEntryInner(inner){
  if(!inner) return true;
  if(/<ISDEEMEDPOSITIVE>\s*Yes\s*</i.test(inner)) return true;
  if(/<ISDEEMEDPOSITIVE>\s*No\s*</i.test(inner)) return false;
  return true;
}
function parseVendorGstFactsFromXml(xmlText){
  if(!xmlText||typeof xmlText!=='string') return [];
  var safe=sanitizeTallyXmlForDomParser(xmlText);
  var vouchers=tallyXmlListInners(safe,'VOUCHER');
  var out=[];
  vouchers.forEach(function(vb, idx){
    var dateRaw=tallyVoucherDateRawFromInner(vb);
    var date=normalizeDate(dateRaw)||today();
    var vno=tallyXmlSimpleTag(vb,'VOUCHERNUMBER')||String(idx+1);
    var vtype=tallyXmlSimpleTag(vb,'VOUCHERTYPENAME')||'';
    var partyHint=String(tallyXmlSimpleTag(vb,'PARTYLEDGERNAME')||'').trim();
    var ents=tallyXmlListInners(vb,'ALLLEDGERENTRIES.LIST');
    if(!ents.length) return;
    var drBase=0, drGst=0, partyCrAmt=0, bestCrName='', vendor=partyHint;
    ents.forEach(function(ent){
      var ledger=String(tallyXmlSimpleTag(ent,'LEDGERNAME')||'').trim();
      var amtStr=tallyLedgerPrimaryAmountStr(ent);
      var mag=Math.abs(parseFloat(String(amtStr).replace(/,/g,''))||0);
      if(!ledger || !mag) return;
      if(!vendor && /<ISPARTYLEDGER>\s*Yes\s*<\/ISPARTYLEDGER>/i.test(ent)) vendor=ledger;
      var isDr=tallyIsDebitFromEntryInner(ent);
      if(isDr){
        if(isGstLedgerName(ledger)) drGst+=mag;
        else if(!isRoundOffTdsName(ledger)) drBase+=mag;
      } else {
        if(!isGstLedgerName(ledger) && !isRoundOffTdsName(ledger) && mag>=partyCrAmt - 0.1){
          partyCrAmt=mag; bestCrName=ledger;
        }
      }
    });
    if(!vendor && bestCrName) vendor=bestCrName;
    if(!vendor) vendor=tallyXmlSimpleTag(ents[0],'LEDGERNAME')||'Unknown Vendor';
    var total= partyCrAmt>0 ? partyCrAmt : (drBase+drGst);
    var gst= drGst, taxable= drBase;
    if(partyCrAmt>0) taxable=Math.max(0, partyCrAmt - drGst);
    if(total<=0) return;
    if(gst<=0.01 && drBase>0 && drGst<0.01) taxable=total;
    var narr=String(tallyXmlSimpleTag(vb,'NARRATION')||'').trim();
    out.push({
      vendor: vendor, date: date, voucherNo: vno, voucherType: vtype,
      taxable: taxable, gst: gst, total: total,
      gstPct: total?((gst/total)*100):0,
      narration: narr
    });
  });
  return out;
}

function renderDebt(){
  var el=document.getElementById('page-debt'); if(!el) return;
  if(!PROJS.length){el.innerHTML=noProjectMsg();return;}
  var cfg=getCF(_curPid);
  var h='';
  h+='<div style="font-size:15px;font-weight:800;color:var(--blue-b);margin-bottom:12px">🏦 Debt Service — '+cfg.projName+'</div>';
  h+='<div style="font-size:10px;color:var(--muted);margin-bottom:12px">Configure debt tranches. Interest and principal repayments auto-calculate and feed into Cashflow rows ⑧ & ⑨.</div>';

  (cfg.debtTranches||[]).forEach(function(dt,i){
    var tot=dt.drawAmount||0;
    var repaid=(dt.repaySchedule||[]).reduce(function(s,r){return s+r.amount;},0);
    h+='<div class="card" style="border-top:3px solid var(--purple);margin-bottom:12px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">';
    h+='<div style="font-size:13px;font-weight:700;color:var(--purple-b)">'+(dt.lender||'Debt '+dt.id)+'</div>';
    h+='<button data-action="del-dt" data-idx="'+i+'" class="btn btn-red" style="padding:3px 8px;font-size:10px">Remove</button>';
    h+='</div>';
    h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:10px">';
    [['id','Tranche ID'],['lender','Lender Name']].forEach(function(f){
      h+='<div><label class="fld-lbl">'+f[1]+'</label><input type="text" value="'+(dt[f[0]]||'')+'" data-action="upd-dt" data-idx="'+i+'" data-key="'+f[0]+'" class="cap-inp" style="width:100%"/></div>';
    });
    [['drawAmount','Sanctioned Amount (₹)'],['ratePct','Annual Interest Rate %'],['drawDate','Draw Date']].forEach(function(f){
      var typ=f[0]==='drawDate'?'date':'number';
      h+='<div><label class="fld-lbl">'+f[1]+'</label><input type="'+typ+'" value="'+(dt[f[0]]||'')+'" data-action="upd-dt" data-idx="'+i+'" data-key="'+f[0]+'" class="cap-inp" style="width:100%"/></div>';
    });
    h+='</div>';
    // Repayment schedule
    var repRows=(dt.repaySchedule||[]).map(function(r,j){
      return '<tr><td style="padding:3px 6px"><input type="date" value="'+String(r.dueDate||'').slice(0,10)+'" data-action="upd-repay" data-dtidx="'+i+'" data-ridx="'+j+'" data-key="dueDate" class="cap-inp" style="width:130px" title="If set, principal posts in this calendar month (overrides month #)"/></td>'
        +'<td style="padding:3px 6px"><input type="number" value="'+r.month+'" placeholder="Month#" data-action="upd-repay" data-dtidx="'+i+'" data-ridx="'+j+'" data-key="month" class="cap-inp" style="width:70px"/></td>'
        +'<td style="padding:3px 6px"><input type="number" value="'+r.amount+'" placeholder="Amount ₹" data-action="upd-repay" data-dtidx="'+i+'" data-ridx="'+j+'" data-key="amount" class="cap-inp" style="width:120px"/></td>'
        +'<td><button data-action="del-repay" data-dtidx="'+i+'" data-ridx="'+j+'" class="btn btn-red" style="padding:2px 6px;font-size:9px">×</button></td></tr>';
    }).join('');
    h+='<div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px">Principal Repayment Schedule</div>';
    h+='<div style="font-size:9px;color:var(--muted);margin-bottom:6px">Use <strong>Due date</strong> for calendar-month booking, or leave it blank and use <strong>Month #</strong> (project period).</div>';
    h+=repRows?'<table style="font-size:10px"><thead><tr><th style="padding:3px 6px">Due date</th><th style="padding:3px 6px">Month #</th><th>Amount (₹)</th><th></th></tr></thead><tbody>'+repRows+'</tbody></table>':'<div style="font-size:10px;color:var(--muted)">No repayment schedule set — add when principal repayment is due.</div>';
    h+='<div style="margin-top:8px;display:flex;gap:8px">';
    h+='<button class="btn btn-outline" data-action="add-repay" data-idx="'+i+'" style="font-size:10px">+ Add Repayment</button>';
    h+='<div style="font-size:10px;color:var(--muted);align-self:center">Total principal drawn: '+cr(tot)+' | Scheduled repayment: '+cr(repaid)+' | Outstanding: '+cr(tot-repaid)+'</div>';
    h+='</div></div>';
  });

  h+='<button class="btn btn-primary" data-action="add-dt">+ Add Debt Tranche</button>';
  el.innerHTML=h;
}

  h+='<button type="button" class="btn '+(_gaTimeScale==='quarter'?'btn-primary':'btn-outline')+'" data-action="ga-set-scale" data-scale="quarter" style="font-size:10px;padding:4px 10px">Quarterly</button>';
  h+='<span style="font-size:10px;color:var(--muted)">'+(_gaTimeScale==='quarter'?rows.length+' quarters':'Full month grid')+'</span>';
  h+='<label style="font-size:10px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;margin-left:14px;cursor:pointer;user-select:none">';
  h+='<input type="checkbox" data-action="toggle-prior-years" '+(showPriorCalendarYears()?'checked':'')+' style="accent-color:var(--blue)"/>';
  h+='Show prior calendar years</label>';

  h+='<div class="kpi-row">';
  [{l:'Portfolio GDV',v:cr(vis.reduce(function(s,p){return s+(p._gdv||0);},0)),c:'var(--blue)'},

   {l:'Total Outflows',v:cr(totOut,'₹0'),c:'var(--red-b)'},

   {l:'GA DM Fee (Portfolio)',v:cr(vis.reduce(function(s,p){return s+(p._dmFee||0);},0)),c:'var(--teal)'},

    h+='<div class="kpi" style="border-top:3px solid '+k.c+'"><div style="font-size:16px;font-weight:800;color:'+k.c+'">'+k.v+'</div><div style="font-size:9px;color:var(--muted);margin-top:2px">'+k.l+'</div></div>';

  h+='<th colspan="'+(iExp?1:gOutC)+'" style="background:#7B1D1D;cursor:pointer;text-align:center" data-toggle-group="outflows">'+(iExp?'▶ OUTFLOWS':'▼ OUTFLOWS')+'</th>';
  h+='<th style="background:#1558A0">Net CF</th><th style="background:#1558A0">Closing</th>';
  h+='</tr>';
  h+='<tr><th class="cf-sticky0"></th><th class="cf-sticky1 cf-month-narrow"></th>';
  if(!iInf){
    gIn.forEach(function(c){h+='<th style="background:#155E34;font-size:10px">'+cfCatThLabel(c)+'</th>';});
    h+='<th style="background:#0D4D30;font-size:10px">Total<br/>In</th>';
  }else{
    h+='<th style="background:#0D4D30;font-size:10px">Total Inflows</th>';

  if(!iExp){
    gOut.forEach(function(c){h+='<th style="background:#7B1D1D;font-size:10px">'+cfOutflowColHeaderHtml(c)+'</th>';});

  }else{

  }
  h+='<th style="background:#0A3266;font-size:10px">Net</th><th style="background:#0A3266;font-size:10px">Closing</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var bg=r.isCurrent?'background:#FFFDE7;':'';
    h+='<tr style="'+bg+'">';
    h+='<td class="cf-sticky0" style="font-size:10px;color:var(--muted);background:'+(r.isCurrent?'#FFFDE7':'var(--card)')+'">'+r.period+'</td>';
    h+='<td class="cf-sticky1 cf-month-narrow" style="background:'+(r.isCurrent?'#FFFDE7':'var(--card)')+'">'+r.label+'</td>';
    if(!iInf){
      var l1gIn=r.l1In || l1InflowFromRowVals(r);
      gIn.forEach(function(cn){
        if(cn==='Sales Revenue') h+='<td class="cf-num cf-in" style="vertical-align:top">'+formatSalesRevBreakdownHtml(r)+'</td>';
        else h+='<td class="cf-num cf-in">'+crN((l1gIn[cn]||0))+'</td>';
      });
      h+='<td class="cf-num" style="background:#C6F6D5">'+crN(r.totInflows)+'</td>';
    } else {
      h+='<td class="cf-num" style="background:#C6F6D5">'+crN(r.totInflows)+'</td>';
    }
    if(!iExp){
      var l1gOut=r.l1Out || l1OutflowFromRowVals(r);
      gOut.forEach(function(cn){
        h+='<td class="cf-num cf-out">'+crN((l1gOut[cn]||0))+'</td>';
      });
      h+='<td class="cf-num" style="background:#FED7D7">'+crN(r.totOutflows)+'</td>';
    } else {
      h+='<td class="cf-num" style="background:#FED7D7">'+crN(r.totOutflows)+'</td>';
    }
    h+='<td class="cf-num" style="'+(r.netCF>=0?'color:var(--green-b)':'color:var(--red-b)')+';font-weight:700">'+crN(r.netCF)+'</td>';
    h+='<td class="cf-num" style="'+(r.closingCash<0?'background:#FEECEC;color:var(--red-b)':'background:#E8F6EE;color:var(--green-b)')+';font-weight:800">'+crN(r.closingCash)+'</td>';
    h+='</tr>';

  h+='<tr style="background:var(--blue-l);font-weight:800;font-size:11px"><td class="cf-sticky0" style="background:var(--blue-l)">Σ</td><td class="cf-sticky1" style="background:var(--blue-l)">TOTAL</td>';
  if(!iInf){
    var gaL1I=l1MapEmpty(gIn);
    rows.forEach(function(r){ mergeL1Object(gaL1I, r.l1In || l1InflowFromRowVals(r)); });
    gIn.forEach(function(cn){ h+='<td class="cf-num">'+crN(gaL1I[cn]||0)+'</td>'; });
    h+='<td class="cf-num" style="background:#C6F6D5">'+crN(totIn)+'</td>';
  } else {
    h+='<td class="cf-num" style="background:#C6F6D5">'+crN(totIn)+'</td>';
  }
  if(!iExp){
    var gaL1O=l1MapEmpty(gOut);
    rows.forEach(function(r){ mergeL1Object(gaL1O, r.l1Out || l1OutflowFromRowVals(r)); });
    gOut.forEach(function(cn){ h+='<td class="cf-num">'+crN(gaL1O[cn]||0)+'</td>'; });
    h+='<td class="cf-num" style="background:#FED7D7">'+crN(totOut)+'</td>';
  } else {
    h+='<td class="cf-num" style="background:#FED7D7">'+crN(totOut)+'</td>';
  }
  h+='<td class="cf-num" style="'+((totIn-totOut)>=0?'color:var(--green-b)':'color:var(--red-b)')+'">'+crN(totIn-totOut)+'</td>';
  h+='<td class="cf-num" style="'+(closingLast>=0?'background:#E8F6EE;color:var(--green-b)':'background:#FEECEC;color:var(--red-b)')+'">'+crN(closingLast)+'</td></tr>';
  h+='</tbody></table></div>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">';
  h+='<button class="btn btn-outline" data-action="export-ga-tsv">⬇ Export TSV</button>';
  h+='<button class="btn btn-primary" data-action="export-ppt">📊 Investor PPT</button>';
  h+='</div>';
  el.innerHTML=h;
}

function saveUnit(){
  var unitNo=document.getElementById('u-no').value.trim();
  var val=parseFloat(document.getElementById('u-val').value);
  var date=document.getElementById('u-date').value;
  if(!unitNo||!val||!date){alert('Unit No., Value and Booking Date are required.');return;}
  var payType=document.querySelector('input[name="u-paytype"]:checked');
  var pt=payType?payType.value:'const';
  var installs=[];
  if(pt==='install'){
    document.querySelectorAll('#u-installs > div').forEach(function(row){
      var inps=row.querySelectorAll('input');
      var d=inps[0]&&inps[0].value, a=parseFloat(inps[1]&&inps[1].value||0);
      if(d&&a) installs.push({date:d,amount:a});

  if(!_curPid){alert('Select a project first.');return;}
  var parsed=parseTallyXmlToLedgerLines(xmlText);
  if(parsed.error){alert(parsed.error);return;}
  var rows=parsed.rows||[];
  if(!rows.length){alert('No ledger lines found in this XML.');return;}
  var s=getTallySyncForPull();
  var res=mergeTallyLinesIntoActuals(rows,{
    replaceTally:!!s.replaceTally,
    costCentreSubstr:s.costCentreSubstr||''
  });
  window.__gaLastTallyExportRaw=xmlText;
  window.__gaLastTallyExportMeta={
    reportId:'uploaded-xml',
    fromDate:'',
    toDate:'',
    sendCompanyToTally:false,
    currentCompany:'',
    pulledAt:new Date().toISOString()
  };
  window.__gaLastTallyParsedRows=rows.slice();
  renderTab(_curTab);
  refreshProjectCashflowViews();
  alert('✓ From uploaded XML: +'+res.added+' line(s) into actuals. Skipped '+res.skipped+' (duplicate or cost-centre filter).');
}
function importTallyFile(input){
  if(!input.files||!input.files[0]) return;
  var r=new FileReader();
  r.onload=function(e){
    var text=String(e.target.result||'').replace(/^\uFEFF/,'');
    if(/<ENVELOPE[\s>]/i.test(text)||/<VOUCHER[\s/>]/i.test(text)){
      importTallyXmlFromFileText(text);
      input.value='';
      return;
    }
    var lines=text.replace(/\r/g,'').split('\n').filter(function(l){return l.trim();});
    if(!lines.length){alert('File appears empty.');return;}
    var header=lines[0].split('\t').map(function(h){return h.toLowerCase().trim();});
    var iDate=header.indexOf('date'), iParty=-1, iAmt=-1, iCredit=-1, iNarr=-1, iCC=-1;
    ['particulars','ledger name','party name','ledger'].forEach(function(k){if(iParty<0)iParty=header.indexOf(k);});
    ['amount','debit amount','debit'].forEach(function(k){if(iAmt<0)iAmt=header.indexOf(k);});
    ['credit amount','credit'].forEach(function(k){if(iCredit<0)iCredit=header.indexOf(k);});
    ['narration','description','remarks'].forEach(function(k){if(iNarr<0)iNarr=header.indexOf(k);});
    ['cost centre','cost center','department'].forEach(function(k){if(iCC<0)iCC=header.indexOf(k);});
    if(iParty<0){alert('Cannot find Particulars / Ledger Name column in file.\nExpected: Date, Particulars, Amount.\nPlease ensure tab-separated Tally export format.');return;}
    var parsed=[];
    lines.slice(1).forEach(function(line){
      var cols=line.split('\t');
      var party=cols[iParty]&&cols[iParty].trim();
      if(!party) return;
      var amtRaw=iAmt>=0?cols[iAmt]||'':'';
      var creditRaw=iCredit>=0?cols[iCredit]||'':'';
      var amt=parseFloat(amtRaw.replace(/,/g,''))||0;
      var credit=parseFloat(creditRaw.replace(/,/g,''))||0;
      if(credit>0) amt=credit;
      if(!amt) return;
      var narr=iNarr>=0?cols[iNarr]||'':'';
      var cc=iCC>=0?cols[iCC]||'':'';
      var date=iDate>=0?normalizeDate(cols[iDate]||''):today();
      var cl=classifyTallyLineFromText(party+' '+narr, party, amt);
      var cat=cl.cat1;
      var isInflow=INFLOW_CATS.indexOf(cat)>=0;
      if(cl.flow==='in' && !isInflow) isInflow=true;
      if(cl.flow==='out' && isInflow) isInflow=false;
      if(!isInflow) amt=-Math.abs(amt);
      parsed.push({
        date:date,party:party,cat1:cat,note:narr,amount:amt,costCentre:cc,
        gaL1:cl.gaL1,gaL2:cl.gaL2,gaL3:cl.gaL3,gaL3Name:cl.gaL3Name,tallyMapSrc:cl.tallyMapSrc,
      });
    });
    if(!parsed.length){alert('No transactions parsed. Check file format.');return;}
    var cfg=getCF(_curPid);
    var added=0;
    parsed.forEach(function(p){
      if(p.date&&p.amount){
        cfg.actuals.push(Object.assign({id:uid()},p));
        added++;
      }
    });
    saveAll(); renderTab(_curTab); refreshProjectCashflowViews();
    alert('✓ Imported '+added+' transaction(s). Review categories in the transaction log — auto-mapping uses ledger name keywords. Correct any that need updating.');
  };
  r.readAsText(input.files[0]); input.value='';
}

function normalizeDate(d){
  if(!d) return today();
  var s=String(d).trim();
  if(/^\d{8}$/.test(s)) return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
  var mons={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  var ma=/^(\d{1,2})-([A-Za-z]{3,9})-(\d{2,4})$/i.exec(s);
  if(ma){
    var mo=mons[String(ma[2]).toLowerCase().slice(0,3)];
    if(mo){
      var yr=String(ma[3]).length===2?('20'+ma[3]):ma[3];
      return yr+'-'+mo+'-'+String(ma[1]).padStart(2,'0');
    }
  }
  var m=/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/.exec(s);
  if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  m=/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/.exec(s);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  return s;
}

function importExpenseSchedule(input){
  if(!input.files||!input.files[0]) return;
  if(!window.XLSX){alert('XLSX library not loaded.');input.value='';return;}
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var buf=new Uint8Array(e.target.result);
      var wb=XLSX.read(buf,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(rows.length<2){alert('No data rows in expense file.');return;}
      var hdr=rows[0].map(function(c){ return String(c||'').toLowerCase().trim(); });
      function colIdx(names){
        for(var i=0;i<hdr.length;i++){
          for(var j=0;j<names.length;j++){
            if(hdr[i]===names[j]||hdr[i].indexOf(names[j])>=0) return i;
          }
        }
        return -1;
      }
      var iDa=colIdx(['date']), iAm=colIdx(['amount']), iDe=colIdx(['description','desc']), iCa=colIdx(['category','l3','l3 code','cost head','code']), iCC=colIdx(['cost centre','cost center','unit','cc']);
      if(iDa<0) iDa=0;
      if(iAm<0) iAm=1;
      if(iDe<0) iDe=2;
      if(iCa<0) iCa=3;
      if(iCC<0) iCC=4;
      var cfg=getCF(_curPid);
      var added={landSchedule:0,nocSchedule:0,consultantSchedule:0,regulatoryConsultingSchedule:0,constructionSchedule:0,marketingSchedule:0};
      var skippedGA=0;
      function pushSk(sk,o){
        if(!cfg[sk]) cfg[sk]=[];
        cfg[sk].push(o);
        added[sk]++;
      }
      rows.slice(1).forEach(function(r){
        var dateRaw=r[iDa], amount=parseFloat(r[iAm])||0, desc=(r[iDe]||'').toString().trim(), catRaw=(r[iCa]||'').toString().trim(), cc=(r[iCC]||'').toString().trim();
        if(!amount) return;
        var iso=normalizeToISODate(dateRaw);
        var cat=catRaw.toLowerCase();
        var g=null;
        if(typeof GA_ACCT_L3_BY_CODE!=='undefined' && GA_ACCT_L3_BY_CODE){
          var t3=catRaw.trim();
          g=GA_ACCT_L3_BY_CODE[t3]||lookupGAAccountingByLedgerName(t3.split(/[\s|]+/)[0]);
        }
        if(g){
          var sk=legacyCat1ToExpenseScheduleKey(g.legacyCat1);
          if(!sk){
            skippedGA++;
            return;
          }
          if(sk==='constructionSchedule'||sk==='marketingSchedule'){
            var o={amount:amount,costCentre:cc,desc:desc||g.l3Name||g.desc};
            if(iso){ o.date=iso; o.month=dateToProjectMonth(cfg.startDate||'',iso); }
            else o.month=1;
            pushSk(sk,o);
          } else {
            pushSk(sk,{date:iso||'',amount:amount,desc:desc||g.l3Name||g.desc,costCentre:cc});
          }
          return;
        }
        if(cat.indexOf('land')>=0||(cat.indexOf('partner')>=0&&cat.indexOf('buyout')>=0)){
          pushSk('landSchedule',{date:iso||'',amount:amount,desc:desc,costCentre:cc});
        } else if(cat.indexOf('noc')>=0||cat.indexOf('approval')>=0||cat.indexOf('statutory')>=0){
          pushSk('nocSchedule',{date:iso||'',amount:amount,desc:desc,costCentre:cc});
        } else if(cat.indexOf('regulatory')>=0){
          pushSk('regulatoryConsultingSchedule',{date:iso||'',amount:amount,desc:desc,costCentre:cc});
        } else if(cat.indexOf('consult')>=0){
          pushSk('consultantSchedule',{date:iso||'',amount:amount,desc:desc,costCentre:cc});
        } else if(cat.indexOf('construct')>=0||cat.indexOf('civil')>=0){
          var co={amount:amount,costCentre:cc,desc:desc};
          if(iso){ co.date=iso; co.month=dateToProjectMonth(cfg.startDate||'',iso); }
          else co.month=1;
          pushSk('constructionSchedule',co);
        } else if(cat.indexOf('market')>=0||cat.indexOf('brand')>=0||cat.indexOf('advert')>=0){
          var mo={amount:amount,costCentre:cc,desc:desc};
          if(iso){ mo.date=iso; mo.month=dateToProjectMonth(cfg.startDate||'',iso); }
          else mo.month=1;
          pushSk('marketingSchedule',mo);
        } else if(cat.indexOf('ga dm')>=0||cat.indexOf('ga-dm')>=0||cat.indexOf('dm fee')>=0||cat.indexOf('g&a')>=0||cat.indexOf('g a')>=0||cat.indexOf('admin')>=0||cat.indexOf('overhead')>=0){
          skippedGA++;
        }
      });
      var n=added.landSchedule+added.nocSchedule+added.consultantSchedule+added.regulatoryConsultingSchedule+added.constructionSchedule+added.marketingSchedule;
      if(!n&&!skippedGA){alert('No rows matched. Use an L3 code from GA Accounting Categories (e.g. I3-2) or legacy text (Land, NOC, …).');return;}
      saveAll();
      renderTab(_curTab);
      refreshProjectCashflowViews();
      var msg='✓ Imported '+n+' expense schedule row(s). Monthly Cashflow and GA Consolidated updated.';
      if(skippedGA) msg+=' ('+skippedGA+' GA DM Fee row(s) skipped — set GA DM Fee monthly / V2 annual fields on this tab.)';
      alert(msg);
    }catch(err){
      alert('Could not read expense file: '+err.message);
    }finally{
      input.value='';
    }
  };
  reader.readAsArrayBuffer(input.files[0]);
}

function importMilestoneTemplate(input){

      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(!rows.length){alert('Template appears empty.');return;}
      var hdr=rows[0].map(function(c){return (c||'').toString().trim().toLowerCase();});
      function colIdx(names){
        for(var i=0;i<hdr.length;i++){
          var h=hdr[i];
          for(var j=0;j<names.length;j++){
            if(h===names[j]||h.indexOf(names[j])>=0) return i;
          }
        }
        return -1;
      }
      var ik=colIdx(['key']), ilab=colIdx(['label']), ipct=colIdx(['percent','%']), icl=colIdx(['construction','linked','y/n']);
      var iAch=colIdx(['achieved date','milestone achieved','actual date','actual']);
      var iTgt=colIdx(['target date','milestone target','payment date','plan date']);
      if(iTgt<0){
        var idLegacy=colIdx(['date']);
        if(idLegacy>=0 && idLegacy!==iAch) iTgt=idLegacy;
      }
      if(ik<0) ik=0;
      if(ilab<0) ilab=1;
      if(ipct<0) ipct=2;
      if(icl<0) icl=3;
      if(iTgt<0) iTgt=4;
      if(iAch<0) iAch=5;
      var dataRows=rows.slice(1);
      var rawPctSum=0;
      dataRows.forEach(function(r){
        var k0=(r[ik]!==undefined&&r[ik]!==null?r[ik]:r[0]);
        k0=(k0||'').toString().trim();
        var l0=(r[ilab]!==undefined&&r[ilab]!==null?r[ilab]:r[1]);

        if(!k0||!l0) return;
        rawPctSum+=Math.abs(parseFloat(r[ipct]!==undefined&&r[ipct]!==null?r[ipct]:r[2])||0);
      });
      // Paradise-style: cells sum to ~1.0 as fractions of GDV (0.1+0.2+…); GA template uses 5,10,… summing to ~100.
      var pctScaleExcelFractions=rawPctSum>0.85&&rawPctSum<=1.05;

      dataRows.forEach(function(r){
        var key=(r[ik]!==undefined&&r[ik]!==null?r[ik]:r[0]);

        var label=(r[ilab]!==undefined&&r[ilab]!==null?r[ilab]:r[1]);

        var pctRaw=r[ipct]!==undefined&&r[ipct]!==null?r[ipct]:r[2];
        var pct=parseFloat(pctRaw)||0;
        if(pctScaleExcelFractions&&pct>0&&pct<=1) pct=pct*100;
        else if(!pctScaleExcelFractions&&pct>0&&pct<1) pct=pct*100;
        var clRaw=r[icl]!==undefined&&r[icl]!==null?r[icl]:r[3];

function slugCRM(s){
  return (s||'').toString().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,48)||'step';
}
function cellToISODateCRM(v){
  if(v===null||v===undefined||v==='') return '';
  if(v instanceof Date && !isNaN(v.getTime())) return v.toISOString().slice(0,10);
  if(typeof v==='number'){
    if(v>20000&&v<100000){
      var epoch=new Date(1899,11,30);
      var dt=new Date(epoch.getTime()+Math.round(v)*86400000);
      if(!isNaN(dt.getTime())) return dt.toISOString().slice(0,10);
    }
    if(v>1e11) return new Date(v).toISOString().slice(0,10);
  }
  return normalizeToISODate(v)||'';
}
function resolvePidForCRM(sheetName, row5name, fileHint){
  var alias={'anantam signature':'P001','anantam signature dump':'P001','waves':'P002','waves dump':'P002','project 04':'P002','avisa':'P003','avisa dump':'P003','project 03':'P003','paradise':'P009','paraadise':'P009','paradise dump':'P009','paraadise dump':'P009','paradise collection':'P009','paradise collection report':'P009'};
  var tryNames=[sheetName,row5name].filter(Boolean);
  if(fileHint){
    var fh=(''+fileHint).replace(/\.(xlsx?|xlsm?|xls)$/i,'').replace(/_/g,' ').trim();
    if(fh){
      tryNames.push(fh);
      tryNames.push(fh.replace(/\s*dump\s*/gi,' ').replace(/\s+/g,' ').trim());
      tryNames.push(fh.replace(/\s+dump\s*$/i,'').trim());
    }
  }
  var t,raw,k,i,pn;
  for(t=0;t<tryNames.length;t++){
    raw=(tryNames[t]+'').trim();
    k=raw.toLowerCase().replace(/\s+/g,' ');
    if(alias[k]&&PROJS.some(function(p){return p.id===alias[k];})) return alias[k];
  }
  for(t=0;t<tryNames.length;t++){
    raw=(tryNames[t]+'').trim().toLowerCase().replace(/\s+/g,' ');
    if(!raw||raw==='sheet1'||raw==='sheet2'||raw==='sheet3') continue;
    for(i=0;i<PROJS.length;i++){
      pn=(PROJS[i].name||'').toLowerCase();
      if(!pn) continue;
      if(pn===raw||raw.indexOf(pn)>=0||pn.indexOf(raw)>=0) return PROJS[i].id;
    }
  }
  return null;
}
/** Parse rupee amounts from CRM dumps (numbers, strings with commas / ₹, Cr/Lakhs text, SheetJS quirks). */
function parseCRMNumber(v){
  if(v===null||v===undefined||v==='') return 0;
  if(typeof v==='object'&&v&&'v' in v) return parseCRMNumber(v.v);
  if(typeof v==='number'&&isFinite(v)) return v;
  if(typeof v==='boolean') return 0;
  var raw=String(v).trim();
  if(!raw) return 0;
  var crM=raw.match(/^([\d,\s.]+)\s*cr(?:ores?)?$/i);
  if(crM){
    var xc=parseFloat(crM[1].replace(/,/g,'').replace(/\s/g,''));
    return isFinite(xc)?xc*1e7:0;
  }
  var lkM=raw.match(/^([\d,\s.]+)\s*(?:lac|lakh|lacs|lakhs)\.?$/i);
  if(lkM){
    var xl=parseFloat(lkM[1].replace(/,/g,'').replace(/\s/g,''));
    return isFinite(xl)?xl*1e5:0;
  }
  var s=raw.replace(/[₹,\s]/g,'').replace(/[^\d.\-eE]/g,'');
  if(!s) return 0;
  var n=parseFloat(s);
  return isFinite(n)?n:0;
}

function normCRMHeader(x){
  return String(x||'').trim().toLowerCase().replace(/\s+/g,' ');
}

/** Map logical columns from header row (handles shifted Agreement / Status columns). */
function crmColumnMapFromHeader(hdr){
  if(!hdr||hdr.length<6) return null;
  var iBuild=-1,iUnit=-1,iType=-1,iClient=-1,iAg=-1,iSt=-1,iBook=-1,c;
  for(c=0;c<hdr.length;c++){
    var h=normCRMHeader(hdr[c]);
    if(iBuild<0&&(h==='building name'||h==='building'||h==='project'||h==='project name')) iBuild=c;
    if(iUnit<0&&(h==='unit'||h==='unit no'||h==='unit number'||h==='flat'||h==='flat no'||h==='flat number')) iUnit=c;
    if(iType<0&&(h==='configuration'||h==='unit type'||h==='config')) iType=c;
    if(iClient<0&&(h==='client'||h==='client name'||h==='customer'||h==='customer name')) iClient=c;
    if(h==='agreement amount') iAg=c;
    else if(h==='status'||h==='type') iSt=c;
    else if(h==='booking date'||h==='date of booking'||h==='booking dt') iBook=c;
  }
  if(iBook<0){
    for(c=0;c<hdr.length;c++){
      var hb=normCRMHeader(hdr[c]);
      if(hb.indexOf('booking')>=0&&hb.indexOf('date')>=0){ iBook=c; break; }
    }
  }
  if(iAg<0){
    for(c=0;c<hdr.length;c++){
      var h2=normCRMHeader(hdr[c]);
      if(h2.indexOf('agreement')>=0&&h2.indexOf('amount')>=0){ iAg=c; break; }
    }
  }
  if(iAg<0){
    for(c=0;c<hdr.length;c++){
      var h3=normCRMHeader(hdr[c]);
      if((h3.indexOf('sale')>=0&&h3.indexOf('value')>=0)||h3==='bsp'||h3.indexOf('agreement value')>=0){ iAg=c; break; }
    }
  }
  if(iBuild<0 && normCRMHeader(hdr[0])==='project') iBuild=0;
  if(iUnit<0) iUnit=1;
  if(iType<0) iType=2;
  if(iClient<0) iClient=3;
  if(iAg<0||iSt<0||iUnit<0) return null;
  return {building:iBuild>=0?iBuild:0,unitNo:iUnit,unitType:iType,client:iClient,booking:iBook,agreement:iAg,status:iSt,milestoneStart:iSt+1};
}

function findCRMHeaderRow(rows){
  for(var r=0;r<rows.length;r++){
    var map=crmColumnMapFromHeader(rows[r]);
    if(map) return {hi:r,map:map};
  }
  return null;
}

function crmMaxCol(rows, hi, msStart){
  var mx=(rows[hi]&&rows[hi].length)||0;
  var r;
  for(r=hi+1;r<rows.length;r++){
    var rw=rows[r];
    if(!rw) continue;
    if(rw.length>mx) mx=rw.length;
  }
  return Math.max(mx, msStart+1);
}

/** Add months to YYYY-MM (calendar). */
function addMonthsToYM(ym, add){
  if(!ym||add===0) return ym||'';
  var p=ym.split('-');
  if(p.length<2) return ym;
  var d=new Date(+p[0],+p[1]-1+add,1);
  if(isNaN(d.getTime())) return ym;
  return d.toISOString().slice(0,7);
}

function parseCRMPostSalesRows(rows, cfg){
  var head=findCRMHeaderRow(rows);
  if(!head) return null;
  var hi=head.hi,col=head.map;
  var hdr=rows[hi];
  var msStart=col.milestoneStart;
  var maxC=crmMaxCol(rows, hi, msStart);
  var timeRow=null;
  var tr,rw,pr,r,d0,lab,c,agr,book,installments,sumRecv,recv,pend,dt,unitNo,u,building,dueR,recvR,pendR,datesR,agr0,dueAmt,pct;
  var audit={units:0,agreement:0,due:0,received:0,pending:0};
  var stNeed=function(row,need){
    var t=normCRMHeader(row&&row[col.status]);
    return t===need||(need==='amount due'&&(t==='due amount'||t==='amt due'))||
      (need==='amount received'&&t.indexOf('received')>=0&&t.indexOf('pending')<0)||
      (need==='amount pending'&&t.indexOf('pending')>=0);
  };
  var isCRMDateRow=function(row){
    if(!row||row.length<=col.status) return false;
    var t=normCRMHeader(row[col.status]);
    return t==='dates'||t==='date'||t==='payment dates'||t==='due date'||t.indexOf('due date')>=0||
      (t.indexOf('date')>=0&&t.indexOf('received')<0&&t.indexOf('pending')<0&&t.indexOf('amount')<0);
  };
  function isTokenHeader(lbl){
    var h=String(lbl||'').trim().toLowerCase().replace(/\s+/g,'');
    return h==='token'||h.indexOf('token')>=0;
  }
  function isInstallmentHeader(lbl){
    var h=String(lbl||'').trim().toLowerCase().replace(/\s+/g,'');
    return /^installment\d+$/.test(h);
  }
  // Business rule: scope CRM schedule from Token through Installment columns.
  // This naturally excludes GST / stamp duty / maintenance and other post-agreement charges.
  var stageStartCol=msStart, stageEndCol=maxC-1, cScan;
  for(cScan=msStart;cScan<maxC;cScan++){
    if(isTokenHeader(hdr[cScan])){ stageStartCol=cScan; break; }
  }
  var lastInstallmentCol=-1;
  for(cScan=msStart;cScan<maxC;cScan++){
    if(isInstallmentHeader(hdr[cScan])) lastInstallmentCol=cScan;
  }
  if(lastInstallmentCol>=stageStartCol) stageEndCol=lastInstallmentCol;
  var achievedByKey={};
  function mergeAchievedDateForLabel(lab, iso){
    if(!cfg||!iso) return;
    var ms=findMilestoneDefForHeader(cfg, lab);
    if(!ms||!ms.key) return;
    var prev=achievedByKey[ms.key]||'';
    if(!prev||iso<prev) achievedByKey[ms.key]=iso;
  }
  for(tr=Math.max(0,hi-5);tr<hi;tr++){
    rw=rows[tr];
    if(rw&&normCRMHeader(rw[col.status])==='timeline'){ timeRow=rw; break; }
  }
  var hasTimeline=false;
  if(timeRow){
    for(c=msStart;c<maxC;c++){
      if(cellToISODateCRM(timeRow[c])){ hasTimeline=true; break; }
    }
  }
  var projName='';
  for(pr=0;pr<Math.min(hi,16);pr++){
    rw=rows[pr];
    if(rw&&normCRMHeader(rw[0])==='project name'){ projName=(rw[1]||'').toString().trim(); break; }
  }
  var units=[];
  for(r=hi+1;r<rows.length;){
    dueR=rows[r];
    if(!dueR||dueR.length<=Math.max(col.agreement,col.status)) break;
    if(!stNeed(dueR,'amount due')){ r++; continue; }
    building=(dueR[col.building]||'').toString().trim();
    u=(dueR[col.unitNo]||'').toString().trim();
    if(!u && !building){ r++; continue; }
    recvR=rows[r+1]||[];
    pendR=rows[r+2]||[];
    if(!stNeed(recvR,'amount received')||!stNeed(pendR,'amount pending')){
      r++;
      continue;
    }
    datesR=null;
    var r4=rows[r+3];
    if(r4 && !stNeed(r4,'amount due') && isCRMDateRow(r4)) datesR=r4;
    agr=parseCRMNumber(dueR[col.agreement]);
    book=(col.booking>=0)?(cellToISODateCRM(dueR[col.booking])||''):'';
    if(!book) book=today();
    installments=[];
    sumRecv=0;
    var explicitDatesForUnit=hasTimeline;
    if(datesR){
      for(c=msStart;c<maxC;c++){
        if(cellToISODateCRM(datesR[c])){ explicitDatesForUnit=true; break; }
      }
    }
    var regIso='';
    var maxKnownIso='';
    function plusOneMonthISO(iso){
      var b=normalizeToISODate(iso)||'';
      if(!b) return '';
      var d=new Date(b);
      if(isNaN(d.getTime())) return '';
      d.setMonth(d.getMonth()+1);
      return d.toISOString().slice(0,10);
    }
    function sumInstallDue(arr){
      return (arr||[]).reduce(function(s,it){
        return s + (String(it&&it.label||'').indexOf('(due)')>=0 ? coerceMoney(it.amount) : 0);
      },0);
    }
    for(c=stageStartCol;c<=stageEndCol;c++){
      lab=hdr[c];
      if(lab===undefined||lab===null||String(lab).trim()==='') break;
      var labLow=String(lab).trim().toLowerCase();
      if(labLow==='total agreement'||labLow==='total amount'||(labLow.indexOf('total')===0&&labLow.indexOf('agreement')>=0)) break;
      recv=parseCRMNumber(recvR[c]);
      pend=parseCRMNumber(pendR[c]);
      dueAmt=parseCRMNumber(dueR[c]);
      audit.due+=coerceMoney(dueAmt);
      audit.received+=coerceMoney(recv);
      audit.pending+=coerceMoney(pend);
      sumRecv+=recv;
      dt='';
      if(datesR) dt=cellToISODateCRM(datesR[c])||'';
      if(!dt) dt=timeRow?cellToISODateCRM(timeRow[c]):'';
      var dtIso=normalizeToISODate(dt)||'';
      if(dtIso && (!maxKnownIso || dtIso>maxKnownIso)) maxKnownIso=dtIso;
      var labNorm=String(lab||'').toLowerCase();
      if(!regIso && dtIso && (labNorm.indexOf('agreement')>=0 || labNorm.indexOf('registration')>=0 || labNorm.indexOf('stamp')>=0)){
        regIso=dtIso;
      }
      if(dtIso) mergeAchievedDateForLabel(lab, dtIso);
      if(dueAmt>0) installments.push({date:dt,amount:dueAmt,label:String(lab).trim()+' (due)'});
      if(recv>0) installments.push({date:dt,amount:recv,label:String(lab).trim()+' (received)'});
      if(pend>0) installments.push({date:dt,amount:pend,label:String(lab).trim()+' (pending)'});
    }
    var dueTotal=sumInstallDue(installments);
    if(agr>0 && dueTotal<agr){
      var bal=agr-dueTotal;
      if(bal>1){
        var balDate=regIso||plusOneMonthISO(book)||maxKnownIso||book||today();
        installments.push({date:balDate,amount:bal,label:'Balance to Agreement (due)'});
      }
    }
    installments=applyCRMFutureSchedule(installments, book, explicitDatesForUnit);
    unitNo=(building?building+' ':'')+u;
    units.push({
      unitNo:unitNo,
      unitType:(dueR[col.unitType]||'').toString().trim(),
      clientName:(dueR[col.client]||'').toString().trim(),
      building:building,
      totalValue:agr,
      bookingDate:book,
      receivedToDate:sumRecv,
      installments:installments
    });
    audit.units++;
    audit.agreement+=coerceMoney(agr);
    r+=datesR?4:3;
  }
  var milestoneDefs=[];
  if(units.length){
    d0=rows[hi+1];
    agr0=parseCRMNumber(d0[col.agreement]);
    for(c=stageStartCol;c<=stageEndCol;c++){
      lab=hdr[c];
      if(lab===undefined||lab===null||String(lab).trim()==='') break;
      var labLow2=String(lab).trim().toLowerCase();
      if(labLow2==='total agreement'||labLow2==='total amount'||(labLow2.indexOf('total')===0&&labLow2.indexOf('agreement')>=0)) break;
      dueAmt=parseCRMNumber(d0[c]);
      pct=agr0>0?(100*dueAmt/agr0):0;
      milestoneDefs.push({key:'crm_'+slugCRM(lab)+'_'+c,label:String(lab).trim(),pct:Math.round(pct*10000)/10000,constLink:c>msStart});
    }
  }
  return {units:units,milestoneDefs:milestoneDefs,achievedByKey:achievedByKey,projectLabel:projName,audit:audit};
}

function importCRMPostSalesWorkbook(input){
  if(!input.files||!input.files[0]) return;
  if(!window.XLSX){alert('XLSX library not loaded.');input.value='';return;}
  var fileNameHint=input.files[0].name||'';
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array',cellDates:true});
      var skip={'instructions':1,'consolidated view':1};
      var done=0,msgs=[],pidCleared={},pidAudit={};
      wb.SheetNames.forEach(function(sn){
        var low=sn.toLowerCase().trim();
        if(skip[low]) return;
        var ws=wb.Sheets[sn];
        if(!ws) return;
        var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
        var parsedLite=parseCRMPostSalesRows(rows, null);
        if(!parsedLite||!parsedLite.units.length) return;
        var pid=resolvePidForCRM(sn,parsedLite.projectLabel,fileNameHint);
        if(!pid && _curPid){
          pid=_curPid;
          msgs.push(sn+' → using selected project '+pid+' (auto-match not found)');
        }
        if(!pid){ msgs.push(sn+': parsed '+parsedLite.units.length+' units, but no matching project — select a project in top bar, or use a workbook/file name that includes the project name, sync V3, or add a manual project whose name matches.'); return; }
        var cfg=getCF(pid);
        var parsed=parseCRMPostSalesRows(rows, cfg);
        if(!parsed||!parsed.units.length) return;
        if(!pidCleared[pid]){
          if(!Array.isArray(cfg.units)) cfg.units=[];
          pidCleared[pid]=1;
        }
        if(!pidAudit[pid]) pidAudit[pid]={sheets:0,units:0,agreement:0,due:0,received:0,pending:0};
        function normUnitNo(x){
          return String(x||'').trim().toLowerCase().replace(/\s+/g,' ');
        }
        var importedSoldSet={};
        var hmeta=getProjectHierarchy(pid);
        parsed.units.forEach(function(ux){
          var incoming=normUnitNo(ux.unitNo);
          importedSoldSet[incoming]=1;
          // Overwrite mode: drop any existing row for the same unit (manual/import/legacy).
          cfg.units=cfg.units.filter(function(ex){
            return normUnitNo(ex&&ex.unitNo)!==incoming;
          });
          var id=uid();
          cfg.units.push({
            id:id,
            unitNo:ux.unitNo,
            unitType:ux.unitType,
            totalValue:coerceMoney(ux.totalValue),
            bookingDate:normalizeToISODate(ux.bookingDate)||ux.bookingDate,
            payType:'install',
            receivedToDate:coerceMoney(ux.receivedToDate),
            clientName:ux.clientName,
            projectGroup:hmeta.projectGroup,
            phase:hmeta.phase,
            building:(ux.building||hmeta.building),
            source:'crm-import',
            paymentIssueStatus:'ok',expectedAgreementDate:'',
            milestonesDates:{},
            installments:(ux.installments||[]).map(function(ins){
              return {date:ins.date,amount:coerceMoney(ins.amount),label:ins.label};
            })
          });
        });
        if(Array.isArray(cfg.unsoldUnits)){
          cfg.unsoldUnits=cfg.unsoldUnits.filter(function(u){
            return !importedSoldSet[normUnitNo(u&&u.unitNo)];
          });
        }
        var ad=parsed.audit||{};
        pidAudit[pid].sheets++;
        pidAudit[pid].units+=coerceMoney(ad.units);
        pidAudit[pid].agreement+=coerceMoney(ad.agreement);
        pidAudit[pid].due+=coerceMoney(ad.due);
        pidAudit[pid].received+=coerceMoney(ad.received);
        pidAudit[pid].pending+=coerceMoney(ad.pending);
        // Keep existing milestone setup from template/user edits.
        // Only merge achieved dates learned from CRM due-date rows.
        if(!cfg.milestonesAchievedDates) cfg.milestonesAchievedDates={};
        Object.keys(parsed.achievedByKey||{}).forEach(function(k){
          var iso=normalizeToISODate(parsed.achievedByKey[k])||'';
          if(iso) cfg.milestonesAchievedDates[k]=iso;
        });
        done++;
        msgs.push(sn+' → '+pid+' · '+parsed.units.length+' units');
      });
      if(!done){
        var extra=msgs.length?('\n\nDetails:\n- '+msgs.join('\n- ')):'';
        alert('No CRM units imported. The workbook may not match expected structure, or project mapping failed.\nExpected: header with Building/Project + Agreement Amount + Status/Type and 3-line Amount Due / Received / Pending blocks (optional 4th Dates/Due Date row).'+extra);
        input.value='';
        return;
      }
      saveAll();
      buildProjSelect();
      renderAll();
      refreshProjectCashflowViews();
      var integrity=[];
      Object.keys(pidAudit).forEach(function(pid){
        var a=pidAudit[pid];
        var gap=Math.abs((a.due||0)-((a.received||0)+(a.pending||0)));
        integrity.push(pid+': sheets '+a.sheets+', units '+a.units+', Ag '+cr(a.agreement,'₹0')+', Due '+cr(a.due,'₹0')+', Rec '+cr(a.received,'₹0')+', Pend '+cr(a.pending,'₹0')+(gap>1?' ⚠ Due≠Rec+Pend by '+cr(gap,'₹0'):''));
      });
      alert('CRM Post-Sales import done.\n\n'+msgs.join('\n')+(integrity.length?'\n\nIntegrity check:\n- '+integrity.join('\n- '):''));
    }catch(err){
      alert('CRM import failed: '+err.message);
    }finally{
      input.value='';
    }
  };
  reader.readAsArrayBuffer(input.files[0]);
}

function loadScriptWithFallback(urls, done){
  var i=0;
  function tryNext(){
    if(i>=urls.length){ done(new Error('Unable to load script from all sources.')); return; }
    var s=document.createElement('script');
    s.src=urls[i++];
    s.async=true;
    s.onload=function(){ done(null); };
    s.onerror=function(){ tryNext(); };
    document.head.appendChild(s);
  }
  tryNext();
}

function formatCr(v){
  if(!v&&v!==0) return '—';
  var a=Math.abs(v), s=v<0?'-':'';
  if(a>=10000000) return s+'₹'+(a/10000000).toFixed(2)+' Cr';
  if(a>=100000)   return s+'₹'+(a/100000).toFixed(1)+' L';
  return s+'₹'+a.toLocaleString('en-IN');
}

// Capital structure template download/upload
function dlCapitalTemplate(){
  if(!window.XLSX){alert('XLSX library not loaded.');return;}
  var cfg=getCF(_curPid);
  var data=[['Type','Name / Party','Amount (₹)','Draw Date / Month#','Rate %','Term (Yrs)','Notes']];
  (cfg.investors||[]).forEach(function(i){data.push(['Equity/Investor',i.name,i.amount,'Month '+i.drawMonth,i.ratePct,i.termYrs,'']);});
  (cfg.unsecuredLoans||[]).forEach(function(u){data.push(['Unsecured Loan',u.name,u.amount,u.drawDate,u.ratePct,'','']);});
  (cfg.customerUL||[]).forEach(function(c){data.push(['Customer UL',c.name,c.amount,c.date,'','','']);});
  (cfg.otherInflows||[]).forEach(function(o){data.push(['Other Inflow',o.name,o.amount,o.date,'','',o.note]);});
  var wb=XLSX.utils.book_new();
  var ws=XLSX.utils.aoa_to_sheet(data);
  ws['!cols']=[{wch:16},{wch:28},{wch:16},{wch:16},{wch:8},{wch:8},{wch:30}];
  XLSX.utils.book_append_sheet(wb,ws,'Capital Structure');
  XLSX.writeFile(wb,'GA_Capital_Template_'+(_curPid||'proj')+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

function importCapitalTemplate(input){
  if(!input.files||!input.files[0]) return;
  if(!window.XLSX){alert('XLSX library not loaded.');input.value='';return;}
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(!rows.length){alert('Template appears empty.');return;}
      var cfg=getCF(_curPid);
      cfg.investors=[];
      cfg.unsecuredLoans=[];
      cfg.customerUL=[];
      cfg.otherInflows=[];
      var header=rows[0].map(function(h){return (h||'').toString().toLowerCase();});
      var iType=header.indexOf('type');
      var iName=header.indexOf('name / party');
      var iAmt=header.indexOf('amount (₹)');
      if(iAmt<0) iAmt=header.indexOf('amount');
      var iDraw=header.indexOf('draw date / month#');
      if(iDraw<0) iDraw=header.indexOf('draw date');
      var iRate=header.indexOf('rate %');
      var iTerm=header.indexOf('term (yrs)');
      var iNote=header.indexOf('notes');
      rows.slice(1).forEach(function(r){
        var t=(r[iType]||'').toString().toLowerCase();
        var name=(r[iName]||'').toString().trim();
        var amt=parseFloat((r[iAmt]||'').toString().replace(/,/g,''))||0;
        if(!name||!amt) return;
        if(t.indexOf('unsecured')>=0){
          cfg.unsecuredLoans.push({
            id:uid(),
            name:name,
            amount:amt,
            drawDate:(r[iDraw]||'').toString().trim(),
            ratePct:parseFloat(r[iRate])||0
          });
        }else if(t.indexOf('customer ul')>=0){
          cfg.customerUL.push({
            id:uid(),
            name:name,
            amount:amt,
            date:(r[iDraw]||'').toString().trim()
          });
        }else if(t.indexOf('other inflow')>=0){
          cfg.otherInflows.push({
            id:uid(),
            name:name,
            amount:amt,
            date:(r[iDraw]||'').toString().trim(),
            note:(iNote>=0?(r[iNote]||'').toString().trim():'')
          });
        }else{
          // Equity / Investor
          var drawRaw=(r[iDraw]||'').toString().trim();
          var drawMonth=parseInt(drawRaw.replace(/\D/g,''),10)||1;
          var rate=parseFloat(r[iRate])||18;
          var term=parseFloat(r[iTerm])||2;
          cfg.investors.push({
            id:uid(),
            name:name,
            amount:amt,
            drawMonth:drawMonth,
            ratePct:rate,
            termYrs:term,
            type:(t.indexOf('equity')>=0?'equity':'investor')
          });
        }
      });
      saveAll();
      renderCapital();
      alert('✓ Capital structure updated from template.');
    }catch(err){
      alert('Could not read capital template: '+err.message);
    }finally{
      input.value='';
    }
  };
  reader.readAsArrayBuffer(input.files[0]);
}

  if(a==='del-sched')              { var dsk=el.dataset.skey, dix=+el.dataset.idx; if(cfg[dsk]&&cfg[dsk][dix]!==undefined){cfg[dsk].splice(dix,1);saveAll();renderTab(_curTab);refreshProjectCashflowViews();} return; }

  if(a==='add-inv')                { if(!cfg.investors)cfg.investors=[]; cfg.investors.push({id:uid(),name:'',amount:0,drawMonth:1,ratePct:el.dataset.type==='equity'?0:18,termYrs:2,type:el.dataset.type||'investor'}); saveAll(); renderCapital(); return; }
  if(a==='del-ul')                 { cfg.unsecuredLoans.splice(+el.dataset.idx,1); saveAll(); renderCapital(); return; }
  if(a==='add-ul')                 { if(!cfg.unsecuredLoans)cfg.unsecuredLoans=[]; cfg.unsecuredLoans.push({id:uid(),name:'',amount:0,drawDate:'',ratePct:0}); saveAll(); renderCapital(); return; }
  if(a==='del-cul')                { cfg.customerUL.splice(+el.dataset.idx,1); saveAll(); renderCapital(); return; }
  if(a==='add-cul')                { if(!cfg.customerUL)cfg.customerUL=[]; cfg.customerUL.push({id:uid(),name:'',amount:0,date:''}); saveAll(); renderCapital(); return; }
  if(a==='del-other')              { cfg.otherInflows.splice(+el.dataset.idx,1); saveAll(); renderCapital(); return; }
  if(a==='add-other')              { if(!cfg.otherInflows)cfg.otherInflows=[]; cfg.otherInflows.push({id:uid(),name:'',amount:0,date:'',note:''}); saveAll(); renderCapital(); return; }
  if(a==='add-dt')                 { if(!cfg.debtTranches)cfg.debtTranches=[]; cfg.debtTranches.push({id:'D'+(cfg.debtTranches.length+1).toString().padStart(2,'0'),lender:'',drawAmount:0,drawDate:'',ratePct:12,repaySchedule:[]}); saveAll(); renderDebt(); return; }
  if(a==='del-dt')                 { cfg.debtTranches.splice(+el.dataset.idx,1); saveAll(); renderDebt(); return; }
  if(a==='add-repay')              { var dt=cfg.debtTranches[+el.dataset.idx]; if(dt){if(!dt.repaySchedule)dt.repaySchedule=[];dt.repaySchedule.push({month:1,amount:0,dueDate:''});}saveAll();renderDebt();return;}
  if(a==='del-repay')              { cfg.debtTranches[+el.dataset.dtidx].repaySchedule.splice(+el.dataset.ridx,1); saveAll(); renderDebt(); return; }
  if(a==='add-sched'){
    var sk=el.dataset.skey;
    if(!cfg[sk]) cfg[sk]=[];
    if(sk==='constructionSchedule'||sk==='marketingSchedule') cfg[sk].push({month:1,amount:0,costCentre:'',date:'',planDate:'',desc:''});
    else if(sk==='consultantSchedule'||sk==='regulatoryConsultingSchedule') cfg[sk].push({date:'',planDate:'',amount:0,desc:'',costCentre:''});
    else cfg[sk].push({date:'',planDate:'',amount:0,desc:'',costCentre:''});
    saveAll(); renderExpenses(); refreshProjectCashflowViews(); return;
  }
}, true);

document.addEventListener('change',function(e){
  var el=e.target; var a=el.dataset.action;
  if(a==='narration-cf-only'){ _narrationCfOnly=!!el.checked; if(_curTab==='expenses' && _expenseUIPanel==='narration') renderExpenses(); return; }
  if(a==='toggle-prior-years'){ setShowPriorCalendarYears(!!el.checked); renderAll(); return; }
  if(a==='sales-search'){ _salesSearchQuery=String(el.value||''); renderSalesKeepViewport(); return; }
  if(a==='expense-vendor-search'){
    _expenseVendorSearch=String(el.value||'');
    if(_expenseVendorSearchTimer) clearTimeout(_expenseVendorSearchTimer);
    _expenseVendorSearchTimer=setTimeout(function(){
      _expenseVendorSearchTimer=null;
      if(_curTab==='expenses' && _expenseUIPanel==='gst-vendor') renderExpenses();
    }, 320);
    return;
  }
  if(a==='expense-ledger-cat-search'){
    _expenseLedgerCatQ=String(el.value||'');
    if(_expenseLedgerCatTimer) clearTimeout(_expenseLedgerCatTimer);
    _expenseLedgerCatTimer=setTimeout(function(){
      _expenseLedgerCatTimer=null;
      if(_curTab==='expenses' && _expenseUIPanel==='gst-vendor') renderExpenses();
    }, 320);
    return;
  }
  if(a==='post-sales-delay'){ _postSalesDelayMo=parseInt(el.value,10)||0; renderSales(); return; }
  var cfg=_curPid?getCF(_curPid):null;
  if(!a||!cfg) return;
  var v=el.value, n=parseFloat(v)||0;
  var isNum=['amount','drawMonth','ratePct','termYrs','drawAmount','month','contingencyPct','gaMonthly','gaGAAnnual','gaMktgAnnual'];
  if(a==='set-milestone')          { if(!cfg.milestonesDates)cfg.milestonesDates={}; cfg.milestonesDates[el.dataset.key]=v; saveAll(); renderTab(_curTab); refreshProjectCashflowViews(); return; }
  if(a==='set-milestone-achieved'){ if(!cfg.milestonesAchievedDates)cfg.milestonesAchievedDates={}; cfg.milestonesAchievedDates[el.dataset.key]=v; saveAll(); renderTab(_curTab); return; }
  if(a==='set-inv-proj')           { if(!cfg.inventoryProjection)cfg.inventoryProjection={}; cfg.inventoryProjection[el.dataset.key]=parseFloat(v)||0; saveAll(); renderSales(); refreshProjectCashflowViews(); return; }
  if(a==='unsold-pace-mode')      { ensureUnsoldPaceCfg(cfg); cfg.unsoldPace.mode=el.value==='units'?'units':'sqft'; saveAll(); renderSales(); refreshProjectCashflowViews(); return; }
  if(a==='unsold-pace-period')   { ensureUnsoldPaceCfg(cfg); cfg.unsoldPace.inputPeriod=el.value==='quarter'?'quarter':'month'; saveAll(); renderSales(); refreshProjectCashflowViews(); return; }
  if(a==='unsold-pace-value')    { ensureUnsoldPaceCfg(cfg); cfg.unsoldPace.value=parseFloat(v)||0; saveAll(); renderSales(); refreshProjectCashflowViews(); return; }
  if(a==='unit-pay-health'){
    var uix=+el.dataset.idx;
    if(!Array.isArray(cfg.units)||cfg.units[uix]===undefined) return;
    cfg.units[uix].paymentIssueStatus=v;
    if(normalizeUnitPaymentStatus(cfg.units[uix])!=='agreement_pending') cfg.units[uix].expectedAgreementDate='';
    saveAll(); renderSalesKeepViewport(); refreshProjectCashflowViews(); return;
  }
  if(a==='unit-exp-agreement'){
    var uixA=+el.dataset.idx;
    if(!Array.isArray(cfg.units)||cfg.units[uixA]===undefined) return;
    if(normalizeUnitPaymentStatus(cfg.units[uixA])!=='agreement_pending') return;
    cfg.units[uixA].expectedAgreementDate=normalizeToISODate(v)||'';
    saveAll(); renderSalesKeepViewport(); refreshProjectCashflowViews(); return;
  }
  if(a==='unsold-edit'){
    var idx=+el.dataset.idx, key=el.dataset.key||'';
    if(!Array.isArray(cfg.unsoldUnits)||!cfg.unsoldUnits[idx]) return;
    var uu=cfg.unsoldUnits[idx];
    if(key==='projectedSaleDate') uu.projectedSaleDate=normalizeToISODate(v)||'';
    else if(key==='saleableArea'||key==='plannedRatePerSqft'||key==='plannedSaleValue'||key==='projectedSalePerMonth'){
      uu[key]=parseFloat(v)||0;
    } else uu[key]=v;
    var area=coerceMoney(uu.saleableArea), rate=coerceMoney(uu.plannedRatePerSqft);
    if((!coerceMoney(uu.plannedSaleValue))&&area>0&&rate>0) uu.plannedSaleValue=area*rate;
    uu.totalValue=coerceMoney(uu.plannedSaleValue)||0;
    if(coerceMoney(uu.projectedSalePerMonth)>0) uu.projectedSaleDate='';
    uu.expectedMonth=(cfg.startDate&&uu.projectedSaleDate)?dateToProjectMonth(cfg.startDate,uu.projectedSaleDate):'';
    saveAll(); renderSalesKeepViewport(); refreshProjectCashflowViews(); return;
  }
  if(a==='forecast-set'){
    if(!cfg.forecast) cfg.forecast={salesFactor:1,collectionsFactor:1,otherInflowFactor:1,costFactor:1,marketingFactor:1,gaFactor:1,monthlyBuffer:0};
    var k=el.dataset.key||'';
    var vv=(el.dataset.type==='abs')?(parseFloat(v)||0):((parseFloat(v)||100)/100);
    cfg.forecast[k]=vv;
    saveAll(); renderCashflow(); refreshProjectCashflowViews(); return;
  }
  if(a==='upd-cfg')                { cfg[el.dataset.key]=isNum.indexOf(el.dataset.key)>=0?n:v; saveAll(); renderTab(_curTab); refreshProjectCashflowViews(); return; }
  if(a==='upd-inv')                { var inv=cfg.investors[+el.dataset.idx]; if(inv){inv[el.dataset.key]=isNum.indexOf(el.dataset.key)>=0?n:v;} saveAll(); return; }
  if(a==='upd-ul'){
    var ul=cfg.unsecuredLoans[+el.dataset.idx];
    if(ul){
      var uk=el.dataset.key||'';
      if(uk==='drawDate') ul.drawDate=normalizeToISODate(v)||'';
      else ul[uk]=isNum.indexOf(uk)>=0?n:v;
    }
    saveAll(); renderCapital(); return;
  }
  if(a==='upd-cul'){
    var cu=cfg.customerUL[+el.dataset.idx];
    if(cu){
      var ck=el.dataset.key||'';
      if(ck==='date') cu.date=normalizeToISODate(v)||'';
      else cu[ck]=isNum.indexOf(ck)>=0?n:v;
    }
    saveAll(); renderCapital(); return;
  }
  if(a==='upd-other'){
    var oi=cfg.otherInflows[+el.dataset.idx];
    if(oi){
      var ok=el.dataset.key||'';
      if(ok==='date') oi.date=normalizeToISODate(v)||'';
      else oi[ok]=isNum.indexOf(ok)>=0?n:v;
    }
    saveAll(); renderCapital(); return;
  }
  if(a==='upd-dt'){
    var dt2=cfg.debtTranches[+el.dataset.idx];
    if(dt2){
      var dk=el.dataset.key||'';
      if(dk==='drawDate') dt2.drawDate=normalizeToISODate(v)||'';
      else dt2[dk]=isNum.indexOf(dk)>=0?n:v;
    }
    saveAll(); renderDebt(); return;
  }
  if(a==='upd-repay'){
    var rs=cfg.debtTranches[+el.dataset.dtidx]&&cfg.debtTranches[+el.dataset.dtidx].repaySchedule[+el.dataset.ridx];
    if(rs){
      var rk=el.dataset.key||'';
      if(rk==='dueDate') rs.dueDate=normalizeToISODate(v)||'';
      else if(rk==='month') rs.month=parseInt(v,10)||0;
      else rs[rk]=n;
    }
    saveAll(); renderDebt(); return;
  }
  if(a==='upd-sched'){
    var sc=cfg[el.dataset.skey];
    if(sc&&sc[+el.dataset.idx]){
      var skk=el.dataset.key||'';
      if(skk==='date'||skk==='planDate') sc[+el.dataset.idx][skk]=normalizeToISODate(v)||'';
      else if(skk==='month') sc[+el.dataset.idx].month=parseInt(v,10)||0;
      else sc[+el.dataset.idx][skk]=isNum.indexOf(skk)>=0?n:v;
    }
    saveAll(); renderTab(_curTab); refreshProjectCashflowViews(); return;
  }
  if(a==='upd-sched-mo')           { var sc2=cfg[el.dataset.skey]; if(sc2&&sc2[+el.dataset.idx]){sc2[+el.dataset.idx][el.dataset.key]=n;} saveAll(); renderTab(_curTab); refreshProjectCashflowViews(); return; }
});

(function gaApplyProjectFromUrl(){
  try{
    var q=new URLSearchParams(window.location.search||'');
    var p=q.get('project')||q.get('pid')||'';
    if(!p){
      var h=(window.location.hash||'').replace(/^#/,'');
      if(h.indexOf('project=')===0) p=decodeURIComponent(h.slice(9).split('&')[0]||'');
    }
    p=String(p||'').trim();
    if(p&&PROJS.some(function(x){return String(x.id)===p;})) selectProj(p);
  }catch(e){}
})();
setInterval(function(){
  var raw=localStorage.getItem('ga_rp_projects');
  if(raw&&raw!==_lastProjHash){
    try{var pp=JSON.parse(raw);if(pp&&pp.length){
      var v3ids=pp.map(function(p){return p.id;});
      PROJS=PROJS.filter(function(p){return p._manual&&!v3ids.includes(p.id);});
      pp.forEach(function(p){PROJS.push(p);});
      _lastProjHash=raw;
      PROJS.forEach(function(p){var d=getCF(p.id);d.projName=p.name;if(p._projMonths)d.totalMonths=p._projMonths;});
      buildProjectGroupSelect();
      buildPhaseSelect();
      buildBuildingSelect();
      ensureCurrentProjectVisible();
      readV2Costs();
      buildProjSelect(); renderAll(); setSS('Synced '+pp.length+' project(s)','green');
    }}catch(e){}
  }
  // Also check V2 cost push
  var v2raw=localStorage.getItem('ga_v2_proj_costs');
  if(v2raw) readV2Costs();
},2000);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GA Cashflow Tracker V2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundled.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script src="ga_accounting_categories_parser.js"></script>
<script src="ga_accounting_categories.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4FA;--card:#fff;--border:#DDE2EA;--muted:#6B7280;
  --blue:#1558A0;--blue-b:#0A3266;--blue-l:#EBF4FF;
  --green:#1A7244;--green-l:#E8F6EE;--green-b:#0D4D30;
  --red:#A8301E;--red-l:#FEECEC;--red-b:#7B1D1D;
  --gold:#A07800;--gold-l:#FDF8EC;--teal:#0B7070;--teal-l:#E6F7F7;
  --purple:#542B8A;--purple-l:#F3EEFF;--purple-b:#3B1D6E;
  --orange:#B54D0A;--orange-l:#FEF0E5;--slate:#4A5568;--text:#1A202C;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:12px}
.hidden{display:none!important}
/* Top bar */
#topbar{background:linear-gradient(90deg,#0A3266,#1558A0);color:#fff;padding:0 14px;display:flex;align-items:center;gap:4px;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.3);flex-wrap:wrap;min-height:46px}
#topbar .logo{font-size:14px;font-weight:800;padding:0 14px 0 0;border-right:1px solid rgba(255,255,255,.2);margin-right:4px;white-space:nowrap}
.tab-btn{background:none;border:none;color:rgba(255,255,255,.7);padding:12px 11px;cursor:pointer;font-size:11px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab-btn.on{color:#fff;border-bottom-color:#62C5FF}
.tab-btn:hover{color:#fff}
.planning-wrap{position:relative;display:inline-flex;align-self:stretch;align-items:stretch}
.planning-wrap .tab-btn{padding-right:8px}
.planning-menu{position:absolute;top:100%;left:0;min-width:200px;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:300;padding:6px 0;margin-top:2px}
.planning-menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:10px 14px;font-size:11px;font-weight:600;color:var(--blue-b);cursor:pointer}
.planning-menu button:hover{background:var(--blue-l)}
.planning-menu button.on{background:var(--blue-l);color:var(--blue);border-left:3px solid var(--blue)}
.planning-menu .planning-menu-hdr{font-size:9px;font-weight:700;color:var(--muted);padding:6px 14px 4px;letter-spacing:.06em;text-transform:uppercase}
/* Sync bar */
#sync-bar{background:var(--blue-l);border-bottom:1.5px solid var(--border);padding:8px 14px;display:flex;flex-direction:column;align-items:stretch;gap:8px;font-size:10px}
#sync-bar-row1{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
#sync-bar-row2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:2px;border-top:1px solid var(--border)}
/* Pages */
.page{padding:12px 14px;max-width:1800px;margin:0 auto}
/* Cards */
.card{background:var(--card);border-radius:8px;border:1.5px solid var(--border);padding:12px 14px;margin-bottom:10px}
/* KPI row */
.kpi-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kpi{flex:1;min-width:100px;background:var(--card);border-radius:8px;padding:10px 12px;border:1.5px solid var(--border)}
/* Buttons */
.btn{padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:700;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-b)}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:var(--card);color:var(--blue-b);border:1.5px solid var(--border)}
.btn-outline:hover{border-color:var(--blue)}
.btn-red{background:var(--red);color:#fff}
/* Cashflow table */
.cf-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);box-shadow:0 4px 24px rgba(10,50,102,.06);background:var(--card)}
.cf-tbl{border-collapse:separate;border-spacing:0;width:100%;min-width:2000px;font-size:12px;line-height:1.35}
.cf-tbl thead th{background:#1A2744;color:#fff;padding:8px 9px;text-align:right;white-space:nowrap;font-size:11px;font-weight:700;position:sticky;top:0;z-index:10;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.cf-tbl thead tr:nth-child(2) th{font-size:10px;font-weight:600;padding:6px 8px}
.cf-tbl thead th:first-child,.cf-tbl thead th:nth-child(2){text-align:left}
.cf-sticky0{position:sticky;left:0;z-index:16;background:var(--card);min-width:38px;text-align:left!important;box-shadow:1px 0 0 var(--border)}
.cf-sticky1{position:sticky;left:38px;z-index:16;background:var(--card);min-width:56px;max-width:72px;box-shadow:1px 0 0 var(--border)}
.cf-month-narrow{font-size:10px;line-height:1.25;white-space:normal;word-break:break-word;padding:5px 6px!important;font-weight:600;color:var(--blue-b)}
.sales-cur-mo{background:#FFFDE7!important;box-shadow:inset 0 0 0 1px #F59E0B}
.sales-subtab{display:inline-flex;gap:4px;margin-bottom:12px;padding:4px;background:var(--border);border-radius:8px}
.sales-subtab button{border:none;padding:8px 14px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted)}
.sales-subtab button.on{background:#fff;color:var(--blue-b);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ms-milestone-title{word-break:normal;overflow-wrap:break-word;white-space:normal;line-height:1.35;hyphens:auto}
.ps-dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.ps-dash-card{border-radius:10px;padding:12px 14px;border:1.5px solid var(--border);background:linear-gradient(145deg,#fff,#F8FAFC)}
.ps-dash-card h4{margin:0 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ps-dash-card .v{font-size:18px;font-weight:800;color:var(--blue-b)}
.ps-roadmap-wrap{overflow-x:auto;margin:4px 0 0;padding:12px 8px 8px;background:linear-gradient(180deg,#fafcff 0%,#fff 55%);border-radius:12px;border:1px solid var(--border)}
.ps-roadmap-svg{display:block;min-width:760px;width:100%;height:auto;font-family:inherit}
.ps-roadmap-note{font-size:10px;color:var(--muted);line-height:1.45;margin:0 0 10px}
@keyframes ps-road-pulse{0%,100%{opacity:1;filter:drop-shadow(0 0 4px rgba(234,179,8,.9))}50%{opacity:.88;filter:drop-shadow(0 0 10px rgba(234,179,8,.65))}}
.ps-road-here{animation:ps-road-pulse 2.4s ease-in-out infinite}
.sales-grid-wrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:8px}
.sales-grid-wrap thead th{position:sticky;z-index:20;background:#fff}
.sales-grid-wrap thead tr:first-child th{top:0;z-index:40}
.sales-grid-wrap thead tr:nth-child(2) th{top:28px;z-index:39}
.cf-tbl tbody tr:hover td{background-color:rgba(21,88,160,.04)!important}
.cf-tbl tbody td{border-bottom:1px solid #E8EDF4}
.cf-num{text-align:right;padding:6px 9px;white-space:nowrap;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.cf-muted{color:var(--muted)}
.cf-in{color:#166534}
.cf-out{color:#991B1B}
.cf-in-tot{font-weight:700;color:#14532D}
.cf-out-tot{font-weight:700;color:#7F1D1D}
.cf-debt{color:#4A2080;font-size:11px}
.cf-actual{opacity:1}
.cf-proj td{font-style:italic;opacity:.92}
/* Modal */
.modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:10px;padding:20px 24px;width:500px;max-width:95vw;max-height:88vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.modal h3{font-size:14px;font-weight:800;color:var(--blue-b);margin-bottom:14px}
/* Form fields */
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.field label,.fld-lbl{font-size:10px;font-weight:700;color:var(--muted)}
.fld-note{font-size:9px;color:var(--muted);font-weight:400;margin-top:1px}
.field input,.field select,.cap-inp{padding:6px 8px;border:1.5px solid var(--border);border-radius:5px;font-size:11px;background:var(--card);width:100%}
.field input:focus,.cap-inp:focus{border-color:var(--blue);outline:none}
/* Native calendar picker for capital / schedules (some layouts were too narrow to show as date) */
input[type="date"].cap-inp,input[type="month"].cap-inp{min-width:11rem;width:auto;max-width:100%}
</style>
<link rel="stylesheet" href="/legacy/ga_activity_calendar_core.css"/>
</head>
<body>

<!-- Top nav -->
<div id="topbar">
  <div class="logo">&#127968; GA Cashflow</div>
  <button class="tab-btn"     id="tab-cashflow"  onclick="showTab('cashflow')">&#128200; Cashflow</button>
  <button class="tab-btn"     id="tab-pl"        onclick="showTab('pl')">&#128202; P&amp;L</button>
  <button class="tab-btn"     id="tab-activities" onclick="showTab('activities')">&#128197; Activity Calendar</button>
  <span style="opacity:.45;font-size:10px;padding:0 4px;align-self:center">|</span>
  <div class="planning-wrap" id="planning-wrap">
    <button type="button" class="tab-btn" id="tab-planning" onclick="togglePlanningMenu(event)" aria-haspopup="true" aria-expanded="false" title="Sales, capital, schedules, debt, portfolio rollup">&#128203; Planning &#9662;</button>
    <div id="planning-menu" class="planning-menu hidden" role="menu" onclick="event.stopPropagation()">
      <div class="planning-menu-hdr">Inputs &amp; schedules</div>
      <button type="button" role="menuitem" id="plan-menu-sales" onclick="showTabFromPlanning('sales')">&#127968; Sales &amp; collections</button>
      <button type="button" role="menuitem" id="plan-menu-capital" onclick="showTabFromPlanning('capital')">&#128176; Capital structure</button>
      <button type="button" role="menuitem" id="plan-menu-expenses" onclick="showTabFromPlanning('expenses')">&#128196; Expense schedules</button>
      <div class="planning-menu-hdr" style="margin-top:4px;border-top:1px solid var(--border);padding-top:8px">Finance (password)</div>
      <button type="button" role="menuitem" id="plan-menu-debt" onclick="showTabFromPlanning('debt')">&#127970; Debt service</button>
      <button type="button" role="menuitem" id="plan-menu-ga" onclick="showTabFromPlanning('ga')">&#127760; GA consolidated rollup</button>
    </div>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:6px;padding:6px 0">
    <select id="proj-select" onchange="selectProj(this.value)"
      style="padding:5px 8px;border-radius:5px;border:1px solid #fff;background:#fff;color:var(--blue-b);font-size:11px;font-weight:600;min-width:160px">
      <option value="">No projects</option>
    </select>
    <select id="proj-root-select" multiple size="3" onchange="selectProjectGroup()"
      title="Project filter (multi-select)"
      style="padding:4px 6px;border-radius:5px;border:1px solid #fff;background:#fff;color:var(--blue-b);font-size:10px;font-weight:600;min-width:145px;max-height:66px">
      <option value="__all__">All Projects</option>
    </select>
    <select id="phase-select" multiple size="3" onchange="selectPhase()"
      title="Phase filter (multi-select)"
      style="padding:4px 6px;border-radius:5px;border:1px solid #fff;background:#fff;color:var(--blue-b);font-size:10px;font-weight:600;min-width:130px;max-height:66px">
      <option value="__all__">All phases</option>
    </select>
    <button class="btn btn-outline" type="button" onclick="setPhaseAll()"
      style="font-size:10px;padding:4px 8px;color:#fff;border-color:rgba(255,255,255,.3)" title="Select all phases">All phases</button>
    <select id="building-select" multiple size="3" onchange="selectBuilding()"
      title="Building filter (multi-select)"
      style="padding:4px 6px;border-radius:5px;border:1px solid #fff;background:#fff;color:var(--blue-b);font-size:10px;font-weight:600;min-width:130px;max-height:66px">
      <option value="__all__">All buildings</option>
    </select>
    <button class="btn btn-outline" type="button" onclick="setBuildingAll()"
      style="font-size:10px;padding:4px 8px;color:#fff;border-color:rgba(255,255,255,.3)" title="Select all buildings">All buildings</button>
    <button class="btn btn-outline" onclick="syncFromV3()"
      style="font-size:10px;padding:4px 8px;color:#fff;border-color:rgba(255,255,255,.3)">&#8635; Sync V3</button>
    <button class="btn btn-outline" data-action="add-proj"
      style="font-size:10px;padding:4px 8px;color:#fff;border-color:rgba(255,255,255,.3)" title="Add project manually">+ Manual</button>
    <button class="btn btn-outline" data-action="hierarchy-modal"
      style="font-size:10px;padding:4px 8px;color:#fff;border-color:rgba(255,255,255,.3)" title="Edit project hierarchy">⚙ Hierarchy</button>
    <button class="btn btn-outline" data-action="remove-proj-cf"
      style="font-size:10px;padding:4px 8px;color:#fecaca;border-color:rgba(254,202,202,.5)" title="Remove the selected project from this workbook (and Mongo if server save is on). V3 projects can reappear after Sync until removed in V3.">− Remove project</button>
    <button class="btn btn-outline" data-action="restore-last-deleted-proj"
      style="font-size:10px;padding:4px 8px;color:#bbf7d0;border-color:rgba(187,247,208,.5)" title="Restore the last deleted project from server snapshot">↺ Restore deleted</button>
  </div>
</div>

<!-- Sync bar: row 2 keeps Server/Mongo controls visible (was clipped on one wide flex row). -->
<div id="sync-bar">
  <div id="sync-bar-row1">
    <span id="sync-msg" style="color:var(--muted)">Loading&#8230;</span>
    <span style="margin-left:12px;padding-left:12px;border-left:1.5px solid var(--border);display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-weight:700;color:var(--blue-b)">Tally</span>
      <button type="button" class="btn btn-primary" data-action="tally-sync-modal" style="font-size:10px;padding:4px 10px">Live sync (local)</button>
    </span>
    <span style="margin-left:12px;padding-left:12px;border-left:1.5px solid var(--border);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span style="font-weight:700;color:var(--blue-b)">Drive</span>
      <button type="button" class="btn btn-outline" data-action="cf-cloud-setup" style="font-size:10px;padding:4px 8px" title="Same Web App URL as GA Planner V3 (localStorage ga_cloud_url)">Apps Script URL</button>
      <button type="button" class="btn btn-primary" data-action="cf-cloud-save" style="font-size:10px;padding:4px 8px">Save to cloud</button>
      <span id="cf-cloud-status" style="font-size:10px;color:var(--muted);max-width:220px"></span>
    </span>
    <span style="margin-left:auto;color:var(--muted);font-size:10px">Today: <strong id="today-date"></strong></span>
  </div>
  <div id="sync-bar-row2" title="Requires a small backend that stores one JSON state document in MongoDB. Not the same as Drive / Apps Script.">
    <span style="font-weight:700;color:var(--blue-b)">Server / Mongo</span>
    <button type="button" class="btn btn-outline" data-action="mongo-server-setup" style="font-size:10px;padding:4px 8px">Set API + enable</button>
    <button type="button" class="btn btn-primary" data-action="mongo-save-now" style="font-size:10px;padding:4px 8px" title="PUT state now">Save to server</button>
    <button type="button" class="btn btn-outline" data-action="mongo-load-now" style="font-size:10px;padding:4px 8px" title="GET state from server">Load from server</button>
    <button type="button" class="btn btn-outline" data-action="mongo-sync-postsales" style="font-size:10px;padding:4px 8px" title="Pull Due/Received/Pending from Post Sales Demands">Sync Post Sales collections</button>
    <button type="button" class="btn btn-outline" data-action="mongo-restore-snapshot" style="font-size:10px;padding:4px 8px;color:#166534;border-color:#86efac" title="Restore full workbook from an automatic server backup">↺ Restore snapshot</button>
    <button type="button" class="btn btn-primary" data-action="mongo-import-v3-projects" style="font-size:10px;padding:4px 10px" title="Load ga_rp_projects from v3_org_planner in Mongo, apply here, then save Cashflow to the server">Import V3 list from server</button>
    <span style="margin-left:8px;padding-left:8px;border-left:1.5px solid var(--border);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span style="font-weight:700;color:var(--blue-b)">Coding</span>
      <button type="button" class="btn btn-outline" data-action="upload-coding-master" style="font-size:10px;padding:4px 8px" title="Upload GA Accounting Categories V3 workbook (.xlsx) — Master Sheet for Building + Master Sheet For Common">Upload coding XLSX</button>
      <button type="button" class="btn btn-outline" data-action="clear-coding-master" style="font-size:10px;padding:4px 8px" title="Remove uploaded override and use the coding master shipped with this app version">Reset coding</button>
      <span id="coding-master-status" style="font-size:10px;color:var(--muted);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="Active accounting categories master"></span>
    </span>
    <span id="mongo-cf-status" style="font-size:10px;color:var(--muted);flex:1;min-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>
  </div>
</div>

<input type="file" id="coding-master-input" accept=".xlsx,.xls,.xlsm" style="display:none" onchange="importCodingMasterWorkbook(this)"/>

<script>
// CF V1 — Part 1: Constants, data model, engine
'use strict';

// ══════════════════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════════════════
var CF_VERSION = 62;
var GA_ACCT_OVERRIDE_LS_KEY = 'ga_acct_master_override';
var _gaAcctMasterMeta = { source: 'shipped', fileName: '', uploadedAt: 0, keyCount: 0 };
var INFLOW_CATS  = ['Sales Revenue','Equity Infusion','Investor Funding','Unsecured Loan','Customer Collections','Customer UL','Other Inflow'];
var OUTFLOW_CATS = ['Land','NOC','Consultant','Regulatory & Consulting','Construction','Marketing','GA DM Fee','Contingency','Interest Paid','Principal Repaid'];
var ALL_CATS = INFLOW_CATS.concat(OUTFLOW_CATS);
function isCashflowInflowCat(cat1){ return INFLOW_CATS.indexOf(String(cat1||'').trim())>=0; }
/** Expense dashboard: collections & other inflows stay out of outflow rollups. */
function isExpenseDashboardInflow(a){
  if(!a) return false;
  if(isCashflowInflowCat(a.cat1)) return true;
  return coerceMoney(a.amount)>0;
}
function isExpenseDashboardOutflow(a){
  if(!a) return false;
  if(isExpenseDashboardInflow(a)) return false;
  return coerceMoney(a.amount)<0;
}
/**
 * Display column names from GA Accounting Categories (L1 inflow A–G, outflow H–O).
 * Engine still uses INFLOW/OUTFLOW legacy cat1 keys internally.
 */
var CF_INFLOW_L1_COLS = null;
var CF_OUTFLOW_L1_COLS = null;
var PL_L1_COLS_BUILDING = null;
var PL_L1_COLS_COMMON = null;
function gaAcctIsV3(){
  return typeof GA_ACCT_SCHEMA!=='undefined' && GA_ACCT_SCHEMA==='v3';
}
function ensureGaL1CashflowCols(){
  if(CF_INFLOW_L1_COLS && CF_OUTFLOW_L1_COLS) return;
  if(gaAcctIsV3()){
    var inf=[], ouf=[];
    (GA_ACCT_CF_L1_BUILDING||[]).forEach(function(x){
      if(!x||!x.label) return;
      if(x.flow==='in') inf.push(x.label);
      else if(x.flow!=='cash') ouf.push(x.label);
    });
    (GA_ACCT_CF_L1_COMMON||[]).forEach(function(x){
      if(!x||!x.label) return;
      if(x.flow==='in') inf.push(x.label);
      else if(x.flow!=='cash') ouf.push(x.label);
    });
    CF_INFLOW_L1_COLS = inf.length ? inf : INFLOW_CATS.slice();
    CF_OUTFLOW_L1_COLS = ouf.length ? ouf : OUTFLOW_CATS.slice();
    PL_L1_COLS_BUILDING = (GA_ACCT_PL_L1_BUILDING||[]).map(function(x){ return x.label; });
    PL_L1_COLS_COMMON = (GA_ACCT_PL_L1_COMMON||[]).map(function(x){ return x.label; });
    return;
  }
  if(typeof GA_ACCT_L3_BY_CODE==='undefined'){
    CF_INFLOW_L1_COLS = INFLOW_CATS.slice();

function lookupGAAccountingByCostCentre(costCentre){

  if(!ccNorm) return null;
  var bPref=parseBuildingPrefixFromTallyCostCentre(costCentre);
  var scope=bPref?'building':(/^cm\s+cf\b/.test(ccNorm)?'common':inferAcctScopeFromText(costCentre,costCentre));
  var best=null, bestLen=0;
  Object.keys(GA_ACCT_L3_BY_CODE).forEach(function(k){
    var g=GA_ACCT_L3_BY_CODE[k];

    ['cfL3','plL3','l3Name','desc'].forEach(function(fld){
      var v=normTallyCostCentreLabel(g[fld]);
      if(!v||v.length<4) return;

    return gaAcctCloneForPrefix(best, bPref||(_curPid?getAcctPrefixForPid(_curPid):'A'));

function buildLenderPaymentSchedule(cfg){

var MILESTONE_LABEL_LEX = [

  '1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th',
  'gst','interest','the','and','for','of','on','at','time','coat'
];
MILESTONE_LABEL_LEX.sort(function(a,b){return b.length-a.length;});

function humanizeMilestoneLabel(raw){
  if(raw===undefined||raw===null) return '';
  var s=String(raw).replace(/_/g,' ').replace(/-/g,' ').trim();
  if(!s) return '';
  if(/\s/.test(s)) return s.replace(/\b([a-z])/gi,function(_,c){return c.toUpperCase();});
  var lower=s.toLowerCase();
  var out=[], i=0;
  while(i<lower.length){
    var matched=false;
    for(var wi=0;wi<MILESTONE_LABEL_LEX.length;wi++){
      var w=MILESTONE_LABEL_LEX[wi];
      if(lower.slice(i,i+w.length)===w){ out.push(w); i+=w.length; matched=true; break; }
    }
    if(!matched){ out.push(lower[i]); i++; }
  }
  var merged=[], buf='';
  function flushBuf(){ if(buf){ merged.push(buf); buf=''; } }
  out.forEach(function(t){
    if(t.length===1) buf+=t;
    else { flushBuf(); merged.push(t); }
  });
  flushBuf();
  var phrase=merged.join(' ').replace(/\s+/g,' ').trim();
  return phrase.replace(/\b([a-z])/gi,function(_,c){return c.toUpperCase();});
}

function formatMilestonePct(p){
  var n=parseFloat(p);
  if(!isFinite(n)) return '—';
  var r=Math.round(n*10000)/10000;
  if(Math.abs(r-Math.round(r))<1e-6) return String(Math.round(r));
  return r.toFixed(2).replace(/\.?0+$/,'');
}

function findMilestoneDefForHeader(cfg, hdrLabel){

function milestoneDateIsoBySlugScan(cfg, unit, labelish){

function cumulativeMilestonePctAtBooking(unit,cfg){

function installUsesCRMDueLines(unit){
  return (unit.installments||[]).some(function(ins){ return String(ins.label||'').indexOf('(due)')>=0; });
}
/** One object per CRM milestone column: due, recv, pend (explicit or derived), shared milestone month. */
function groupCRMInstallmentsByBase(unit,cfg){
  var acc={};
  (unit.installments||[]).forEach(function(ins){
    var L=String(ins.label||'');
    var base=installmentBaseLabel(L);
    if(!base) return;
    var iso=effectiveInstallmentIso(unit,cfg,ins);
    var typ=L.indexOf('(received)')>=0?'r':L.indexOf('(pending)')>=0?'p':L.indexOf('(due)')>=0?'d':'u';
    if(!acc[base]) acc[base]={base:base,due:0,recv:0,pendSum:0,pendExplicit:false,dueIso:''};
    var g=acc[base];
    if(typ==='d'){
      g.due+=coerceMoney(ins.amount);
      if(iso) g.dueIso=iso;
    }else if(typ==='r'){
      g.recv+=coerceMoney(ins.amount);
      if(iso&&!g.dueIso) g.dueIso=iso;
    }else if(typ==='p'){
      g.pendExplicit=true;
      g.pendSum+=coerceMoney(ins.amount);
      if(iso&&!g.dueIso) g.dueIso=iso;
    }else if(typ==='u'){
      g.due+=coerceMoney(ins.amount);
      if(iso) g.dueIso=iso;
    }
  });
  var arr=Object.keys(acc).map(function(k){
    var g=acc[k];
    g.pend=g.pendExplicit?g.pendSum:Math.max(0,coerceMoney(g.due)-coerceMoney(g.recv));
    delete g.pendSum;
    delete g.pendExplicit;
    return g;
  });
  var syn=null;
  arr.forEach(function(g){
    if(String(g.base||'').indexOf('Construction stage at booking')>=0) syn=g;
  });
  if(!syn) return arr;
  var bmo=(normalizeToISODate(unit&&unit.bookingDate)||'').slice(0,7);
  var tv=coerceMoney(unit&&unit.totalValue);
  if(!bmo||tv<=0) return arr;
  var sumBookDue=0;
  arr.forEach(function(g){
    var iso=normalizeToISODate(g.dueIso)||'';
    if(!iso||iso.slice(0,7)!==bmo) return;
    sumBookDue+=coerceMoney(g.due);
  });
  if(sumBookDue<=tv*1.01) return arr;
  var extraDue=0,extraRecv=0;
  var out=[];
  arr.forEach(function(g){
    var isSyn=String(g.base||'').indexOf('Construction stage at booking')>=0;
    if(isSyn){ out.push(g); return; }
    var iso=normalizeToISODate(g.dueIso)||'';
    var inBook=!!(iso&&iso.slice(0,7)===bmo);
    var isBal=String(g.base||'').indexOf('Balance to Agreement')>=0;
    if(inBook&&!isBal){
      extraDue+=coerceMoney(g.due);
      extraRecv+=coerceMoney(g.recv);
      return;
    }
    out.push(g);
  });
  syn.due=coerceMoney(syn.due)+extraDue;
  syn.recv=coerceMoney(syn.recv)+extraRecv;
  syn.pend=Math.max(0,coerceMoney(syn.due)-coerceMoney(syn.recv));
  return out;
}

/**
 * Tally ledgers that follow the GA chart often prefix the voucher line with the L3 code (e.g. "I3-2 Cement").
 * "C1-1-3 C302" → resolve by trimming trailing "-segments" until a workbook L3 key matches.
 */
function lookupGAAccountingByLedgerName(ledgerName, scopeHint, buildingPrefix){
  if(typeof GA_ACCT_L3_BY_CODE==='undefined'||!GA_ACCT_L3_BY_CODE) return null;
  var t=String(ledgerName||'').trim();
  if(!t) return null;
  var sp=t.indexOf(' ');
  var first=sp<0?t:t.slice(0,sp);
  var c=first;
  while(c){
    var mk=resolveMasterKeyFromShortCode(c, scopeHint, buildingPrefix);
    if(mk && GA_ACCT_L3_BY_CODE[mk]){
      var e=GA_ACCT_L3_BY_CODE[mk];
      if(scopeHint!=='common'&&buildingPrefix&&e.scope==='building') return gaAcctCloneForPrefix(e, buildingPrefix);
      return e;
    }
    if(GA_ACCT_L3_BY_CODE[c]) return GA_ACCT_L3_BY_CODE[c];
    var p=c.lastIndexOf('-');
    if(p<0) break;
    c=c.slice(0,p);
  }
  return null;
}
/** Try to read an L3 code at the start of a string (e.g. "K3-2 Reimbursement …") and walk parent codes. */
function lookupGAAccountingByLeadingCodeToken(s, scopeHint, buildingPrefix){
  if(typeof GA_ACCT_L3_BY_CODE==='undefined'||!GA_ACCT_L3_BY_CODE) return null;
  var t=String(s||'').trim();
  if(!t) return null;
  var m=t.match(/^([A-Za-z]\d+(?:-\d+)*)\b/);
  var first=(m&&m[1])?m[1]:(t.replace(/^[|\s/:]+/,'').split(/[\s|/:]+/)[0]||'');
  var c=first;
  while(c){
    var mk=resolveMasterKeyFromShortCode(c, scopeHint, buildingPrefix);
    if(mk && GA_ACCT_L3_BY_CODE[mk]){
      var e=GA_ACCT_L3_BY_CODE[mk];
      if(scopeHint!=='common'&&buildingPrefix&&e.scope==='building') return gaAcctCloneForPrefix(e, buildingPrefix);
      return e;
    }
    if(GA_ACCT_L3_BY_CODE[c]) return GA_ACCT_L3_BY_CODE[c];
    var p=c.lastIndexOf('-');
    if(p<0) break;
    c=c.slice(0,p);
  }
  return null;
}
/** Resolve GA chart row from party and/or full line text (party, narration, voucher text). */
function resolveGAAccountingChartRow(fullText, party, scopeHint, buildingPrefix){
  var g=lookupGAAccountingByLedgerName(party, scopeHint, buildingPrefix); if(g) return g;
  g=lookupGAAccountingByLedgerName(String(party||'').trim().split(/[\s|:/]+/)[0], scopeHint, buildingPrefix); if(g) return g;
  g=lookupGAAccountingByLeadingCodeToken(String(party||''), scopeHint, buildingPrefix); if(g) return g;
  g=lookupGAAccountingByLeadingCodeToken(String(fullText||''), scopeHint, buildingPrefix); if(g) return g;
  var blob=String(party||'')+' '+String(fullText||'');
  var found=blob.match(/\b([A-Za-z]\d+(?:-\d+)*)\b/g);
  if(found){
    for(var i=0;i<found.length;i++){
      var tok=found[i], w=tok;
      while(w){
        var mk=resolveMasterKeyFromShortCode(w, scopeHint, buildingPrefix);
        if(mk && GA_ACCT_L3_BY_CODE[mk]){
          var e=GA_ACCT_L3_BY_CODE[mk];
          if(scopeHint!=='common'&&buildingPrefix&&e.scope==='building') return gaAcctCloneForPrefix(e, buildingPrefix);
          return e;
        }
        if(GA_ACCT_L3_BY_CODE[w]) return GA_ACCT_L3_BY_CODE[w];
        var p=w.lastIndexOf('-');
        if(p<0) break;
        w=w.slice(0,p);
      }
    }
  }
  return null;
}
/**
 * @returns {{cat1:string,gaL1:string,gaL2:string,gaL3:string,gaL3Name:string,flow?:string,tallyMapSrc:string,masterKey?:string,gaScope?:string,plL1?:string}}
 */
function classifyTallyLineFromText(fullText, party, rawAmount, scopeHint, buildingPrefix, costCentre){
  var cc=String(costCentre||'').trim();
  var text=(String(fullText||'')+(cc?(' '+cc):'')).toLowerCase();
  var scope=scopeHint||inferAcctScopeFromText(String(fullText||'')+' '+cc, cc);
  var bPref=buildingPrefix||parseBuildingPrefixFromTallyCostCentre(cc)||(_curPid?getAcctPrefixForPid(_curPid):'A');
  var g=null;
  if(cc) g=lookupGAAccountingByCostCentre(cc);
  if(!g) g=lookupCommonMasterByKeywords(text+' '+String(party||''));
  if(!g) g=resolveGAAccountingChartRow(String(fullText||'')+' '+cc, String(party||'')+(cc?(' '+cc):''), scope, bPref);
  if(g){
    var gaL1=g.cfApplicable ? String(g.cfL1Label||g.l1Name||'') : String(g.plL1Label||g.l1Name||'');
    var leg=g.legacyCat1;
    if((g.l1==='R'||g.l1==='W'||String(g.l1Name||'').toLowerCase().indexOf('payable')>=0) && leg==='Construction') leg='Payables';
    return {
      cat1:leg,
      gaL1:gaL1,
      gaL2:(g.l2Name||'')+' ('+(g.l2||'')+')',
      gaL3:g.shortCode||g.l3||'',
      gaL3Name:g.l3Name||'',
      flow:g.flow,
      tallyMapSrc:'l3-book',
      masterKey:g.masterKey||'',
      gaScope:g.scope||scope,
      plL1:String(g.plL1Label||g.l1Name||''),
    };
  }
  var kw=guessTallyCategoryKey(fullText);
  if(!kw) kw=guessTallyCategoryKey(String(party||''));
  if(kw){
    if(kw==='Payables'){
      var pg=lookupCommonMasterByKeywords(text+' '+String(party||''));
      if(pg) return {
        cat1:'Payables',
        gaL1:pg.cfL1Label||'Common · Payables',
        gaL2:(pg.l2Name||'')+' ('+(pg.l2||'')+')',
        gaL3:pg.shortCode||'',
        gaL3Name:pg.l3Name||'',
        flow:pg.flow,
        tallyMapSrc:'keyword-v3',
        masterKey:pg.masterKey||'',
        gaScope:'common',
        plL1:pg.plL1Label||'',
      };
    }
    return {cat1:kw,gaL1:legacyCashflowCat1ToDisplayGaL1(kw),gaL2:'',gaL3:'',gaL3Name:'',tallyMapSrc:'keyword'};
  }
  if(/customer|collection|booking|milestone|possession|receipt|sale|unit|flat|parking|amenity|demand|installment|allotment/i.test(text)){
    return {cat1:'Other Inflow',gaL1:'',gaL2:'',gaL3:'',gaL3Name:'(heuristic inflow)',tallyMapSrc:'heuristic-in'};
  }
  return {cat1:'Construction',gaL1:legacyCashflowCat1ToDisplayGaL1('Construction'),gaL2:'',gaL3:'',gaL3Name:'(unmapped — reclassify if needed)',tallyMapSrc:'unmapped-out'};
}
function legacyCat1ToExpenseScheduleKey(leg){
  var m={'Land':'landSchedule','NOC':'nocSchedule','Consultant':'consultantSchedule','Regulatory & Consulting':'regulatoryConsultingSchedule','Construction':'constructionSchedule','Marketing':'marketingSchedule'};
  return m[leg]||null;
}
function guessTallyCategoryKey(ledger){
  if(!ledger) return '';
  var l=String(ledger).toLowerCase();
  var best='', bestLen=0;
  Object.keys(TALLY_MAP).forEach(function(k){
    if(l.indexOf(k)>=0 && k.length>bestLen){ best=TALLY_MAP[k]; bestLen=k.length; }
  });
  return best;
}

/** Tally exports on Windows are often UTF-16 LE — decode upload bytes reliably. */
function decodeTallyUploadArrayBuffer(buf){
  if(!buf) return '';
  var u8=buf instanceof Uint8Array?buf:new Uint8Array(buf);
  if(u8.length>=2 && u8[0]===0xFF && u8[1]===0xFE) return new TextDecoder('utf-16le').decode(u8);
  if(u8.length>=2 && u8[0]===0xFE && u8[1]===0xFF) return new TextDecoder('utf-16be').decode(u8);
  return new TextDecoder('utf-8').decode(u8);
}
function isTallyBankOrCashLedger(ledgerName){
  var p=String(ledgerName||'').toLowerCase().trim();
  if(!p) return false;
  if(/\bbank\b|a\/c[\s\-]|account\s*no|current\s*a\/c|savings\s*a\/c/i.test(p)) return true;
  if(/\bicici\b|\bhdfc\b|\baxis\b|\bsbi\b|\bkotak\b|\byes bank\b|\bbob\b|\bidbi\b/i.test(p)) return true;
  if(/^cash$|^petty cash$|^cash in hand$/i.test(p)) return true;
  // Chart codes like T2-2 / T2_3 used for bank / cash ledgers in GA books
  if(/^t\d+[-_\s]/i.test(p) && /(bank|a\/c|account|cash)/i.test(p)) return true;
  if(/^t2[-_\s]/i.test(p)) return true;
  return false;
}

function filterTallyRowsPaymentReceiptOnly(rows){

function runTallyPullVouchers(){
  var el=document.getElementById('tally-sync-msg'); if(!el) return;
  if(!_curPid){alert('Select a project first.');return;}
  saveTallySettingsFromForm();
  var s=getTallySyncForPull();
  var fd=tallyDd(s.fromDate), td=tallyDd(s.toDate);
  if(fd.length!==8||td.length!==8){alert('Choose valid from/to dates.');return;}
  if(fd>td){alert('From date must be on or before To date.');return;}
  var preset=s.pullPreset||'payment_receipt';
  var label=preset==='payment_receipt'?'Payment + Receipt vouchers (dated)':'report '+s.reportId;
  el.textContent='Requesting Tally export ('+label+', '+fd+'–'+td+'). Bridge v2 year→month — keep Tally + bridge open…';
  var exportBody={
    fromDate:fd,
    toDate:td,
    chunkByYear:true,
    sendCompanyToTally:!!s.tallySendCompany
  };
  if(preset==='payment_receipt'){
    exportBody.preset='payment_receipt';
  }else{
    exportBody.reportId=s.reportId||'Day Book';
  }
  if(s.tallySendCompany&&s.tallyCompanyName) exportBody.currentCompany=s.tallyCompanyName;
  fetch(s.bridgeUrl+'/tally/export',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(exportBody)
  }).then(function(r){return r.text().then(function(text){return {ok:r.ok,status:r.status,text:text,meta:r.headers.get('X-GA-Tally-Meta')};});}).then(function(resp){
    var text=resp.text;
    if(!resp.ok&&text.trim().charAt(0)==='{'){
      try{
        var j=JSON.parse(text);
        el.textContent='Bridge: '+(j.error||j.message||('HTTP '+resp.status));
        return;
      }catch(e2){}
    }
    var onlyPR=preset==='payment_receipt';
    var parsed=parseTallyXmlToLedgerLines(text, {onlyPaymentReceipt:onlyPR});
    if(parsed.error){
      el.textContent='Parse: '+parsed.error;
      if(text.indexOf('<')>=0) console.warn('Tally raw (first 2k):', text.slice(0,2000));
      return;
    }
    var filt=onlyPR?filterTallyRowsPaymentReceiptOnly(parsed.rows||[]):{rows:(parsed.rows||[]).slice(),skippedType:0,skippedBank:0};
    var rows=filt.rows;
    window.__gaLastTallyExportRaw=text;
    window.__gaLastTallyExportMeta={
      preset:preset,
      reportId:s.reportId,
      fromDate:fd,
      toDate:td,
      sendCompanyToTally:!!s.tallySendCompany,
      currentCompany:(s.tallySendCompany&&s.tallyCompanyName)?s.tallyCompanyName:'',
      pulledAt:new Date().toISOString(),
      bridgeMeta:resp.meta||null,
      onlyPaymentReceipt:onlyPR,
      filteredOutType:filt.skippedType||0,
      filteredOutBank:filt.skippedBank||0
    };
    window.__gaLastTallyParsedRows=rows.slice();
    var res=mergeTallyLinesIntoActuals(rows,{
      replaceTally:s.replaceTally,
      costCentreSubstr:s.costCentreSubstr,
      onlyPaymentReceipt:onlyPR
    });
    var metaHint='';
    try{ if(resp.meta){ var m=JSON.parse(resp.meta); if(m&&m.voucherCount!=null) metaHint=' · vouchers≈'+m.voucherCount+(m.dateMin&&m.dateMax?(' · dates '+m.dateMin+'→'+m.dateMax):''); } }catch(e3){}
    if(onlyPR) metaHint+=' · Payment/Receipt only (Journal/Contra/bank sides dropped)';
    if(rows.length<=5 && fd!==td){
      metaHint+=' ⚠ Very few Payment/Receipt lines — restart bridge v2 (start-tally-bridge.bat) and confirm Tally HTTP :9000.';
    }
    if(!s.replaceTally) metaHint+=' · Tip: tick Replace to clear old Journal/Contra imports';
    el.textContent='✓ Added '+res.added+' Payment/Receipt line(s). Skipped '+res.skipped+'.'+metaHint;
    closeModal();
    renderTab(_curTab);
    refreshProjectCashflowViews();
    alert('Tally sync ('+label+'): +'+res.added+' Payment/Receipt actual(s). Skipped '+res.skipped+'.'+metaHint);
  }).catch(function(e){
    el.textContent='Error: '+e.message+(isNetworkOrBridgeFetchFailure(e)?tallyBridgeUnreachableHint(s.bridgeUrl):'');
  });
}

function expenseTreePushLeaf(treeOut, l1, l2, l3k, mag, line){
  if(mag<=0) return;

    .then(function(res){

function mongoPayloadForSave(){
  var full=cfStatePayload();
  if(_mongoForceFullSave) return {payload:full, dirtyKeys:[]};
  var ids=Object.keys(_mongoDirtyPids||{});
  if(!ids.length) return {payload:full, dirtyKeys:[]};
  var slim={};
  var hasSectionSlices=false;
  ids.forEach(function(pid){
    if(!full.data || !Object.prototype.hasOwnProperty.call(full.data,pid)) return;
    var src=full.data[pid];
    var sections=_mongoDirtyPidSections[pid];
    if(!sections){
      slim[pid]=src;
      return;
    }
    var secKeys=Object.keys(sections||{});
    if(!secKeys.length){
      slim[pid]=src;
      return;
    }
    hasSectionSlices=true;
    var slice={};
    secKeys.forEach(function(k){
      if(Object.prototype.hasOwnProperty.call(src,k)) slice[k]=src[k];
    });
    if(!Object.keys(slice).length){
      slim[pid]=src;
      return;
    }
    // Keep identifiers on partial project saves so server merge remains deterministic.
    if(Object.prototype.hasOwnProperty.call(src,'pid')) slice.pid=src.pid;
    if(Object.prototype.hasOwnProperty.call(src,'projName')) slice.projName=src.projName;
    slim[pid]=slice;
  });
  if(!Object.keys(slim).length) return {payload:full, dirtyKeys:[]};
  var partialPayload={v:full.v,ts:full.ts,data:slim,manualProjs:full.manualProjs,ui:full.ui};
  if(full.acctMaster) partialPayload.acctMaster=full.acctMaster;
  return {
    payload:partialPayload,
    dirtyKeys:ids,
    partialBySections:hasSectionSlices
  };
}
function mergeV1CashflowEnvelopeClient(existingEnv, incomingEnv){
  var ex=(existingEnv&&typeof existingEnv==='object')?existingEnv:{};
  var exData=(ex.data&&typeof ex.data==='object')?ex.data:{};
  var inData=(incomingEnv&&incomingEnv.data&&typeof incomingEnv.data==='object')?incomingEnv.data:{};
  var byId={};
  (ex.manualProjs||[]).forEach(function(p){ if(p&&p.id!=null) byId[String(p.id)]=p; });
  (incomingEnv.manualProjs||[]).forEach(function(p){ if(p&&p.id!=null) byId[String(p.id)]=p; });
  var mergedManual=Object.keys(byId).map(function(k){ return byId[k]; });
  return {
    v: incomingEnv.v,
    ts: Date.now(),
    data: Object.assign({}, exData, inData),
    manualProjs: mergedManual,
    ui: Object.assign({}, (ex.ui&&typeof ex.ui==='object')?ex.ui:{}, (incomingEnv.ui&&typeof incomingEnv.ui==='object')?incomingEnv.ui:{}),
    acctMaster: (incomingEnv&&incomingEnv.acctMaster)?incomingEnv.acctMaster:(ex.acctMaster||undefined)
  };
}

    oc=computeOwnContributionAmount(tv,loan,'loan');

function mongoStatePutNow(){
  if(!canUseMongoState()) return Promise.resolve(false);
  if(_mongoSaveBusy){ _mongoSaveQueued=true; return Promise.resolve(false); }
  _mongoSaveBusy=true;
  var expected=_mongoStateVersion;
  var payloadInfo=mongoPayloadForSave();
  var payload=payloadInfo.payload;
  var dirtyKeys=payloadInfo.dirtyKeys||[];
  var user='User';
  try{ user=(localStorage.getItem('ga_user_name')||'User').trim()||'User'; }catch(e){}
  function sendPut(data, exp){
    return fetch(mongoStateApiUrl(),{
      method:'PUT',
      credentials:'include',
      cache:'no-store',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({data:data, expectedVersion:exp, updatedBy:user, forceRestore:!!_mongoRestoringSnapshot})
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,body:j}; }); });
  }
  return fetchMongoEnvelope().then(function(latest){
    if(latest&&latest.data&&!guardMongoSaveAgainstUnitLoss(latest.data, payload)) return {ok:false, body:{error:'Save blocked to protect sold-unit data'}};
    return sendPut(payload, expected);
  })
  .then(function(res){
    if(res.ok) return res;
    if(res.body && res.body.currentVersion!==undefined && String(res.body.error||'').toLowerCase().indexOf('version conflict')>=0){
      _mongoStateVersion=Number(res.body.currentVersion)||_mongoStateVersion;
      return fetchMongoEnvelope().then(function(latest){
        if(!latest) return res;
        var rebased=mergeV1CashflowEnvelopeClient((latest.data&&typeof latest.data==='object')?latest.data:{}, payload);
        return sendPut(rebased, latest.version);
      });
    }
    return res;
  })
  .then(function(res){
    if(!res.ok){
      if(res.body && res.body.currentVersion!==undefined){
        _mongoStateVersion=Number(res.body.currentVersion)||_mongoStateVersion;
      }
      throw new Error((res.body&&res.body.error)||'Mongo save failed');
    }
    _mongoStateVersion=Number(res.body.version)||_mongoStateVersion;
    if(dirtyKeys.length){
      dirtyKeys.forEach(function(pid){
        delete _mongoDirtyPids[pid];
        delete _mongoDirtyPidSections[pid];
      });
    } else {
      _mongoDirtyPids={};
      _mongoDirtyPidSections={};
    }
    _mongoForceFullSave=false;
    mongoStateStatus('MongoDB save OK · v'+_mongoStateVersion,'green');
    updateMongoStatusLabel();
    return true;
  }).catch(function(e){
    mongoStateStatus('Mongo save failed: '+String(e&&e.message||e).slice(0,90),'red');
    updateMongoStatusLabel('Save failed');
    return false;
  }).finally(function(){
    _mongoSaveBusy=false;
    if(_mongoSaveQueued){
      _mongoSaveQueued=false;
      scheduleMongoStateSave(300);
    }
  });
}
function scheduleMongoStateSave(delayMs){
  if(!canUseMongoState()) return;
  if(_mongoSaveTimer) clearTimeout(_mongoSaveTimer);
  _mongoSaveTimer=setTimeout(function(){
    _mongoSaveTimer=null;
    mongoStatePutNow();
  }, Math.max(200, delayMs||1300));
}

var CF_CLOUD_CONF_KEY='ga_cloud_url';
var _cfCloudSaveTimer=null;
function cfCloudRelayBase(){
  try{
    if(window.location.protocol==='file:') return 'http://localhost:8765';
    if((window.location.protocol==='http:'||window.location.protocol==='https:')&&window.location.host)
      return window.location.origin;
  }catch(e){}
  return 'http://localhost:8765';
}
function cfCloudRelayCandidates(){
  var out=[], seen={};
  function add(u){
    if(!u||seen[u]) return;
    seen[u]=1; out.push(u);
  }
  add(cfCloudRelayBase());
  try{
    if(window.location.origin&&window.location.origin!=='null') add(window.location.origin);
  }catch(e){}
  [8765,8766,8767,8768,8769,8770,8771,8772,8773,8774,8775].forEach(function(p){
    add('http://localhost:'+p);
    add('http://127.0.0.1:'+p);
  });
  return out;
}
function cfFetchWithTimeout(url, opts, ms){
  ms=ms||12000;
  return new Promise(function(resolve,reject){
    var done=false;
    var t=setTimeout(function(){
      if(done) return;
      done=true;
      reject(new Error('Timed out after '+Math.round(ms/1000)+'s'));
    }, ms);
    fetch(url, opts).then(function(r){
      if(done) return;
      done=true; clearTimeout(t); resolve(r);
    }).catch(function(e){
      if(done) return;
      done=true; clearTimeout(t); reject(e);
    });
  });
}
function cfSerializeCloudSlice(){
  var manual=PROJS.filter(function(p){return p._manual;});
  return {v:CF_VERSION, ts:Date.now(), data:_cfData, manualProjs:manual};
}
function setCfCloudStatus(msg){
  var el=document.getElementById('cf-cloud-status');
  if(el) el.textContent=msg||'';
}
function cfCloudPushImmediate(){
  var url='';
  try{ url=(localStorage.getItem(CF_CLOUD_CONF_KEY)||'').trim(); }catch(e){}
  if(!url||url.indexOf('script.google.com')<0){
    setCfCloudStatus('Set Apps Script URL (V3) to enable cloud merge');
    return;
  }
  var savedBy='User';
  try{ savedBy=(localStorage.getItem('ga_user_name')||'User').trim()||'User'; }catch(e){}
  var payload={v:2, ts:Date.now(), savedBy:savedBy, ga_cf_v1:cfSerializeCloudSlice()};
  setCfCloudStatus('Saving to Drive…');
  var relays=cfCloudRelayCandidates(), idx=0, lastErr='';
  function attempt(){
    if(idx>=relays.length){
      var hint='Run Start_GA_Planner.bat (proxy) and open via http://localhost:8765';
      setCfCloudStatus('Cloud failed. '+hint+'. Last error: '+String(lastErr||'Failed to fetch').slice(0,80));
      return;
    }
    var relay=relays[idx++];
    cfFetchWithTimeout(relay+'/cloud-save?url='+encodeURIComponent(url),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    },12000).then(function(r){
      return r.text().then(function(t){ return {r:r,t:t,relay:relay}; });
    }).then(function(o){
      if(!o.r.ok) throw new Error(o.t.slice(0,240)||('HTTP '+o.r.status));
      var meta=JSON.parse(o.t);
      if(meta.ok===false) throw new Error(meta.error||'Save rejected');
      setCfCloudStatus('Drive OK via '+o.relay.replace(/^https?:\/\//,'')+' · '+new Date().toLocaleTimeString('en-IN'));
    }).catch(function(e){
      lastErr=String(e&&e.message||e||'');
      attempt();
    });
  }
  attempt();
}
function scheduleCfCloudPush(){
  var url='';
  try{ url=(localStorage.getItem(CF_CLOUD_CONF_KEY)||'').trim(); }catch(e){}
  if(!url||url.indexOf('script.google.com')<0) return;
  if(_cfCloudSaveTimer) clearTimeout(_cfCloudSaveTimer);
  _cfCloudSaveTimer=setTimeout(function(){
    _cfCloudSaveTimer=null;
    cfCloudPushImmediate();
  },2200);
}

      var bPrefix=getAcctPrefixForPid(pid)||'A';
      cfg.actuals.forEach(function(a){
        if(!a||a.source!=='tally') return;
        var cc=a.costCentre||'';
        var scope=inferAcctScopeFromText((a.party||'')+' '+(a.note||'')+' '+cc, cc);
        var cl=classifyTallyLineFromText((a.party||'')+' '+(a.note||'')+' '+cc, a.party||'', a.amount||0, scope, bPrefix, cc);
        if(a.cat1!==cl.cat1){ a.cat1=cl.cat1; touched=true; }

        if((a.masterKey||'')!==(cl.masterKey||'')){ a.masterKey=cl.masterKey||''; touched=true; }
        if((a.gaScope||'')!==(cl.gaScope||'')){ a.gaScope=cl.gaScope||scope; touched=true; }
        if((a.plL1||'')!==(cl.plL1||'')){ a.plL1=cl.plL1||''; touched=true; }

function syncFromV3(noPersist){
  try{
    var raw=localStorage.getItem('ga_rp_projects');
    if(raw&&raw!==_lastProjHash){
      var pp=JSON.parse(raw);
      if(pp&&pp.length){

        var v3ids=pp.map(function(p){return p.id;});
        PROJS=PROJS.filter(function(p){return p._manual&&!v3ids.includes(p.id);});
        pp.forEach(function(p){PROJS.push(p);});

        buildPhaseSelect();
        buildBuildingSelect();
        ensureCurrentProjectVisible();
        mergeV3CashflowHints();

        _mongoForceFullSave=true;
        _mongoDirtyPids={};

function inferProjectGroupFromProject(p){
  if(!p) return 'Unassigned';
  var explicit=(p.projectGroup||p.project||p.parentProject||p.program||p.projectRoot||p.rootProject||p.group||p.cluster||p.project_name||'').toString().trim();
  if(explicit) return explicit;
  var n=String(p.name||'').trim();
  if(!n) return 'Unassigned';
  var pathParts=n.split(/\s*(?:>|\/|\|)\s*/).map(function(x){ return String(x||'').trim(); }).filter(Boolean);
  if(pathParts.length>=2) return pathParts[0];
  var pm=n.match(/^(.+?)\s*[-:|]\s*phase\b/i);
  if(pm&&pm[1]) return String(pm[1]).trim()||'Unassigned';
  var parts=n.split(/\s[-:|]\s/);
  return (parts[0]||n).trim()||'Unassigned';
}
function inferPhaseFromProject(p){
  if(!p) return 'Unassigned';
  var explicit=(p.phase||p.projectPhase||p._phase||p.phaseName||p.phase_name||p.phaseLabel||'').toString().trim();
  if(explicit) return explicit;
  var n=String(p.name||'');
  var pathParts=n.split(/\s*(?:>|\/|\|)\s*/).map(function(x){ return String(x||'').trim(); }).filter(Boolean);
  if(pathParts.length>=3) return pathParts[1];
  var m=n.match(/\b(phase\s*[a-z0-9]+)/i);
  if(m&&m[1]) return m[1].replace(/\s+/g,' ').replace(/^./,function(c){return c.toUpperCase();});
  return 'Unassigned';
}
function inferBuildingFromProject(p){
  if(!p) return 'Unassigned';
  var explicit=(p.building||p._building||p.buildingName||p._buildingName||p.tower||p.towerName||p.wing||p.block||p.building_name||'').toString().trim();
  if(explicit) return explicit;
  var n=String(p.name||'').trim();
  if(!n) return 'Unassigned';
  var pathParts=n.split(/\s*(?:>|\/|\|)\s*/).map(function(x){ return String(x||'').trim(); }).filter(Boolean);
  if(pathParts.length>=3) return pathParts[pathParts.length-1];
  var parts=n.split(/\s[-:|]\s/);
  if(parts.length>=3) return (parts[2]||'').trim()||'Unassigned';
  return 'Unassigned';
}
function getProjectHierarchy(pid){
  var p=(PROJS||[]).find(function(x){ return x&&x.id===pid; })||null;
  var cfg=getCF(pid)||{};
  var root=inferProjectGroupFromProject(p);
  var phase=inferPhaseFromProject(p);
  var building=inferBuildingFromProject(p);
  if(root==='Unassigned' && cfg.projectGroup) root=String(cfg.projectGroup).trim()||root;
  if(phase==='Unassigned' && cfg.phase) phase=String(cfg.phase).trim()||phase;
  if(building==='Unassigned' && cfg.building) building=String(cfg.building).trim()||building;
  if((root==='Unassigned' || phase==='Unassigned' || building==='Unassigned') && Array.isArray(cfg.units) && cfg.units.length){
    var u0=cfg.units[0]||{};
    if(root==='Unassigned' && u0.projectGroup) root=String(u0.projectGroup).trim()||root;
    if(phase==='Unassigned' && u0.phase) phase=String(u0.phase).trim()||phase;
    if(building==='Unassigned' && (u0.building||u0.tower||u0.wing)) building=String(u0.building||u0.tower||u0.wing).trim()||building;
  }
  if((root==='Unassigned' || phase==='Unassigned' || building==='Unassigned') && Array.isArray(cfg.unsoldUnits) && cfg.unsoldUnits.length){
    var uu0=cfg.unsoldUnits[0]||{};
    if(root==='Unassigned' && uu0.projectGroup) root=String(uu0.projectGroup).trim()||root;
    if(phase==='Unassigned' && uu0.phase) phase=String(uu0.phase).trim()||phase;
    if(building==='Unassigned' && (uu0.building||uu0.tower||uu0.wing)) building=String(uu0.building||uu0.tower||uu0.wing).trim()||building;
  }
  return {
    projectGroup: root||'Unassigned',
    phase: phase||'Unassigned',
    building: building||'Unassigned'
  };
}
function parseMultiFilter(raw){
  if(raw==null||raw==='') return [];
  if(Array.isArray(raw)) return raw.filter(Boolean).map(function(x){ return String(x).trim(); }).filter(Boolean);
  var s=String(raw).trim();
  if(!s||s==='__all__') return [];
  if(s.charAt(0)==='['){
    try{
      var arr=JSON.parse(s);
      if(Array.isArray(arr)) return arr.filter(Boolean).map(function(x){ return String(x).trim(); }).filter(Boolean);
    }catch(e){}
  }
  return [s];
}
function encodeMultiFilter(vals){
  var arr=(vals||[]).filter(Boolean).map(function(x){ return String(x).trim(); }).filter(Boolean);
  return arr.length?JSON.stringify(arr):'__all__';
}
function multiFilterHas(raw, val){
  var arr=parseMultiFilter(raw);
  if(!arr.length) return true;
  return arr.indexOf(String(val||''))>=0;
}
function readMultiSelectValues(selectId){
  var el=document.getElementById(selectId);
  if(!el||!el.options) return [];
  var allSelected=false;
  var out=[];
  for(var i=0;i<el.options.length;i++){
    var op=el.options[i];
    if(op.selected && op.value==='__all__'){ allSelected=true; continue; }
    if(op.selected && op.value && op.value!=='__all__') out.push(op.value);
  }
  if(allSelected) return [];
  return out;
}
/** Projects matching current Project (root) + Phase + Building filters. */
function projectMatchesHierarchy(p){
  if(!p) return false;
  if(!multiFilterHas(_curProjRoot, inferProjectGroupFromProject(p))) return false;
  if(!multiFilterHas(_curPhase, inferPhaseFromProject(p))) return false;
  if(!multiFilterHas(_curBuilding, inferBuildingFromProject(p))) return false;
  return true;
}
function getVisibleProjects(){
  return PROJS.filter(projectMatchesHierarchy);

/** Keep portfolio root sensible when V3 pushes many rows. */
function ensureProjRootCoherent(){
  if(!PROJS.length){ _curProjRoot='__all__'; return; }
  var uniq=[],seen={};
  PROJS.forEach(function(p){
    var r=inferProjectGroupFromProject(p);
    if(r && !seen[r]){ seen[r]=1; uniq.push(r); }
  });
  if(!uniq.length) return;
  var keep=parseMultiFilter(_curProjRoot).filter(function(r){ return uniq.indexOf(r)>=0; });
  _curProjRoot=encodeMultiFilter(keep);
}

function buildProjectGroupSelect(){

  PROJS.forEach(function(p){ set[inferProjectGroupFromProject(p)]=1; });
  Object.keys(set).sort().forEach(function(x){ if(x&&x!=='Unassigned') opts.push(x); });
  if(set.Unassigned) opts.push('Unassigned');
  var selVals=parseMultiFilter(_curProjRoot);

// ══════════════════════════════════════════════════════════════
// CASHFLOW ENGINE
// ══════════════════════════════════════════════════════════════
function minMonthKey(a,b){
  if(!a) return b||'';
  if(!b) return a;
  return a<=b?a:b;
}
function maxMonthKey(a,b){
  if(!a) return b||'';
  if(!b) return a;
  return a>=b?a:b;
}
/** Earliest YYYY-MM among recorded actuals (ledger lines). */
function earliestActualsMonthKey(cfg){
  var minMo='';
  (cfg.actuals||[]).forEach(function(a){
    if(!includeActualInCashflowSums(a)) return;
    var mk=a.date?String(a.date).slice(0,7):'';
    if(!/^\d{4}-\d{2}$/.test(mk)) return;
    if(!minMo||mk<minMo) minMo=mk;
  });
  return minMo;
}
/** Count of months m where fromMo <= m < toMoExclusive (YYYY-MM keys). */
function monthKeysBetweenHalfOpen(fromMo,toMoExclusive){
  var n=0, cur=fromMo;
  while(cur&&cur<toMoExclusive){
    n++;
    cur=addMonthsToMonthKey(cur,1);
  }
  return n;
}
function buildCashflow(pid){
  var cfg=getCF(pid);
  var fz=forecastCfg(cfg);
  var months=Math.max(1,cfg.totalMonths||60);
  var startDate=cfg.startDate||new Date().toISOString().slice(0,7)+'-01';
  var startKey=startDate.length>=7?startDate.slice(0,7):'';
  if(!/^\d{4}-\d{2}$/.test(startKey)) startKey=new Date().toISOString().slice(0,7);

  // Build actuals index by month+cat
  var actMap={};
  (cfg.actuals||[]).forEach(function(a){
    if(!includeActualInCashflowSums(a)) return;
    var mo=a.date?a.date.slice(0,7):'';
    if(!mo) return;
    if(!actMap[mo]) actMap[mo]={};
    actMap[mo][a.cat1]=(actMap[mo][a.cat1]||0)+coerceMoney(a.amount);
  });

  // Build capital inflow schedules — equity vs investor columns
  var equityInfMap={}, invFlowMap={};
  (cfg.investors||[]).forEach(function(inv){
    var moK=monthKeyFromInvestorDraw(inv,startDate);
    if(!moK||coerceMoney(inv.amount)<=0) return;
    var add=coerceMoney(inv.amount);
    if(inv.type==='equity') equityInfMap[moK]=(equityInfMap[moK]||0)+add;
    else invFlowMap[moK]=(invFlowMap[moK]||0)+add;
  });
  var ulFlowMap={};
  (cfg.unsecuredLoans||[]).forEach(function(ul){
    var moU=monthKeyFromFlexibleDate(ul.drawDate);
    if(moU&&coerceMoney(ul.amount)>0) ulFlowMap[moU]=(ulFlowMap[moU]||0)+coerceMoney(ul.amount);
  });
  var culFlowMap={};
  (cfg.customerUL||[]).forEach(function(cu){
    var moC=monthKeyFromFlexibleDate(cu.date);
    if(moC&&coerceMoney(cu.amount)>0) culFlowMap[moC]=(culFlowMap[moC]||0)+coerceMoney(cu.amount);
  });
  var otherFlowMap={};
  (cfg.otherInflows||[]).forEach(function(oi){
    var moO=monthKeyFromFlexibleDate(oi.date);
    if(moO&&coerceMoney(oi.amount)>0) otherFlowMap[moO]=(otherFlowMap[moO]||0)+coerceMoney(oi.amount);
  });

  // Build customer collection schedule (CRM: due / realized / deficit meta by milestone month)
  var salesTimingMeta={salesDeficitTotal:0};
  var custCollMap=buildCustomerCollections(cfg, startDate, salesTimingMeta);
  var unsoldSalesMap=buildUnsoldRealization(cfg, startDate);

  // Build outflow schedules
  var landMap={};
  (cfg.landSchedule||[]).forEach(function(e){
    var amtL=parseFloat(e.amount)||0;
    if(!amtL) return;
    var moL=scheduleMonthConsultantRow(e,startDate);
    if(moL) landMap[moL]=(landMap[moL]||0)+amtL;
  });
  var nocMap={};
  (cfg.nocSchedule||[]).forEach(function(e){
    var amtN=parseFloat(e.amount)||0;
    if(!amtN) return;
    var moN=scheduleMonthConsultantRow(e,startDate);
    if(moN) nocMap[moN]=(nocMap[moN]||0)+amtN;
  });
  var consultMap={};
  (cfg.consultantSchedule||[]).forEach(function(e){
    var amt=parseFloat(e.amount)||0;
    if(!amt) return;
    var moC=scheduleMonthConsultantRow(e,startDate);
    if(moC) consultMap[moC]=(consultMap[moC]||0)+amt;
  });
  var regConsultMap={};
  (cfg.regulatoryConsultingSchedule||[]).forEach(function(e){
    var amtR=parseFloat(e.amount)||0;
    if(!amtR) return;
    var moR=scheduleMonthConsultantRow(e,startDate);
    if(moR) regConsultMap[moR]=(regConsultMap[moR]||0)+amtR;
  });
  // Partner buyout → Land in month 0 if not in schedule
  if(cfg.partnerBuyout>0&&cfg.startDate&&!Object.keys(landMap).length){
    landMap[offsetMonth(startDate,0)]=(landMap[offsetMonth(startDate,0)]||0)+cfg.partnerBuyout;
  }

  // Construction schedule: month# from project start and/or explicit calendar date (expense template)
  var consMap={};
  (cfg.constructionSchedule||[]).forEach(function(e){
    var amt=parseFloat(e.amount)||0;
    if(!amt) return;
    var moC=scheduleMonthConsOrMkt(e,startDate);
    if(moC) consMap[moC]=(consMap[moC]||0)+amt;
  });
  // Marketing schedule: same
  var mktgSchedMap={};
  (cfg.marketingSchedule||[]).forEach(function(e){
    var amt=parseFloat(e.amount)||0;
    if(!amt) return;
    var moM=scheduleMonthConsOrMkt(e,startDate);
    if(moM) mktgSchedMap[moM]=(mktgSchedMap[moM]||0)+amt;
  });

  // Debt service schedule
  var debtInterestMap={};
  var debtPrincipalMap={};
  var debtBalance={};
  (cfg.debtTranches||[]).forEach(function(dt){debtBalance[dt.id]={bal:0,rate:dt.ratePct||12};});
  var ulBalance={};
  (cfg.unsecuredLoans||[]).forEach(function(ul,ui){ ulBalance[ui]={bal:0,rate:coerceMoney(ul.ratePct)||0}; });
  var invStates=[];
  (cfg.investors||[]).forEach(function(inv){
    if(!inv||inv.type==='equity') return;
    var principal=coerceMoney(inv.amount);
    if(principal<=0) return;
    var drawMo=monthKeyFromInvestorDraw(inv,startDate);
    if(!drawMo) return;
    var termMonths=Math.max(1,Math.round((coerceMoney(inv.termYrs)||2)*12));
    invStates.push({
      id:inv.id||('inv_'+i),
      bal:0,
      drawMo:drawMo,
      dueMo:addMonthsToMonthKey(drawMo,termMonths-1),
      principal:principal,
      rate:Math.max(0,coerceMoney(inv.ratePct)||0)
    });
  });

  var earliestAct=earliestActualsMonthKey(cfg);
  var floorMo=addMonthsToMonthKey(startKey,-120);
  var sequenceStart=startKey;
  if(earliestAct){
    var em=maxMonthKey(earliestAct,floorMo);
    if(em<sequenceStart) sequenceStart=em;
  }
  if(showPriorCalendarYears()){
    var janYr=startKey.slice(0,4)+'-01';
    if(janYr<startKey) sequenceStart=minMonthKey(sequenceStart,janYr);
  }
  var preCount=monthKeysBetweenHalfOpen(sequenceStart,startKey);

  var openingCash=0;
  var rows=[];
  var curMo=currentMonthStr();
  var totalSteps=preCount+months;

  for(var idx=0;idx<totalSteps;idx++){
    var mo, period, label, i;
    if(idx<preCount){
      mo=addMonthsToMonthKey(sequenceStart,idx);
      period=0;
      label=formatMonthKey(mo);
      i=-1;
    } else {
      i=idx-preCount;
      mo=offsetMonth(startDate,i);
      period=i+1;
      label=monthLabel(startDate,i);
    }
    var isActual=mo<=curMo&&mo!=='';
    var act=actMap[mo]||{};
    var ov=(period>0&&cfg.overrides&&cfg.overrides[period])||{};

    // ── INFLOWS ──
    // Scheduled sold-unit inflows → Sales Revenue only (avoid double-count with Customer Collections)
    var bucketMo=custCollMap[mo]||{};
    var schedSales  = (bucketMo.sales||0) + ((unsoldSalesMap[mo]&&unsoldSalesMap[mo].sales)||0);
    var actSalesRev = act['Sales Revenue'];
    var salesRev    = ov.salesRev !== undefined ? ov.salesRev : (actSalesRev!==undefined&&actSalesRev!==null ? actSalesRev : schedSales);
    var salesRealizedMo=bucketMo.salesRealized||0;
    var unsProj=((unsoldSalesMap[mo]&&unsoldSalesMap[mo].sales)||0);
    var salesProjectedLine=(mo>curMo)?((bucketMo.sales||0)+unsProj):0;
    var salesDeficitMo=(mo===curMo)?(salesTimingMeta.salesDeficitTotal||0):0;
    var equityInf   = ov.equityInf   !== undefined ? ov.equityInf   : (act['Equity Infusion']  || equityInfMap[mo] || 0);
    var invFunding  = ov.invFunding  !== undefined ? ov.invFunding  : (act['Investor Funding'] || invFlowMap[mo] || 0);
    var ulInflow    = ov.ulInflow    !== undefined ? ov.ulInflow    : (act['Unsecured Loan']    || ulFlowMap[mo]  || 0);
    var custColl    = ov.custColl    !== undefined ? ov.custColl    : (act['Customer Collections'] || 0);
    var custUL      = ov.custUL      !== undefined ? ov.custUL      : (act['Customer UL']       || culFlowMap[mo] || 0);
    var otherIn     = ov.otherIn     !== undefined ? ov.otherIn     : (act['Other Inflow']      || otherFlowMap[mo] || 0);

    // ── OUTFLOWS ──
    var land        = ov.land        !== undefined ? ov.land        : (act['Land']         || landMap[mo]    || 0);
    var noc         = ov.noc         !== undefined ? ov.noc         : (act['NOC']           || nocMap[mo]     || 0);
    var consultant  = ov.consultant  !== undefined ? ov.consultant  : (act['Consultant']   || consultMap[mo] || 0);
    var regulatoryConsulting= ov.regulatoryConsulting!==undefined ? ov.regulatoryConsulting : (act['Regulatory & Consulting']||regConsultMap[mo]||0);
    var construction= ov.construction!== undefined ? ov.construction: (isActual ? (act['Construction']||0) : (consMap[mo]||0));
    // G&A from V2 push or manual monthly
    var gaMonthly   = cfg.gaGAAnnual>0 ? cfg.gaGAAnnual/12 : (parseFloat(cfg.gaMonthly)||0);
    var gaDmAct     = act['GA DM Fee'];
    if(gaDmAct===undefined||gaDmAct===null) gaDmAct=act['GA-DM'];
    if(gaDmAct===undefined||gaDmAct===null) gaDmAct=act['G&A'];
    var ga          = ov.ga          !== undefined ? ov.ga          : (gaDmAct          || gaMonthly);
    // Marketing from V2 push or schedule
    var mktgMonthly = cfg.gaMktgAnnual>0 ? cfg.gaMktgAnnual/12 : 0;
    var marketing   = ov.marketing   !== undefined ? ov.marketing   : (act['Marketing']     || mktgSchedMap[mo] || (isActual?0:mktgMonthly));
    // Contingency = % of construction (projected only)
    var contingency = ov.contingency !== undefined ? ov.contingency : (act['Contingency']   || (isActual?0:construction*(cfg.contingencyPct||2)/100));

    if(!isActual && period>0){
      salesRev*=fz.salesFactor;
      custColl*=fz.collectionsFactor;
      otherIn*=fz.otherInflowFactor;
      consultant*=fz.costFactor;
      regulatoryConsulting*=fz.costFactor;
      construction*=fz.costFactor;
      marketing*=fz.marketingFactor;
      ga*=fz.gaFactor;
      contingency=contingency*fz.costFactor+fz.monthlyBuffer;
    }
    var totInflows  = salesRev+equityInf+invFunding+ulInflow+custColl+custUL+otherIn;

    // Debt: calculate interest on balances (monthly accrual on opening + draws this month before payment)
    var schedInt=0, debtDraw=0;
    (cfg.debtTranches||[]).forEach(function(dt){
      if(!debtBalance[dt.id]) debtBalance[dt.id]={bal:0,rate:dt.ratePct||12};
      var db=debtBalance[dt.id];
      var dKey=debtLenderKey('debt',dt.id||'');
      var drawMk=monthKeyFromFlexibleDate(dt.drawDate);
      if(drawMk===mo){
        var add=coerceMoney(dt.drawAmount);
        db.bal+=add; debtDraw+=add;
      }
      if(db.bal>0){
        var dInt=db.bal*(db.rate/100/12);
        if(isDebtPaymentMarked(cfg,mo,dKey,'interest')) schedInt+=dInt;
      }
    });
    // Unsecured loans: balance builds on draw; monthly interest at ratePct (additive to Interest Paid)
    var ulSchedInt=0, ulDrawThisMo=0;
    (cfg.unsecuredLoans||[]).forEach(function(ul,ui){
      var st=ulBalance[ui];
      if(!st) return;
      var um=monthKeyFromFlexibleDate(ul.drawDate);
      if(um===mo && coerceMoney(ul.amount)>0){
        var ulAdd=coerceMoney(ul.amount);
        st.bal+=ulAdd;
        ulDrawThisMo+=ulAdd;
      }
    });
    (cfg.unsecuredLoans||[]).forEach(function(ul,ui){
      var st=ulBalance[ui];
      if(st&&st.bal>0 && st.rate>0) ulSchedInt+=st.bal*(st.rate/100/12);
    });
    // Add only marked unsecured-loan interest.
    (cfg.unsecuredLoans||[]).forEach(function(ul,ui){
      var st=ulBalance[ui];
      if(!st||st.bal<=0||st.rate<=0) return;
      var ulKey=debtLenderKey('unsecured',ul.id||('ul_'+ui));
      if(isDebtPaymentMarked(cfg,mo,ulKey,'interest')) schedInt+=st.bal*(st.rate/100/12);
    });
    // Investor funding from Capital tab: monthly interest + bullet principal at term end.
    var invSchedInt=0, invSchedPrincipal=0, invDrawThisMo=0;
    invStates.forEach(function(st){
      if(st.drawMo===mo){
        st.bal+=st.principal;
        invDrawThisMo+=st.principal;
      }
      if(st.bal>0&&st.rate>0&&isDebtPaymentMarked(cfg,mo,debtLenderKey('investor',st.id||''),'interest')) invSchedInt+=st.bal*(st.rate/100/12);
      if(st.dueMo===mo&&st.bal>0){
        if(isDebtPaymentMarked(cfg,mo,debtLenderKey('investor',st.id||''),'principal')){
          invSchedPrincipal+=st.bal;
          st.bal=0;
        }
      }
    });
    schedInt+=invSchedInt;
    // Use Tally Interest Paid when present; otherwise model accrual (debt + unsecured + investor) for all months
    var actIntRaw=act['Interest Paid'];
    var intPaid=(actIntRaw!==undefined && actIntRaw!==null && actIntRaw!=='')?coerceMoney(actIntRaw):schedInt;
    var principalPaid=act['Principal Repaid'] || 0;

    // Principal repayment from tranche schedules
    if(!isActual)(cfg.debtTranches||[]).forEach(function(dt){
      var dKey=debtLenderKey('debt',dt.id||'');
      (dt.repaySchedule||[]).forEach(function(rs){
        if(isDebtPaymentMarked(cfg,mo,dKey,'principal')) principalPaid+=principalRepaymentInMonthHtml(rs, mo, period);
      });
    });
    if(!isActual) principalPaid+=invSchedPrincipal;

    // Update debt balance for repayments
    if(principalPaid>0){
      var remaining=principalPaid;
      (cfg.debtTranches||[]).forEach(function(dt){
        if(!debtBalance[dt.id]) return;
        var pay=Math.min(debtBalance[dt.id].bal,remaining);
        debtBalance[dt.id].bal-=pay; remaining-=pay;
      });
      (cfg.unsecuredLoans||[]).forEach(function(ul,ui){
        if(remaining<=0) return;
        var st=ulBalance[ui];
        if(!st||st.bal<=0) return;
        var pay=Math.min(st.bal,remaining);
        st.bal-=pay; remaining-=pay;
      });
      invStates.forEach(function(st){
        if(remaining<=0) return;
        if(!st||st.bal<=0) return;
        var pay=Math.min(st.bal,remaining);
        st.bal-=pay; remaining-=pay;
      });
    }

    var totOutflows = land+noc+consultant+regulatoryConsulting+construction+marketing+ga+contingency+intPaid+principalPaid;
    var netCF=totInflows-totOutflows;
    var closingCash=openingCash+netCF;
    var closingDebt=Object.values(debtBalance).reduce(function(s,v){return s+v.bal;},0)
      +(cfg.unsecuredLoans||[]).reduce(function(s,ul,ui){ var st=ulBalance[ui]; return s+(st&&st.bal>0?st.bal:0); },0)
      +invStates.reduce(function(s,st){ return s+(st&&st.bal>0?st.bal:0); },0);
    var openingDebt=closingDebt-(debtDraw+ulDrawThisMo+invDrawThisMo)+principalPaid;
    var cads=Math.max(0,closingCash);
    var debtService=(intPaid||0)+(principalPaid||0);
    var dscr=debtService>0?cads/debtService:null;

    var l1In = l1InflowFromRowVals({ salesRev, equityInf, invFunding, ulInflow, custColl, custUL, otherIn });
    var l1Out = l1OutflowFromRowVals({ land, noc, consultant, regulatoryConsulting, construction, marketing, ga, contingency, intPaid, principalPaid });
    rows.push({
      period,mo,label:label,
      isActual,isCurrent:mo===curMo,isPreProject:period===0,isForecast:(!isActual&&period>0),
      openingCash,
      salesRev,salesRealized:salesRealizedMo,salesProjectedShow:salesProjectedLine,salesDeficit:salesDeficitMo,
      equityInf,invFunding,ulInflow,custColl,custUL,otherIn,totInflows,
      land,noc,consultant,regulatoryConsulting,construction,marketing,ga,contingency,intPaid,principalPaid,totOutflows,
      netCF,closingCash,
      debtDraw,openingDebt,closingDebt,schedInt,debtService,cads,dscr,
      l1In, l1Out
    });
    openingCash=closingCash;
  }
  return rows;
}

function defaultForecastObj(){
  return {salesFactor:1,collectionsFactor:1,otherInflowFactor:1,costFactor:1,marketingFactor:1,gaFactor:1,monthlyBuffer:0};
}
/** Build rows with a temporary forecast override (for impact comparisons). */
function buildCashflowWithForecast(pid, override){
  var cfg=getCF(pid);
  var bak=cfg.forecast;
  cfg.forecast=Object.assign({},defaultForecastObj(),bak||{},override||{});
  var rows=buildCashflow(pid);
  cfg.forecast=bak;
  return rows;
}

function buildCustomerCollections(cfg, startDate, salesMeta){
  salesMeta=salesMeta||{};
  var map={};
  var curMo=currentMonthStr();
  var deficitTotal=0;
  function ensure(mo){
    if(!mo||mo.length<7) return null;
    if(!map[mo]) map[mo]={collections:0,sales:0,salesRealized:0,salesProjected:0,items:[]};
    return map[mo];
  }
  (cfg.units||[]).forEach(function(unit){
    var tv=coerceMoney(unit.totalValue);
    if(tv<=0||!unit.bookingDate) return;
    if(unit.payType==='const'){
      getConstSchedule(unit,cfg).forEach(function(item){
        if(!item.date) return;
        var iso=normalizeToISODate(item.date);
        if(!iso) return;
        var mo=iso.slice(0,7);
        var e=ensure(mo);
        if(!e) return;
        var amt=coerceMoney(item.amount);
        e.collections+=amt;
        e.sales+=amt;
        if(mo>curMo) e.salesProjected+=amt;
        if(amt!==0) e.items.push({unit:unit.unitNo,milestone:item.label,amount:amt,kind:'due'});
      });
      return;
    }
    if(installUsesCRMDueLines(unit)){
      groupCRMInstallmentsByBase(unit,cfg).forEach(function(g){
        var dueMo=crmMilestoneMonthKey(g.dueIso||'', unit);
        if(!dueMo) return;
        var e=ensure(dueMo);
        if(!e) return;
        var d=coerceMoney(g.due), r=coerceMoney(g.recv), pnd=coerceMoney(g.pend);
        if(d>0){
          e.collections+=d;
          e.sales+=d;
          if(dueMo>curMo) e.salesProjected+=d;
          e.items.push({unit:unit.unitNo,milestone:g.base+' (due)',amount:d,kind:'due'});
        }
        if(r>0){

function ensureUnsoldPaceCfg(cfg){
  if(!cfg.unsoldPace) cfg.unsoldPace={mode:'sqft',inputPeriod:'month',value:0,baseline:null};
  if(cfg.unsoldPace.baseline===undefined) cfg.unsoldPace.baseline=null;
  if(!cfg.unsoldPace.mode) cfg.unsoldPace.mode='sqft';

function unsoldPacePerMonth(cfg){

function countCalendarMonthsInclusive(ymStart, ymEnd){
  if(!ymStart||!ymEnd||ymStart>ymEnd) return 0;
  var a=ymStart.split('-'), b=ymEnd.split('-');

  if(!isFinite(y0)||!isFinite(m0)||!isFinite(y1)||!isFinite(m1)) return 0;
  return (y1-y0)*12+(m1-m0)+1;
}
function visibleUnsoldRows(cfg){

/** Spread unsold revenue by project CLP only when the row has "Project CLP" ticked (Sales tab). */

function unsoldProjectedBookingMonthKey(cfg,u){

function unsoldRowPlannedValue(u){

/** CLP schedule for one unsold row at projected booking (construction stage at booking = targets on/before booking month). */
function unsoldClpScheduleForRow(cfg,u,bookingIso){

  var sched=getConstSchedule(pseudo,cfg);

/** Sum of CLP tranches due in booking month for units projected to book in moKey (construction-linked stack at sale). */
function pipelineClpAtBookingMonth(cfg,moKey){

/** Exported for tests — CLP due in booking month for one unsold row. */

function clampConstScheduleAmountsToTotal(sched,tv){

  sched.forEach(function(x){ sum+=coerceMoney(x.amount); });
  if(sum<=cap+0.02) return sched;
  var f=cap/sum;
  return sched.map(function(x){ return {date:x.date,amount:coerceMoney(x.amount*f),label:x.label}; });
}
/** If CLP leaves undated tranches, append remainder at anchor booking so totals match planned sale value. */
function ensureUnsoldScheduleCapturesTotal(sched, anchorIso, totalVal){
  var tv=coerceMoney(totalVal);
  if(!sched||!sched.length||tv<=0) return sched;
  var alloc=0;
  sched.forEach(function(x){ alloc+=coerceMoney(x.amount); });
  if(alloc>=tv-0.02) return sched;
  var rem=tv-alloc;
  var ai=normalizeToISODate(anchorIso)||String(anchorIso||'').slice(0,10);

  return sched.concat([{date:ai,amount:rem,label:'Unsold (CLP balance)'}]);

function totalUnsoldBookValueFromQueue(cfg){

}
function scaleUnsoldMapToBookCap(map,cfg){

  var tot=0;
  Object.keys(map).forEach(function(k){ tot+=coerceMoney(map[k].sales); });
  if(tot<=cap+0.02) return map;
  var f=cap/tot;
  Object.keys(map).forEach(function(k){
    var mk=map[k];
    mk.sales=coerceMoney(mk.sales*f);
    (mk.items||[]).forEach(function(it){ it.amount=coerceMoney(coerceMoney(it.amount)*f); });
  });
  return map;
}
function addConstUnsoldToMap(map, cfg, bookingIso, totalValue, uRef){
  var tv=coerceMoney(totalValue);
  if(tv<=0) return;
  var bi=normalizeToISODate(bookingIso)||String(bookingIso);
  var pseudo={payType:'const',bookingDate:bi,totalValue:tv,milestonesDates:(uRef&&uRef.milestonesDates)||{}};
  var labelUnit=(uRef&&(uRef.unitNo||uRef.id))||'Pace (unsold)';
  if(unsoldUsesConstScheduleSpread(uRef)){
    var sched=getConstSchedule(pseudo,cfg);
    sched=clampConstScheduleAmountsToTotal(sched,tv);
    sched=ensureUnsoldScheduleCapturesTotal(sched,bi,tv);
    if(sched&&sched.length){
      sched.forEach(function(it){
        var iso=normalizeToISODate(it.date);
        if(!iso) return;
        var mKey=iso.slice(0,7);
        if(!map[mKey]) map[mKey]={sales:0,items:[]};
        var amt=coerceMoney(it.amount);
        map[mKey].sales+=amt;
        map[mKey].items.push({unit:labelUnit,amount:amt,milestone:it.label||'Milestone'});
      });
      return;
    }
  }
  var m0=bi.slice(0,7);
  if(!map[m0]) map[m0]={sales:0,items:[]};
  map[m0].sales+=tv;
  map[m0].items.push({unit:labelUnit,amount:tv,milestone:unsoldUsesConstScheduleSpread(uRef)?'Unsold CLP fallback (no dated tranches)':'Unsold projected sale (lump)'});
}
/** Revenue map for unsold: FIFO lots + same CLP as sold const-linked units. Optional `opts` for max(projectedSalePerMonth) path. */
function buildUnsoldGlobalPaceRevenueMap(cfg, opts){
  var map={};
  var queue=buildUnsoldPaceQueue(cfg);
  if(!queue.length) return map;
  ensureUnsoldPaceCfg(cfg);
  var o=opts&&typeof opts==='object'?opts:null;
  var mode=cfg.unsoldPace.mode==='units'?'units':'sqft';
  if(o&&o.unitsPerMonth!=null) mode='units';
  if(o&&o.sqftPerMonth!=null) mode='sqft';
  if(o&&o.mode) mode=o.mode;
  var pace=0;
  if(o&&mode==='units'&&o.unitsPerMonth!=null) pace=Math.max(0,+o.unitsPerMonth)||0;
  else if(o&&mode==='sqft'&&o.sqftPerMonth!=null){
    var v=+o.sqftPerMonth; pace=(o.inputPeriod==='quarter'&&v>0)?(v/3):v;
  } else pace=unsoldPacePerMonth(cfg);
  if(pace<=0) return map;
  var startMo=(o&&o.startMonthKey&&/^\d{4}-\d{2}$/.test(String(o.startMonthKey).slice(0,7)))?String(o.startMonthKey).slice(0,7):currentMonthStr();
  if(mode==='units'){
    var nPerMo=Math.max(0,Math.floor(pace+1e-6));
    if(pace>0&&nPerMo<1) nPerMo=1;
    if(nPerMo<0.1) return map;
    var mi=0;
    while(queue.length>0.5&&mi<600){
      var bookYm=addMonthsToYM(startMo,mi);
      if(!bookYm) break;
      var bookIso2=normalizeToISODate(bookYm+'-15')||bookYm+'-15';
      var nThis=Math.min(nPerMo,queue.length);
      for(var ii=0;ii<nThis;ii+=1){
        var lot2=queue.shift();
        if(!lot2) break;
        addConstUnsoldToMap(map,cfg,bookIso2,lot2.val,lot2.row);
      }
      mi++;
    }
    return scaleUnsoldMapToBookCap(map,cfg);
  }
  var remQ=queue.map(function(x){ return {row:x.row,area:coerceMoney(x.area),val:coerceMoney(x.val)}; });
  var mJ=0;
  while(remQ.length>0.5&&mJ<600){
    var bookYm2=addMonthsToYM(startMo,mJ);
    if(!bookYm2) break;
    var bookIso3=normalizeToISODate(bookYm2+'-15')||bookYm2+'-15';
    var remP=pace;
    while(remP>0.1&&remQ.length){
      var h0=remQ[0];
      if(h0.area<0.1){ remQ.shift(); continue; }
      if(h0.area<=remP+0.1){
        var takeA0=h0.area, lot0=remQ.shift();
        if(lot0) addConstUnsoldToMap(map,cfg,bookIso3,lot0.val,lot0.row);
        remP-=takeA0; continue;
      }
      var fr0=remP/h0.area, partV0=h0.val*fr0;
      h0.val-=partV0; h0.area-=remP;
      addConstUnsoldToMap(map,cfg,bookIso3,partV0,h0.row);
      remP=0;
      if(h0.area<0.1) remQ.shift();
    }
    mJ++;
  }
  return scaleUnsoldMapToBookCap(map,cfg);
}
function soldStatsForPaceCompare(cfg, sinceYM){
  var sq=0, val=0, n=0, miss=0;
  (cfg.units||[]).forEach(function(u){
    var b=(normalizeToISODate(u.bookingDate)||'').slice(0,7);
    if(!b||b<sinceYM) return;
    n++;
    var a=coerceMoney(u.saleableArea);
    if(a>0) sq+=a; else miss++;
    val+=coerceMoney(u.totalValue);
  });
  return {sqft:sq,value:val,units:n,missingAreaCount:miss};
}
function computeUnsoldPaceVsBaseline(cfg){
  ensureUnsoldPaceCfg(cfg);
  var b=cfg.unsoldPace.baseline;
  if(!b||!b.at) return null;
  var cur=currentMonthStr();
  var nM=b.at>cur?0:countCalendarMonthsInclusive(b.at,cur);
  var pace=+b.pacePerMonth||0;
  var mode=b.mode==='units'?'units':'sqft';
  var plannedSq=0, plannedVal=0;
  if(mode==='sqft'){
    var W=+b.blendedPSqft||0;
    var capS=+b.bsSqft||0;
    plannedSq=Math.min(nM*pace,capS);
    plannedVal=Math.min(plannedSq*W,+b.bsVal||0);
  } else {
    var av=+b.avgValPerUnit||0;
    var capU=+b.bsUnits||0;
    var uPl=Math.min(nM*pace,capU);
    plannedVal=Math.min(uPl*av,+b.bsVal||0);
    plannedSq=uPl*(capU>0.01?((+b.bsSqft||0)/capU):0);
  }
  var act=soldStatsForPaceCompare(cfg,b.at);
  return{
    nMonths:nM, baselineMonth:b.at,
    plannedSqft:plannedSq, plannedValue:plannedVal, mode:mode,
    actualSqft:act.sqft, actualValue:act.value, actualUnits:act.units,
    missArea:act.missingAreaCount,
    deltaValue:act.value-plannedVal, deltaSqft:act.sqft-plannedSq
  };
}

function buildUnsoldRealization(cfg, startDate){
  ensureUnsoldPaceCfg(cfg);
  if(unsoldGlobalPaceActive(cfg)) return buildUnsoldGlobalPaceRevenueMap(cfg);
  var soldSet={};
  (cfg.units||[]).forEach(function(u){ soldSet[normalizeUnitNoKey(u&&u.unitNo)]=1; });
  var unsold=(cfg.unsoldUnits||[]).filter(function(u){ return !soldSet[normalizeUnitNoKey(u&&u.unitNo)]; });
  var maxPpm=0;
  unsold.forEach(function(u){ maxPpm=Math.max(maxPpm, coerceMoney(u.projectedSalePerMonth)); });
  if(maxPpm>0){
    return buildUnsoldGlobalPaceRevenueMap(cfg, { mode:'units', unitsPerMonth: maxPpm, startMonthKey: currentMonthStr() });
  }
  var map={};
  unsold.forEach(function(u){
    var area=coerceMoney(u.saleableArea);
    var rate=coerceMoney(u.plannedRatePerSqft);
    var val=coerceMoney(u.plannedSaleValue||u.totalValue||(area>0&&rate>0?area*rate:0));
    if(val<=0) return;
    var saleIso=normalizeToISODate(u.projectedSaleDate)||'';
    if(saleIso){
      if(unsoldUsesConstScheduleSpread(u)){
        var pseudo={payType:'const',bookingDate:saleIso,totalValue:val,milestonesDates:(u.milestonesDates&&typeof u.milestonesDates==='object')?u.milestonesDates:{}};
        var schedU=getConstSchedule(pseudo,cfg);
        schedU=clampConstScheduleAmountsToTotal(schedU,val);
        schedU=ensureUnsoldScheduleCapturesTotal(schedU,saleIso,val);
        if(schedU&&schedU.length){
          schedU.forEach(function(it){
            var iso2=normalizeToISODate(it.date);
            if(!iso2) return;
            var mo=iso2.slice(0,7);
            if(!map[mo]) map[mo]={sales:0,items:[]};
            var amt=coerceMoney(it.amount);
            map[mo].sales+=amt;
            map[mo].items.push({unit:u.unitNo||'Unsold',amount:amt,milestone:it.label||'Milestone'});
          });
          return;
        }
      }
      var moSale=saleIso.slice(0,7);
      if(!map[moSale]) map[moSale]={sales:0,items:[]};
      map[moSale].sales+=val;
      map[moSale].items.push({unit:u.unitNo||'Unsold',amount:val,milestone:'Unsold projected sale (lump)'});
      return;
    }
    var m=parseInt(u.expectedMonth,10);
    if(!m||m<1) return;
    var mo=offsetMonth(startDate,m-1);

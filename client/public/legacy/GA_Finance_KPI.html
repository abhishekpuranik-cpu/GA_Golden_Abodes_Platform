<style>
:root{
  --gold:#A07800;--gold-l:#FDF8EC;--gold-b:#6B5000;
  --blue:#1558A0;--blue-l:#EAF1FB;--blue-b:#0A3266;
  --red:#A8301E;--red-l:#FDECEA;--red-b:#6E1D12;
  --green:#1A7244;--green-l:#E8F6EE;--green-b:#0F4829;
  --purple:#542B8A;--purple-l:#F2ECF9;--purple-b:#341860;
  --teal:#0B7070;--teal-l:#E6F5F5;--teal-b:#064646;
  --orange:#B54D0A;--orange-l:#FEF0E5;--orange-b:#7A3205;
  --slate:#4A5568;--slate-l:#F0F1F3;--slate-b:#1A202C;
  --bg:#F5F7FA;--card:#FFFFFF;--border:#DDE2EA;
  --text:#1A202C;--muted:#64748B;--radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:var(--text);background:var(--bg)}
html.ga-vault-embed,html.ga-vault-embed body{width:100%;min-height:100%}
.hdr{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:200;box-shadow:var(--shadow)}
.logo{font-size:15px;font-weight:800;color:var(--blue-b)}.logo span{color:var(--gold-b)}
.tabs{background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;display:flex;overflow-x:auto}
.tab{padding:10px 18px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.page{padding:16px 20px;min-height:80vh}.hidden{display:none!important}
.card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.kpi-stat{background:var(--card);border-radius:var(--radius);padding:12px 14px;border:1px solid var(--border);box-shadow:var(--shadow)}
.kpi-stat .v{font-size:22px;font-weight:800;line-height:1.1;margin-top:4px}
.kpi-stat .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kpi-stat .s{font-size:10px;color:var(--muted);margin-top:3px}
input[type=number]{padding:4px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;font-weight:600;background:var(--bg);text-align:center;width:74px}
input[type=number]:focus{border-color:var(--blue);outline:none;background:#F0F6FF}
input[type=text],input[type=date],input[type=month]{padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;background:var(--bg)}
input[type=text]{width:100%}
textarea{padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;background:var(--bg);width:100%;font-family:inherit;resize:vertical}
select{padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;background:var(--bg)}
.btn{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:700;border:none;cursor:pointer}
.btn-blue{background:var(--blue);color:#fff}.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--muted)}
.btn-green{background:var(--green);color:#fff}.btn-red{background:transparent;border:1.5px solid var(--red);color:var(--red-b)}
.btn-gold{background:var(--gold);color:#fff}
.sc-btn{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer}
.sc-btn.on{background:var(--gold-l);color:var(--gold-b);border-color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:11px}
th{padding:7px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg);border-bottom:2px solid var(--border)}
td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:hover td{background:#FAFBFD}
.info{background:var(--blue-l);border-radius:8px;padding:10px 14px;font-size:11px;margin-bottom:12px;color:var(--blue-b)}
.warn{background:var(--red-l);border-radius:8px;padding:10px 14px;font-size:11px;margin-bottom:12px;color:var(--red-b);font-weight:600}
.ok-strip{background:var(--green-l);border-radius:8px;padding:10px 14px;font-size:11px;margin-bottom:12px;color:var(--green-b);font-weight:600}
.cat-row td{background:var(--slate-l)!important;font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-b)}
.sug{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;background:var(--teal-l);color:var(--teal-b);cursor:pointer;border:1px solid var(--teal)}
.grid{display:grid;gap:12px}
.lockbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h3.sec{font-size:13px;font-weight:800;margin:14px 0 8px;color:var(--blue-b)}
.muted{color:var(--muted)}
.r4{color:var(--green-b);font-weight:800}.r3{color:var(--blue-b);font-weight:800}.r2{color:var(--orange-b);font-weight:800}.r1{color:var(--red-b);font-weight:800}
.score-hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:14px}
.score-hero .num{font-size:34px;font-weight:800;line-height:1}
.step-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.step-n{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.step-t{font-size:13px;font-weight:800;color:var(--blue-b)}
.adm{background:var(--gold-l);border:1px solid var(--gold);color:var(--gold-b);font-weight:700;font-size:10px;padding:3px 10px;border-radius:12px}
.pod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}
.pod-card{background:var(--card);border-radius:var(--radius);padding:14px;border:1px solid var(--border);box-shadow:var(--shadow);border-left:4px solid var(--blue)}
.pod-comp{border-left-color:var(--purple-b)}.pod-ops{border-left-color:var(--teal-b)}
.pod-h{font-size:12px;font-weight:800;color:var(--blue-b);margin-bottom:6px}
.pod-role{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
.pod-member{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:11px}
.pod-member:last-child{border-bottom:none}
.lane-chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;text-transform:uppercase}
.lane-comp{background:var(--purple-l);color:var(--purple-b)}.lane-ops{background:var(--teal-l);color:var(--teal-b)}
.raci-r{background:var(--green-l);color:var(--green-b);font-weight:800}
.raci-a{background:var(--blue-l);color:var(--blue-b);font-weight:800}
.raci-c{background:var(--orange-l);color:var(--orange-b);font-weight:700}
.raci-i{background:var(--slate-l);color:var(--slate-b)}
</style>

/* ------------- Compliance calendar generator (any FY) --------------- */
function pad2(n){return ('0'+n).slice(-2);}
function genCalendar(startYear){
  var rows=[],id=1;
  function add(obl,auth,period,due){rows.push({id:'C'+startYear+'_'+(id++),obligation:obl,authority:auth,period:period,due:due,actual:'',remarks:''});}
  var fyShort=String(startYear).slice(2)+'-'+String(startYear+1).slice(2);
  var prevShort=String(startYear-1).slice(2)+'-'+String(startYear).slice(2);
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  for(var m=4;m<=15;m++){
    var y=m<=12?startYear:startYear+1, mm=m<=12?m:m-12;
    var pm=mm===1?12:mm-1, py=mm===1?y-1:y;
    var pLab=MON[pm-1]+'-'+String(py).slice(2);
    add('TDS deposit \u2014 Challan 281','Income Tax',pLab,y+'-'+pad2(mm)+'-07');
    add('GSTR-1 filing','GSTN',pLab,y+'-'+pad2(mm)+'-11');
    add('GSTR-3B filing','GSTN',pLab,y+'-'+pad2(mm)+'-20');
    if(mm===4)add('RERA Q4 financial disclosure','MahaRERA','Q4 FY'+prevShort,y+'-04-30');
    if(mm===5)add('TDS Q4 return \u2014 Form 24Q / 26Q','Income Tax / TRACES','Jan\u2013Mar '+(y),y+'-05-31');
    if(mm===6)add('Advance tax \u2014 1st installment (15%)','Income Tax','FY'+fyShort,y+'-06-15');
    if(mm===7){add('TDS Q1 return \u2014 Form 24Q / 26Q','Income Tax / TRACES','Apr\u2013Jun '+y,y+'-07-31');add('RERA Q1 financial disclosure','MahaRERA','Q1 FY'+fyShort,y+'-07-31');}
    if(mm===9)add('Advance tax \u2014 2nd installment (45%)','Income Tax','FY'+fyShort,y+'-09-15');
    if(mm===10){add('TDS Q2 return \u2014 Form 24Q / 26Q','Income Tax / TRACES','Jul\u2013Sep '+y,y+'-10-31');add('RERA Q2 financial disclosure','MahaRERA','Q2 FY'+fyShort,y+'-10-31');}
    if(mm===12){add('Advance tax \u2014 3rd installment (75%)','Income Tax','FY'+fyShort,y+'-12-15');add('GSTR-9 annual return (FY'+prevShort+')','GSTN','FY'+prevShort,y+'-12-31');add('GSTR-9C reconciliation statement (FY'+prevShort+')','GSTN','FY'+prevShort,y+'-12-31');}
    if(mm===1){add('TDS Q3 return \u2014 Form 24Q / 26Q','Income Tax / TRACES','Oct\u2013Dec '+(y-1),y+'-01-31');add('RERA Q3 financial disclosure','MahaRERA','Q3 FY'+fyShort,y+'-01-31');}
    if(mm===3)add('Advance tax \u2014 4th installment (100%)','Income Tax','FY'+fyShort,y+'-03-15');
  }
  add('RERA Q4 financial disclosure','MahaRERA','Q4 FY'+fyShort,(startYear+1)+'-04-30');
  add('TDS Q4 return \u2014 Form 24Q / 26Q','Income Tax / TRACES','Jan\u2013Mar '+(startYear+1),(startYear+1)+'-05-31');
  rows.sort(function(a,b){return a.due<b.due?-1:1;});
  return rows;
}

var S=null;
function defaultState(){
  return {
    meta:{fy:FY_LABEL,created:new Date().toISOString(),v:3},
    employees:defaultEmployees(),
    kpis:{}, /* per-employee KPI sets, seeded lazily from TEMPLATES */
    workSplit:defaultWorkSplit(),
    compliance:genCalendar(FY_START_YEAR),
    raBills:[], corrections:[], payments:[],
    training:genTraining(FY_START_YEAR),
    reviews:{}, /* 'empId|YYYY-MM' -> {a:{kpiId:val},date,wins,issues,actions,prior,lockBy,lockTs} */
    appraisals:{}, audit:[]
  };
}
function migrateV1(old){
  var s=defaultState();
  try{
    if(old.employees&&old.employees.length)s.employees=old.employees;
    s.raBills=old.raBills||[];s.corrections=old.corrections||[];s.payments=old.payments||[];
    /* keep historical compliance rows that were actually filed */
    (old.compliance||[]).forEach(function(c){if(c.actual)s.compliance.push(c);});
    s.compliance.sort(function(a,b){return a.due<b.due?-1:1;});
    /* keep completed training rows as history */
    (old.training||[]).forEach(function(t){if(t.completed)s.training.push(t);});
    /* merge scores + 1:1 logs + locks into unified reviews */
    var keys={};
    Object.keys(old.scores||{}).forEach(function(k){keys[k]=1;});
    Object.keys(old.ones||{}).forEach(function(k){keys[k]=1;});
    Object.keys(keys).forEach(function(k){
      var o=(old.ones||{})[k]||{},sc=(old.scores||{})[k]||{},lk=(old.locks||{})[k];
      s.reviews[k]={a:sc,date:o.date||'',wins:o.wins||'',issues:o.issues||'',actions:o.actions||'',prior:o.prior||'',lockBy:lk?lk.by:'',lockTs:lk?lk.ts:''};
    });
    s.appraisals=old.appraisals||{};
    s.audit=old.audit||[];
    s.audit.unshift({ts:new Date().toISOString(),action:'migrate',detail:'Upgraded v1 state to FY '+FY_LABEL+' (v2)'});
  }catch(e){}
  return s;
}
function loadState(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(raw){S=JSON.parse(raw);ensureV3State();return;}
    var rawV1=localStorage.getItem(LS_KEY_V1);
    if(rawV1){S=migrateV1(JSON.parse(rawV1));ensureV3State();return;}
  }catch(e){}
  S=defaultState();
}
var _saveT=null;
function saveState(manual){
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));
    var el=document.getElementById('save-status');
    el.textContent='Saved '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    if(manual){el.style.color='var(--green-b)';setTimeout(function(){el.style.color='var(--muted)';},1500);}
  }catch(e){alert('Save failed: '+e.message);}
}
function touch(){if(_saveT)clearTimeout(_saveT);_saveT=setTimeout(function(){saveState(false);},400);scheduleMongoStateSave(800);}
function logAudit(action,detail){S.audit.unshift({ts:new Date().toISOString(),action:action,detail:detail});if(S.audit.length>500)S.audit.length=500;touch();}

/* --------------------------- Mongo cloud sync ----------------------- */
var MONGO_APP_ID='finance_kpi';
var GA_MONGO_ENABLE_KEY='ga_mongo_state_enable';
var GA_MONGO_API_BASE_KEY='ga_mongo_api_base';
var _mongoSaveT=null,_mongoVersion=null,_mongoPullDone=false;
function mongoStateApiUrl(){
  var path='api/apps/'+MONGO_APP_ID+'/state';
  var base='';
  try{base=String(localStorage.getItem(GA_MONGO_API_BASE_KEY)||'').trim().replace(/\/$/,'');}catch(e){}
  return (base?base+'/':'/')+path;
}
function canUseMongoState(){
  try{return localStorage.getItem(GA_MONGO_ENABLE_KEY)==='1';}catch(e){return false;}
}
function setMongoEnabled(on){
  try{localStorage.setItem(GA_MONGO_ENABLE_KEY,on?'1':'0');}catch(e){}
}
function packMongoPayload(){
  var o={};
  o[LS_KEY]=JSON.stringify(S);
  return o;
}
function applyMongoPayload(data){
  if(!data||typeof data!=='object')return false;
  var raw=data[LS_KEY];
  if(typeof raw==='string'){
    try{S=JSON.parse(raw);ensureV3State();return true;}catch(e){}
  }
  if(raw&&typeof raw==='object'){S=raw;ensureV3State();return true;}
  return false;
}
function mongoStatus(msg,color){
  var el=document.getElementById('save-status');
  if(!el||!msg)return;
  el.textContent=msg;
  if(color==='green')el.style.color='var(--green-b)';
  else if(color==='red')el.style.color='var(--red-b)';
  else el.style.color='var(--muted)';
}
function scheduleMongoStateSave(ms){
  if(!canUseMongoState())return;
  if(_mongoSaveT)clearTimeout(_mongoSaveT);
  _mongoSaveT=setTimeout(pushMongoState,ms||800);
}
function pushMongoState(){
  if(!canUseMongoState())return;
  var body={data:packMongoPayload(),updatedBy:ADMIN_NAME||'finance_kpi'};
  if(_mongoVersion!=null)body.expectedVersion=_mongoVersion;
  fetch(mongoStateApiUrl(),{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      if(res.ok&&res.j){_mongoVersion=res.j.version||_mongoVersion;mongoStatus('Cloud saved · v'+(res.j.version||'?'),'green');}
      else if(res.j&&res.j.error)mongoStatus('Cloud save: '+res.j.error,'red');
    })
    .catch(function(){mongoStatus('Cloud save offline','red');});
}
function pullMongoState(cb){
  fetch(mongoStateApiUrl(),{credentials:'same-origin',cache:'no-store'})
    .then(function(r){if(r.status===404)return null;return r.json();})
    .then(function(j){
      if(j&&j.data&&applyMongoPayload(j.data)){
        _mongoVersion=j.version||null;
        _mongoPullDone=true;
        mongoStatus('Loaded from cloud · v'+(j.version||'?'),'green');
      }
      if(cb)cb();
    })
    .catch(function(){if(cb)cb();});
}
function initMongoSync(){
  fetch('/api/auth/session',{credentials:'same-origin',cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j&&j.authenticated)setMongoEnabled(true);
      if(canUseMongoState())pullMongoState(function(){renderTab(curTab);});
    })
    .catch(function(){});
}

/* --------------------------- Admin mode ----------------------------- */
/* Admin = platform session with 'finance_kpi_admin' app right or
   'manage_security' permission. Managed in the Admin Security console. */
function checkAdminSession(cb){
  fetch('/api/auth/session',{credentials:'same-origin',cache:'no-store'})
    .then(function(r){return r.json().then(function(j){return {reach:true,j:j};}).catch(function(){return {reach:true,j:null};});})
    .catch(function(){return {reach:false,j:null};})
    .then(function(res){
      var authed=false;
      if(res.j&&res.j.authenticated&&res.j.user){
        authed=true;
        var u=res.j.user;
        var apps=(u.allowedApps||[]).map(String),perms=(u.permissions||[]).map(String);
        if(perms.indexOf('manage_security')>=0||apps.indexOf(ADMIN_APP)>=0){
          ADMIN=true;ADMIN_VIA='platform';ADMIN_NAME=u.name||u.email||'Admin';
        }else if(ADMIN_VIA!=='password'){
          ADMIN=false;ADMIN_NAME=u.name||u.email||'';
        }
      }
      updateAdminUi();
      if(cb)cb(res.reach,authed);
    });
}
function updateAdminUi(){
  var badge=document.getElementById('adm-badge'),btn=document.getElementById('adm-btn');
  badge.classList.toggle('hidden',!ADMIN);
  if(ADMIN)badge.textContent='ADMIN \u00b7 '+ADMIN_NAME+(ADMIN_VIA==='platform'?' \u00b7 via Admin Security':' \u00b7 offline');
  btn.textContent=ADMIN?(ADMIN_VIA==='password'?'Exit admin':'Admin info'):'Admin access';
}
function adminInfo(){
  if(ADMIN&&ADMIN_VIA==='password'){
    ADMIN=false;ADMIN_VIA='';ADMIN_NAME='';
    logAudit('admin.off','offline admin ended');
    updateAdminUi();renderTab(curTab);return;
  }
  if(ADMIN){
    alert('Admin is active via your App Vault login ('+ADMIN_NAME+').\n\nTo give admin to someone else: Admin Security console \u2192 add the app right "'+ADMIN_APP+'" to their user. Accounts with the manage_security permission (e.g. abhishek.puranik@goldenabodes.com) are admins automatically.');
    return;
  }
  checkAdminSession(function(reach,authed){
    if(ADMIN){renderTab(curTab);return;}
    if(reach&&authed){
      alert('Your App Vault account does not have Finance KPI admin rights.\n\nAsk Abhishek Puranik to add the app right "'+ADMIN_APP+'" to your user in the Admin Security console.');
    }else if(reach){
      alert('You are not logged into the App Vault in this browser.\n\nOpen the vault, log in (e.g. abhishek.puranik@goldenabodes.com), then return here \u2014 admin activates automatically.');
    }else{
      var pw=window.prompt('Platform API unreachable (offline / local file).\n\nEnter the offline admin password:');
      if(pw==null)return;
      if(pw!==ADMIN_PW){alert('Wrong password.');return;}
      ADMIN=true;ADMIN_VIA='password';ADMIN_NAME='Offline admin';
      logAudit('admin.on','offline password fallback');
      updateAdminUi();renderTab(curTab);
    }
  });
}
function needAdmin(){if(!ADMIN){alert('Admin rights required.\n\nAdmin is tied to your App Vault login \u2014 granted in the Admin Security console (app right "'+ADMIN_APP+'"). Click "Admin access" in the header to re-check.');return true;}return false;}

/* --------------------------- Helpers ------------------------------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtD(iso){if(!iso)return '';var d=new Date(iso+'T00:00:00');if(isNaN(d))return iso;return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'});}
function todayISO(){return new Date().toISOString().slice(0,10);}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function workDays(a,b){
  if(!a||!b)return null;var d=new Date(a+'T00:00:00'),e=new Date(b+'T00:00:00');if(e<d)return 0;var n=0;
  while(d<e){d.setDate(d.getDate()+1);var w=d.getDay();if(w!==0&&w!==6)n++;}
  return n;
}
function ymOf(iso){return iso?iso.slice(0,7):'';}
function ymLabel(ym){if(!ym)return '';var d=new Date(ym+'-01T00:00:00');return d.toLocaleDateString('en-IN',{month:'short',year:'2-digit'});}
function isQtrEnd(ym){var m=+ym.slice(5,7);return m===3||m===6||m===9||m===12;}
function fyQuarter(ym){var m=+ym.slice(5,7);if(m>=4&&m<=6)return 'Q1';if(m>=7&&m<=9)return 'Q2';if(m>=10&&m<=12)return 'Q3';return 'Q4';}
function prevYm(ym){var d=new Date(ym+'-01T00:00:00');d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7);}
function curYm(){return new Date().toISOString().slice(0,7);}
function inr(n){if(n==null||n==='')return '';return Number(n).toLocaleString('en-IN');}
function rate(k,v){
  if(!k.dir||!k.th||v===''||v==null||isNaN(+v))return null;v=+v;
  if(k.dir==='lte'){if(v<=k.th[0])return 4;if(v<=k.th[1])return 3;if(v<=k.th[2])return 2;return 1;}
  if(v>=k.th[0])return 4;if(v>=k.th[1])return 3;if(v>=k.th[2])return 2;return 1;
}
var RATE_LABEL={4:'Outstanding',3:'Meets',2:'Needs Improv.',1:'Unsatisfactory'};
function rateLabels(k){
  if(!k.th||!k.dir)return ['\u2014','\u2014','\u2014','\u2014'];
  return k.dir==='lte'?['\u2264 '+k.th[0],'\u2264 '+k.th[1],'\u2264 '+k.th[2],'beyond '+k.th[2]]:['\u2265 '+k.th[0],'\u2265 '+k.th[1],'\u2265 '+k.th[2],'below '+k.th[2]];
}
function band(score){
  if(score==null)return null;
  if(score>=3.5)return {l:'\u2605 Outstanding',c:'var(--green-b)',bg:'var(--green-l)'};
  if(score>=3.0)return {l:'Exceeds Expectations',c:'var(--blue-b)',bg:'var(--blue-l)'};
  if(score>=2.5)return {l:'Meets Expectations',c:'var(--gold-b)',bg:'var(--gold-l)'};
  return {l:'Needs Improvement',c:'var(--red-b)',bg:'var(--red-l)'};
}
function empById(id){for(var i=0;i<S.employees.length;i++)if(S.employees[i].id===id)return S.employees[i];return null;}
function kpisFor(empId){
  var emp=empById(empId);if(!emp)return [];
  if(!S.kpis[empId]){
    S.kpis[empId]=JSON.parse(JSON.stringify(TEMPLATES[emp.role]||[]));
    touch();
  }
  return S.kpis[empId];
}
function scoreable(k){return !!(k.dir&&k.th&&+k.wt>0);}
function dueKpis(empId,ym){return kpisFor(empId).filter(function(k){return scoreable(k)&&(k.freq==='M'||isQtrEnd(ym));});}
function reviewOf(key){if(!S.reviews[key])S.reviews[key]={a:{},date:'',wins:'',issues:'',actions:'',prior:'',lockBy:'',lockTs:''};return S.reviews[key];}
function monthScore(empId,ym){
  var ks=dueKpis(empId,ym),vals=(S.reviews[empId+'|'+ym]||{}).a||{},sw=0,tw=0,n=0;
  ks.forEach(function(k){var r=rate(k,vals[k.id]);if(r!=null){sw+=r*k.wt;tw+=k.wt;n++;}});
  if(!n)return null;
  return {score:sw/tw,rated:n,due:ks.length};
}
function compStatus(c){
  if(c.actual){var d=dayDiff(c.actual,c.due);return d>=0?{l:'On time',cls:'var(--green-b)',bg:'var(--green-l)',late:false,days:d}:{l:'Late '+(-d)+'d',cls:'var(--red-b)',bg:'var(--red-l)',late:true,days:d};}
  var d2=dayDiff(todayISO(),c.due);
  if(d2<0)return {l:'OVERDUE '+(-d2)+'d',cls:'#fff',bg:'var(--red)',late:true,days:d2};
  return {l:'Due in '+d2+'d',cls:d2<=14?'var(--orange-b)':'var(--muted)',bg:d2<=14?'var(--orange-l)':'var(--slate-l)',late:false,days:d2};
}

/* ------------------- Auto-suggested KPI actuals --------------------- */
function suggest(kpi,empId,ym){
  if(!kpi.auto)return null;
  if(kpi.auto==='gst'){
    var rows=S.compliance.filter(function(c){return c.authority==='GSTN'&&ymOf(c.due)===ym;});
    var done=rows.filter(function(c){return c.actual;});
    if(!rows.length||done.length<rows.length)return null;
    var ok=done.filter(function(c){return dayDiff(c.actual,c.due)>=0;}).length;
    return {v:Math.round(ok/rows.length*100),why:ok+'/'+rows.length+' GST filings on time (Compliance Calendar)'};
  }
  if(kpi.auto==='ra'){
    var bills=S.raBills.filter(function(b){return b.paymentDate&&ymOf(b.paymentDate)===ym&&b.received;});
    if(!bills.length)return null;
    var tot=0;bills.forEach(function(b){tot+=workDays(b.received,b.paymentDate);});
    return {v:Math.round(tot/bills.length*10)/10,why:bills.length+' bills paid this month (RA Bill Register)'};
  }
  if(kpi.auto==='pay'){
    var rows2=S.payments.filter(function(p){return p.due&&ymOf(p.due)===ym;});
    if(!rows2.length)return null;
    var missed=rows2.filter(function(p){return !p.flagged||workDays(p.flagged,p.due)<3;}).length;
    return {v:missed,why:missed+' of '+rows2.length+' dues flagged late/never (Payment Tracker)'};
  }
  if(kpi.auto==='trainSr'||kpi.auto==='trainJr'){
    if(!isQtrEnd(ym))return null;
    var q=fyQuarter(ym),emp=empById(empId);
    var rows3=S.training.filter(function(t){
      if(t.quarter!==q)return false;
      if(kpi.auto==='trainJr')return emp&&t.emp===emp.name;
      return emp&&t.emp!==emp.name;
    });
    if(!rows3.length)return null;
    var c2=rows3.filter(function(t){return t.completed;}).length;
    return {v:Math.round(c2/rows3.length*100),why:c2+'/'+rows3.length+' modules completed in '+q+' (Training Tracker)'};
  }
  if(kpi.auto==='corrSr'||kpi.auto==='corrJr'){
    var emp2=empById(empId);
    var rows4=S.corrections.filter(function(c){
      if(ymOf(c.date)!==ym)return false;
      return kpi.auto==='corrSr'?true:(emp2&&c.emp===emp2.name);
    });
    if(!rows4.length)return null;
    return {v:null,why:rows4.length+' corrections logged this month (Correction Log) \u2014 enter % vs total submissions'};
  }
  return null;
}

function stat(l,v,s,c){return '<div class="kpi-stat"><div class="l">'+l+'</div><div class="v" style="color:'+(c||'var(--text)')+'">'+v+'</div><div class="s">'+s+'</div></div>';}
function regHealth(name,rows,getD){
  var last='';rows.forEach(function(r){var d=getD(r);if(d&&d>last)last=d;});
  return '<tr><td>'+name+'</td><td>'+rows.length+'</td><td>'+(last?fmtD(last):'<span style="color:var(--red-b);font-weight:700">never</span>')+'</td></tr>';
}
function mbrLine(otPct,overdue,late,openRa){
  var parts=['F&A '+ymLabel(curYm())+':','compliance on-time '+(otPct==null?'n/a':otPct+'%'),overdue+' overdue',late+' late FYTD',openRa+' RA bills open'];
  var rm=prevYm(curYm());
  S.employees.filter(function(e){return e.active;}).forEach(function(e){
    var ms=monthScore(e.id,rm);if(ms)parts.push(e.name+' '+ms.score.toFixed(2)+'/4');
  });
  return parts.join(' \u00b7 ');
}
function copyMbr(){
  var txt=document.getElementById('mbr-line').textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){alert('Copied.');});
  else {window.prompt('Copy this line:',txt);}
}

var _finCalApi=null;
function finEvStatus(ymd){
  if(!ymd||!window.GAActivityCalendar)return undefined;
  var today=GAActivityCalendar.todayYmd();
  if(ymd<today)return 'overdue';
  if(ymd===today)return 'today';
  return undefined;
}
function finCalendarEvents(){
  var events=[];
  (S.compliance||[]).forEach(function(c,i){
    if(c.actual)return;
    var ymd=String(c.due||'').slice(0,10);
    if(!ymd)return;
    events.push({id:'comp-'+i,date:ymd,title:c.obligation||'Statutory filing',color:'#0284c7',status:finEvStatus(ymd)});
  });
  (S.raBills||[]).forEach(function(b,i){
    if(b.paymentDate)return;
    var recv=String(b.received||'').slice(0,10);
    if(!recv)return;
    var d=new Date(recv+'T12:00:00');
    d.setDate(d.getDate()+10);
    var ymd=GAActivityCalendar?GAActivityCalendar.fmtYmd(d):d.toISOString().slice(0,10);
    events.push({id:'ra-'+i,date:ymd,title:'RA payment · '+(b.contractor||b.ref||'Vendor'),color:'#6366f1',status:finEvStatus(ymd)});
  });
  return events;
}

function addCompRow(){
  if(needAdmin())return;

  var au=window.prompt('Authority (GSTN / Income Tax / MahaRERA / Other):','Other')||'Other';
  var due=window.prompt('Due date (YYYY-MM-DD):',todayISO());if(!due)return;
  S.compliance.push({id:'C'+Date.now(),obligation:ob,authority:au,period:'',due:due,actual:'',remarks:''});
  S.compliance.sort(function(a,b){return a.due<b.due?-1:1;});
  logAudit('compliance.add',ob+' due '+due);renderComp();
}
function delCompRow(i){
  if(needAdmin())return;
  if(!window.confirm('Remove "'+S.compliance[i].obligation+'" ('+fmtD(S.compliance[i].due)+')?'))return;
  logAudit('compliance.del',S.compliance[i].obligation+' '+S.compliance[i].due);
  S.compliance.splice(i,1);touch();renderComp();
}
function regenCalendar(){
  if(needAdmin())return;
  if(!window.confirm('Regenerate the standard FY '+FY_LABEL+' calendar?\n\nOK = replace all rows WITHOUT an actual date (filed rows are kept).'))return;
  var kept=S.compliance.filter(function(c){return c.actual;});
  S.compliance=kept.concat(genCalendar(FY_START_YEAR).filter(function(n){
    return !kept.some(function(k){return k.obligation===n.obligation&&k.due===n.due;});
  }));
  S.compliance.sort(function(a,b){return a.due<b.due?-1:1;});
  logAudit('compliance.regen','FY '+FY_LABEL+' standard calendar regenerated');
  saveState(true);renderComp();
}
function downloadCalTemplate(){
  if(!window.XLSX){alert('Excel library still loading \u2014 try again in a few seconds.');return;}
  var wb=XLSX.utils.book_new();
  var rows=[['Month','Obligation','Authority','Period','Due Date','Responsible','Actual Date','Remarks']];
  S.compliance.forEach(function(c){rows.push([ymLabel(ymOf(c.due)),c.obligation,c.authority,c.period,c.due,complianceOwner(),c.actual||'',c.remarks||'']);});
  rows.push([]);

  var ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:9},{wch:44},{wch:22},{wch:16},{wch:12},{wch:16},{wch:12},{wch:24}];

function uploadCalendar(file){
  if(needAdmin())return;
  if(!file)return;
  if(!window.XLSX){alert('Excel library still loading \u2014 try again in a few seconds.');return;}
  var r=new FileReader();
  r.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      var ws=wb.Sheets['Compliance Calendar']||wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
      var hi=-1,idx={};
      for(var i=0;i<rows.length;i++){
        var low=rows[i].map(function(x){return String(x).trim().toLowerCase();});
        if(low.indexOf('obligation')>=0&&low.indexOf('due date')>=0){
          hi=i;
          idx={obl:low.indexOf('obligation'),auth:low.indexOf('authority'),per:low.indexOf('period'),due:low.indexOf('due date'),act:low.indexOf('actual date'),rem:low.indexOf('remarks')};
          break;
        }
      }
      if(hi<0)throw new Error('Header row not found \u2014 need columns "Obligation" and "Due Date". Use the downloadable template.');
      var parsed=[];
      for(var j=hi+1;j<rows.length;j++){
        var ro=rows[j];
        var obl=String(ro[idx.obl]||'').trim();
        var due=exDate(ro[idx.due]);
        if(!obl||!due)continue;
        if(obl.indexOf('HOW TO USE')===0||obl.indexOf('Then in the app')===0)continue;
        parsed.push({id:'CU'+Date.now()+'_'+j,obligation:obl,authority:String(idx.auth>=0?ro[idx.auth]:'').trim(),period:String(idx.per>=0?ro[idx.per]:'').trim(),due:due,actual:idx.act>=0?exDate(ro[idx.act]):'',remarks:String(idx.rem>=0?ro[idx.rem]:'').trim()});
      }
      if(!parsed.length)throw new Error('No valid rows found below the header.');
      var replace=window.confirm('Parsed '+parsed.length+' obligations from "'+file.name+'".\n\nOK = REPLACE the entire calendar with these rows.\nCancel = MERGE (update matching rows, add new ones).');
      if(replace){S.compliance=parsed;}
      else{
        var merged=0,added=0;
        parsed.forEach(function(n){
          var hit=null;
          S.compliance.forEach(function(c){if(c.obligation===n.obligation&&c.due===n.due)hit=c;});
          if(hit){if(n.actual)hit.actual=n.actual;if(n.remarks)hit.remarks=n.remarks;merged++;}
          else{S.compliance.push(n);added++;}
        });
      }
      S.compliance.sort(function(a,b){return a.due<b.due?-1:1;});
      logAudit('compliance.upload',file.name+' \u2014 '+parsed.length+' rows ('+(replace?'replace':'merge')+') by '+ADMIN_NAME);
      saveState(true);renderComp();
      alert('Calendar '+(replace?'replaced':'merged')+': '+parsed.length+' rows processed.');
    }catch(err){alert('Upload failed: '+err.message);}
  };
  r.readAsArrayBuffer(file);
}

function rvBox(key,f,label,ph,rv,dis){
  return '<div class="card" style="padding:10px"><div style="font-size:10px;font-weight:800;color:var(--muted);margin-bottom:5px">'+label+'</div>'+
    '<textarea rows="3" '+dis+'placeholder="'+ph+'" onchange="setRv(\''+key+'\',\''+f+'\',this.value)">'+esc(rv[f]||'')+'</textarea></div>';
}
function setRv(key,f,v){var rv=reviewOf(key);if(rv.lockBy){alert('This review is locked.');return;}rv[f]=v;touch();}
function setActual(key,kpiId,v){
  var rv=reviewOf(key);
  if(rv.lockBy){alert('This review is locked.');return;}
  rv.a[kpiId]=(v===''?'':+v);
  touch();renderReview();
}
function acceptAllSug(key){
  var rv=reviewOf(key);if(rv.lockBy)return;
  var p=key.split('|');
  dueKpis(p[0],p[1]).forEach(function(k){
    if(rv.a[k.id]!==''&&rv.a[k.id]!=null)return;
    var sg=suggest(k,p[0],p[1]);
    if(sg&&sg.v!=null)rv.a[k.id]=sg.v;
  });
  touch();renderReview();
}
function completeReview(key){
  var p=key.split('|'),rv=reviewOf(key);
  var ms=monthScore(p[0],p[1]),ks=dueKpis(p[0],p[1]);
  var warn='';
  if(!ms)warn='No KPIs are rated yet. ';
  else if(ms.rated<ks.length)warn=(ks.length-ms.rated)+' KPI(s) still unrated (score renormalizes without them). ';
  if(!rv.wins&&!rv.issues&&!rv.actions)warn+='1:1 notes are empty. ';
  var by=window.prompt((warn?'\u26a0 '+warn+'\n\n':'')+'Complete & lock '+ymLabel(p[1])+' for '+(empById(p[0])||{}).name+'?\n\nEnter reviewer name to confirm:');
  if(!by)return;
  rv.lockBy=by;rv.lockTs=new Date().toISOString();
  if(!rv.date)rv.date=todayISO();
  logAudit('review.lock',key+' by '+by+(ms?' \u2014 score '+ms.score.toFixed(2):''));
  saveState(true);renderReview();
}
function unlockReview(key){
  if(needAdmin())return;
  var why=window.prompt('Unlocking a completed review is exceptional and is recorded against '+ADMIN_NAME+'.\n\nReason for unlock:');
  if(why==null)return;
  logAudit('review.unlock',key+' \u2014 '+(why||'(none given)')+' (by '+ADMIN_NAME+')');
  var rv=reviewOf(key);rv.lockBy='';rv.lockTs='';
  saveState(true);renderReview();
}

/* --------------------------- Appraisal ------------------------------ */
var apEmp=null,apPeriod='H1';
function fyMonths(period){
  var months=[];
  if(period==='H1'){for(var m=4;m<=9;m++)months.push(FY_START_YEAR+'-'+pad2(m));}
  else{for(var m2=10;m2<=12;m2++)months.push(FY_START_YEAR+'-'+pad2(m2));for(var m3=1;m3<=3;m3++)months.push((FY_START_YEAR+1)+'-'+pad2(m3));}
  return months;
}
function renderAppr(){
  var emps=S.employees.filter(function(e){return e.active;});
  if(!apEmp||!empById(apEmp))apEmp=emps.length?emps[0].id:null;
  var h='<div class="lockbar">'+
    '<select onchange="apEmp=this.value;renderAppr()">'+emps.map(function(e){return '<option value="'+e.id+'"'+(e.id===apEmp?' selected':'')+'>'+esc(e.name)+'</option>';}).join('')+'</select>'+
    '<select onchange="apPeriod=this.value;renderAppr()"><option value="H1"'+(apPeriod==='H1'?' selected':'')+'>H1 \u2014 Apr to Sep '+FY_START_YEAR+'</option><option value="H2"'+(apPeriod==='H2'?' selected':'')+'>H2 \u2014 Oct '+FY_START_YEAR+' to Mar '+(FY_START_YEAR+1)+'</option></select>'+
    '</div>';
  var emp=empById(apEmp);
  if(!emp){document.getElementById('page-appr').innerHTML=h+'<div class="info">Add an employee first.</div>';return;}

  h+='<div class="info">The appraisal <b>writes itself</b> from the monthly reviews: score = average of completed months; the 1:1 notes below are the evidence for the conversation. Hold it twice a year, sign three ways, lock \u2014 done. Payout band follows the score.</div>';

  var akey=apEmp+'|'+apPeriod, ap=S.appraisals[akey]||{};
  var months=fyMonths(apPeriod), scored=[],lockedN=0;
  months.forEach(function(ym){var ms2=monthScore(apEmp,ym);if(ms2){scored.push({ym:ym,score:ms2.score});if((S.reviews[apEmp+'|'+ym]||{}).lockBy)lockedN++;}});
  var avg=scored.length?scored.reduce(function(a,x){return a+x.score;},0)/scored.length:null;
  var b2=avg!=null?band(avg):null;

  h+='<div class="card" style="margin-bottom:16px">';
  if(ap.locked)h+='<div class="ok-strip">\u{1F512} Signed off and locked on '+fmtD((ap.ts||'').slice(0,10))+'. Unlocking requires the admin password.</div>';
  h+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px">'+
    stat('Months reviewed',scored.length+'/'+months.length,lockedN+' locked',null)+
    stat('Period average',avg!=null?avg.toFixed(2)+' / 4.00':'\u2014','mean of monthly weighted scores',b2?b2.c:null)+
    stat('Band',b2?b2.l:'\u2014','variable-pay gate input',b2?b2.c:null)+
    '</div>';
  if(scored.length){
    h+='<table style="margin-bottom:12px"><tr><th>Month</th>'+scored.map(function(x){return '<th>'+ymLabel(x.ym)+((S.reviews[apEmp+'|'+x.ym]||{}).lockBy?' \u{1F512}':'')+'</th>';}).join('')+'</tr>'+
      '<tr><td><b>Weighted score</b></td>'+scored.map(function(x){var bb=band(x.score);return '<td><span class="badge" style="background:'+bb.bg+';color:'+bb.c+'">'+x.score.toFixed(2)+'</span></td>';}).join('')+'</tr></table>';
    if(lockedN<scored.length)h+='<div class="warn" style="margin-bottom:12px">'+(scored.length-lockedN)+' reviewed month(s) not locked \u2014 lock all months in Monthly Review before sign-off so the appraisal is tamper-proof.</div>';
  } else h+='<div class="info">No reviewed months in this period yet \u2014 run Monthly Reviews first.</div>';

  /* 1:1 evidence trail */
  var notes=months.filter(function(ym){var r=S.reviews[apEmp+'|'+ym];return r&&(r.wins||r.issues||r.actions);});
  if(notes.length){
    h+='<h3 class="sec">1:1 evidence trail</h3><table style="margin-bottom:12px"><tr><th>Month</th><th>Went well</th><th>Needed attention</th><th>Actions</th><th>Prior status</th></tr>';
    notes.forEach(function(ym){
      var r=S.reviews[apEmp+'|'+ym];
      h+='<tr><td><b>'+ymLabel(ym)+'</b></td><td style="font-size:10px">'+esc(r.wins)+'</td><td style="font-size:10px">'+esc(r.issues)+'</td><td style="font-size:10px">'+esc(r.actions)+'</td><td>'+esc(r.prior||'')+'</td></tr>';
    });
    h+='</table>';
  }

  var dis=ap.locked?'disabled ':'';
  h+='<div class="grid" style="grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">'+
    '<div><div class="muted" style="font-size:10px;font-weight:700;margin-bottom:3px">REVIEWER COMMENTS &amp; OBSERVATIONS</div><textarea rows="3" '+dis+'onchange="setAppr(\''+akey+'\',\'comments\',this.value)">'+esc(ap.comments||'')+'</textarea></div>'+
    '<div><div class="muted" style="font-size:10px;font-weight:700;margin-bottom:3px">DEVELOPMENT / VARIABLE-PAY NOTE</div><textarea rows="3" '+dis+'onchange="setAppr(\''+akey+'\',\'paynote\',this.value)">'+esc(ap.paynote||'')+'</textarea></div></div>';
  h+='<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px">'+
    signBox(akey,'signEmp','EMPLOYEE',ap)+signBox(akey,'signRev','REVIEWER',ap)+signBox(akey,'signPrin','PRINCIPAL / MP \u2014 '+PRINCIPAL_NAME.toUpperCase(),ap)+'</div>';
  if(!ap.locked)h+='<button class="btn btn-green" onclick="lockAppr(\''+akey+'\')">\u{1F512} Sign off &amp; lock appraisal</button>';
  else h+='<button class="btn btn-red" onclick="unlockAppr(\''+akey+'\')">Unlock (admin)</button>';
  h+='</div>';
  document.getElementById('page-appr').innerHTML=h;
}
function signBox(akey,field,label,ap){
  var dis=ap.locked?'disabled ':'';
  return '<div><div class="muted" style="font-size:10px;font-weight:700;margin-bottom:3px">'+label+'</div><input type="text" '+dis+'placeholder="Name & date" value="'+esc(ap[field]||'')+'" onchange="setAppr(\''+akey+'\',\''+field+'\',this.value)"/></div>';
}
function setAppr(key,f,v){if(S.appraisals[key]&&S.appraisals[key].locked){alert('Appraisal is locked.');return;}if(!S.appraisals[key])S.appraisals[key]={};S.appraisals[key][f]=v;touch();}
function lockAppr(key){
  var ap=S.appraisals[key]||{};
  if(!ap.signEmp||!ap.signRev||!ap.signPrin){alert('All three sign-off fields (Employee, Reviewer, Principal) must be filled before locking.');return;}

function unlockAppr(key){
  if(needAdmin())return;

  if(why==null)return;
  logAudit('appraisal.unlock',key+' \u2014 '+(why||'(none given)')+' (by '+ADMIN_NAME+')');
  S.appraisals[key].locked=false;saveState(true);renderAppr();
}

function addWorkRow(kind){
  if(!S.workSplit)S.workSplit=defaultWorkSplit();
  if(kind==='processes')S.workSplit.processes.push({id:'W'+Date.now(),process:'New process',R:'',A:'',C:'',I:''});
  else if(kind==='rhythm')S.workSplit.rhythm.push({id:'R'+Date.now(),when:'Day ?',cells:{}});
  else if(kind==='scaling')S.workSplit.scaling.push({id:'S'+Date.now(),trigger:'When...',action:'Do...'});
  touch();renderWorkSplit();
}
function delWorkRow(kind,i){
  if(!window.confirm('Delete this row?'))return;
  S.workSplit[kind].splice(i,1);touch();renderWorkSplit();
}
function resetWorkSplit(){
  if(!window.confirm('Reset the entire work split (pods scope text, RACI, rhythm, scaling) to the Golden Abodes default?\n\nEmployee names and lane assignments in Team & Data are kept.'))return;
  var scopes={};
  S.employees.forEach(function(e){scopes[e.id]=e.scope;});
  S.workSplit=defaultWorkSplit();
  S.employees.forEach(function(e){
    var d=defaultEmployees().find(function(x){return x.id===e.id;});
    if(d){e.lane=d.lane;e.podJr=d.podJr;e.leadId=d.leadId;e.backupId=d.backupId;if(!e.scope)e.scope=d.scope;}
  });
  logAudit('work.reset','Work split reset to GA 2-pod default');
  saveState(true);renderWorkSplit();
}

function backupJson(){

function restoreJson(file){
  if(!file)return;var r=new FileReader();
  r.onload=function(e){
    try{var d=JSON.parse(e.target.result);
      if(!d.employees||!d.compliance)throw new Error('Not a Finance KPI backup.');
      if(!window.confirm('Replace ALL current data with this backup?'))return;
      if(d.scores&&!d.reviews)d=migrateV1(d);
      S=d;ensureV3State();saveState(true);renderTab(curTab);alert('Restored.');
    }catch(err){alert('Restore failed: '+err.message);}
  };r.readAsText(file);
}

/* --------------------------- Excel I/O ------------------------------ */
function exDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date)return v.toISOString().slice(0,10);
  if(typeof v==='number'){var d=new Date(Math.round((v-25569)*86400000));return d.toISOString().slice(0,10);}
  var s=String(v).trim();var d2=new Date(s);if(!isNaN(d2))return d2.toISOString().slice(0,10);
  return '';
}
function sheetRows(wb,name){
  var ws=wb.Sheets[name];if(!ws)return null;
  return XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
}
function findHeader(rows,firstCell){
  for(var i=0;i<rows.length;i++){if(String(rows[i][0]).trim()===firstCell)return i;}
  return -1;
}
function importExcel(file){
  if(!file)return;
  if(!window.XLSX){alert('Excel library still loading \u2014 try again in a few seconds.');return;}
  var r=new FileReader();
  r.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      var report=[];
      var rows=sheetRows(wb,'Compliance Calendar');
      if(rows){
        var hi=findHeader(rows,'Month'),merged=0,added=0;
        if(hi>=0)for(var i=hi+1;i<rows.length;i++){
          var ro=rows[i];if(!ro[1]||!ro[4])continue;
          var due=exDate(ro[4]),act=exDate(ro[6]);
          var hit=null;
          S.compliance.forEach(function(c){if(c.obligation===String(ro[1]).trim()&&c.due===due)hit=c;});
          if(hit){if(act&&!hit.actual){hit.actual=act;merged++;}}
          else {S.compliance.push({id:'C'+Date.now()+'_'+i,obligation:String(ro[1]).trim(),authority:String(ro[2]||''),period:String(ro[3]||''),due:due,actual:act,remarks:''});added++;}
        }
        S.compliance.sort(function(a,b){return a.due<b.due?-1:1;});
        report.push('Compliance: '+merged+' actual dates merged, '+added+' new rows');
      }
      rows=sheetRows(wb,'RA Bill Register');
      if(rows){
        var hi2=findHeader(rows,'#'),n2=0;
        if(hi2>=0)for(var j=hi2+1;j<rows.length;j++){
          var b=rows[j];if(!b[1]&&!b[2])continue;
          if(String(b[0]).indexOf('MONTHLY')===0)break;
          S.raBills.push({ref:String(b[1]||''),contractor:String(b[2]||''),project:String(b[3]||''),qs:exDate(b[4]),received:exDate(b[5]),gross:+b[6]||'',tds:+b[7]||'',ret:+b[9]||'',paymentDate:exDate(b[11])});n2++;
        }
        report.push('RA bills: '+n2+' imported');
      }
      rows=sheetRows(wb,'Correction Log');
      if(rows){
        var hi3=findHeader(rows,'Date'),n3=0;
        if(hi3>=0)for(var k2=hi3+1;k2<rows.length;k2++){
          var c2=rows[k2];if(!c2[1])continue;
          S.corrections.push({date:exDate(c2[0]),emp:String(c2[1]||''),task:String(c2[3]||''),issue:String(c2[4]||''),action:String(c2[5]||''),resub:exDate(c2[6])});n3++;
        }
        report.push('Corrections: '+n3+' imported');
      }
      rows=sheetRows(wb,'Payment Tracker');
      if(rows){
        var hi4=findHeader(rows,'#'),n4=0;
        if(hi4>=0)for(var m2=hi4+1;m2<rows.length;m2++){
          var p2=rows[m2];if(!p2[2])continue;
          if(String(p2[0]).indexOf('PERIOD')===0)break;
          S.payments.push({cat:String(p2[1]||'Other'),desc:String(p2[2]||''),amount:+p2[3]||'',due:exDate(p2[4]),flagged:exDate(p2[5]),paid:exDate(p2[8])});n4++;
        }
        report.push('Payments: '+n4+' imported');
      }
      rows=sheetRows(wb,'Training Tracker');
      if(rows){
        var hi5=findHeader(rows,'#'),merged5=0,added5=0;
        if(hi5>=0)for(var q2=hi5+1;q2<rows.length;q2++){
          var t2=rows[q2];if(!t2[3])continue;
          var comp=exDate(t2[8]),hit5=null;
          S.training.forEach(function(x){if(x.emp===String(t2[1]).trim()&&x.module===String(t2[3]).trim())hit5=x;});
          if(hit5){if(comp&&!hit5.completed){hit5.completed=comp;merged5++;}}
          else {S.training.push({emp:String(t2[1]||''),module:String(t2[3]||''),category:String(t2[4]||''),quarter:String(t2[5]||'Q1'),assigned:exDate(t2[6]),target:exDate(t2[7]),completed:comp});added5++;}
        }
        report.push('Training: '+merged5+' completions merged, '+added5+' new modules');
      }
      logAudit('excel.import',file.name+' \u2014 '+report.join('; '));
      saveState(true);renderTab(curTab);
      alert('Import complete:\n\n'+(report.length?report.join('\n'):'No recognised sheets found (looked for: Compliance Calendar, RA Bill Register, Correction Log, Payment Tracker, Training Tracker).'));
    }catch(err){alert('Import failed: '+err.message);}
  };
  r.readAsArrayBuffer(file);
}
function exportExcel(){
  if(!window.XLSX){alert('Excel library still loading \u2014 try again in a few seconds.');return;}
  var wb=XLSX.utils.book_new();
  function add(name,header,rows){
    var ws=XLSX.utils.aoa_to_sheet([header].concat(rows));
    XLSX.utils.book_append_sheet(wb,ws,name);
  }
  add('Compliance',['Month','Obligation','Authority','Period','Due','Actual','Days Early/(Late)','Status','Remarks'],
    S.compliance.map(function(c){var st=compStatus(c);return [ymLabel(ymOf(c.due)),c.obligation,c.authority,c.period,c.due,c.actual,c.actual?dayDiff(c.actual,c.due):'',st.l,c.remarks||''];}));
  add('RA Bills',['Bill Ref','Contractor','Project','QS Approval','Received','Gross','TDS %','Retention %','Payment Date','Working Days','Status'],
    S.raBills.map(function(b){return [b.ref,b.contractor,b.project,b.qs,b.received,b.gross,b.tds,b.ret,b.paymentDate,b.paymentDate?workDays(b.received,b.paymentDate):'',b.paymentDate?'Paid':'Open'];}));
  add('Corrections',['Date','Employee','Task','Issue','Action','Resubmitted','Days to Fix'],
    S.corrections.map(function(c){return [c.date,c.emp,c.task,c.issue,c.action,c.resub,c.date&&c.resub?dayDiff(c.date,c.resub):''];}));
  add('Payments',['Category','Description','Amount','Due','Flagged','Working Days Advance','Paid'],
    S.payments.map(function(p){return [p.cat,p.desc,p.amount,p.due,p.flagged,p.flagged&&p.due?workDays(p.flagged,p.due):'',p.paid];}));
  add('Training',['Employee','Module','Category','Quarter','Assigned','Target','Completed'],
    S.training.map(function(t){return [t.emp,t.module,t.category,t.quarter,t.assigned,t.target,t.completed];}));
  var kpiRows=[];
  S.employees.forEach(function(e){
    kpisFor(e.id).forEach(function(k){
      kpiRows.push([e.name,ROLE_LABEL[e.role],k.cat,k.name,k.freq,k.wt,k.dir||'',k.th?k.th.join(' / '):'',k.target,k.src,scoreable(k)?'Active':'Draft']);
    });
  });
  add('KPI Definitions',['Employee','Role','Category','KPI','Freq','Wt%','Direction','T4 / T3 / T2','Target','Evidence','Status'],kpiRows);
  var revRows=[];
  Object.keys(S.reviews).sort().forEach(function(key){
    var p=key.split('|'),emp=empById(p[0]);if(!emp)return;
    var ms=monthScore(p[0],p[1]),rv=S.reviews[key];
    revRows.push([emp.name,p[1],ms?ms.score.toFixed(2):'',ms?band(ms.score).l:'',ms?ms.rated+'/'+ms.due:'',rv.date||'',rv.wins||'',rv.issues||'',rv.actions||'',rv.prior||'',rv.lockBy?'Locked by '+rv.lockBy:'Open']);
  });
  add('Monthly Reviews',['Employee','Month','Weighted Score','Band','KPIs Rated','1:1 Date','Went Well','Needs Attention','Actions','Prior Status','Lock'],revRows);
  if(S.workSplit){
    add('Work Split Model',['Section','Content'],[['Operating model',S.workSplit.model],['Stand-up',S.workSplit.standup||'']]);
    add('RACI',['Process','R','A','C','I'],
      S.workSplit.processes.map(function(w){
        return [w.process,empNameById(w.R)||w.R,empNameById(w.A)||w.A,empNameById(w.C)||w.C,w.I==='MP'?'Managing Partner':(empNameById(w.I)||w.I)];
      }));
    var act=S.employees.filter(function(e){return e.active;});
    var rh=['When'].concat(act.map(function(e){return e.name;}));
    var rr=S.workSplit.rhythm.map(function(r){
      var row=[r.when];act.forEach(function(e){row.push((r.cells&&r.cells[e.id])||'');});return row;
    });
    add('Monthly Rhythm',rh,rr);
    add('Scaling Triggers',['Trigger','Action'],S.workSplit.scaling.map(function(s){return [s.trigger,s.action];}));
    add('Team Lanes',['Name','Title','Lane','Role','Scope','Lead / Pod Jr','Backup'],
      S.employees.filter(function(e){return e.active;}).map(function(e){
        return [e.name,e.title||'',LANE_LABEL[e.lane]||'',ROLE_LABEL[e.role]||e.role,e.scope||'',e.role==='JR'?empNameById(e.leadId):empNameById(e.podJr),e.role==='SR'?empNameById(e.backupId):''];
      }));
  }
  XLSX.writeFile(wb,'GA_Finance_KPI_FY'+FY_LABEL.replace('-','_')+'_'+todayISO()+'.xlsx');
}

/* ----------------------------- Boot --------------------------------- */
loadState();
saveState(false);
renderTab('dash');
checkAdminSession(function(){renderTab(curTab);initMongoSync();});
</script>

<script>
GAVaultAskAI.mount({
  appId:'finance_kpi', appLabel:'Finance KPI', title:'Ask Finance KPI',
  buildContext:function(){
    try{
      if(typeof S==='undefined' || !S){
        return Object.assign({app:'finance_kpi', note:'Finance state not loaded yet'}, GAVaultAskAI.contextFromLocalStorage(['ga_finkpi_state_v2']));
      }
      var t = (typeof todayISO==='function') ? todayISO() : new Date().toISOString().slice(0,10);
      var fyStart = (typeof FY_START_YEAR!=='undefined'?FY_START_YEAR:new Date().getFullYear())+'-04-01';
      var compliance = S.compliance||[];
      var overdue = compliance.filter(function(c){ return !c.actual && c.due && c.due<t && c.due>=fyStart; });
      var next14 = compliance.filter(function(c){
        if(c.actual||!c.due) return false;
        var d=(new Date(c.due)-new Date(t))/86400000;
        return d>=0 && d<=14;
      });
      var openRa = (S.raBills||[]).filter(function(b){ return !b.paymentDate; });
      var hotItems = [];
      overdue.slice(0,15).forEach(function(c){
        hotItems.push({ title:c.obligation||'Filing', detail:'OVERDUE · due '+c.due+' · '+(c.authority||''), status:'overdue', risk:10 });
      });
      next14.slice(0,10).forEach(function(c){
        hotItems.push({ title:c.obligation||'Filing', detail:'Due '+c.due+' · '+(c.authority||''), status:'due_soon', risk:7 });
      });
      openRa.slice(0,10).forEach(function(b){
        hotItems.push({ title:b.vendor||b.billNo||'RA bill', detail:'Open RA · '+(b.amount!=null?b.amount:'')+' · '+(b.project||''), status:'ra_open', risk:6 });
      });
      return {
        generatedAt:new Date().toISOString(),
        app:'finance_kpi',
        totals:{
          overdueCompliance:overdue.length,
          dueNext14:next14.length,
          openRaBills:openRa.length,
          complianceRows:compliance.length,
          employees:(S.employees||[]).filter(function(e){return e.active!==false;}).length,
          corrections:(S.corrections||[]).length
        },
        hotItems:hotItems
      };
    }catch(e){
      return { totals:{error:String(e&&e.message||e)}, hotItems:[] };
    }
  },
  examples:['What compliance items are overdue?','Where are finance KPIs weak?','What should F&A prioritize this month?']
});
</script>
